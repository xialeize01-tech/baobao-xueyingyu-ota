  // 首页「继续学习」Hero 卡：点击进入语言学习；进度实时反映当前登录账号
  (function wireHero(){
    const heroEl = document.getElementById('homeHero');
    const heroGo = document.getElementById('heroGoBtn');
    if(heroEl) heroEl.addEventListener('click', ()=>openCategory('lang'));
    if(heroGo) heroGo.addEventListener('click', (e)=>{ e.stopPropagation(); openCategory('lang'); });
  })();
  renderHomeHero();

  function renderHomeHero(){
    try{
      const p = loadProgress();
      const words = (p.learned||[]).length;
      const poems = (p.poems||[]).length;
      const total = words + poems;
      const goal = 40;                                   // 友好里程碑，仅用于进度条展示
      const pct = Math.max(6, Math.min(100, Math.round(total/goal*100)));
      const cnt = document.getElementById('heroCount');
      const fill = document.getElementById('heroFill');
      const sub = document.getElementById('heroSub');
      if(cnt) cnt.textContent = total;
      if(fill) fill.style.width = pct + '%';
      if(sub) sub.textContent = '单词 ' + words + ' 个 · 古诗 ' + poems + ' 首，继续加油！';
    }catch(e){}
  }

  // 进入一级目录 → 展示其下的子栏目（英语/韩语/日语、诗词、或闯关）
  function openCategory(catId){
    if(catId==='challenge'){ switchTab('challenge'); return; }
    const cat = categories.find(c=>c.id===catId);
    if(!cat) return;
    if(cat.themes.length===1){ openTheme(cat.themes[0]); return; }   // 单主题板块跳过冗余中间页，直达内容（修仙系列→书架）
    const cards = cat.themes.map(k=>{
      const t = themes[k];
      return `
        <div class="theme-card" style="border-color:${t.light}" onclick="openTheme('${k}')">
          <span class="ribbon" style="background:${t.color}">GO!</span>
          <span class="big-emoji">${t.emoji}</span>
          <div class="tc-name">${t.name}</div>
          <div class="tc-sub">${t.sub}</div>
          <span class="go">进入学习 →</span>
        </div>`;
    }).join("");
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${cat.color},${shade(cat.color)});">
        <span class="b-emoji">${cat.emoji}</span>
        <div>
          <div class="b-title">${cat.name}</div>
          <div class="b-sub">${cat.sub}</div>
        </div>
      </div>
      <div class="grid">${cards}</div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  const detail = document.getElementById("detail");

  function openTheme(key){
    const t = themes[key];
    if(t.type==='poems'){ openPoemTheme(t, key); return; }
    if(t.type==='world'){ openWorld(t, key); return; }
    if(t.type==='astro'){ openAstro(t, key); return; }
    if(t.type==='xian'){ openXian(t, key); return; }
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">
        <span class="b-emoji">${t.emoji}</span>
        <div>
          <div class="b-title">${t.name}</div>
          <div class="b-sub">${t.sub} · 跟着读一读吧</div>
        </div>
        <span class="b-badge">⭐ ${t.badge}</span>
      </div>
      <div class="grid ${t.type==='letters'?'grid-letters':''}">
        ${renderCards(t, key)}
      </div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    document.getElementById("grow").classList.remove("active");
    detail.style.display="";
    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderCards(t, key){
    if(t.type==='letters'){
      return t.letters.map(L=>`
        <div class="wc" onclick="speakLetter('${L}')">
          <div class="circle letter-circle" style="background:${t.light};color:${t.color}">${L}${L.toLowerCase()}</div>
          <div class="tap">🔊 点我听</div>
        </div>`).join("");
    }
    // 英语单词含 w.s（日常口语）；韩语/日语无 s，改为显示罗马音 w.py
    return t.words.map((w,i)=>`
      <div class="wc" onclick="openWord('${key}', ${i})">
        <div class="circle" style="background:${t.light}">${w.e}</div>
        <div class="word" style="color:${t.color}">${w.w}</div>
        <div class="mean" style="color:${t.color}">${w.m}</div>
        ${w.py ? `<div class="rom">${w.py}</div>` : ``}
        <div class="tap">🔊 点我听</div>
        ${w.s ? `<div class="sent" onclick="event.stopPropagation();speakSentence('${key}',${i})">
          <span class="sent-btn">💬 日常口语</span>
          <span class="sent-txt">${w.s}</span>
        </div>` : ``}
      </div>`).join("");
  }

  // ============ 天文科学：宇宙 / 星球 / 星座 三主题切换 ============
  function openAstro(t, key){
    function sectionHTML(sec){
      return `
        <div class="astro-sec-title">${sec.emoji} ${sec.name} · ${sec.en}</div>
        <div class="grid grid-astro">
          ${sec.items.map(it=>`
            <div class="wc" onclick="speak('${it.en}')">
              <div class="circle" style="background:${t.light}">${it.e}</div>
              <div class="word" style="color:${t.color}">${it.en}</div>
              <div class="mean" style="color:${t.color}">${it.zh}</div>
              <div class="tap">🔊 点我听</div>
              <div class="fact">💡 ${it.fact}</div>
            </div>`).join("")}
        </div>`;
    }
    function show(idx){
      const sec = t.sections[idx];
      const tabs = t.sections.map((s,i)=>`
        <button class="astro-tab ${i===idx?'active':''}" onclick="renderAstroSection(${i})">
          <span class="te">${s.emoji}</span>${s.name}
        </button>`).join("");
      detail.innerHTML = `
        <button class="back" onclick="goHome()">← 返回首页</button>
        <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">
          <span class="b-emoji">${t.emoji}</span>
          <div>
            <div class="b-title">${t.name}</div>
            <div class="b-sub">${t.sub} · 跟着读一读吧</div>
          </div>
          <span class="b-badge">⭐ ${t.badge}</span>
        </div>
        <div class="astro-tabs">${tabs}</div>
        <div id="astroBody">${sectionHTML(sec)}</div>`;
      document.getElementById("home").style.display="none";
      document.getElementById("challenge").classList.remove("active");
      document.getElementById("grow").classList.remove("active");
      detail.style.display="";
      detail.classList.add("active");
      window.scrollTo({top:0,behavior:"smooth"});
    }
    window.renderAstroSection = function(i){ show(i); };
    show(0);
  }

  // ============ 修仙系列：书架 → 单本详情（一页一味本草） ============
  function openXian(t, key){
    const books = t.books.map(b=>`
      <div class="xian-book ${b.locked?'locked':''}" ${b.locked?'':`onclick="openXianBook('${b.id}')"`}>
        <div class="xian-book-cover" style="background:${b.locked?'#D7D7D7':t.light}">
          <span class="xbe">${b.emoji}</span>
        </div>
        <div class="xian-book-title">${b.title}</div>
        <div class="xian-book-sub">${b.sub}</div>
        <div class="xian-book-author">${b.author||''}</div>
        ${b.locked?'<span class="xian-lock">🔒 敬请期待</span>':'<span class="xian-go">翻开 →</span>'}
      </div>`).join("");
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">
        <span class="b-emoji">${t.emoji}</span>
        <div>
          <div class="b-title">${t.name}</div>
          <div class="b-sub">${t.sub}</div>
        </div>
        <span class="b-badge">📚 ${t.badge}</span>
      </div>
      <div class="xian-shelf">${books}</div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    document.getElementById("grow").classList.remove("active");
    detail.style.display="";
    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function openXianBook(bookId){
    const book = themes.xian.books.find(b=>b.id===bookId);
    if(!book) return;
    if(book.locked){
      detail.innerHTML = `
        <button class="back" onclick="openXian(themes.xian,'xian')">← 返回书架</button>
        <div class="banner" style="background:linear-gradient(120deg,${themes.xian.color},${shade(themes.xian.color)});">
          <span class="b-emoji">${book.emoji}</span>
          <div><div class="b-title">${book.title}</div><div class="b-sub">${book.sub}</div></div>
        </div>
        <div class="xian-locked-screen">
          <div class="xian-locked-emoji">🔒</div>
          <div class="xian-locked-title">这本还在整理中</div>
          <div class="xian-locked-sub">《${book.title}》的小故事正在准备，敬请期待哦！</div>
        </div>`;
      document.getElementById("home").style.display="none";
      detail.style.display="";
      detail.classList.add("active");
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    let idx = 0;
    function show(){
      const it = book.items[idx];
      detail.innerHTML = `
        <button class="back" onclick="openXian(themes.xian,'xian')">← 返回书架</button>
        <div class="banner" style="background:linear-gradient(120deg,${themes.xian.color},${shade(themes.xian.color)});">
          <span class="b-emoji">${book.emoji}</span>
          <div>
            <div class="b-title">${book.title}</div>
          <div class="b-sub">第 ${idx+1} / ${book.items.length} ${book.unit||'味'} · ${book.author||''}</div>
        </div>
        <span class="b-badge">${book.badgeEmoji||'🌿'} ${book.items.length} ${book.unit||'味'}</span>
        </div>
        <div class="xian-intro">${book.intro}</div>
        <div class="xian-page">
          <div class="xian-illu"><img src="img/xian/${bookId}/${bookId}_${String(idx+1).padStart(3,'0')}.png" alt="${esc(it.name)}" loading="lazy" onerror="this.parentNode.style.display='none'"></div>
          <div class="xian-emoji">${it.e}</div>
          <div class="xian-name">${it.name}</div>
          <div class="xian-hi">💡 ${it.hi}</div>
          <div class="xian-block"><div class="xb-title">🌟 原来如此</div><p>${it.fact}</p></div>
          ${it.prop?`<div class="xian-block prop"><div class="xb-title">💊 药性 / 功效</div><p>${it.prop}</p></div>`:''}
          ${it.origin?`<div class="xian-block origin"><div class="xb-title">📖 来源出处</div><p>${it.origin}</p></div>`:''}
          ${it.quote?`<div class="xian-block quote"><div class="xb-title">📜 古籍大意</div><p>${it.quote}</p></div>`:''}
          <div class="xian-block"><div class="xb-title">🔍 小观察</div><p>${it.look}</p></div>
          <div class="xian-block rhyme"><div class="xb-title">🎵 记住它</div><p>${it.rhyme}</p></div>
          ${(book.id==='bencao'||book.id==='shanghan')?`<div class="xian-safe">⚠️ 小提醒：这些内容只讲有趣的故事，生病一定要告诉爸爸妈妈，并找医生帮忙哦～</div>`:''}
          <button class="xian-speak" onclick="xianSpeakBook('${bookId}', ${idx})">🔊 读给我听</button>
        </div>
        <div class="xian-nav">
          <button class="xian-nav-btn" ${idx===0?'disabled':''} onclick="xianTurn(-1)">← 上一${book.unit||'味'}</button>
          <span class="xian-nav-idx">${idx+1} / ${book.items.length}</span>
          <button class="xian-nav-btn" ${idx===book.items.length-1?'disabled':''} onclick="xianTurn(1)">下一${book.unit||'味'} →</button>
        </div>`;
      window.scrollTo({top:0,behavior:"smooth"});
    }
    window.xianTurn = function(d){ idx += d; if(idx<0) idx=0; if(idx>=book.items.length) idx=book.items.length-1; show(); };
    window.xianSpeakBook = function(bid, ii){
      const b = themes.xian.books.find(x=>x.id===bid);
      if(!b) return;
      const it = b.items[ii];
      let t = it.name + '。' + it.fact;
      if(it.prop) t += '。药性：' + it.prop;
      t += '。' + it.rhyme;
      speakZh(t);
    };
    show();
  }

      const sh = CONT_SHAPES[c.id]||{d:"",lx:0,ly:0,full:c.name};
      const sel = (c.id===selId) ? ' sel' : '';
      return `<g class="cont${sel}" onclick="selectContinent('${c.id}')">
        <path d="${sh.d}" fill="${c.color}"></path>
        <text class="clabel" x="${sh.lx}" y="${sh.ly}">${c.emoji} ${c.name}</text>
      </g>`;
    }).join("");
    let below="";
    if(selId){
      const c = t.continents.find(x=>x.id===selId);
      if(c){

    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function selectContinent(id){ openWorld(curWorldTheme, curWorldKey, id); }

  }

  // ============ 国文学习：诗词列表 + 作者搜索 + 上次学习作者默认 ============
  // 安全读写 localStorage：部分环境（file:// 直接打开、某些 WebView、隐私模式）下
  // localStorage 会抛 SecurityError，必须吞掉异常，否则会中断整个渲染导致页面空白。
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  let curPoemTheme=null, curPoemKey=null, curPoemAuthors=[], curPoemLines=[], curPoemTitle='';
  let poemFilterState = {q:'', author:null, title:null};
  function openPoemTheme(t, key){
    curPoemTheme=t; curPoemKey=key;
    const authors = [...new Set(t.poems.map(p=>p.author))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh'));
    const titles  = [...new Set(t.poems.map(p=>p.title))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh'));
    const stored = lsGet('lastPoemAuthor') || '';
    // 不搜索时，默认选中上次学习的作者；无记录则显示全部
    poemFilterState.author = (stored && authors.indexOf(stored)>=0) ? stored : null;
    poemFilterState.title = null;
    poemFilterState.q = poemFilterState.author || '';
    curPoemAuthors = authors;
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">
        <span class="b-emoji">${t.emoji}</span>
        <div>
          <div class="b-title">${t.name}</div>
          <div class="b-sub">${t.sub} · 跟着读一读吧</div>
        </div>
        <span class="b-badge">⭐ ${t.badge}</span>
      </div>
      <div class="poem-search">
        <input id="poemSearch" class="ps-input" placeholder="搜索：标题 / 作者 / 诗句里的任意字或句子" value="${esc(poemFilterState.q)}" oninput="poemSearchInput(this.value)" />
        <div class="poem-filters">
          <select id="poemAuthorSel" class="pf-sel" onchange="selectPoemAuthor(this.value)">
            <option value="__all__">👤 全部作者</option>
            ${authors.map(a=>`<option value="${esc(a)}" ${poemFilterState.author===a?'selected':''}>${esc(a)}</option>`).join("")}
          </select>
          <select id="poemTitleSel" class="pf-sel" onchange="selectPoemTitle(this.value)">
            <option value="__all__">📖 全部诗词</option>
            ${titles.map(ti=>`<option value="${esc(ti)}">${esc(ti)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="grid" id="poemGrid"></div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    document.getElementById("grow").classList.remove("active");
    detail.style.display="";
    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
    renderPoemGrid();
  }
  function renderPoemGrid(){
    const t=curPoemTheme, key=curPoemKey; if(!t) return;
    const q=(poemFilterState.q||'').trim().toLowerCase();
    const au=poemFilterState.author;
    const ti=poemFilterState.title;
    let list=t.poems.map((p,i)=>({p,i}));
    if(ti){ list=list.filter(o=>o.p.title===ti); }
    if(au){ list=list.filter(o=>o.p.author===au); }
    if(q){
      list=list.filter(o=>
        (o.p.title||'').toLowerCase().includes(q) ||
        (o.p.author||'').toLowerCase().includes(q) ||
        (o.p.lines||[]).some(l=>l.toLowerCase().includes(q))
      );
    }
    const grid=document.getElementById('poemGrid'); if(!grid) return;
    if(!list.length){
      grid.innerHTML=`<div class="empty">没有找到相关诗词，换个关键词试试～</div>`;
      return;
    }
    grid.innerHTML = list.map(o=>`
      <div class="wc" onclick="openPoem('${key}', ${o.i})">
        <div class="circle" style="background:${t.light}">${o.p.e||'📜'}</div>
        <div class="word" style="color:${t.color}">${esc(o.p.title)}</div>
        <div class="mean" style="color:${t.color}">${esc(o.p.author)}</div>
        <div class="tap">📖 点我读</div>
      </div>`).join("");
  }
  function syncPoemFilters(){
    const as=document.getElementById('poemAuthorSel'); if(as) as.value = poemFilterState.author || '__all__';
    const ts=document.getElementById('poemTitleSel'); if(ts) ts.value = poemFilterState.title || '__all__';
    const inp=document.getElementById('poemSearch'); if(inp) inp.value = poemFilterState.q;
  }
  function poemSearchInput(v){
    poemFilterState.q = v;
    poemFilterState.author = null;   // 自由搜索优先于作者/标题过滤
    poemFilterState.title = null;
    syncPoemFilters();
    renderPoemGrid();
  }
  function selectPoemAuthor(a){
    poemFilterState.author = (a==='__all__') ? null : a;
    poemFilterState.title = null;
    poemFilterState.q = '';
    syncPoemFilters();
    renderPoemGrid();
  }
  function selectPoemTitle(t){
    poemFilterState.title = (t==='__all__') ? null : t;
    poemFilterState.author = null;
    poemFilterState.q = '';
    syncPoemFilters();
    renderPoemGrid();
  }

  // ============ 发音引擎（桌面 / 平板 / 手机 通用 · 本地音频优先） ============
  // 根因：平板（多为 iPad）无法播放在线有道音频，且对 <audio> 元素程序化播放
  //       常有静默拦截。解决方案：
  //       ① 所有发音预下载为本地文件 /study/audio/*.mp3(.wav)；
  //       ② 主播放改用 Web Audio API（fetch→decode→播放），绕开 <audio> 限制，iPad 友好；
  //       ③ 失败再降级 <audio> 元素、在线有道、浏览器 TTS。

  // ============ 在线 TTS 源（每种语言双源兜底）============
  // ⚠️ 2026-08-03 实测结论（勿轻易改回）：
  //   ① 有道 dictvoice 的 type=2 已废弃，返回 500 {"msg":"returned null audio"}；
  //   ② 有道 le=zh 仅对词典内已收录词条有效，整句古诗（如「床前明月光」）稳定 500；
  //   ③ 百度 gettts 对中/英/日/韩整句（含标点）均返回真实 mp3，故作为主源；
  //   ④ 有道 le=jap / le=ko 对日韩单词可用，作为第二源。
  const BD_LAN = { 'zh-CN':'zh', 'en-US':'en', 'ja-JP':'jp',  'ko-KR':'kor' };
  const YD_LE  = { 'zh-CN':'zh', 'en-US':'',   'ja-JP':'jap', 'ko-KR':'ko'  };

  // 百度 TTS（主源）：整句可用
  const BDT = (t, lang) =>
    'https://fanyi.baidu.com/gettts?lan=' + (BD_LAN[lang] || 'zh') +
    '&text=' + encodeURIComponent(t) + '&spd=3&source=web';

  // 有道 TTS（第二源）：英文用 type=2，其余用 le=xx
  const YDT = (t, lang) => {
    const le = YD_LE[lang];
    return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(t) +
           (le ? ('&le=' + le) : '&type=2');
  };

  // 统一在线兜底候选列表（playAny 会按序尝试，首个成功即停）
  const onlineTTS = (t, lang) => [BDT(t, lang), YDT(t, lang)];

  // 兼容旧调用点的别名
  const YD  = t => YDT(t, 'en-US');   // 英文（原实现漏拼 text 参数，已修复）
  const YDC = t => BDT(t, 'zh-CN');   // 中文（原 type=2 已失效，改百度主源）

  // --- Web Audio 上下文（在首次手势内创建并恢复，iPad 必需） ---
  let audioCtx = null;
  function getCtx(){
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) audioCtx = new AC();
      }
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){}
    return audioCtx;
  }

  // 1) 首次手势解锁音频
  let audioUnlocked = false;
  const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAD//w==';
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    try{
      const s = new Audio(SILENT_WAV); s.play().catch(()=>{});  // 解锁媒体
      getCtx();                                                  // 在手势内恢复 AudioContext
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
    }catch(e){}
  }
  ['touchstart','touchend','click','pointerdown'].forEach(ev=>
    document.addEventListener(ev, unlockAudio, {passive:true}));

  // 2) 文件名推导（与下载脚本 slug 完全一致）
  function slug(text){
    return String(text).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  }
  // 字母名读音词映射（A→ay 读作 /eɪ/ 等）
  const LETTER_PRON = {A:"ay",B:"bee",C:"see",D:"dee",E:"ee",F:"eff",G:"jee",H:"aitch",
    I:"eye",J:"jay",K:"kay",L:"el",M:"em",N:"en",O:"oh",P:"pee",Q:"cue",R:"ar",
    S:"ess",T:"tee",U:"you",V:"vee",W:"double u",X:"eks",Y:"why",Z:"zee"};

  // 3) 语音合成声音加载（兜底用）
  let US_VOICES = [];
  function pickUSVoice(){
    if(!('speechSynthesis' in window)) return null;
    const all = window.speechSynthesis.getVoices() || [];
    const us = all.filter(x => /en[-_]US/i.test(x.lang));
    if(us.length){
      us.sort((a,b)=>{
        const kw = n => /google us english|samantha|zira|aria|female|united states/i.test(n);
        return (kw(b.name)?1:0) - (kw(a.name)?1:0);
      });
      return us[0];
    }
    return all.find(x=>/^en/i.test(x.lang)) || null;
  }
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    const sync = ()=>{ US_VOICES = window.speechSynthesis.getVoices() || []; };
    sync();
    if(!US_VOICES.length){
      window.speechSynthesis.onvoiceschanged = ()=>{ sync(); };
      setTimeout(sync, 1200);
    }
  }
  loadVoices();

  // 4) 兜底：浏览器美式语音合成
  function ttsFallback(text, rate, pitch){
    if(!('speechSynthesis' in window)) return Promise.reject('no-tts');
    return new Promise(res=>{
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate  = (rate  == null ? 0.9 : rate);
        u.pitch = (pitch == null ? 1.1 : pitch);
        const v = pickUSVoice();
        if(v) u.voice = v;
        let settled = false;
        const done = ()=>{ if(!settled){ settled=true; res(); } };
        u.onend = done; u.onerror = done;
        window.speechSynthesis.speak(u);
        setTimeout(done, 4000);
      }catch(e){ res(); }
    });
  }

  // 5) 主播放：Web Audio API（iPad 友好，绕开 <audio> 元素限制）
  async function playWebAudio(url){
    const ctx = getCtx();
    if(!ctx) throw new Error('no-ctx');
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('http'+resp.status);
    const arr = await resp.arrayBuffer();
    const buf = await ctx.decodeAudioData(arr);
    await new Promise((resolve,reject)=>{
      const srcNode = ctx.createBufferSource();
      srcNode.buffer = buf;
      srcNode.connect(ctx.destination);
      let done = false;
      const end = ()=>{ if(done) return; done = true; resolve(); };
      srcNode.onended = end;
      try{ srcNode.start(0); }catch(e){ reject(e); return; }
      setTimeout(end, (buf.duration*1000) + 2000);   // 兜底
    });
  }

  // 6) 降级：<audio> 元素播放（部分环境 Web Audio 不可用）
  function playEl(url){
    return new Promise((resolve,reject)=>{
      const a = document.getElementById('player');
      let done = false;
      const cl = ()=>{ a.onplaying=null; a.onerror=null; };
      const ok  = ()=>{ if(done) return; done=true; cl(); resolve(true); };
      const err = (e)=>{ if(done) return; done=true; cl(); reject(e); };
      a.onplaying = ok; a.onerror = err;
      try{
        a.pause(); a.src = url; a.load();
        const p = a.play();
        if(p && p.then) p.then(ok).catch(err); else setTimeout(ok, 400);
      }catch(e){ err(e); }
      setTimeout(()=>{ if(!done) err(new Error('timeout')); }, 5000);
    });
  }

  // 7) 依次尝试多个来源，命中即返回
  async function playAny(urls){
    for(const u of urls){
      try{ await playWebAudio(u); return true; }catch(e){}
      try{ await playEl(u); return true; }catch(e){}
    }
    return false;
  }
  function localUrls(text){
    const s = slug(text);
    return ['audio/' + s + '.mp3', 'audio/' + s + '.wav'];

  // --- 中文朗读（古诗用）：zh-CN 语音合成 ---
  function pickZHVoice(){
    if(!('speechSynthesis' in window)) return null;
    const all = window.speechSynthesis.getVoices()||[];
    const zh = all.filter(x=>/zh/i.test(x.lang));

  // 中文朗读（古诗/中文）：在线 TTS 兜底 + 浏览器语音合成兜底。
  // 关键修复：Capacitor/Android WebView 的 speechSynthesis 常“无声”（无系统中文语音引擎），
  // 因此先走在线中文 TTS，失败再回退到语音合成，确保古诗词“有声音”。
  async function speakZh(text){
    unlockAudio();
    try{ if(await playAny(onlineTTS(text, 'zh-CN'))) return; }catch(e){}
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; u.rate=0.82; u.pitch=1.05;
      const v=pickZHVoice(); if(v) u.voice=v;
      await new Promise(res=>{
        let done=false; const end=()=>{ if(!done){done=true;res();} };
        u.onend=end; u.onerror=end;
        window.speechSynthesis.speak(u);
        setTimeout(end, 6000);
      });
    }catch(e){}
  }
  async function speakZhLines(arr, onLine){
    unlockAudio();
    for(let i=0;i<arr.length;i++){
      if(onLine) try{ onLine(i); }catch(e){}
      await speakZh(arr[i]);
      await new Promise(r=>setTimeout(r,320));
    }
    if(onLine) try{ onLine(-1); }catch(e){}
  }
  // 诗词朗读：逐句朗读（避免长诗被 TTS 截断、加自然停顿），并高亮当前句
  function hlPoemLine(i){

  // 10) 多语言朗读（韩语 ko-KR / 日语 ja-JP 等），用于语言学习板块
  function pickVoiceByLang(lang){
    if(!('speechSynthesis' in window)) return null;
    const all = window.speechSynthesis.getVoices()||[];
    const code = (lang||'en-US').split('-')[0].toLowerCase();
    const hit = all.filter(x=>x.lang && x.lang.toLowerCase().replace('_','-').indexOf(code)===0);
    return hit[0] || null;
  }
  // 多语种朗读（日语/韩语等）。
  // 关键修复（v1.1.8）：原实现只用 speechSynthesis，而 Android WebView 普遍未装
  // 日/韩语音引擎，导致「日语发音」「韩语发音」两个主题共 41 个词全程无声——
  // 与 v1.1.6 修的古诗词无声是同一根因，当时只补了中文、漏了这里。
  // 现统一为：本地音频 → 百度 TTS → 有道 TTS → speechSynthesis 四级兜底。
  async function speakLang(text, lang){
    unlockAudio();
    const lg = lang || 'en-US';
    try{ if(await playAny(localUrls(text))) return; }catch(e){}
    try{ if(await playAny(onlineTTS(text, lg))) return; }catch(e){}
    if(!('speechSynthesis' in window)){ aToast('此设备暂不支持朗读', false); return; }
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lg;
      u.rate = 0.82; u.pitch = 1.05;
      const v = pickVoiceByLang(lg); if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }catch(e){ aToast('朗读失败，请稍后再试', false); }
  }
  // 单词发音：英语走 speak()，韩语/日语走 speakLang()
  function speakWord(themeKey, idx){
    const t = themes[themeKey]; if(!t) return;
    const w = t.words[idx];
    if(t.lang) speakLang(w.w, t.lang); else speak(w.w);
  }
  function speakSentence(themeKey, idx){
    const t = themes[themeKey]; if(!t) return;
    const w = t.words[idx];
    if(!w.s) return;
    if(t.lang) speakLang(w.s, t.lang); else speak(w.s);
  }

  function shade(hex){
    const c = hex.replace("#","");
    const n = parseInt(c,16);

    r=Math.max(0,r-40);g=Math.max(0,g-40);b=Math.max(0,b-40);
    return `rgb(${r},${g},${b})`;
  }

  function themeOf(w){ return themes[ Object.keys(themes).find(k=> themes[k].words && themes[k].words.indexOf(w)>=0) ]; }

  let G = null;   // 当前游戏状态
  // 诗词所有汉字池（去标点），用于古诗词填空的干扰项
  const POEM_CHARS = (function(){
    const set = new Set();
    (themes.poems.poems||[]).forEach(p=> (p.lines||[]).forEach(ln=>{
      for(const ch of ln){ if(/[一-鿿]/.test(ch)) set.add(ch); }
    }));
    return [...set];
  })();
  const CHINESE_RE = /[一-鿿]/;

  // ===== 随机题型：英文（emoji→单词） 或 古诗词填空（缺字选填） =====
  function randomEnglishWord(pools){
    const arr = poolWords(pools);
    return arr[Math.floor(Math.random()*arr.length)];
  }
  function buildEnglishRound(pools){
    const w = randomEnglishWord(pools);
    const others = shuffle(poolWords(pools).filter(x=>x.w!==w.w)).slice(0,3);
    const opts = shuffle([w, ...others]).map(x=>x.w);
    const t = themeOf(w);
    return { type:'en', emoji:w.e, answer:w.w, opts, color:t.color, light:t.light };
  }
  function buildPoemRound(){
    const poems = themes.poems.poems;
    for(let tries=0; tries<40; tries++){
      const p = poems[Math.floor(Math.random()*poems.length)];
      const lines = (p.lines||[]).filter(l=> l.replace(/[^一-鿿]/g,'').length>=2);
      if(!lines.length) continue;
      const line = lines[Math.floor(Math.random()*lines.length)];
      const positions = [];
      for(let i=0;i<line.length;i++){ if(CHINESE_RE.test(line[i])) positions.push(i); }
      if(positions.length<2) continue;
      const pos = positions[Math.floor(Math.random()*positions.length)];
      const answer = line[pos];
      const masked = line.slice(0,pos) + '<span class="blank">⬜</span>' + line.slice(pos+1);
      const dist = shuffle(POEM_CHARS.filter(c=>c!==answer)).slice(0,3);
      const opts = shuffle([answer, ...dist]);
      return { type:'poem', title:p.title, author:p.author, line:line, masked:masked, answer:answer, opts };
    }
    const p = poems[0];
    return { type:'poem', title:p.title, author:p.author, line:p.lines[0], masked:p.lines[0], answer:p.lines[0][0], opts:[p.lines[0][0]] };
  }
  function buildRounds(L){
    const rounds=[];
    for(let i=0;i<L.pairs;i++){
      rounds.push( Math.random()<0.5 ? buildEnglishRound(L.pool) : buildPoemRound() );
    }
    // 题数>=2 时，保证英文与古诗词两种题型都出现（随机组合但仍可见到两类）
    if(rounds.length>=2 && rounds.every(r=>r.type===rounds[0].type)){
      const flip = Math.floor(Math.random()*rounds.length);
      rounds[flip] = (rounds[flip].type==='en') ? buildPoemRound() : buildEnglishRound(L.pool);
    }
    return rounds;
  }

  function nextRound(){

  function nextLevel(){

  // ============ 古诗冒险（100 关，每关 3 题，全对才能过关） ============
  const PA_POEMS = (themes.poems && themes.poems.poems) || [];
  const PA_LINES = (function(){
    const arr=[];
    PA_POEMS.forEach(p=> (p.lines||[]).forEach(ln=>{
      const pure=(ln||"").replace(/[^一-鿿]/g,"");
      if(pure.length>=2) arr.push({poem:p, line:ln});
    }));
    return arr;
  })();
  // 上句→下句：取偶数行作“出句”，下一行作“对句”
  const PA_UPPER = (function(){
    const arr=[];
    PA_POEMS.forEach(p=>{
      const ls=p.lines||[];
      for(let i=0;i+1<ls.length;i+=2){
        const up=ls[i], down=ls[i+1];
        if(up && down && /[一-鿿]/.test(up) && /[一-鿿]/.test(down)) arr.push({poem:p, up, down});
      }
    });
    return arr;
  })();
  // 主题/带字识别：按关键词正则匹配诗句
  const PA_THEMES = [
    {key:"水", label:"含有「水」字的诗句", re:/水/},
    {key:"月", label:"含有「月」字的诗句", re:/月/},
    {key:"风", label:"含有「风」字的诗句", re:/风/},
    {key:"花", label:"含有「花」字的诗句", re:/花/},
    {key:"山", label:"含有「山」字的诗句", re:/山/},
    {key:"日", label:"含有「日」(太阳)的诗句", re:/日/},
    {key:"春", label:"写「春天」的诗句", re:/春/},
    {key:"雪", label:"含有「雪」字的诗句", re:/雪/},
    {key:"秋", label:"写「秋天」的诗句", re:/秋/},
    {key:"思", label:"表达「思念」的诗句", re:/思|念|忆|故园|乡愁|家书/},
    {key:"边塞", label:"写「边塞军旅」的诗句", re:/塞|征|戍|沙场|将军|胡|羌|烽|关山|铁衣|金鼓|百战/},
    {key:"友情", label:"写「送别友情」的诗句", re:/送|别|故人|劝君|浊酒|沾巾/}
  ];
  const PA_THEME_POOLS = (function(){
    const map={};
    PA_THEMES.forEach(t=>{ map[t.key] = PA_LINES.filter(x=> t.re.test(x.line)); });
    return map;
  })();
  function paLineLenSim(a,b){ return Math.abs((a||"").length-(b||"").length)<=3; }
  function paPick(arr, n){
    const pool=arr.slice(); const out=[]; const used=new Set();
    while(out.length<n && pool.length){
      const i=Math.floor(Math.random()*pool.length);
      const v=pool[i];
      if(used.has(v)){ pool.splice(i,1); continue; }
      used.add(v); out.push(v); pool.splice(i,1);
    }
    return out;
  }
  // 关卡题型组成：随难度调整权重（越往后 对句/识诗 越多）
  function paLevelTypes(n){
    const types=[];
    for(let i=0;i<3;i++){
      const t=Math.random();
      if(n<=30)      types.push(t<0.6?'blank':(t<0.85?'keyword':'upper'));
      else if(n<=70) types.push(t<0.4?'upper':(t<0.75?'keyword':'blank'));
      else           types.push(t<0.55?'upper':(t<0.85?'keyword':'blank'));
    }
    return types;
  }
  function paBuildBlank(){
    for(let tries=0;tries<40;tries++){
      const p = PA_POEMS[Math.floor(Math.random()*PA_POEMS.length)];
      const lines=(p.lines||[]).filter(l=> (l||"").replace(/[^一-鿿]/g,'').length>=2);
      if(!lines.length) continue;
      const line=lines[Math.floor(Math.random()*lines.length)];
      const pos=[]; for(let i=0;i<line.length;i++) if(CHINESE_RE.test(line[i])) pos.push(i);
      if(pos.length<2) continue;
      const pi=pos[Math.floor(Math.random()*pos.length)];
      const answer=line[pi];
      const masked=line.slice(0,pi)+'<span class="blank">⬜</span>'+line.slice(pi+1);
      const others=paPick(POEM_CHARS.filter(c=>c!==answer),3,[]);
      const opts=shuffle([answer,...others]);
      if(new Set(opts).size<4) continue;
      return {type:'blank', tag:'✍️ 填空', title:p.title, author:p.author,
        qHtml:`<div class="q-title">《${esc(p.title)}》 · ${esc(p.author)}</div>
               <div class="q-line">${masked}</div>
               <div class="q-tip">把空缺的字填进去吧</div>`,
        opts, answer, speak:line,
        explain:`完整诗句是：<b>${esc(line)}</b>（出自《${esc(p.title)}》·${esc(p.author)}）`};
    }
    const p=PA_POEMS[0];
    return {type:'blank', tag:'✍️ 填空', title:p.title, author:p.author,
      qHtml:`<div class="q-title">《${esc(p.title)}》 · ${esc(p.author)}</div>
             <div class="q-line">${esc(p.lines[0])}</div>`,
      opts:[p.lines[0][0]], answer:p.lines[0][0], speak:p.lines[0],
      explain:`这句是：<b>${esc(p.lines[0])}</b>`};
  }
  function paBuildUpper(){
    if(!PA_UPPER.length) return paBuildBlank();
    for(let tries=0;tries<40;tries++){
      const u=PA_UPPER[Math.floor(Math.random()*PA_UPPER.length)];
      const cand=PA_LINES.filter(x=> paLineLenSim(x.line,u.down) && x.line!==u.down);
      if(cand.length<3) continue;
      const dist=paPick(cand.map(x=>x.line),3);
      if(new Set(dist.concat(u.down)).size<4) continue;
      const opts=shuffle([u.down,...dist]);
      return {type:'upper', tag:'🔗 对句', title:u.poem.title, author:u.poem.author,
        qHtml:`<div class="q-title">《${esc(u.poem.title)}》 · ${esc(u.poem.author)}</div>
               <div class="q-line">${esc(u.up)}</div>
               <div class="q-tip">它的下一句是什么？</div>`,
        opts, answer:u.down, speak:u.up,
        explain:`上句：<b>${esc(u.up)}</b><br>下句：<b>${esc(u.down)}</b>（出自《${esc(u.poem.title)}》·${esc(u.poem.author)}）`};
    }
    return paBuildBlank();
  }
  function paBuildKeyword(){
    const avail = PA_THEMES.filter(t=> (PA_THEME_POOLS[t.key]||[]).length>=1);
    if(!avail.length) return paBuildBlank();
    for(let tries=0;tries<30;tries++){
      const t=avail[Math.floor(Math.random()*avail.length)];
      const matches=PA_THEME_POOLS[t.key];
      const correct=matches[Math.floor(Math.random()*matches.length)];
      const nonMatches=PA_LINES.filter(x=> !t.re.test(x.line) && x.line!==correct.line);
      if(nonMatches.length<3) continue;
      const dist=paPick(nonMatches.map(x=>x.line),3);
      const opts=shuffle([correct.line,...dist]);
      if(new Set(opts).size<4) continue;
      return {type:'keyword', tag:'🔍 识诗', title:t.label, author:'',
        qHtml:`<div class="q-title">${esc(t.label)}</div>
               <div class="q-tip">下面哪一句符合？点它！</div>`,
        opts, answer:correct.line, speak:t.label,
        explain:`正确答案：<b>${esc(correct.line)}</b>（出自《${esc(correct.poem.title)}》·${esc(correct.poem.author)}），这句里有「${esc(t.key)}」字。`};
    }
    return paBuildBlank();
  }
  function paBuild(type){
    if(type==='upper') return paBuildUpper();
    if(type==='keyword') return paBuildKeyword();
    return paBuildBlank();
  }

  let PA=null;
  function paLeave(){ if(PA) PA.done=true; openHub(); }
  function openPoemAdvLevel(n){

    PA={n, rounds, idx:0, mistakes:0, answered:0, done:false};
    challengeEl.innerHTML = `

  function paAnswer(el){
    if(!PA || PA.done) return;
    const r=PA.rounds[PA.idx];
    if(r._done) return;

    const v=el.dataset.v;

      const mEl=document.getElementById('paMist'); if(mEl) mEl.textContent=PA.mistakes;
      opts.forEach(o=>{ if(o.dataset.v===r.answer) o.classList.add('correct'); });

  function paShowExplain(r){

  function paShowWin(passed){

  function setActiveTab(name){

  function switchTab(name){
    setActiveTab(name);
    const home=document.getElementById('home'), det=document.getElementById('detail'),
          ch=document.getElementById('challenge'), grow=document.getElementById('grow'),
          me=document.getElementById('me');
    // 统一用 .active class 控制 detail/challenge/grow/me 的显隐（它们都靠 .active{display:block} 显示）。
    // 切勿给它们设 inline display:none —— inline 优先级高于 .active 规则，会遗留
    // 一个覆盖 .detail.active 的 inline 隐藏样式，导致之后打开详情页整屏空白、只能杀进程恢复。
    [det,ch,grow,me].forEach(s=>{ if(s){ s.classList.remove('active'); s.style.display=''; } });
    home.style.display='none';
    if(name==='study'){ home.style.display='block'; renderHomeHero(); }
    else if(name==='challenge'){ openHub(); ch.classList.add('active'); }
    else if(name==='grow'){ renderGrow(); grow.classList.add('active'); }
    else if(name==='me'){ renderMe(); me.classList.add('active'); }
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function renderGrow(){
    const p = loadProgress();
    const learned = (p.learned||[]).length;
    const learnedPoems = (p.poems||[]).length;
    const totalStars = Object.values(p.stars||{}).reduce((a,b)=>a+(+b||0),0);
    const maxStars = LEVELS.length*3;
    const growEl = document.getElementById('grow');
    if(!growEl) return;
    growEl.innerHTML = `
      <button class="back" onclick="switchTab('study')">← 返回学习</button>
      <div class="gcard">
        <h2 style="font-size:26px;font-weight:800;margin-bottom:4px;">🌟 我的成长</h2>
        <div class="gstat">
          <div class="gs"><b>${Math.max(0,p.unlocked-1)}/${LEVELS.length}</b><span>已闯关卡数</span></div>
          <div class="gs"><b>${totalStars}/${maxStars}</b><span>累计星星</span></div>
          <div class="gs"><b>${learned}</b><span>学会单词</span></div>
          <div class="gs"><b>${learnedPoems}</b><span>会背古诗</span></div>
        </div>
        <div class="glevels">
          ${LEVELS.map(L=>{ const st=p.stars[L.n]||0;
            return `<div class="glv"><div class="gn">${L.n}</div><div class="gs">${"★".repeat(st)}${"☆".repeat(3-st)}</div></div>`;
          }).join("")}
        </div>
        <div class="gbtns">
          <button class="gbtn" onclick="exportProgress()">📤 备份进度</button>
          <button class="gbtn alt" onclick="document.getElementById('impFile').click()">📥 恢复进度</button>
        </div>
        <p style="margin-top:12px;font-size:12px;color:var(--gray);font-weight:600;line-height:1.5;">进度保存在本机，换平板或重装 App 会丢失，记得定期备份到网盘或发给家长哦～</p>
      </div>`;
  }

  function buildBackup(){
    const p = loadProgress();
    return JSON.stringify({app:"宝宝学英语", version:1, exportedAt:new Date().toISOString(), progress:p}, null, 2);
  }
  async function exportProgress(){
    const json = buildBackup();
    const blob = new Blob([json], {type:'application/json'});
    const file = new File([blob], '宝宝学英语-进度备份.json', {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'宝宝学英语进度备份'}); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='宝宝学英语-进度备份.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    aToast('已生成备份文件，请保存到网盘或发给家长～', true);
  }
  function onImportFile(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    importProgress(f);
    e.target.value='';
  }
  function importProgress(file){
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const data = JSON.parse(r.result);
        const p = data && data.progress ? data.progress : data;
        if(!p || typeof p!=='object') throw new Error('格式不对');
        const clean = {unlocked: Number(p.unlocked)||1, stars:{}, learned:[]};
        if(p.stars) for(const k in p.stars) clean.stars[k]=Number(p.stars[k])||0;
        if(Array.isArray(p.learned)) clean.learned = p.learned.filter(x=>typeof x==='string');
        if(clean.unlocked<1) clean.unlocked=1;
        saveProgress(clean);
        renderGrow();
        aToast('进度已恢复！🌟', true);
      }catch(err){ aToast('恢复失败：文件格式不正确', false); }
    };
    r.readAsText(file);
  }

  // ============ 我的 / 设置页 ============
  // HTML 转义：账号名是用户自由输入，直接拼进 innerHTML 会被当作标签解析
  // （实测输入 <img src=x onerror=...> 会真的注入 DOM），故渲染前必须转义。
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function renderMe(){
    const u = getCurrentUser();
    const meEl = document.getElementById('me');
    if(!meEl) return;
    const users = getUsers();
    const accountRows = users.map(x=>{
      const isCur = x.id === u.id;
      // 仅剩一个账号时不提供删除，避免把自己删空
      const delBtn = (!isCur && users.length > 1)
        ? `<button class="set-del" onclick="meDeleteUser('${esc(x.id)}')" aria-label="删除账号">✕</button>`
        : '';
      return `
      <div class="set-row acct">
        <button class="acct-main" onclick="meSwitchUser('${esc(x.id)}')">
          <span class="set-ico">${esc(x.avatar)}</span>
          <span class="set-label">${esc(x.name)}${isCur?'（当前）':''}</span>
          <span class="set-val">${isCur?'✅':''}</span>
        </button>${delBtn}
      </div>`;
    }).join('');
    meEl.innerHTML = `
      <button class="back" onclick="switchTab('study')">← 返回学习</button>
      <div class="gcard me-profile">
        <div class="me-ava" onclick="meOpenAvatarPicker()" style="background:${esc(u.color||'#FFC857')}">${esc(u.avatar)}</div>
        <div class="me-name" onclick="meEditName()">${esc(u.name)} <span class="me-edit">✎ 改名</span></div>
        <div class="me-sub">当前登录账号</div>
      </div>
      <div class="gcard">
        <div class="set-title">设置</div>
        <button class="set-row" onclick="meEditName()">
          <span class="set-ico">✏️</span><span class="set-label">登录名称</span><span class="set-val">${esc(u.name)} ›</span>
        </button>
        <button class="set-row" onclick="meOpenAvatarPicker()">
          <span class="set-ico">🖼️</span><span class="set-label">头像</span><span class="set-val">${esc(u.avatar)} ›</span>
        </button>
        <button class="set-row" onclick="otaCheck(true)">
          <span class="set-ico">🔄</span><span class="set-label">检查更新</span><span class="set-val">›</span>
        </button>
        <div class="set-row">
          <span class="set-ico">📦</span><span class="set-label">版本号</span><span class="set-val">v${OTA_VER}</span>
        </div>
      </div>
      <div class="gcard">
        <div class="set-title">切换 / 添加账号</div>
        ${accountRows}
        <button class="set-row add" onclick="meAddUser()">
          <span class="set-ico">➕</span><span class="set-label">添加新账号</span><span class="set-val">›</span>
        </button>
        <p style="margin-top:10px;font-size:12px;color:var(--gray);font-weight:600;line-height:1.5;">不同账号的闯关进度、学会的单词和古诗各自独立保存。</p>
      </div>`;
  }
  function meEditName(){
    const u = getCurrentUser();
    const n = prompt('给这个账号起个名字：', u.name);
    if(n==null) return;
    const name = n.trim().slice(0,12) || u.name;
    const users = getUsers(); const cur = users.find(x=>x.id===u.id);
    if(cur){ cur.name = name; saveUsers(users); }
    renderMe();
    aToast('名字已更新：'+name+' 🎉', true);
  }
  function meOpenAvatarPicker(){
    const grid = AVATARS.map(a=>`<button class="ava-opt" onclick="mePickAvatar('${a}')">${a}</button>`).join('');
    const box = document.getElementById('avatarBox');
    if(box) box.innerHTML =
      `<div class="win-box"><div class="w-emoji">🖼️</div><h3>选个头像</h3>` +
      `<div class="ava-grid">${grid}</div>` +
      `<button class="w-btn alt" style="margin-top:18px" onclick="meCloseWin('avatarWin')">取消</button></div>`;
    const win = document.getElementById('avatarWin');
    if(win) win.classList.add('show');
  }
  function mePickAvatar(a){
    const u = getCurrentUser(); const users = getUsers(); const cur = users.find(x=>x.id===u.id);
    if(cur){ cur.avatar = a; saveUsers(users); }
    meCloseWin('avatarWin'); renderMe();
    aToast('头像已更新 '+a, true);
  }
  function meCloseWin(id){ const w=document.getElementById(id); if(w) w.classList.remove('show'); }
  function meSwitchUser(id){
    if(lsGet(CUR_USER_KEY)===id) return;
    lsSet(CUR_USER_KEY, id);
    const u = getCurrentUser();
    renderMe(); renderGrow();
    aToast('已切换到「'+u.name+'」'+u.avatar, true);
  }
  function meAddUser(){
    const n = prompt('新账号名字：', '宝宝'+(getUsers().length+1));
    if(n==null) return;
    const name = n.trim().slice(0,12) || ('宝宝'+(getUsers().length+1));
    const id = 'u'+Date.now();
    const ava = AVATARS[getUsers().length % AVATARS.length];
    const users = getUsers();
    users.push({id, name, avatar:ava, color:'#FFC857', progress:defaultProgress()});
    saveUsers(users); lsSet(CUR_USER_KEY, id);
    renderMe(); renderGrow();
    aToast('已创建并切换到「'+name+'」', true);
  }
  // 删除账号：走 App 自有弹窗而非系统 confirm()
  // （Capacitor 的原生对话框按钮是硬编码英文 OK/Cancel，且删除进度不可逆，
  //   对儿童应用需要一次明确的二次确认）
  function meDeleteUser(id){
    const users = getUsers();
    const target = users.find(x=>x.id===id);
    if(!target || users.length <= 1) return;
    const box = document.getElementById('avatarBox');
    if(box) box.innerHTML =
      `<div class="win-box"><div class="w-emoji">🗑️</div><h3>删除这个账号？</h3>` +
      `<p style="margin:10px 0 4px;font-size:15px;font-weight:700;color:var(--ink);">` +
      `${esc(target.avatar)} ${esc(target.name)}</p>` +
      `<p style="margin:0 0 6px;font-size:13px;font-weight:600;color:var(--gray);line-height:1.55;">` +
      `该账号的闯关进度、学会的单词和古诗会一并清除，且无法恢复。</p>` +
      `<button class="w-btn" style="margin-top:16px;background:#E5534B;color:#fff"` +
      ` onclick="meDeleteUserConfirm('${esc(id)}')">确认删除</button>` +
      `<button class="w-btn alt" style="margin-top:10px" onclick="meCloseWin('avatarWin')">再想想</button></div>`;
    const win = document.getElementById('avatarWin');
    if(win) win.classList.add('show');
  }
  function meDeleteUserConfirm(id){
    let users = getUsers();
    if(users.length <= 1) { meCloseWin('avatarWin'); return; }
    const target = users.find(x=>x.id===id);
    users = users.filter(x=>x.id!==id);
    saveUsers(users);
    // 若删掉的正好是当前账号，回退到列表首个账号
    if(lsGet(CUR_USER_KEY)===id) lsSet(CUR_USER_KEY, users[0].id);
    meCloseWin('avatarWin');
    renderMe(); renderGrow();
    aToast('已删除「'+(target?target.name:'账号')+'」', true);
  }
</script>
  <!-- 常驻音频元素（<audio> 降级播放用） -->
  <audio id="player" playsinline webkit-playsinline preload="auto"></audio>
  <!-- 全局错误横幅：真机任何未捕获异常都会显示出来，便于排查 -->
  <div id="errBar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:200;background:#C0392B;color:#fff;font-family:inherit;font-weight:700;font-size:13px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:normal;line-height:1.4;"></div>
  <!-- 发音状态提示（仅在兜底层/失败时短暂显示，便于排查） -->
  <div id="aToast" style="position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-family:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;z-index:95;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);"></div>

  <!-- OTA 更新弹窗 -->
  <div class="ota-backdrop" id="otaBar" onclick="if(event.target===this)otaHide()">
    <div class="ota-modal">
      <div class="ota-emoji" id="otaEmoji">✨</div>
      <div class="ota-title" id="otaTitle">发现新版本</div>
      <div class="ota-body" id="otaMsg"></div>
      <button class="oa-btn" id="otaAct"></button>
      <button class="ota-dismiss" id="otaX" onclick="otaHide()">稍后再说</button>
    </div>
  </div>

<script>
/* =========================================================
   OTA 在线更新模块
   原理：只更新这份 app.html（约 220KB），视频/音频等大资源留在 APK 内不动。
        新版 HTML 下载后存进 localStorage，由 index.html 加载器在下次启动时运行。
   发布：改完本文件后执行 ./ota-release.sh <新版本号> 即可推送给所有用户。
   ========================================================= */
'use strict';

/* 当前运行的应用版本号：发布 OTA 更新时必须递增（与 manifest.json 的 version 一致） */
const OTA_VER = '1.3.2';

/* 更新源（依次尝试，任一可用即可；兼顾国内网络） */
const OTA_BASES = [
  'https://raw.githubusercontent.com/xialeize01-tech/baobao-xueyingyu-ota/main/',
  'https://cdn.jsdelivr.net/gh/xialeize01-tech/baobao-xueyingyu-ota@main/',
  'https://ghproxy.net/https://raw.githubusercontent.com/xialeize01-tech/baobao-xueyingyu-ota/main/'
];

const OTA_K = { html:'ota.html', ver:'ota.ver', fail:'ota.fail', last:'ota.last' };
const OTA_MAX_BYTES = 3 * 1024 * 1024;   // localStorage 安全上限
const OTA_INTERVAL  = 6 * 3600 * 1000;   // 自动检查间隔：6 小时
let   otaBusy = false;

function otaLSGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function otaLSSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

/* 版本号比较：返回 1 表示 a > b */
function otaCmp(a,b){
  const x=String(a||'0').split('.'), y=String(b||'0').split('.');
  for(let i=0;i<3;i++){
    const m=parseInt(x[i]||'0',10)||0, n=parseInt(y[i]||'0',10)||0;
    if(m!==n) return m>n?1:-1;
  }
  return 0;
}

function otaHide(){
  const bar=document.getElementById('otaBar');
  if(bar) bar.classList.remove('show');
}

/* 显示更新弹窗；actFn 为空则不显示操作按钮 */
function otaShow(text, actLabel, actFn, autoHideMs){
  const bar=document.getElementById('otaBar');
  const msg=document.getElementById('otaMsg');
  const act=document.getElementById('otaAct');
  const title=document.getElementById('otaTitle');
  const emoji=document.getElementById('otaEmoji');
  const dismiss=document.getElementById('otaX');
  if(!bar||!msg) return;
  msg.textContent = text;
  if(actFn){
    act.style.display='inline-block'; act.textContent=actLabel; act.onclick=actFn;
    dismiss.style.display='block';
  } else {
    act.style.display='none'; act.onclick=null;
    /* 无操作按钮时隐藏「稍后再说」 */
    if(autoHideMs > 0){ dismiss.style.display='none'; }
    else { dismiss.style.display='block'; }
  }
  bar.classList.add('show');
  if(autoHideMs){ setTimeout(()=>{ if(msg.textContent===text) otaHide(); }, autoHideMs); }
}

/* 多源依次尝试拉取文本，任一成功即返回 */
async function otaFetchText(path, timeoutMs){
  let lastErr = null;
  for(const base of OTA_BASES){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 9000);
    try{
      const bust = path.endsWith('.json') ? ('?_=' + Date.now()) : '';
      const res = await fetch(base + path + bust, { signal: ctrl.signal, cache:'no-store' });
      clearTimeout(timer);
      if(res.ok) return await res.text();
      lastErr = new Error('HTTP ' + res.status);
    }catch(e){
      clearTimeout(timer);
      lastErr = e;
    }
  }
  throw lastErr || new Error('全部更新源不可用');
}

/* SHA-256 校验（非安全上下文时自动跳过） */
async function otaSha256Hex(text){
  if(!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* 检查更新主流程；manual=true 表示用户手动点击 */
async function otaCheck(manual){
  if(otaBusy) return;
  otaBusy = true;
  const btn = document.getElementById('verBtn');
  if(btn){ btn.disabled = true; btn.textContent = '检查中…'; }

  try{
    if(manual) otaShow('正在检查更新…', null, null, 0);
    otaLSSet(OTA_K.last, String(Date.now()));

    const raw = await otaFetchText('manifest.json', 8000);
    let mf;
    try{ mf = JSON.parse(raw); }
    catch(e){ throw new Error('更新信息格式错误'); }

    if(!mf || !mf.version || !mf.file) throw new Error('更新信息不完整');

    // 已是最新
    if(otaCmp(mf.version, OTA_VER) <= 0){
      if(manual) otaShow('已经是最新版本 v' + OTA_VER + ' 🎉', null, null, 3000);
      else otaHide();
      return;
    }

    if(manual) otaShow('发现新版本 v' + mf.version + '，正在下载…', null, null, 0);
    else otaShow('发现新版本 v' + mf.version + '，正在后台下载…', null, null, 0);

    const html = await otaFetchText(mf.file, 30000);

    // —— 完整性校验，任何一项不过就放弃本次更新 ——
    if(!html || html.length < 20000) throw new Error('更新包不完整');
    if(html.length > OTA_MAX_BYTES) throw new Error('更新包过大，请下载新安装包');
    if(html.indexOf('id="themeGrid"') === -1) throw new Error('更新包内容异常');
    if(mf.sha256){
      const got = await otaSha256Hex(html);
      if(got && got.toLowerCase() !== String(mf.sha256).toLowerCase()){
        throw new Error('更新包校验失败');
      }
    }

    // 写入缓存并重置看门狗计数
    if(!otaLSSet(OTA_K.html, html)) throw new Error('存储空间不足，无法保存更新');
    otaLSSet(OTA_K.ver, mf.version);
    otaLSSet(OTA_K.fail, '0');

    const note = mf.notes ? ('：' + mf.notes) : '';
    otaShow('有版本更新，欢迎小主更新～', '立即更新', otaApply, 0);

  }catch(err){
    const m = (err && err.message) ? err.message : String(err);
    if(manual) otaShow('检查更新失败：' + m, null, null, 4000);
    // 自动检查失败时静默，不打扰孩子使用
  }finally{
    otaBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = '检查更新'; }
  }
}

/* 应用更新：回到加载器，由它载入新版本 */
function otaApply(){
  try{ location.replace('index.html?u=' + Date.now()); }
  catch(e){ location.reload(); }
}

/* 启动收尾：清零看门狗（证明本版本能正常启动）+ 显示版本号 + 定时自动检查 */
(function otaBoot(){
  try{
    otaLSSet(OTA_K.fail, '0');
    // 预热中文 TTS 语音列表：Android WebView 的语音常异步加载，先触发一次避免首读无中文音色
    if('speechSynthesis' in window){
      try{ window.speechSynthesis.getVoices(); }catch(e){}
      window.speechSynthesis.onvoiceschanged = function(){ try{ window.speechSynthesis.getVoices(); }catch(e){} };
    }
    const vt = document.getElementById('verTxt');
    if(vt){
      // 缓存版本号与当前运行版本一致，说明本次运行的是在线更新下来的版本
      const fromOta = otaLSGet(OTA_K.ver) === OTA_VER;
      vt.textContent = '版本 v' + OTA_VER + (fromOta ? ' · 已在线更新' : '');
    }
  }catch(e){}

  setTimeout(function(){
    try{
      const last = parseInt(otaLSGet(OTA_K.last), 10) || 0;
      if(Date.now() - last > OTA_INTERVAL) otaCheck(false);
    }catch(e){}
  }, 3000);
})();
</script>
