        {e:"🍂",title:"采樵作",author:"孟浩然",dynasty:"唐",lines:["采樵入深山，山深树重叠。","桥崩卧槎拥，路险垂藤接。","日落伴将稀，山风拂萝衣。","长歌负轻策，平野望烟归。"],py:["cǎi qiáo rù shēn shān ， shān shēn shù chóng dié 。","qiáo bēng wò chá yōng ， lù xiǎn chuí téng jiē 。","rì luò bàn jiāng xī ， shān fēng fú luó yī 。","zhǎng gē fù qīng cè ， píng yě wàng yān guī 。"],s:""},
        {e:"🌊",title:"长乐宫",author:"孟浩然",dynasty:"唐",lines:["秦城旧来称窈窕，汉家更衣应不少。","红粉邀君在何处，青楼苦夜长难晓。","长乐宫中钟暗来，可怜歌舞惯相催。","欢娱此事今寂寞，惟有年年陵树哀。"],py:["qín chéng jiù lái chēng yǎo tiǎo ， hàn jiā gēng yī yīng bù shǎo 。","hóng fěn yāo jūn zài hé chù ， qīng lóu kǔ yè zhǎng nán xiǎo 。","cháng lè gōng zhōng zhōng àn lái ， kě lián gē wǔ guàn xiāng cuī 。","huān yú cǐ shì jīn jì mò ， wéi yǒu nián nián líng shù āi 。"],s:""},
        {e:"🌻",title:"送崔遏",author:"孟浩然",dynasty:"唐",lines:["片玉来夸楚，治中作主人。","江山增润色，词赋动阳春。","别馆当虚敞，离情任吐伸。","因声两京旧，谁念卧漳滨。"],py:["piàn yù lái kuā chǔ ， zhì zhōng zuò zhǔ rén 。","jiāng shān zēng rùn sè ， cí fù dòng yáng chūn 。","bié guǎn dāng xū chǎng ， lí qíng rèn tǔ shēn 。","yīn shēng liǎng jīng jiù ， shuí niàn wò zhāng bīn 。"],s:""},
        {e:"🐦",title:"送席大",author:"孟浩然",dynasty:"唐",lines:["惜尔怀其宝，迷邦倦客游。","江山历全楚，河洛越成周。","道路疲千里，乡园老一丘。","知君命不偶，同病亦同忧。"],py:["xī ěr huái qí bǎo ， mí bāng juàn kè yóu 。","jiāng shān lì quán chǔ ， hé luò yuè chéng zhōu 。","dào lù pí qiān lǐ ， xiāng yuán lǎo yī qiū 。","zhī jūn mìng bù ǒu ， tóng bìng yì tóng yōu 。"],s:""},
        {e:"🌺",title:"凌晨早朝",author:"虞世南",dynasty:"唐",lines:["万瓦宵光曙，重檐夕雾收。","玉花停夜烛，金壶送晓筹。","日晖青琐殿，霞生结绮楼。","重门应启路，通籍引王侯。"],py:["wàn wǎ xiāo guāng shǔ ， zhòng yán xī wù shōu 。","yù huā tíng yè zhú ， jīn hú sòng xiǎo chóu 。","rì huī qīng suǒ diàn ， xiá shēng jié qǐ lóu 。","zhòng mén yīng qǐ lù ， tōng jí yǐn wáng hóu 。"],s:""},
        {e:"🌈",title:"林亭寓言",author:"张九龄",dynasty:"唐",lines:["林居逢岁晏，遇物使情多。","蘅茝不时与，芬荣奈汝何。","更怜篱下菊，无如松上萝。","因依自有命，非是隔阳和。"],py:["lín jū féng suì yàn ， yù wù shǐ qíng duō 。","héng chǎi bù shí yǔ ， fēn róng nài rǔ hé 。","gèng lián lí xià jú ， wú rú sōng shàng luó 。","yīn yī zì yǒu mìng ， fēi shì gé yáng hé 。"],s:""},
        {e:"🔥",title:"送使广州",author:"张九龄",dynasty:"唐",lines:["家在湘源住，君今海峤行。","经过正中道，相送倍爲情。","心逐书邮去，形随世网婴。","因声谢远别，缘义不缘名。"],py:["jiā zài xiāng yuán zhù ， jūn jīn hǎi jiào xíng 。","jīng guò zhèng zhōng dào ， xiāng sòng bèi wèi qíng 。","xīn zhú shū yóu qù ， xíng suí shì wǎng yīng 。","yīn shēng xiè yuǎn bié ， yuán yì bù yuán míng 。"],s:""},
        {e:"❄️",title:"使还湘水",author:"张九龄",dynasty:"唐",lines:["归舟宛何处，正值楚江平。","夕逗烟村宿，朝缘浦树行。","于役已弥岁，言旋今惬情。","乡郊尚千里，流目夏云生。"],py:["guī zhōu wǎn hé chù ， zhèng zhí chǔ jiāng píng 。","xī dòu yān cūn sù ， cháo yuán pǔ shù xíng 。","yú yì yǐ mí suì ， yán xuán jīn qiè qíng 。","xiāng jiāo shàng qiān lǐ ， liú mù xià yún shēng 。"],s:""},
        {e:"🌼",title:"赴使泷崃",author:"张九龄",dynasty:"唐",lines:["溪路日幽深，寒空入两嵚。","霜清百丈水，风落万重林。","夕鸟联归翼，秋猿断去心。","别离多远思，况乃岁方阴。"],py:["xī lù rì yōu shēn ， hán kōng rù liǎng qīn 。","shuāng qīng bǎi zhàng shuǐ ， fēng luò wàn zhòng lín 。","xī niǎo lián guī yì ， qiū yuán duàn qù xīn 。","bié lí duō yuǎn sī ， kuàng nǎi suì fāng yīn 。"],s:""},
        {e:"🍁",title:"使至广州",author:"张九龄",dynasty:"唐",lines:["昔年尝不调，兹地亦邅回。","本谓双凫少，何知驷马来。","人非汉使橐，郡是越王台。","去去虽殊事，山川长在哉。"],py:["xī nián cháng bù diào ， zī dì yì zhān huí 。","běn wèi shuāng fú shǎo ， hé zhī sì mǎ lái 。","rén fēi hàn shǐ tuó ， jùn shì yuè wáng tái 。","qù qù suī shū shì ， shān chuān zhǎng zài zāi 。"],s:""},
        {e:"🌳",title:"山亭夜宴",author:"王勃",dynasty:"唐",lines:["桂宇幽襟积，山亭凉夜永。","森沈野径寒，肃穆巖扉静。","竹晦南汀色，荷翻北潭影。","清兴殊未阑，林端照初景。"],py:["guì yǔ yōu jīn jī ， shān tíng liáng yè yǒng 。","sēn shěn yě jìng hán ， sù mù yán fēi jìng 。","zhú huì nán tīng sè ， hé fān běi tán yǐng 。","qīng xīng shū wèi lán ， lín duān zhào chū jǐng 。"],s:""},
        {e:"🌼",title:"散关晨度",author:"王勃",dynasty:"唐",lines:["关山凌旦开，石路无尘埃。","白马高谭去，青牛真气来。","重门临巨壑，连栋起崇隈。","即今扬策度，非是弃繻回。"],py:["guān shān líng dàn kāi ， shí lù wú chén āi 。","bái mǎ gāo tán qù ， qīng niú zhēn qì lái 。","zhòng mén lín jù hè ， lián dòng qǐ chóng wēi 。","jí jīn yáng cè dù ， fēi shì qì xū huí 。"],s:""},
        {e:"🪷",title:"重别薛华",author:"王勃",dynasty:"唐",lines:["明月沈珠浦，秋风濯锦川。","楼台临绝岸，洲渚亘长天。","旅泊成千里，栖遑共百年。","穷途唯有泪，还望独潸然。"],py:["míng yuè shěn zhū pǔ ， qiū fēng zhuó jǐn chuān 。","lóu tái lín jué àn ， zhōu zhǔ gèn cháng tiān 。","lǚ pō chéng qiān lǐ ， qī huáng gòng bǎi nián 。","qióng tú wéi yǒu lèi ， hái wàng dú shān rán 。"],s:""},
        {e:"🌟",title:"麻平晚行",author:"王勃",dynasty:"唐",lines:["百年怀土望，千里倦游情。","高低寻戍道，远近听泉声。","磵叶才分色，山花不辨名。","羁心何处尽？风急暮猨清。"],py:["bǎi nián huái tǔ wàng ， qiān lǐ juàn yóu qíng 。","gāo dī xún shù dào ， yuǎn jìn tīng quán shēng 。","jiàn yè cái fèn sè ， shān huā bù biàn míng 。","jī xīn hé chù jǐn ？ fēng jí mù yuán qīng 。"],s:""},
        {e:"🌿",title:"送卢主簿",author:"王勃",dynasty:"唐",lines:["穷途非所恨，虚室自相依。","城阙居年满，琴尊俗事稀。","开襟方未已，分袂忽多违。","东巖富松竹，岁暮幸同归。"],py:["qióng tú fēi suǒ hèn ， xū shì zì xiāng yī 。","chéng què jū nián mǎn ， qín zūn sú shì xī 。","kāi jīn fāng wèi yǐ ， fēn mèi hū duō wéi 。","dōng yán fù sōng zhú ， suì mù xìng tóng guī 。"],s:""},
        {e:"🌸",title:"饯韦兵曹",author:"王勃",dynasty:"唐",lines:["征骖临野次，别袂惨江垂。","川霁浮烟歛，山明落照移。","鹰风凋晚叶，蝉露泣秋枝。","亭臯分远望，延想间云涯。"],py:["zhēng cān lín yě cì ， bié mèi cǎn jiāng chuí 。","chuān jì fú yān hān ， shān míng luò zhào yí 。","yīng fēng diāo wǎn yè ， chán lù qì qiū zhī 。","tíng gāo fēn yuǎn wàng ， yán xiǎng jiān yún yá 。"],s:""},
        {e:"🍃",title:"北眺舂陵",author:"骆宾王",dynasty:"唐",lines:["揽辔疲宵迈，驱马倦晨兴。","既出封泥谷，还过避雨陵。","山行明照上，谿宿密云蒸。","登高徒欲赋，词殚独抚膺。"],py:["lǎn pèi pí xiāo mài ， qū mǎ juàn chén xīng 。","jì chū fēng ní gǔ ， hái guò bì yǔ líng 。","shān xíng míng zhào shàng ， xī sù mì yún zhēng 。","dēng gāo tú yù fù ， cí dān dú fǔ yīng 。"],s:""},
        {e:"🌙",title:"渡瓜步江",author:"骆宾王",dynasty:"唐",lines:["捧檄辞幽径，鸣榔下贵洲。","惊涛疑跃马，积气似连牛。","月迥寒沙净，风急夜江秋。","不学浮云影，他乡空滞留。"],py:["pěng xí cí yōu jìng ， míng láng xià guì zhōu 。","jīng tāo yí yuè mǎ ， jī qì shì lián niú 。","yuè jiǒng hán shā jìng ， fēng jí yè jiāng qiū 。","bù xué fú yún yǐng ， tā xiāng kōng zhì liú 。"],s:""},
        {e:"⛰️",title:"途中有怀",author:"骆宾王",dynasty:"唐",lines:["睠然怀楚奏，怅矣背秦关。","涸鳞惊照辙，坠羽怯虚弯。","素服三川化，乌裘十上还。","莫言无皓齿，时俗薄朱颜。"],py:["juàn rán huái chǔ zòu ， chàng yǐ bèi qín guān 。","hé lín jīng zhào zhé ， zhuì yǔ qiè xū wān 。","sù fú sān chuān huà ， wū qiú shí shàng hái 。","mò yán wú hào chǐ ， shí sú báo zhū yán 。"],s:""},
        {e:"💧",title:"至分水戍",author:"骆宾王",dynasty:"唐",lines:["行役忽离忧，复此怆分流。","溅石回湍咽，萦丛曲涧幽。","阴巖常结晦，宿莽竞含秋。","况乃霜晨早，寒风入戍楼。"],py:["xíng yì hū lí yōu ， fù cǐ chuàng fēn liú 。","jiàn shí huí tuān yàn ， yíng cóng qū jiàn yōu 。","yīn yán cháng jié huì ， sù mǎng jìng hán qiū 。","kuàng nǎi shuāng chén zǎo ， hán fēng rù shù lóu 。"],s:""},
        {e:"🍂",title:"送人之军",author:"贺知章",dynasty:"唐",lines:["常经绝脉塞，复见断肠流。","送子成今别，令人起昔愁。","陇云晴半雨，边草夏先秋。","万里长城寄，无贻汉国忧。"],py:["cháng jīng jué mài sāi ， fù jiàn duàn cháng liú 。","sòng zi chéng jīn bié ， lìng rén qǐ xī chóu 。","lǒng yún qíng bàn yǔ ， biān cǎo xià xiān qiū 。","wàn lǐ cháng chéng jì ， wú yí hàn guó yōu 。"],s:""},
        {e:"🌊",title:"赠刘蓝田",author:"王维",dynasty:"唐",lines:["篱间犬迎吠，出屋候荆扉。","岁晏输井税，山村人夜归。","晚田始家食，余布成我衣。","讵肯无公事，烦君问是非。"],py:["lí jiān quǎn yíng fèi ， chū wū hòu jīng fēi 。","suì yàn shū jǐng shuì ， shān cūn rén yè guī 。","wǎn tián shǐ jiā shí ， yú bù chéng wǒ yī 。","jù kěn wú gōng shì ， fán jūn wèn shì fēi 。"],s:""},
        {e:"🌻",title:"新晴野望",author:"王维",dynasty:"唐",lines:["新晴原野旷，极目无氛垢。","郭门临渡头，村树连谿口。","白水明田外，碧峰出山后。","农月无闲人，倾家事南亩。"],py:["xīn qíng yuán yě kuàng ， jí mù wú fēn gòu 。","guō mén lín dù tóu ， cūn shù lián xī kǒu 。","bái shuǐ míng tián wài ， bì fēng chū shān hòu 。","nóng yuè wú xián rén ， qīng jiā shì nán mǔ 。"],s:""},
        {e:"🐦",title:"冬夜书怀",author:"王维",dynasty:"唐",lines:["冬宵寒且永，夜漏宫中发。","草白霭繁霜，木衰澄清月。","丽服暎颓颜，朱灯照华髪。","汉家方尚少，顾影慙朝谒。"],py:["dōng xiāo hán qiě yǒng ， yè lòu gōng zhōng fā 。","cǎo bái ǎi fán shuāng ， mù shuāi chéng qīng yuè 。","lì fú yìng tuí yán ， zhū dēng zhào huá fà 。","hàn jiā fāng shàng shǎo ， gù yǐng cán cháo yè 。"],s:""},
        {e:"🌺",title:"入若耶溪",author:"崔颢",dynasty:"唐",lines:["轻舟去何疾，已到云林境。","起坐鱼鸟间，动摇山水影。","巖中响自答，溪里言弥静。","事事令人幽，停桡向余景。"],py:["qīng zhōu qù hé jí ， yǐ dào yún lín jìng 。","qǐ zuò yú niǎo jiān ， dòng yáo shān shuǐ yǐng 。","yán zhōng xiǎng zì dá ， xī lǐ yán mí jìng 。","shì shì lìng rén yōu ， tíng ráo xiàng yú jǐng 。"],s:""},
        {e:"🌈",title:"王家少妇",author:"崔颢",dynasty:"唐",lines:["十五嫁王昌，盈盈入画堂。","自矜年最少，复倚壻爲郎。","舞爱前谿绿，歌怜子夜长。","闲来鬬百草，度日不成妆。"],py:["shí wǔ jià wáng chāng ， yíng yíng rù huà táng 。","zì jīn nián zuì shǎo ， fù yǐ xù wèi láng 。","wǔ ài qián xī lǜ ， gē lián zi yè zhǎng 。","xián lái dòu bǎi cǎo ， dù rì bù chéng zhuāng 。"],s:""},
        {e:"🔥",title:"题潼关楼",author:"崔颢",dynasty:"唐",lines:["客行逢雨霁，歇马上津楼。","山势雄三辅，关门扼九州。","川从陕路去，河遶华阴流。","向晚登临处，风烟万里愁。"],py:["kè xíng féng yǔ jì ， xiē mǎ shàng jīn lóu 。","shān shì xióng sān fǔ ， guān mén è jiǔ zhōu 。","chuān cóng shǎn lù qù ， hé rào huá yīn liú 。","xiàng wǎn dēng lín chù ， fēng yān wàn lǐ chóu 。"],s:""},
        {e:"❄️",title:"晚入汴水",author:"崔颢",dynasty:"唐",lines:["昨晚南行楚，今朝北泝河。","客愁能几日，乡路渐无多。","晴景摇津树，春风起棹歌。","长淮亦已尽，宁复畏潮波。"],py:["zuó wǎn nán xíng chǔ ， jīn zhāo běi sù hé 。","kè chóu néng jǐ rì ， xiāng lù jiàn wú duō 。","qíng jǐng yáo jīn shù ， chūn fēng qǐ zhào gē 。","zhǎng huái yì yǐ jǐn ， níng fù wèi cháo bō 。"],s:""},
        {e:"🌼",title:"发锦沙村",author:"崔颢",dynasty:"唐",lines:["北上途未半，南行岁已阑。","孤舟下建德，江水入新安。","海近山常雨，谿深地早寒。","行行泊不可，须及子陵滩。"],py:["běi shàng tú wèi bàn ， nán xíng suì yǐ lán 。","gū zhōu xià jiàn dé ， jiāng shuǐ rù xīn ān 。","hǎi jìn shān cháng yǔ ， xī shēn dì zǎo hán 。","xíng xíng pō bù kě ， xū jí zi líng tān 。"],s:""},
        {e:"🍁",title:"行经华阴",author:"崔颢",dynasty:"唐",lines:["岧嶤太华俯咸京，天外三峰削不成。","武帝祠前云欲散，仙人掌上雨初晴。","河山北枕秦关险，驿树西连汉畤平。","借问路傍名利客，无如此处学长生。"],py:["tiáo yáo tài huá fǔ xián jīng ， tiān wài sān fēng xuē bù chéng 。","wǔ dì cí qián yún yù sàn ， xiān rén zhǎng shàng yǔ chū qíng 。","hé shān běi zhěn qín guān xiǎn ， yì shù xī lián hàn zhì píng 。","jiè wèn lù bàng míng lì kè ， wú rú cǐ chù xué zhǎng shēng 。"],s:""},
        {e:"🌳",title:"变行路难",author:"王昌龄",dynasty:"唐",lines:["向晚横吹悲，风动马嘶合。","前趋引旗节，千里阵云帀。","单于下阴山，砂砾空飒飒。","封侯取一战，岂复念闺合。"],py:["xiàng wǎn héng chuī bēi ， fēng dòng mǎ sī hé 。","qián qū yǐn qí jié ， qiān lǐ zhèn yún zā 。","chán yú xià yīn shān ， shā lì kōng sà sà 。","fēng hóu qǔ yī zhàn ， qǐ fù niàn guī hé 。"],s:""},
        {e:"🌼",title:"驾出长安",author:"王昌龄",dynasty:"唐",lines:["圣德超千古，皇风扇九围。","天廻万象出，驾动六龙飞。","淑气来黄道，祥云覆紫微。","太平多扈从，文物有光辉。"],py:["shèng dé chāo qiān gǔ ， huáng fēng shàn jiǔ wéi 。","tiān huí wàn xiàng chū ， jià dòng liù lóng fēi 。","shū qì lái huáng dào ， xiáng yún fù zǐ wēi 。","tài píng duō hù cóng ， wén wù yǒu guāng huī 。"],s:""},
        {e:"🪷",title:"驾幸河东",author:"王昌龄",dynasty:"唐",lines:["晋水千庐合，汾桥万国从。","开唐天业盛，入沛圣恩浓。","下辇廻三象，题碑任六龙。","睿明悬日月，千岁此时逢。"],py:["jìn shuǐ qiān lú hé ， fén qiáo wàn guó cóng 。","kāi táng tiān yè shèng ， rù pèi shèng ēn nóng 。","xià niǎn huí sān xiàng ， tí bēi rèn liù lóng 。","ruì míng xuán rì yuè ， qiān suì cǐ shí féng 。"],s:""},
        {e:"🌟",title:"谒焦鍊师",author:"王昌龄",dynasty:"唐",lines:["中峯青苔壁，一点云生时。","岂意石堂里，得逢焦鍊师。","炉香净琴案，松影闲瑶墀。","拜受长年药，翩翻西海期。"],py:["zhōng fēng qīng tái bì ， yì diǎn yún shēng shí 。","qǐ yì shí táng lǐ ， dé féng jiāo liàn shī 。","lú xiāng jìng qín àn ， sōng yǐng xián yáo chí 。","bài shòu cháng nián yào ， piān fān xī hǎi qī 。"],s:""},
        {e:"🌿",title:"寒食即事",author:"王昌龄",dynasty:"唐",lines:["晋阳寒食地，风俗旧来传。","雨灭龙蛇火，春生鸿雁天。","泣多流水涨，歌发舞云旋。","西见之推庙，空爲人所怜。"],py:["jìn yáng hán shí dì ， fēng sú jiù lái chuán 。","yǔ miè lóng shé huǒ ， chūn shēng hóng yàn tiān 。","qì duō liú shuǐ zhǎng ， gē fā wǔ yún xuán 。","xī jiàn zhī tuī miào ， kōng wèi rén suǒ lián 。"],s:""},
        {e:"🌸",title:"江上琴兴",author:"常建",dynasty:"唐",lines:["江上调玉琴，一弦清一心。","泠泠七弦遍，万木澄幽阴。","能使江月白，又令江水深。","始知梧桐枝，可以徽黄金。"],py:["jiāng shàng diào yù qín ， yī xián qīng yī xīn 。","líng líng qī xián biàn ， wàn mù chéng yōu yīn 。","néng shǐ jiāng yuè bái ， yòu lìng jiāng shuǐ shēn 。","shǐ zhī wú tóng zhī ， kě yǐ huī huáng jīn 。"],s:""},
        {e:"🍃",title:"潭州留别",author:"常建",dynasty:"唐",lines:["贤达不相识，偶然交已深。","宿帆谒郡佐，怅别依禅林。","湘水流入海，楚云千里心。","望君杉松夜，山月清猿吟。"],py:["xián dá bù xiāng shí ， ǒu rán jiāo yǐ shēn 。","sù fān yè jùn zuǒ ， chàng bié yī chán lín 。","xiāng shuǐ liú rù hǎi ， chǔ yún qiān lǐ xīn 。","wàng jūn shān sōng yè ， shān yuè qīng yuán yín 。"],s:""},
        {e:"🌙",title:"泊舟盱眙",author:"常建",dynasty:"唐",lines:["泊舟淮水次，霜降夕流清。","夜久潮侵岸，天寒月近城。","平沙依鴈宿，候馆听鸡鸣。","乡国云霄外，谁堪羁旅情。"],py:["pō zhōu huái shuǐ cì ， shuāng jiàng xī liú qīng 。","yè jiǔ cháo qīn àn ， tiān hán yuè jìn chéng 。","píng shā yī yàn sù ， hòu guǎn tīng jī míng 。","xiāng guó yún xiāo wài ， shuí kān jī lǚ qíng 。"],s:""},
        {e:"⛰️",title:"余干旅舍",author:"刘长卿",dynasty:"唐",lines:["摇落暮天迥，青枫霜叶稀。","孤城向水闭，独鸟背人飞。","渡口月初上，邻家渔未归。","乡心正欲绝，何处擣寒衣。"],py:["yáo luò mù tiān jiǒng ， qīng fēng shuāng yè xī 。","gū chéng xiàng shuǐ bì ， dú niǎo bèi rén fēi 。","dù kǒu yuè chū shàng ， lín jiā yú wèi guī 。","xiāng xīn zhèng yù jué ， hé chù dǎo hán yī 。"],s:""},
        {e:"💧",title:"耶溪泛舟",author:"孟浩然",dynasty:"唐",lines:["落景馀清辉，轻桡弄溪渚。","澄明爱水物，临泛何容与。","白首垂钓翁，新妆浣纱女。","相看似相识，脉脉不得语。"],py:["luò jǐng yú qīng huī ， qīng ráo nòng xī zhǔ 。","chéng míng ài shuǐ wù ， lín fàn hé róng yǔ 。","bái shǒu chuí diào wēng ， xīn zhuāng huàn shā nǚ 。","xiāng kàn shì xiāng shí ， mò mò bù dé yǔ 。"],s:""},
        {e:"🍂",title:"清明即事",author:"孟浩然",dynasty:"唐",lines:["帝里重清明，人心自愁思。","车声上路合，柳色东城翠。","花落草齐生，鸎飞蝶双戏。","空堂坐相忆，酌茗聊代醉。"],py:["dì lǐ zhòng qīng míng ， rén xīn zì chóu sī 。","chē shēng shàng lù hé ， liǔ sè dōng chéng cuì 。","huā luò cǎo qí shēng ， yīng fēi dié shuāng xì 。","kōng táng zuò xiāng yì ， zhuó míng liáo dài zuì 。"],s:""},
        {e:"🌊",title:"寄赵正字",author:"孟浩然",dynasty:"唐",lines:["正字芸香阁，幽人竹素园。","经过宛如昨，归卧寂无喧。","高鸟能择木，羚羊漫触藩。","物情今已见，从此愿忘言。"],py:["zhèng zì yún xiāng gé ， yōu rén zhú sù yuán 。","jīng guò wǎn rú zuó ， guī wò jì wú xuān 。","gāo niǎo néng zé mù ， líng yáng màn chù fān 。","wù qíng jīn yǐ jiàn ， cóng cǐ yuàn wàng yán 。"],s:""},
        {e:"🌻",title:"寻天台山",author:"孟浩然",dynasty:"唐",lines:["吾友太乙子，餐霞卧赤城。","欲寻华顶去，不惮恶谿名。","歇马凭云宿，扬帆截海行。","高高翠微里，遥见石梁横。"],py:["wú yǒu tài yǐ zi ， cān xiá wò chì chéng 。","yù xún huá dǐng qù ， bù dàn è xī míng 。","xiē mǎ píng yún sù ， yáng fān jié hǎi xíng 。","gāo gāo cuì wēi lǐ ， yáo jiàn shí liáng héng 。"],s:""},
        {e:"🐦",title:"武陵泛舟",author:"孟浩然",dynasty:"唐",lines:["武陵川路狭，前櫂入花林。","莫测幽源里，仙家信几深。","水回青嶂合，云度绿溪阴。","坐听闲猿啸，弥清尘外心。"],py:["wǔ líng chuān lù xiá ， qián zhào rù huā lín 。","mò cè yōu yuán lǐ ， xiān jiā xìn jǐ shēn 。","shuǐ huí qīng zhàng hé ， yún dù lǜ xī yīn 。","zuò tīng xián yuán xiào ， mí qīng chén wài xīn 。"],s:""},
        {e:"🌺",title:"中妇织流黄",author:"虞世南",dynasty:"唐",lines:["寒闺织素锦，含怨敛双蛾。","综新交缕澁，经脆断丝多。","衣香逐举袖，钏动应鸣梭。","还恐裁缝罢，无信达交河。"],py:["hán guī zhī sù jǐn ， hán yuàn liǎn shuāng é 。","zōng xīn jiāo lǚ sè ， jīng cuì duàn sī duō 。","yī xiāng zhú jǔ xiù ， chuàn dòng yīng míng suō 。","hái kǒng cái féng bà ， wú xìn dá jiāo hé 。"],s:""},
        {e:"🌈",title:"奉和咏日午",author:"虞世南",dynasty:"唐",lines:["高天净秋色，长汉转曦车。","玉树阴初正，桐圭影未斜。","翠盖飞圆彩，明镜发轻花。","再中良表瑞，共仰璧晖赊。"],py:["gāo tiān jìng qiū sè ， zhǎng hàn zhuǎn xī chē 。","yù shù yīn chū zhèng ， tóng guī yǐng wèi xié 。","cuì gài fēi yuán cǎi ， míng jìng fā qīng huā 。","zài zhōng liáng biǎo ruì ， gòng yǎng bì huī shē 。"],s:""},
        {e:"🔥",title:"侍宴归鴈堂",author:"虞世南",dynasty:"唐",lines:["歌堂面渌水，舞馆接金塘。","竹开霜后翠，梅动雪前香。","凫归初命侣，鴈起欲分行。","刷羽同栖集，怀恩愧稻粱。"],py:["gē táng miàn lù shuǐ ， wǔ guǎn jiē jīn táng 。","zhú kāi shuāng hòu cuì ， méi dòng xuě qián xiāng 。","fú guī chū mìng lǚ ， yàn qǐ yù fēn háng 。","shuā yǔ tóng qī jí ， huái ēn kuì dào liáng 。"],s:""},
        {e:"❄️",title:"鴈门胡人歌",author:"崔颢",dynasty:"唐",lines:["高山代郡东接燕，鴈门胡人家近边。","解放胡鹰逐塞鸟，能将代马猎秋田。","山头野火寒多烧，雨里孤峰湿作烟。","闻道辽西无鬬战，时时醉向酒家眠。"],py:["gāo shān dài jùn dōng jiē yàn ， yàn mén hú rén jiā jìn biān 。","jiě fàng hú yīng zhú sāi niǎo ， néng jiāng dài mǎ liè qiū tián 。","shān tóu yě huǒ hán duō shāo ， yǔ lǐ gū fēng shī zuò yān 。","wén dào liáo xī wú dòu zhàn ， shí shí zuì xiàng jiǔ jiā mián 。"],s:""},
        {e:"🌼",title:"岐王席观妓",author:"崔颢",dynasty:"唐",lines:["二月春来半，宫中日渐长。","柳垂金屋煖，花发玉楼香。","拂匣先临镜，调笙更炙簧。","还将歌舞态，只拟奉君王。"],py:["èr yuè chūn lái bàn ， gōng zhōng rì jiàn zhǎng 。","liǔ chuí jīn wū nuǎn ， huā fā yù lóu xiāng 。","fú xiá xiān lín jìng ， diào shēng gèng zhì huáng 。","hái jiāng gē wǔ tài ， zhǐ nǐ fèng jūn wáng 。"],s:""},
        {e:"🍁",title:"宿裴氏山庄",author:"王昌龄",dynasty:"唐",lines:["苍苍竹林暮，吾亦知所投。","静坐山斋月，清溪闻远流。","西峰下微雨，向晓白云收。","遂解尘中组，终南春可游。"],py:["cāng cāng zhú lín mù ， wú yì zhī suǒ tóu 。","jìng zuò shān zhāi yuè ， qīng xī wén yuǎn liú 。","xī fēng xià wēi yǔ ， xiàng xiǎo bái yún shōu 。","suì jiě chén zhōng zǔ ， zhōng nán chūn kě yóu 。"],s:""},
        {e:"🌳",title:"大梁途中作",author:"王昌龄",dynasty:"唐",lines:["怏怏步长道，客行渺无端。","郊原欲下雪，天地稜稜寒。","当时每酣醉，不觉行路难。","今日无酒钱，悽惶向谁叹。"],py:["yàng yàng bù zhǎng dào ， kè xíng miǎo wú duān 。","jiāo yuán yù xià xuě ， tiān dì léng léng hán 。","dāng shí měi hān zuì ， bù jué xíng lù nán 。","jīn rì wú jiǔ qián ， qī huáng xiàng shuí tàn 。"],s:""},
        {e:"🌼",title:"段宥廰孤桐",author:"王昌龄",dynasty:"唐",lines:["凤皇所宿处，月暎孤桐寒。","藁叶零落尽，空柯苍翠残。","虚心谁能见，直影非无端。","响发调尚苦，清商劳一弹。"],py:["fèng huáng suǒ sù chù ， yuè yìng gū tóng hán 。","gǎo yè líng luò jǐn ， kōng kē cāng cuì cán 。","xū xīn shuí néng jiàn ， zhí yǐng fēi wú duān 。","xiǎng fā diào shàng kǔ ， qīng shāng láo yī dàn 。"],s:""},
        {e:"🪷",title:"高楼夜弹筝",author:"常建",dynasty:"唐",lines:["高楼百余尺，直上江水平。","明月照人苦，开帘弹玉筝。","山高猿狖急，天静鸿鴈鸣。","曲度犹未终，东峰霞半生。"],py:["gāo lóu bǎi yú chǐ ， zhí shàng jiāng shuǐ píng 。","míng yuè zhào rén kǔ ， kāi lián dàn yù zhēng 。","shān gāo yuán yòu jí ， tiān jìng hóng yàn míng 。","qǔ dù yóu wèi zhōng ， dōng fēng xiá bàn shēng 。"],s:""},
        {e:"🌟",title:"弔王将军墓",author:"常建",dynasty:"唐",lines:["嫖姚北伐时，深入强千里。","战余落日黄，军败鼓声死。","尝闻汉飞将，可夺单于垒。","今与山鬼邻，残兵哭辽水。"],py:["piáo yáo běi fá shí ， shēn rù qiáng qiān lǐ 。","zhàn yú luò rì huáng ， jūn bài gǔ shēng sǐ 。","cháng wén hàn fēi jiāng ， kě duó chán yú lěi 。","jīn yǔ shān guǐ lín ， cán bīng kū liáo shuǐ 。"],s:""},
        {e:"🌿",title:"送李大都护",author:"常建",dynasty:"唐",lines:["单于虽不战，都护事边深。","君执幕中秘，能爲高士心。","海头近初月，碛里多愁阴。","西望郭犹子，将分泪满襟。"],py:["chán yú suī bù zhàn ， dōu hù shì biān shēn 。","jūn zhí mù zhōng mì ， néng wèi gāo shì xīn 。","hǎi tóu jìn chū yuè ， qì lǐ duō chóu yīn 。","xī wàng guō yóu zi ， jiāng fēn lèi mǎn jīn 。"],s:""},
        {e:"🌸",title:"发营逢雨应诏",author:"虞世南",dynasty:"唐",lines:["豫游欣胜地，皇泽乃先天。","油云阴御道，膏雨润公田。","陇麦霑逾翠，山花湿更然。","稼穑良所重，方复悦丰年。"],py:["yù yóu xīn shèng dì ， huáng zé nǎi xiān tiān 。","yóu yún yīn yù dào ， gāo yǔ rùn gōng tián 。","lǒng mài zhān yú cuì ， shān huā shī gèng rán 。","jià sè liáng suǒ zhòng ， fāng fù yuè fēng nián 。"],s:""},
        {e:"🍃",title:"赠梁州张都督",author:"崔颢",dynasty:"唐",lines:["闻君爲汉将，虏骑罢南侵。","出塞清沙漠，还家拜羽林。","风霜臣节苦，岁月主恩深。","爲语西河使，知余报国心。"],py:["wén jūn wèi hàn jiāng ， lǔ qí bà nán qīn 。","chū sài qīng shā mò ， hái jiā bài yǔ lín 。","fēng shuāng chén jié kǔ ， suì yuè zhǔ ēn shēn 。","wèi yǔ xī hé shǐ ， zhī yú bào guó xīn 。"],s:""},
        {e:"🌙",title:"宿王昌龄隐居",author:"常建",dynasty:"唐",lines:["清溪深不测，隐处唯孤云。","松际露微月，清光犹爲君。","茅亭宿花影，药院滋苔纹。","余亦谢时去，西山鸾鹤羣。"],py:["qīng xī shēn bù cè ， yǐn chù wéi gū yún 。","sōng jì lù wēi yuè ， qīng guāng yóu wèi jūn 。","máo tíng sù huā yǐng ， yào yuàn zī tái wén 。","yú yì xiè shí qù ， xī shān luán hè qún 。"],s:""},
        {e:"⛰️",title:"赋得临池竹应制",author:"虞世南",dynasty:"唐",lines:["葱翠梢云质，垂彩暎清池。","波泛含风影，流摇防露枝。","龙鳞漾嶰谷，凤翅拂涟漪。","欲识凌冬性，唯有岁寒知。"],py:["cōng cuì shāo yún zhì ， chuí cǎi yìng qīng chí 。","bō fàn hán fēng yǐng ， liú yáo fáng lù zhī 。","lóng lín yàng xiè gǔ ， fèng chì fú lián yī 。","yù shí líng dōng xìng ， wéi yǒu suì hán zhī 。"],s:""},
        {e:"💧",title:"奉和献岁䜩宫臣",author:"虞世南",dynasty:"唐",lines:["履端初起节，长苑命高筵。","肆夏喧金奏，重润响朱弦。","春光催柳色，日彩泛槐烟。","微臣同滥吹，谬得仰钧天。"],py:["lǚ duān chū qǐ jié ， zhǎng yuàn mìng gāo yán 。","sì xià xuān jīn zòu ， zhòng rùn xiǎng zhū xián 。","chūn guāng cuī liǔ sè ， rì cǎi fàn huái yān 。","wēi chén tóng làn chuī ， miù dé yǎng jūn tiān 。"],s:""},
        {e:"🍂",title:"奉和出颍至淮应令",author:"虞世南",dynasty:"唐",lines:["良晨喜利涉，解缆入淮浔。","寒流泛鹢首，霜吹响哀吟。","潜鳞波里跃，水鸟浪前沈。","邗沟非复远，怅望悦宸襟。"],py:["liáng chén xǐ lì shè ， jiě lǎn rù huái xún 。","hán liú fàn yì shǒu ， shuāng chuī xiǎng āi yín 。","qián lín bō lǐ yuè ， shuǐ niǎo làng qián shěn 。","hán gōu fēi fù yuǎn ， chàng wàng yuè chén jīn 。"],s:""},
        {e:"🌊",title:"侍宴应诏赋韵得前字",author:"虞世南",dynasty:"唐",lines:["芬芳禁林晚，容与桂丹前。","横空一鸟度，照水百花然。","绿野明斜日，青山澹晚烟。","滥陪终宴赏，握管类窥天。"],py:["fēn fāng jìn lín wǎn ， róng yǔ guì dān qián 。","héng kōng yī niǎo dù ， zhào shuǐ bǎi huā rán 。","lǜ yě míng xié rì ， qīng shān dàn wǎn yān 。","làn péi zhōng yàn shǎng ， wò guǎn lèi kuī tiān 。"],s:""},
        {e:"🌻",title:"蝉",author:"虞世南",dynasty:"唐",lines:["垂緌饮清露，流响出疎桐。","居高声自远，非是借秋风。"],py:["chuí ruí yǐn qīng lù ， liú xiǎng chū shū tóng 。","jū gāo shēng zì yuǎn ， fēi shì jiè qiū fēng 。"],s:""},
        {e:"🐦",title:"春夜",author:"虞世南",dynasty:"唐",lines:["春苑月裴回，竹堂侵夜开。","惊鸟排林度，风花隔水来。"],py:["chūn yuàn yuè péi huí ， zhú táng qīn yè kāi 。","jīng niǎo pái lín dù ， fēng huā gé shuǐ lái 。"],s:""},
        {e:"🌺",title:"咏舞",author:"虞世南",dynasty:"唐",lines:["繁弦奏渌水，长袖转回鸾。","一双俱应节，还似镜中看。"],py:["fán xián zòu lù shuǐ ， cháng xiù zhuǎn huí luán 。","yī shuāng jù yīng jié ， hái shì jìng zhōng kàn 。"],s:""},
        {e:"🌈",title:"咏萤",author:"虞世南",dynasty:"唐",lines:["的历流光小，飘飖弱翅轻。","恐畏无人识，独自暗中明。"],py:["de lì liú guāng xiǎo ， piāo yáo ruò chì qīng 。","kǒng wèi wú rén shí ， dú zì àn zhōng míng 。"],s:""},
        {e:"🔥",title:"秋鴈",author:"虞世南",dynasty:"唐",lines:["日暮霜风急，羽翮转难任。","爲有传书意，联翩入上林。"],py:["rì mù shuāng fēng jí ， yǔ hé zhuǎn nán rèn 。","wèi yǒu chuán shū yì ， lián piān rù shàng lín 。"],s:""},
        {e:"❄️",title:"采莲曲",author:"贺知章",dynasty:"唐",lines:["稽山罢雾郁嵯峨，镜水无风也自波。","莫言春度芳菲尽，别有中流采芰荷。"],py:["jī shān bà wù yù cuó é ， jìng shuǐ wú fēng yě zì bō 。","mò yán chūn dù fāng fēi jǐn ， bié yǒu zhōng liú cǎi jì hé 。"],s:""},
        {e:"🌼",title:"答朝士",author:"贺知章",dynasty:"唐",lines:["钑镂银盘盛蛤蜊，镜湖莼菜乱如丝。","乡曲近来隹此味，遮渠不道是吴儿。"],py:["sà lòu yín pán shèng gé lí ， jìng hú chún cài luàn rú sī 。","xiāng qū jìn lái zhuī cǐ wèi ， zhē qú bù dào shì wú ér 。"],s:""},
        {e:"🍁",title:"乌栖曲",author:"李白",dynasty:"唐",lines:["姑苏台上乌栖时，吴王宫里醉西施。","吴歌楚舞欢未毕，青山欲衔半边日。"],py:["gū sū tái shàng wū qī shí ， wú wáng gōng lǐ zuì xī shī 。","wú gē chǔ wǔ huān wèi bì ， qīng shān yù xián bàn biān rì 。"],s:""},
        {e:"🌳",title:"题袁氏别业",author:"贺知章",dynasty:"唐",lines:["主人不相识，偶坐爲林泉。","莫谩愁沽酒，囊中自有钱。"],py:["zhǔ rén bù xiāng shí ， ǒu zuò wèi lín quán 。","mò mán chóu gū jiǔ ， náng zhōng zì yǒu qián 。"],s:""},
        {e:"🌼",title:"乌夜啼",author:"李白",dynasty:"唐",lines:["黄云城边乌欲栖，归飞哑哑枝上啼。","机中织锦秦川女，碧纱如烟隔窗语。","停梭怅然忆远人，独宿孤房泪如雨。"],py:["huáng yún chéng biān wū yù qī ， guī fēi yā yā zhī shàng tí 。","jī zhōng zhī jǐn qín chuān nǚ ， bì shā rú yān gé chuāng yǔ 。","tíng suō chàng rán yì yuǎn rén ， dú sù gū fáng lèi rú yǔ 。"],s:""},
        {e:"🪷",title:"公无渡河",author:"李白",dynasty:"唐",lines:["黄河西来决崑崙，咆哮万里触龙门。","波滔天，尧咨嗟，大禹理百川，儿啼不窥家。","杀湍烟洪水，九州始蚕麻。","其害乃去，茫然风沙。","被发之叟狂而痴，清晨临流欲奚爲。","旁人不惜妻止之，公无渡河苦渡之。","虎可搏，河难凭，公果溺死流海湄。","有长鲸白齿若雪山，公乎公乎挂罥于其间，箜篌所悲竟不还。"],py:["huáng hé xī lái jué kūn lún ， páo xiāo wàn lǐ chù lóng mén 。","bō tāo tiān ， yáo zī jiē ， dà yǔ lǐ bǎi chuān ， ér tí bù kuī jiā 。","shā tuān yān hóng shuǐ ， jiǔ zhōu shǐ cán má 。","qí hài nǎi qù ， máng rán fēng shā 。","bèi fā zhī sǒu kuáng ér chī ， qīng chén lín liú yù xī wèi 。","páng rén bù xī qī zhǐ zhī ， gōng wú dù hé kǔ dù zhī 。","hǔ kě bó ， hé nán píng ， gōng guǒ nì sǐ liú hǎi méi 。","yǒu zhǎng jīng bái chǐ ruò xuě shān ， gōng hū gōng hū guà juàn yú qí jiān ， kōng hóu suǒ bēi jìng bù hái 。"],s:""},
        {e:"🌟",title:"药",author:"宋之问",dynasty:"唐",lines:["有卉祕神仙，君臣有礼焉。","忻当苦口喻，不畏入肠偏。","扁鹊功成日，神农定品年。","丹成如可待，鸡犬自闻天。"],py:["yǒu huì mì shén xiān ， jūn chén yǒu lǐ yān 。","xīn dāng kǔ kǒu yù ， bù wèi rù cháng piān 。","biǎn què gōng chéng rì ， shén nóng dìng pǐn nián 。","dān chéng rú kě dài ， jī quǎn zì wén tiān 。"],s:""},
        {e:"🌿",title:"句",author:"苏颋",dynasty:"唐",lines:["飞埃结红雾，游盖飘青云。","指如十挺墨，耳似两张匙。","丑虽有足，甲不全身。","见君无口，知伊少人。"],py:["fēi āi jié hóng wù ， yóu gài piāo qīng yún 。","zhǐ rú shí tǐng mò ， ěr shì liǎng zhāng shi 。","chǒu suī yǒu zú ， jiǎ bù quán shēn 。","jiàn jūn wú kǒu ， zhī yī shǎo rén 。"],s:""},
        {e:"🌸",title:"雪",author:"徐彦伯",dynasty:"唐",lines:["雪暗穷海云，洒空纷似露。","朔风吹故里，宛转玉阶树。","孤妾调玉瑟，早寒生锦衿。","况君张罗幕，愁坐北庭阴。"],py:["xuě àn qióng hǎi yún ， sǎ kōng fēn shì lù 。","shuò fēng chuī gù lǐ ， wǎn zhuǎn yù jiē shù 。","gū qiè diào yù sè ， zǎo hán shēng jǐn jīn 。","kuàng jūn zhāng luó mù ， chóu zuò běi tíng yīn 。"],s:""},
        {e:"🍃",title:"秋莺",author:"后主煜",dynasty:"唐",lines:["残莺何事不知秋，横过幽林尚独游。","老舌百般倾耳听，深黄一点入烟流。","栖迟背世同悲鲁，浏亮如笙碎在缑。","莫更留连好归去，露华凄冷蓼花愁。"],py:["cán yīng hé shì bù zhī qiū ， héng guò yōu lín shàng dú yóu 。","lǎo shé bǎi bān qīng ěr tīng ， shēn huáng yì diǎn rù yān liú 。","qī chí bèi shì tóng bēi lǔ ， liú liàng rú shēng suì zài gōu 。","mò gèng liú lián hǎo guī qù ， lù huá qī lěng liǎo huā chóu 。"],s:""},
        {e:"🌙",title:"悼诗",author:"后主煜",dynasty:"唐",lines:["永念难消释，孤怀痛自嗟。","雨深秋寂莫，愁引病增加。","咽绝风前思，昏蒙眼上花。","空王应念我，穷子正迷家。"],py:["yǒng niàn nán xiāo shì ， gū huái tòng zì jiē 。","yǔ shēn qiū jì mò ， chóu yǐn bìng zēng jiā 。","yàn jué fēng qián sī ， hūn méng yǎn shàng huā 。","kōng wáng yīng niàn wǒ ， qióng zi zhèng mí jiā 。"],s:""},
        {e:"⛰️",title:"梅花",author:"后主煜",dynasty:"唐",lines:["殷勤移植地，曲槛小阑边。","共约重芳日，还忧不盛妍。","阻风开步障，乘月溉寒泉。","谁料花前后，蛾眉却不全。"],py:["yīn qín yí zhí dì ， qū kǎn xiǎo lán biān 。","gòng yuē zhòng fāng rì ， hái yōu bù shèng yán 。","zǔ fēng kāi bù zhàng ， chéng yuè gài hán quán 。","shuí liào huā qián hòu ， é méi què bù quán 。"],s:""},
        {e:"💧",title:"观棊",author:"吉王从谦",dynasty:"唐",lines:["竹林二君子，尽日竟沈吟。","相对终无语，争先各有心。","恃强斯有失，守分固无侵。","若算机筹处，沧沧海未深。"],py:["zhú lín èr jūn zǐ ， jǐn rì jìng shěn yín 。","xiāng duì zhōng wú yǔ ， zhēng xiān gè yǒu xīn 。","shì qiáng sī yǒu shī ， shǒu fèn gù wú qīn 。","ruò suàn jī chóu chù ， cāng cāng hǎi wèi shēn 。"],s:""},
        {e:"🍂",title:"咏笛",author:"刘孝孙",dynasty:"唐",lines:["凉秋夜笛鸣，流风韵九成。","调高时慷慨，曲变或凄清。","征客怀离绪，邻人思旧情。","幸以知音顾，千载有奇声。"],py:["liáng qiū yè dí míng ， liú fēng yùn jiǔ chéng 。","diào gāo shí kāng kǎi ， qū biàn huò qī qīng 。","zhēng kè huái lí xù ， lín rén sī jiù qíng 。","xìng yǐ zhī yīn gù ， qiān zài yǒu qí shēng 。"],s:""},
        {e:"🌊",title:"咏马",author:"杨师道",dynasty:"唐",lines:["宝马权奇出未央，雕鞍照曜紫金装。","春草初生驰上苑，秋风欲动戏长杨。","鸣珂屡度章台侧，细蹀经向濯龙傍。","徒令汉将连年去，宛城今已献名王。"],py:["bǎo mǎ quán qí chū wèi yāng ， diāo ān zhào yào zǐ jīn zhuāng 。","chūn cǎo chū shēng chí shàng yuàn ， qiū fēng yù dòng xì zhǎng yáng 。","míng kē lǚ dù zhāng tái cè ， xì dié jīng xiàng zhuó lóng bàng 。","tú lìng hàn jiāng lián nián qù ， wǎn chéng jīn yǐ xiàn míng wáng 。"],s:""},
        {e:"🌻",title:"北山",author:"王绩",dynasty:"唐",lines:["旧知山里绝氛埃，登高日暮心悠哉。","子平一去何时返？仲叔长游遂不来。","幽兰独夜清琴曲，桂树凌云浊酒杯。","藁项同枯木，丹心等死灰。"],py:["jiù zhī shān lǐ jué fēn āi ， dēng gāo rì mù xīn yōu zāi 。","zi píng yī qù hé shí fǎn ？ zhòng shū zhǎng yóu suì bù lái 。","yōu lán dú yè qīng qín qǔ ， guì shù líng yún zhuó jiǔ bēi 。","gǎo xiàng tóng kū mù ， dān xīn děng sǐ huī 。"],s:""},
        {e:"🐦",title:"野望",author:"王绩",dynasty:"唐",lines:["东皐薄暮望，徙倚欲何依。","树树皆秋色，山山唯落晖。","牧人驱犊返，猎马带禽归。","相顾无相识，长歌怀采薇。"],py:["dōng gāo bó mù wàng ， xǐ yǐ yù hé yī 。","shù shù jiē qiū sè ， shān shān wéi luò huī 。","mù rén qū dú fǎn ， liè mǎ dài qín guī 。","xiāng gù wú xiāng shí ， zhǎng gē huái cǎi wēi 。"],s:""},
        {e:"🌺",title:"独坐",author:"王绩",dynasty:"唐",lines:["问君樽酒外，独坐更何须。","有客谈名理，无人索地租。","三男婚令族，五女嫁贤夫。","百年随分了，未羡陟方壶。"],py:["wèn jūn zūn jiǔ wài ， dú zuò gèng hé xū 。","yǒu kè tán míng lǐ ， wú rén suǒ dì zū 。","sān nán hūn lìng zú ， wǔ nǚ jià xián fū 。","bǎi nián suí fēn le ， wèi xiàn zhì fāng hú 。"],s:""},
        {e:"🌈",title:"咏妓",author:"王绩",dynasty:"唐",lines:["妖姬饰靓妆，窈窕出兰房。","日照当轩影，风吹满路香。","早时歌扇薄，今日舞衫长。","不应令曲误，持此试周郎。"],py:["yāo jī shì jìng zhuāng ， yǎo tiǎo chū lán fáng 。","rì zhào dāng xuān yǐng ， fēng chuī mǎn lù xiāng 。","zǎo shí gē shàn báo ， jīn rì wǔ shān zhǎng 。","bù yīng lìng qū wù ， chí cǐ shì zhōu láng 。"],s:""},
        {e:"🔥",title:"骢马",author:"庾抱",dynasty:"唐",lines:["枥上浮云骢，本出吴门中。","发迹来东道，长鸣起北风。","回鞍拂桂白，赪汗类尘红。","灭没徒留影，无因图汉宫。"],py:["lì shàng fú yún cōng ， běn chū wú mén zhōng 。","fā jì lái dōng dào ， cháng míng qǐ běi fēng 。","huí ān fú guì bái ， chēng hàn lèi chén hóng 。","miè méi tú liú yǐng ， wú yīn tú hàn gōng 。"],s:""},
        {e:"❄️",title:"道失",author:"欧阳询",dynasty:"唐",lines:["已惑孔贵嫔，又被辞人侮。","花牋一何荣，七字谁曾许。","不下结绮阁，空迷江令语。","琱戈动地来，悞杀陈后主。"],py:["yǐ huò kǒng guì pín ， yòu bèi cí rén wǔ 。","huā jiān yī hé róng ， qī zì shuí céng xǔ 。","bù xià jié qǐ gé ， kōng mí jiāng lìng yǔ 。","diāo gē dòng dì lái ， wù shā chén hòu zhǔ 。"],s:""},
        {e:"🌼",title:"咏水",author:"张文琮",dynasty:"唐",lines:["标名资上善，流派表灵长。","地图罗四渎，天文载五潢。","方流涵玉润，圆折动珠光。","独有蒙园吏，栖偃翫濠梁。"],py:["biāo míng zī shàng shàn ， liú pài biǎo líng zhǎng 。","dì tú luó sì dú ， tiān wén zài wǔ huáng 。","fāng liú hán yù rùn ， yuán zhé dòng zhū guāng 。","dú yǒu méng yuán lì ， qī yǎn wán háo liáng 。"],s:""},
        {e:"🍁",title:"赋桥",author:"张文琮",dynasty:"唐",lines:["造舟浮渭日，鞭石表秦初。","星文遥写汉，虹势尚凌虚。","已授文成履，空题武骑书。","别有临濠上，栖偃独观鱼。"],py:["zào zhōu fú wèi rì ， biān shí biǎo qín chū 。","xīng wén yáo xiě hàn ， hóng shì shàng líng xū 。","yǐ shòu wén chéng lǚ ， kōng tí wǔ qí shū 。","bié yǒu lín háo shàng ， qī yǎn dú guān yú 。"],s:""},
        {e:"🌳",title:"刘生",author:"卢照邻",dynasty:"唐",lines:["刘生气不平，抱剑欲专征。","报恩爲豪侠，死难在横行。","翠羽装刀鞘，黄金饰马铃。","但令一顾重，不恡百身轻。"],py:["liú shēng qì bù píng ， bào jiàn yù zhuān zhēng 。","bào ēn wèi háo xiá ， sǐ nàn zài héng xíng 。","cuì yǔ zhuāng dāo qiào ， huáng jīn shì mǎ líng 。","dàn lìng yī gù zhòng ， bù lìn bǎi shēn qīng 。"],s:""},
        {e:"🌼",title:"芳树",author:"卢照邻",dynasty:"唐",lines:["芳树本多奇，年华复在斯。","结翠成新幄，开红满故枝。","风归花历乱，日度影参差。","容色朝朝落，思君君不知。"],py:["fāng shù běn duō qí ， nián huá fù zài sī 。","jié cuì chéng xīn wò ， kāi hóng mǎn gù zhī 。","fēng guī huā lì luàn ， rì dù yǐng cēn cī 。","róng sè cháo cháo luò ， sī jūn jūn bù zhī 。"],s:""},
        {e:"🪷",title:"送别",author:"李百药",dynasty:"唐",lines:["眷言一杯酒，悽怆起离忧。","夜花飘露气，暗水急还流。","雁行遥上月，虫声迥映秋。","明日河梁上，谁与论仙舟。"],py:["juàn yán yī bēi jiǔ ， qī chuàng qǐ lí yōu 。","yè huā piāo lù qì ， àn shuǐ jí hái liú 。","yàn háng yáo shàng yuè ， chóng shēng jiǒng yìng qiū 。","míng rì hé liáng shàng ， shuí yǔ lùn xiān zhōu 。"],s:""},
        {e:"🌟",title:"雨后",author:"李百药",dynasty:"唐",lines:["晚来风景丽，晴初物色华。","薄云向空尽，轻虹逐望斜。","后窗临岸竹，前阶枕浦沙。","寂寥无与晤，尊酒论风花。"],py:["wǎn lái fēng jǐng lì ， qíng chū wù sè huá 。","báo yún xiàng kōng jǐn ， qīng hóng zhú wàng xié 。","hòu chuāng lín àn zhú ， qián jiē zhěn pǔ shā 。","jì liáo wú yǔ wù ， zūn jiǔ lùn fēng huā 。"],s:""},
        {e:"🌿",title:"刘生",author:"杨炯",dynasty:"唐",lines:["卿家本六郡，年长入三秦。","白璧酬知己，黄金谢主人。","剑锋生赤电，马足起红尘。","日暮歌钟发，喧喧动四邻。"],py:["qīng jiā běn liù jùn ， nián zhǎng rù sān qín 。","bái bì chóu zhī jǐ ， huáng jīn xiè zhǔ rén 。","jiàn fēng shēng chì diàn ， mǎ zú qǐ hóng chén 。","rì mù gē zhōng fā ， xuān xuān dòng sì lín 。"],s:""},
        {e:"🌸",title:"骢马",author:"杨炯",dynasty:"唐",lines:["骢马铁连钱，长安侠少年。","帝畿平若水，官路直如弦。","夜玉妆车轴，秋金铸马鞭。","风霜但自保，穷达任皇天。"],py:["cōng mǎ tiě lián qián ， cháng ān xiá shào nián 。","dì jī píng ruò shuǐ ， guān lù zhí rú xián 。","yè yù zhuāng chē zhóu ， qiū jīn zhù mǎ biān 。","fēng shuāng dàn zì bǎo ， qióng dá rèn huáng tiān 。"],s:""},
        {e:"🍃",title:"出塞",author:"杨炯",dynasty:"唐",lines:["塞外欲纷纭，雌雄犹未分。","明堂占气色，华盖辨星文。","二月河魁将，三千太乙军。","丈夫皆有志，会见立功勋。"],py:["sài wài yù fēn yún ， cí xióng yóu wèi fēn 。","míng táng zhàn qì sè ， huá gài biàn xīng wén 。","èr yuè hé kuí jiāng ， sān qiān tài yǐ jūn 。","zhàng fū jiē yǒu zhì ， huì jiàn lì gōng xūn 。"],s:""},
        {e:"🌙",title:"芳树",author:"宋之问",dynasty:"唐",lines:["何地早芳菲，宛在长门殿。","夭桃色若绶，秾李光如练。","啼鸟弄花疎，游蜂饮香遍。","叹息春风起，飘零君不见。"],py:["hé dì zǎo fāng fēi ， wǎn zài cháng mén diàn 。","yāo táo sè ruò shòu ， nóng lǐ guāng rú liàn 。","tí niǎo nòng huā shū ， yóu fēng yǐn xiāng biàn 。","tàn xī chūn fēng qǐ ， piāo líng jūn bú jiàn 。"],s:""},
        {e:"⛰️",title:"牛女",author:"宋之问",dynasty:"唐",lines:["粉席秋期缓，针楼别怨多。","奔龙争渡月，飞鹊乱填河。","失喜先临镜，含羞未解罗。","谁能留夜色，来夕倍还梭。"],py:["fěn xí qiū qī huǎn ， zhēn lóu bié yuàn duō 。","bēn lóng zhēng dù yuè ， fēi què luàn tián hé 。","shī xǐ xiān lín jìng ， hán xiū wèi jiě luó 。","shuí néng liú yè sè ， lái xī bèi hái suō 。"],s:""},
        {e:"💧",title:"咏笛",author:"宋之问",dynasty:"唐",lines:["羌笛写龙声，长吟入夜清。","关山孤月下，来向陇头鸣。","逐吹梅花落，含春柳色惊。","行观向子赋，坐忆旧邻情。"],py:["qiāng dí xiě lóng shēng ， cháng yín rù yè qīng 。","guān shān gū yuè xià ， lái xiàng lǒng tóu míng 。","zhú chuī méi huā luò ， hán chūn liǔ sè jīng 。","xíng guān xiàng zi fù ， zuò yì jiù lín qíng 。"],s:""},
        {e:"🍂",title:"咏钟",author:"宋之问",dynasty:"唐",lines:["既接南邻磬，还随北里笙。","平陵通曙响，长乐警宵声。","秋至含霜动，春归应律鸣。","岂惟恆待扣，金簴有余清。"],py:["jì jiē nán lín qìng ， hái suí běi lǐ shēng 。","píng líng tōng shǔ xiǎng ， cháng lè jǐng xiāo shēng 。","qiū zhì hán shuāng dòng ， chūn guī yīng lǜ míng 。","qǐ wéi héng dài kòu ， jīn jù yǒu yú qīng 。"],s:""},
        {e:"🌊",title:"花落",author:"宋之问",dynasty:"唐",lines:["铁骑几时回，金闺怨早梅。","雪寒花已落，风暖叶还开。","夕逐新春管，香迎小岁桮。","盛时何足贵，书里报轮台。"],py:["tiě qí jǐ shí huí ， jīn guī yuàn zǎo méi 。","xuě hán huā yǐ luò ， fēng nuǎn yè hái kāi 。","xī zhú xīn chūn guǎn ， xiāng yíng xiǎo suì bēi 。","shèng shí hé zú guì ， shū lǐ bào lún tái 。"],s:""},
        {e:"🌻",title:"剪綵",author:"宋之问",dynasty:"唐",lines:["驻想持金错，居然作管灰。","绮罗纤手制，桃李向春开。","拾藻蜂初泊，衔花鸟未回。","不言将巧笑，飜逐美人来。"],py:["zhù xiǎng chí jīn cuò ， jū rán zuò guǎn huī 。","qǐ luó qiàn shǒu zhì ， táo lǐ xiàng chūn kāi 。","shí zǎo fēng chū pō ， xián huā niǎo wèi huí 。","bù yán jiāng qiǎo xiào ， fān zhú měi rén lái 。"],s:""},
        {e:"🐦",title:"边愁",author:"崔湜",dynasty:"唐",lines:["九月蓬根断，三边草叶腓。","风尘马变色，霜雪劒生衣。","客思愁阴晚，边书驿骑归。","殷勤凤楼上，还袂及春晖。"],py:["jiǔ yuè péng gēn duàn ， sān biān cǎo yè féi 。","fēng chén mǎ biàn sè ， shuāng xuě jiàn shēng yī 。","kè sī chóu yīn wǎn ， biān shū yì qí guī 。","yīn qín fèng lóu shàng ， hái mèi jí chūn huī 。"],s:""},
        {e:"🌺",title:"大酺",author:"杜审言",dynasty:"唐",lines:["圣后乘干日，皇明御历辰。","紫宫初启坐，苍璧正临春。","雷雨垂膏泽，金钱赠下人。","诏酺欢赏徧，交泰覩惟新。"],py:["shèng hòu chéng gàn rì ， huáng míng yù lì chén 。","zǐ gōng chū qǐ zuò ， cāng bì zhèng lín chūn 。","léi yǔ chuí gāo zé ， jīn qián zèng xià rén 。","zhào pú huān shǎng biàn ， jiāo tài dǔ wéi xīn 。"],s:""},
        {e:"🌈",title:"咏日",author:"董思恭",dynasty:"唐",lines:["沧海十枝晖，悬圃重轮庆。","蕣华发晨楹，菱彩飜朝镜。","忽遇惊风飘，自有浮云映。","更也人皆仰，无待挥戈正。"],py:["cāng hǎi shí zhī huī ， xuán pǔ zhòng lún qìng 。","shùn huá fà chén yíng ， líng cǎi fān cháo jìng 。","hū yù jīng fēng piāo ， zì yǒu fú yún yìng 。","gèng yě rén jiē yǎng ， wú dài huī gē zhèng 。"],s:""},
        {e:"🔥",title:"咏月",author:"董思恭",dynasty:"唐",lines:["北堂未安寝，西园聊骋望。","玉户照罗帏，珠轩明绮障。","别客长安道，思妇高楼上。","所愿君莫违，清风时可访。"],py:["běi táng wèi ān qǐn ， xī yuán liáo chěng wàng 。","yù hù zhào luó wéi ， zhū xuān míng qǐ zhàng 。","bié kè cháng ān dào ， sī fù gāo lóu shàng 。","suǒ yuàn jūn mò wéi ， qīng fēng shí kě fǎng 。"],s:""},
        {e:"❄️",title:"咏星",author:"董思恭",dynasty:"唐",lines:["历历东井舍，昭昭右掖垣。","云际龙文出，池中鸟色飜。","流辉下月路，坠影入河源。","方知颍川集，别有太丘门。"],py:["lì lì dōng jǐng shě ， zhāo zhāo yòu yē yuán 。","yún jì lóng wén chū ， chí zhōng niǎo sè fān 。","liú huī xià yuè lù ， zhuì yǐng rù hé yuán 。","fāng zhī yǐng chuān jí ， bié yǒu tài qiū mén 。"],s:""},
        {e:"🌼",title:"咏风",author:"董思恭",dynasty:"唐",lines:["萧萧度阊阖，习习下庭闱。","花蝶自飘舞，兰蕙生光辉。","相乌正举翼，退鹢已惊飞。","方从列子御，更逐浮云归。"],py:["xiāo xiāo dù chāng hé ， xí xí xià tíng wéi 。","huā dié zì piāo wǔ ， lán huì shēng guāng huī 。","xiāng wū zhèng jǔ yì ， tuì yì yǐ jīng fēi 。","fāng cóng liè zi yù ， gèng zhú fú yún guī 。"],s:""},
        {e:"🍁",title:"咏云",author:"董思恭",dynasty:"唐",lines:["帝乡白云起，飞盖上天衢。","带月绮罗映，从风枝叶敷。","参差过层阁，倏忽下苍梧。","因风望既远，安得久踟蹰。"],py:["dì xiāng bái yún qǐ ， fēi gài shàng tiān qú 。","dài yuè qǐ luó yìng ， cóng fēng zhī yè fū 。","cēn cī guò céng gé ， shū hū xià cāng wú 。","yīn fēng wàng jì yuǎn ， ān dé jiǔ chí chú 。"],s:""},
        {e:"🌳",title:"咏雪",author:"董思恭",dynasty:"唐",lines:["天山飞雪度，言是落花朝。","惜哉不我与，萧索从风飘。","鲜洁凌纨素，纷糅下枝条。","良时竟何在，坐见容华销。"],py:["tiān shān fēi xuě dù ， yán shì luò huā cháo 。","xī zāi bù wǒ yǔ ， xiāo suǒ cóng fēng piāo 。","xiān jié líng wán sù ， fēn róu xià zhī tiáo 。","liáng shí jìng hé zài ， zuò jiàn róng huá xiāo 。"],s:""},
        {e:"🌼",title:"咏露",author:"董思恭",dynasty:"唐",lines:["夜色凝仙掌，晨甘下帝庭。","不觉九秋至，远向三危零。","芦渚花初白，葵园叶尚青。","晞阳一洒惠，方愿益沧溟。"],py:["yè sè níng xiān zhǎng ， chén gān xià dì tíng 。","bù jué jiǔ qiū zhì ， yuǎn xiàng sān wēi líng 。","lú zhǔ huā chū bái ， kuí yuán yè shàng qīng 。","xī yáng yī sǎ huì ， fāng yuàn yì cāng míng 。"],s:""},
        {e:"🪷",title:"咏雾",author:"董思恭",dynasty:"唐",lines:["苍山寂已暮，翠观黯将沈。","终南晨豹隐，巫崃夜猿吟。","天寒气不歇，景晦色方深。","待访公超市，将予赴华阴。"],py:["cāng shān jì yǐ mù ， cuì guān àn jiāng shěn 。","zhōng nán chén bào yǐn ， wū lái yè yuán yín 。","tiān hán qì bù xiē ， jǐng huì sè fāng shēn 。","dài fǎng gōng chāo shì ， jiāng yǔ fù huá yīn 。"],s:""}
      ]},

      china:[      {id:"heilongjiang",name:"黑龙江",full:"黑龙江",abbr:"黑",capital:"哈尔滨",region:"东北",x:790,y:60,story:"金朝、清朝的发祥地，中东铁路枢纽，哈尔滨被誉为“东方莫斯科”。",origin:"因黑龙江（河流）而得名。",sites:"五大连池、圣索菲亚教堂、镜泊湖。",univ:"哈尔滨工业大学、哈尔滨工程大学。",geo:"北部和东部与俄罗斯接壤，有大小兴安岭林海。",war:"1932年哈尔滨沦陷；东北抗日联军在杨靖宇、赵尚志领导下在此浴血奋战。"},
      {id:"jilin",name:"吉林",full:"吉林",abbr:"吉",capital:"长春",region:"东北",x:790,y:126,story:"清代“吉林乌拉”意为沿江，伪满洲国曾定都新京（长春）。",origin:"满语“吉林乌拉”意为“沿江的城池”。",sites:"长白山天池、伪满皇宫、松花湖。",univ:"吉林大学。",geo:"有长白山、松花江，与朝鲜、俄罗斯接壤。",war:"杨靖宇将军在靖宇县壮烈牺牲，东北抗联在林海雪原坚持抗战。"},
      {id:"liaoning",name:"辽宁",full:"辽宁",abbr:"辽",capital:"沈阳",region:"东北",x:790,y:192,story:"清王朝“龙兴之地”，沈阳故宫所在地，九一八事变爆发地。",origin:"取“辽河流域安宁”之意。",sites:"沈阳故宫、九一八历史博物馆、大连海滨。",univ:"大连理工大学、东北大学。",geo:"南临黄海、渤海，有辽河平原。",war:"1931年九一八事变在沈阳发生，日军由此侵占东北。"},
      {id:"neimenggu",name:"内蒙古",full:"内蒙古",abbr:"内蒙古",capital:"呼和浩特",region:"华北",x:450,y:120,story:"草原丝路要冲，成吉思汗在此崛起，元朝发祥于漠北。",origin:"清代指长城以北蒙古各部，意为“漠南蒙古”。",sites:"成吉思汗陵、响沙湾、元上都遗址。",univ:"内蒙古大学。",geo:"横跨东北、华北、西北，有呼伦贝尔大草原。",war:"大青山抗日游击根据地在此长期坚持斗争。"},
      {id:"beijing",name:"北京",full:"北京",abbr:"京",capital:"北京",region:"华北",x:558,y:120,story:"元、明、清三代都城，五四运动、开国大典在此发生。",origin:"明初改称“北京”，意为“北方的京城”。",sites:"故宫、长城、天坛。",univ:"北京大学、清华大学、中国人民大学。",geo:"位于华北平原北端，背靠燕山。",war:"1937年卢沟桥事变（七七事变）在此爆发，全面抗战由此开始。"},
      {id:"tianjin",name:"天津",full:"天津",abbr:"津",capital:"天津",region:"华北",x:450,y:186,story:"近代通商口岸，平津战役中解放。",origin:"明成祖“天子渡津”而得名“天津”。",sites:"五大道、古文化街、天津之眼。",univ:"南开大学、天津大学。",geo:"海河五大支流汇口，东临渤海。",war:"平津战役中天津解放，北平（北京）和平改编。"},
      {id:"hebei",name:"河北",full:"河北",abbr:"冀",capital:"石家庄",region:"华北",x:558,y:186,story:"燕赵大地，战国时燕国、赵国在此建都，荆轲刺秦的故事发生于此。",origin:"因地处黄河以北而得名“河北”。",sites:"承德避暑山庄、山海关、赵州桥。",univ:"河北工业大学、燕山大学。",geo:"西倚太行山，东临渤海，有华北平原。",war:"1941年侵华日军制造潘家峪惨案，屠杀村民千余人。"},
      {id:"shanxi",name:"山西",full:"山西",abbr:"晋",capital:"太原",region:"华北",x:450,y:252,story:"春秋晋国故地，太原为北方军事重镇，平型关大捷在此打响。",origin:"因位于太行山以西而得名“山西”。",sites:"云冈石窟、平遥古城、应县木塔。",univ:"山西大学、太原理工大学。",geo:"表里山河，黄河绕其西，太行立其东。",war:"1937年平型关战役八路军首胜日军；忻口会战在此激战。"},
      {id:"xinjiang",name:"新疆",full:"新疆",abbr:"新",capital:"乌鲁木齐",region:"西北",x:180,y:150,story:"古丝绸之路枢纽，汉唐西域都护府所在，左宗棠收复新疆。",origin:"清代设省，“新疆”意为“故土新归”。",sites:"天山天池、喀纳斯、交河故城。",univ:"新疆大学。",geo:"三山夹两盆（天山、昆仑、阿尔泰；塔里木、准噶尔盆地）。",war:"抗战时期新疆是国际援华物资通道（西北国际通道）的重要节点。"},
      {id:"gansu",name:"甘肃",full:"甘肃",abbr:"甘",capital:"兰州",region:"西北",x:288,y:150,story:"河西走廊咽喉，丝绸之路重镇，敦煌莫高窟所在。",origin:"取甘州（张掖）、肃州（酒泉）二地首字。",sites:"莫高窟、嘉峪关、麦积山。",univ:"兰州大学。",geo:"地形狭长，祁连山、河西走廊贯穿。",war:"兰州曾是抗战大后方与苏联援华通道的重要节点。"},
      {id:"ningxia",name:"宁夏",full:"宁夏",abbr:"宁",capital:"银川",region:"西北",x:180,y:216,story:"西夏王朝都城兴庆府（银川），“塞上江南”。",origin:"元代设“宁夏府路”，意为“安宁西夏”。",sites:"西夏王陵、沙湖、贺兰山岩画。",univ:"宁夏大学。",geo:"黄河穿境，有河套平原。",war:"抗战时期宁夏军民坚守黄河防线。"},
      {id:"qinghai",name:"青海",full:"青海",abbr:"青",capital:"西宁",region:"西北",x:288,y:216,story:"三江源所在，文成公主进藏经此，吐谷浑故地。",origin:"因青海湖而得名。",sites:"青海湖、塔尔寺、可可西里。",univ:"青海大学。",geo:"地处青藏高原东北部，长江、黄河、澜沧江源头。",war:"抗战时期青海出兵抗战，驼峰航线经其南缘。"},
      {id:"shaanxi",name:"陕西",full:"陕西",abbr:"陕",capital:"西安",region:"西北",x:180,y:282,story:"十三朝古都长安所在，秦始皇统一六国，西安事变在此发生。",origin:"取陕原（今河南陕县以西）之西而得名。",sites:"兵马俑、大雁塔、华清池、延安。",univ:"西安交通大学、西北工业大学。",geo:"有秦岭、渭河平原（关中）。",war:"延安是抗战时期中共中央所在地；西安事变促成国共合作抗日。"},
      {id:"xizang",name:"西藏",full:"西藏",abbr:"藏",capital:"拉萨",region:"西南",x:250,y:400,story:"吐蕃王朝故地，文成公主入藏，布达拉宫所在。",origin:"“西藏”意为“西方的宝藏”（清代称谓）。",sites:"布达拉宫、大昭寺、珠穆朗玛峰。",univ:"西藏大学。",geo:"世界屋脊青藏高原，有喜马拉雅山脉。",war:"抗战时期西藏各界捐款捐物支援前线。"},
      {id:"sichuan",name:"四川",full:"四川",abbr:"川",capital:"成都",region:"西南",x:358,y:400,story:"三国蜀汉都城，都江堰造就天府之国，抗战中重庆为陪都。",origin:"北宋设“川峡四路”而得名“四川”。",sites:"都江堰、九寨沟、峨眉山、三星堆。",univ:"四川大学、电子科技大学。",geo:"有成都平原、长江（川江）、峨眉山。",war:"1937年南京沦陷后川军出川抗战，牺牲巨大；李庄接纳内迁文化机构。"},
      {id:"chongqing",name:"重庆",full:"重庆",abbr:"渝",capital:"重庆",region:"西南",x:250,y:466,story:"抗战时期国民政府“陪都”，红岩精神发源地。",origin:"南宋淳祐“双重喜庆”而得名“重庆”。",sites:"大足石刻、洪崖洞、渣滓洞。",univ:"重庆大学。",geo:"长江与嘉陵江交汇，是一座山城。",war:"作为抗战陪都遭日军“重庆大轰炸”，军民意志不屈。"},
      {id:"yunnan",name:"云南",full:"云南",abbr:"云",capital:"昆明",region:"西南",x:358,y:466,story:"西南联大南迁昆明，滇缅公路、驼峰航线是生命线。",origin:"因“彩云之南”而得名“云南”。",sites:"丽江古城、石林、洱海。",univ:"云南大学。",geo:"有滇池、横断山脉、西双版纳。",war:"滇西抗战（松山、腾冲）中国军队反攻收复失地。"},
      {id:"guizhou",name:"贵州",full:"贵州",abbr:"贵",capital:"贵阳",region:"西南",x:250,y:532,story:"遵义会议在此召开，确立了毛泽东同志的领导地位。",origin:"因贵山而得名“贵州”。",sites:"黄果树瀑布、梵净山、荔波。",univ:"贵州大学。",geo:"地处云贵高原，喀斯特地貌，有乌江。",war:"黔南事变中日寇侵入独山，遭当地军民奋勇抗击。"},
      {id:"shandong",name:"山东",full:"山东",abbr:"鲁",capital:"济南",region:"华东",x:630,y:300,story:"孔孟之乡，齐鲁文化发源地，台儿庄战役大捷。",origin:"因在太行山以东而得名“山东”。",sites:"泰山、孔庙、趵突泉。",univ:"山东大学、中国海洋大学。",geo:"有泰山、黄河入海口、濒临黄海渤海。",war:"1938年台儿庄战役歼敌万余，是抗战重大胜利。"},

    xian:{emoji:"📚",name:"修仙系列",sub:"本草·内经·伤寒·天纪·人纪·山海",color:"#3E8E7E",light:"#E3F1EE",type:"xian",badge:"6 卷古籍",
      books:[{id:"bencao",title:"本草纲目",sub:"认识草木的超能力",emoji:"🌿",author:"明·李时珍",locked:false,unit:"味",badgeEmoji:"🌿",intro:"李时珍爷爷走遍大山小河，把看到的花草树木都画下来、写下来，编成了这本大书。今天我们先挑出小朋友身边常见的草木，一个一个认识它们的本领！（古人很聪明，但生病一定要告诉爸爸妈妈和医生哦）",items:[{e:"🫚",name:"生姜",hi:"肚子的小暖炉",fact:"生姜辣辣的。喝下一碗热姜汤，肚子里会暖暖的，像抱了一个小暖炉。受凉肚子不舒服时，妈妈常给我们煮姜汤。不过生病一定要告诉爸爸妈妈和看医生哦。",prop:"性温，味辛；归肺、脾、胃经。能散寒、暖胃。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说生姜生吃能发散寒气，煮熟能调和脾胃。",look:"帮妈妈去厨房挑生姜，要选皱皱皮、闻着辣辣的才新鲜。",rhyme:"生姜辣，暖洋洋，受凉肚子它来帮。"},{e:"🟤",name:"干姜",hi:"老姜更暖身",fact:"干姜是生姜晒干做成的，味道更浓更暖。煮进汤里，能让身体从里到外暖起来。肚子凉凉时它能帮忙，不过生病要告诉医生哦。",prop:"性热，味辛；归脾、胃、肾、心、肺经。能温中散寒。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍把干姜列为温中良药，能温暖脾胃。",look:"看看家里姜罐里的干姜片，闻一闻是不是比鲜姜更浓。",rhyme:"干姜暖，味更浓，煮汤身体暖烘烘。"},{e:"🧅",name:"葱白",hi:"厨房的小卫士",fact:"葱白是葱底下白白的段，辣辣的。受凉时妈妈常切葱白煮水，喝下去身体暖暖的会微微出汗。生病一定要告诉爸爸妈妈和看医生哦。",prop:"性温，味辛；归肺、胃经。能发汗解表、散寒通阳。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说葱白能通阳气、散风寒。",look:"和妈妈一起洗葱，轻轻掰开看里面白白的葱白。",rhyme:"葱白白，辣乎乎，煮水暖身汗珠出。"},{e:"🧄",name:"大蒜",hi:"辣辣的小球球",fact:"大蒜一瓣一瓣像小白球，掰开辣眼睛。它身上有股特别的味道，能帮我们挡住一些坏虫子，是厨房里的好朋友。吃多肚子会烧哦，生病要看医生。",prop:"性温，味辛；归脾、胃、肺经。能行滞、暖胃。",origin:"《本草纲目·菜部五》",quote:"古籍大意：李时珍说大蒜能通窍、杀菌、暖肠胃。",look:"数一数一头大蒜有几瓣，闻闻它特别的味道。",rhyme:"大蒜辣，小球球，帮我们挡小虫虫。"},{e:"🌿",name:"芫荽",hi:"香味小伞伞",fact:"芫荽也叫香菜，叶子像小伞。它香香的，撒在汤面上一闻就有胃口。它帮我们打开小胃口，不过挑食可不行，生病要告诉医生哦。",prop:"性温，味辛；归肺、胃经。能发散、开胃。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说芫荽能温中、开胃、发痘疹。",look:"在菜市场找一找香菜，摸摸它毛茸茸的小叶子。",rhyme:"香菜香，小伞伞，闻一闻来开胃脘。"},{e:"🥬",name:"韭菜",hi:"绿绿小细剑",fact:"韭菜叶子细细长长像小绿剑。它从土里一茬茬长出来，割了还能再长，真顽强。吃点韭菜肚子暖暖的，不过生病要看医生哦。",prop:"性温，味辛；归肝、胃、肾经。能温中、行气。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说韭菜能温中下气、补肾。",look:"去菜地或超市看韭菜，数数它有多细多长。",rhyme:"韭菜绿，小细剑，割了又长真能干。"},{e:"🤍",name:"白萝卜",hi:"通气小帮手",fact:"白萝卜白白的、脆脆甜甜。吃完肚子里的气会咕噜咕噜跑出来，舒服多了。它像肚子里的小风扇，不过胀气严重要告诉医生哦。",prop:"性凉，味辛甘；归肺、胃经。能消食、化痰。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说萝卜能消食、降气、化痰。",look:"帮妈妈切萝卜，听一听切开的清脆声。",rhyme:"白萝卜，脆又甜，肚里胀气它来散。"},{e:"🥕",name:"胡萝卜",hi:"眼睛小卫士",fact:"胡萝卜橙橙的，里面有胡萝卜素，到身体里会变成帮眼睛的小营养。兔子爱吃它，我们的眼睛也喜欢。不过再好也不能当饭吃哦。",prop:"性平，味甘；归脾、肝、肺经。能健脾、明目。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍记载胡萝卜下气、补中、安五脏。",look:"洗一根胡萝卜，掰开看里面橙橙的颜色。",rhyme:"胡萝卜，橙橙的，眼睛见了笑嘻嘻。"},{e:"🍈",name:"冬瓜",hi:"清爽小水库",fact:"冬瓜大大的、水分超级多，夏天吃它凉凉的、解口渴。它像肚子里的小水库，帮身体赶走热气。不过身子虚要少吃，生病看医生。",prop:"性微寒，味甘淡；归肺、小肠、膀胱经。能清热、利水。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说冬瓜能清热解暑、利小便。",look:"抱一抱冬瓜，感受它沉甸甸的水分。",rhyme:"冬瓜大，水汪汪，夏天吃了解口渴。"},{e:"🥒",name:"黄瓜",hi:"清凉小棒棒",fact:"黄瓜绿绿的、脆脆的，咬一口水珠冒出来，凉凉的。夏天吃它像给身体吹小风扇。它很清淡，不过拉肚子时要少吃哦。",prop:"性凉，味甘；归肺、胃、大肠经。能清热、解渴。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说黄瓜能清热、解渴、利水。",look:"洗一根黄瓜，摸摸它身上的小刺刺。",rhyme:"黄瓜绿，小棒棒，咬一口来水汪汪。"},{e:"🥒",name:"苦瓜",hi:"苦脸小勇士",fact:"苦瓜脸上全是疙疙瘩瘩，味道苦苦的。它像勇敢的小战士，夏天帮身体降降火。苦一点没关系，不过脾胃凉要少吃哦。",prop:"性寒，味苦；归心、脾、胃经。能清热。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说苦瓜能除邪热、解劳乏。",look:"看看苦瓜的皱纹，猜猜它为什么叫苦瓜。",rhyme:"苦瓜苦，小勇士，夏天降火它最行。"},{e:"🎃",name:"南瓜",hi:"圆圆小灯笼",fact:"南瓜黄黄的、圆滚滚，像个小灯笼。它甜甜软软，肚子好消化。它给身体慢慢的小能量，不过吃多会变黄手掌哦。",prop:"性温，味甘；归脾、胃经。能补中、健脾。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说南瓜能补中益气、健脾。",look:"抱一抱南瓜，数数它的棱有几条。",rhyme:"南瓜黄，圆灯笼，软软甜甜肚子松。"},{e:"🍆",name:"茄子",hi:"紫紫小灯泡",fact:"茄子紫亮亮的，像个小灯泡。它软软的，吸了汤汁特别香。它给身体清清的小油脂，不过油太多不好，生病看医生。",prop:"性凉，味甘；归脾、胃、大肠经。能清热、活血。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说茄子能清热、活血、消肿。",look:"看紫茄子亮亮的外皮，摸摸是不是光滑。",rhyme:"茄子紫，小灯泡，软软入味真好看。"},{e:"🍅",name:"番茄",hi:"红红小太阳",fact:"番茄红红的、酸酸甜甜，里面好多小籽像小太阳的点点。它水分多、味道好，炒蛋拌糖都行。不过青番茄有毒不能吃哦。",prop:"性微寒，味甘酸；归胃、肝经。能生津、健胃。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍记载番茄（番柿）健脾开胃。",look:"切一个番茄，数数里面有多少小籽。",rhyme:"番茄红，小太阳，酸酸甜甜胃口旺。"},{e:"🌶️",name:"辣椒",hi:"嘴巴小火苗",fact:"辣椒红红的，咬一口嘴巴像点了小火苗，呼呼冒汗。它能让身体热乎起来，但小朋友要少吃，不然肚子会闹脾气哦。",prop:"性热，味辛；归心、脾经。能温中、散寒。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说辣椒能温中散寒、开胃消食。",look:"看红辣椒的样子，闻闻是不是呛鼻子。",rhyme:"辣椒红，小火苗，少吃几口别吵闹。"},{e:"🌶️",name:"胡椒",hi:"汤里小辣粉",fact:"胡椒是小小的圆粒，磨成粉撒进汤里，暖暖的、辣辣的。它帮汤变香，也能让身体暖和。不过放多会呛，生病要听医生的。",prop:"性热，味辛；归胃、大肠经。能温中、下气。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说胡椒能暖肠胃、下气、消痰。",look:"闻一闻胡椒粉，感受它钻进鼻子的辣。",rhyme:"胡椒小，辣粉粉，汤里一撒暖全身。"},{e:"🌶️",name:"花椒",hi:"麻麻小点点",fact:"花椒小小的、红红的，放到嘴里舌头会麻麻的。它常和辣椒一起，让菜香香的。它帮身体暖暖的，不过小朋友少吃哦。",prop:"性温，味辛；归脾、胃、肾经。能温中、止痛。",origin:"《本草纲目·果部》",quote:"古籍大意：李时珍说花椒能温中散寒、杀虫。",look:"数几颗花椒，放舌尖感受一下麻麻的。",rhyme:"花椒红，小点点，舌头麻麻真特别。"},{e:"🌿",name:"茴香",hi:"香香小星星",fact:"茴香叶子细细的，像小星星挤在一起，香香的。它帮肚子里的气顺顺的，妈妈包饺子常放它。不过生病要看医生哦。",prop:"性温，味辛；归肝、肾、脾、胃经。能散寒、理气。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说茴香能散寒、理气、暖腰。",look:"闻闻茴香苗，说说它像不像小星星。",rhyme:"茴香香，小星星，肚子顺顺真轻松。"},{e:"🥬",name:"芹菜",hi:"脆脆小绿杆",fact:"芹菜杆绿绿的、脆脆的，咬起来咯吱响。它水分多、纤维多，帮肠道做运动。它低头弯腰的样子真可爱，不过生病看医生。",prop:"性凉，味甘苦；归肝、胃经。能清热、平肝。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说芹菜能清热、平肝、利湿。",look:"折一根芹菜杆，听听清脆的响声。",rhyme:"芹菜绿，小绿杆，咯吱一咬真好玩。"},{e:"🥬",name:"菠菜",hi:"大力小绿叶",fact:"菠菜叶子绿绿的，大力水手吃了有力气。它里面有铁，帮红细胞搬氧气。不过它含草酸，要焯水再吃哦。",prop:"性凉，味甘；归肝、胃、大肠经。能养血、润燥。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说菠菜能通肠胃、活血脉。",look:"洗一把菠菜，看它绿绿的样子。",rhyme:"菠菜绿，大力叶，吃了力气大一些。"},{e:"🥬",name:"白菜",hi:"白白小胖墩",fact:"白菜一层层抱在一起，像白白的小胖墩。它清淡甜甜，冬天炖豆腐最香。它给身体补水又舒服，不过生病要告诉医生。",prop:"性平，味甘；归胃、大肠经。能清热、除烦。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说白菜能通利肠胃、除烦渴。",look:"剥一片白菜叶，看它一层层抱得多紧。",rhyme:"白菜白，小胖墩，层层抱紧真温存。"},{e:"🥬",name:"油菜",hi:"绿绿小油菜",fact:"油菜叶子绿油油的，开小黄花。它嫩嫩的、营养多，炒一炒就上桌。它给身体清清的小维生素，不过生病看医生哦。",prop:"性凉，味甘；归肝、脾经。能活血、通便。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说油菜能破瘀、消肿、通便。",look:"在田里找油菜花，数数小黄花有几朵。",rhyme:"油菜绿，小黄花，嫩嫩营养顶呱呱。"},{e:"⚫",name:"黑木耳",hi:"黑黑小耳朵",fact:"黑木耳黑黑的、软软的，像小耳朵。它吸水会变胖，炒肉真香。它帮肠道打扫卫生，不过泡发要现吃，别放久哦。",prop:"性平，味甘；归胃、大肠经。能润燥、通便。",origin:"《本草纲目·菜部五》",quote:"古籍大意：李时珍说木耳能益气、轻身、通便。",look:"泡发几朵木耳，看它从小变大的魔法。",rhyme:"黑木耳，黑耳朵，泡一泡来胖好多。"},{e:"🍄",name:"银耳",hi:"白白小木耳",fact:"银耳白白净净，像一朵小云。炖成羹滑滑的、润润的，秋天吃嗓子舒服。它给身体补补水，不过甜羹别太甜哦。",prop:"性平，味甘淡；归肺、胃、肾经。能润肺、生津。",origin:"《本草纲目·菜部五》",quote:"古籍大意：李时珍说银耳能润肺、生津、滋阴。",look:"看干银耳一朵朵，泡发后变白白软软。",rhyme:"银耳白，像朵云，炖羹润润好舒心。"},{e:"🍄",name:"香菇",hi:"香香小伞伞",fact:"香菇像一把小伞，晒过太阳更香。它鲜鲜的，给汤提味。它给身体一点点好蛋白，不过野蘑菇不认识别乱采哦。",prop:"性平，味甘；归肝、胃经。能开胃、健脾。",origin:"《本草纲目·菜部五》",quote:"古籍大意：李时珍说香蕈能益气、开胃、托痘。",look:"闻闻干香菇的香味，说说像什么。",rhyme:"香菇香，小伞伞，汤里一放鲜满碗。"},{e:"🌿",name:"海带",hi:"海里长丝带",fact:"海带是海里长的长丝带，绿绿褐褐的。它里面有碘，帮身体造力气。它咸咸的，不过吃多会咸，生病看医生。",prop:"性寒，味咸；归肝、胃、肾经。能软坚、利水。",origin:"《本草纲目·菜部五》",quote:"古籍大意：李时珍说海带能利水、消痰、软坚。",look:"看海带长长的身子，摸摸滑滑的表面。",rhyme:"海带长，像丝带，海里漂来真自在。"},{e:"🟣",name:"紫菜",hi:"紫紫小薄片",fact:"紫 大意：李时珍说鸡内金能消食、磨积、止遗。",look:"看鸡胗里的黄衣，想它为什么叫金。",rhyme:"鸡内金，黄薄衣，积食化掉肚不挤。"},{e:"🥔",name:"山药",hi:"土里小白棍",fact:"山药土里长，白白净净像小棍。它黏黏的、软软的，养脾胃。它给身子慢慢能量，不过削皮手会痒哦。",prop:"性平，味甘；归脾、肺、肾经。能健脾、补肺。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说山药能健脾、补肺、益肾。",look:"洗山药看白白的，削皮手痒要冲水。",rhyme:"山药白，小棍棍，黏黏软软养脾胃。"},{e:"🥔",name:"土豆",hi:"圆圆小土蛋",fact:"土豆圆圆的、黄黄的，埋在土里。它做法多，给身体能量。它饱饱的，不过发芽变绿有毒不能吃哦。",prop:"性平，味甘；归胃、大肠经。能健脾、和胃。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍记载土豆（土芋）能健脾、宽肠。",look:"看土豆圆圆，找找有没有发芽。",rhyme:"土豆圆，小土蛋，发芽变绿不能啖。"},{e:"🍠",name:"红薯",hi:"红红小甜薯",fact:"红薯红皮黄心，甜甜的、软软的。它纤维多、通便便。它给能量，不过吃多会排气哦。",prop:"性平，味甘；归脾、肾经。能补脾、宽肠。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说红薯能补脾、益气、宽肠。",look:"抱红薯看红皮，想象烤熟多香。",rhyme:"红薯红，甜甜薯，烤熟软软气儿咕。"},{e:"🟤",name:"芋头",hi:"毛毛小圆球",fact:"芋头棕棕的、毛毛毛的，像小圆球。它软软糯糯，养脾胃。不过生吃麻嘴，要煮熟，手痒要冲水哦。",prop:"性平，味辛甘；归胃、大肠经。能健脾、散结。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说芋能健脾、补虚、散结。",look:"摸芋头毛毛皮，削皮手会痒。",rhyme:"芋头棕，毛小球，糯糯软软胃不愁。"},{e:"🎋",name:"竹笋",hi:"尖尖小绿塔",fact:"竹笋尖尖的，从土里钻出来像小绿塔。它脆脆的、清清的，春天最好吃。它帮肠道，不过小朋友别吃多哦。",prop:"性微寒，味甘；归胃、肺经。能清热、化痰。",origin:"《本草纲目·菜部一》",quote:"古籍大意：李时珍说竹笋能清热、化痰、利膈。",look:"看竹笋尖尖塔，想象钻出土。",rhyme:"竹笋尖，小绿塔，钻出土来脆又雅。"},{e:"🍄",name:"蘑菇",hi:"白白小云朵",fact:"蘑菇白白胖胖像小云朵，炖汤鲜鲜的。它给身子好蛋白，不过野蘑菇不认识绝对不能采来吃哦。",prop:"性平，味甘；归胃、肠经。能健脾、开胃。",origin:"《本草纲目·菜部五》",quote:"古籍大意：李时珍说蘑菇能益气、开胃、托毒。",look:"看蘑菇像小云朵，记住野菇别乱采。",rhyme:"蘑菇白，小云朵，野菇有毒莫采嘬。"},{e:"🌰",name:"松子",hi:"松里小坚果",fact:"松子藏在松果里，小小的、香香的。它油油的，给身子好脂肪。不过小朋友别整颗跑跳吃，会卡哦。",prop:"性温，味甘；归肝、肺、大肠经。能润燥、养脑。",origin:"《本草纲目·木部》",quote:"古籍大意：李时珍说松子能润肺、通便、养脑。",look:"看松果里的松子，剥开闻香。",rhyme:"松子小，坚果香，润润补补脑儿康。"},{e:"🌰",name:"南瓜子",hi:"小绿小月牙",fact:"南瓜子绿绿的、扁扁的，像小月牙。它香香的，嗑着吃。它给身子小营养，不过小朋友别噎着哦。",prop:"性平，味甘；归胃、大肠经。能驱虫、润燥。",origin:"《本草纲目·菜部三》",quote:"古籍大意：李时珍说南瓜子能补中、润燥、驱虫。",look:"嗑南瓜子看绿绿月牙，慢慢嚼。",rhyme:"南瓜子，小月牙，绿绿香香慢慢嗑。"},{e:"🍯",name:"蜂蜜",hi:"甜甜小金蜜",fact:"蜂蜜是蜜蜂酿的，金黄金黄的、甜甜的。它润润的，温水冲喝嗓子舒服。不过一岁内宝宝不能吃哦。",prop:"性平，味甘；归肺、脾、大肠经。能润肺、润肠。",origin:"《本草纲目·虫部》",quote:"古籍大意：李时珍说蜂蜜能润肺、补中、润肠。",look:"看蜂蜜金金稠稠，温水冲开。",rhyme:"蜂蜜金，甜小蜜，温水冲开润喉咙。"},{e:"🧂",name:"食盐",hi:"白小白晶晶",fact:"食盐白白的、小小晶晶，做饭不能少。它让菜有味道，也帮身体保持平衡。不过吃多伤身，小朋友要清淡哦。",prop:"性寒，味咸；归胃、肾、大小肠经。能调味、软坚。",origin:"《本草纲目·石部》",quote:"古籍大意：李时珍说盐能调味、凉血、软坚。",look:"看盐白小白晶，尝一丁点咸。",rhyme:"食盐白，小晶晶，做菜一点味儿醒。"},{e:"🫗",name:"醋",hi:"酸酸小调料",fact:"醋酸酸的，做饭去腥提鲜。它帮胃口开开，不过小朋友少蘸，伤牙又伤胃哦。",prop:"性温，味酸苦；归肝、胃经。能消食、散瘀。",origin:"《本草纲目·谷部》",quote:"古籍大意：李时珍说醋能消食、散瘀、解毒。",look:"闻闻醋的酸，想象蘸饺子。",rhyme:"醋儿酸，小调料，少蘸一点胃口妙。"},{e:"🍵",name:"茶叶",hi:"苦香小绿叶",fact:"茶叶绿绿的、卷卷的，泡水苦香。大人爱喝它提神。小朋友少喝，会影响睡觉哦。",prop:"性凉，味苦甘；归心、肺、胃经。能清热、提神。",origin:"《本草纲目·木部》",quote:"古籍大意：李时珍说茶叶能清热、提神、消食。",look:"看干茶叶卷卷，泡开舒展。",rhyme:"茶叶绿，卷卷叶，小朋友少喝安歇。"},{e:"🟢",name:"橄榄",hi:"青青小梭子",fact:"橄榄青青的、两头尖尖像小梭子。刚吃涩涩，嚼久回甜。它帮嗓子润润，不过核不能吞哦。",prop:"性平，味甘酸；归肺、胃经。能清肺、利咽。",origin:"《本草纲目·果部》",quote:"古籍大意：李时珍说橄榄能清肺、利咽、生津。",look:"看橄榄青梭子，嚼嚼回甜。",rhyme:"橄榄青，小梭子，嚼久回甜嗓儿慈。"},{e:"🟢",name:"无花果",hi:"无花小甜果",fact:"无花果外面没花，里面甜甜的籽。它软软的、润润的，帮肠道。不过小朋友少吃，拉肚子看医生。",prop:"性平，味甘；归肺、胃、大肠经。能健脾、润肠。",origin:"《本草纲目·果部》",quote:"古籍大意：李时珍说无花果能健脾、润肠、消肿。",look:"看无花果掰开，里面小红籽。",rhyme:"无花果，无花甜，软软润润肠不黏。"},{e:"🥝",name:"猕猴桃",hi:"毛毛小绿蛋",fact:"猕猴桃毛毛的、绿绿的，切开绿心黑籽。它维生素C超级多，酸酸甜甜。它帮免疫，不过过敏小朋友少吃哦。",prop:"性寒，味酸甘；归胃、肝、肾经。能清热、生津。",origin:"《本草纲目·果部》",quote:"古籍大意：李时珍记载猕猴桃（藤梨）能解热、止渴。",look:"摸猕猴桃毛毛皮，切开看绿心。",rhyme:"猕猴桃，毛绿蛋，维生素C多多身体捍。"},{e:"🍒",name:"樱桃",hi:"红红小珍珠",fact:"樱桃红红的、小小的，像小珍珠。它甜甜的，给身子小铁小营养。不过核不能吞，吃多上火哦。",prop:"性温，味甘微酸；归脾、肝经。能补血、益气。",origin:"《本草纲目·果部》",quote:"古籍大意：李时珍说樱桃能补脾、益气、祛风湿。",look:"看樱桃红红小珍珠，数几颗。",rhyme:"樱桃红，小珍珠，甜甜补补血气足。"}]},
{id:"huangdi",title:"黄帝内经",sub:"身体里的悄悄话",emoji:"📜",author:"上古·黄帝与岐伯",locked:false,unit:"讲",badgeEmoji:"🍃",intro:"黄帝爷爷和岐伯爷爷一问一答，讲身体怎么好好生活。我们把大道理变成小朋友能懂的小习惯！（身体不舒服一定要告诉大人、看医生哦）",items:[{e:"☯️",name:"阴阳",hi:"白天黑夜的好朋友",fact:"世界有阴有阳，就像白天和黑夜轮着来。我们白天玩耍学习，晚上安安静静睡觉，身体才有力气。",origin:"《黄帝内经·素问》阴阳应象大论",quote:"古籍大意：上古之人懂得顺应阴阳，饮食有节、起居有常，所以身体好。",look:"今天记一记：太阳出来你做了什么，天黑了你又做了什么。",rhyme:"白天动，夜里静，阴阳轮转好精神。"},{e:"🛏️",name:"早睡",hi:"月亮陪我睡觉觉",fact:"天黑了，月亮出来了，身体也要休息。早早睡觉，小身体才能长高、记性好。熬夜会没精神，所以小朋友要早睡哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：古人说晚上要早卧，让阳气收敛、身体休息。",look:"今晚定个时间，和月亮说晚安就睡。",rhyme:"月亮出，早早睡，长高记性好宝贝。"},{e:"🌅",name:"早起",hi:"太阳叫我起早起",fact:"太阳公公升起，光照进窗，身体也该醒啦。早起呼吸新鲜空气，一整天都精神。不过也要睡够哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：古人说春天要夜卧早起，广步于庭。",look:"明天试一次，太阳出来就起床伸懒腰。",rhyme:"太阳升，早早起，伸个懒腰有力气。"},{e:"🍚",name:"吃饭慢",hi:"小牙齿慢慢嚼",fact:"吃饭要慢慢嚼，小牙齿把食物磨碎，肚子才好消化。狼吞虎咽会噎着，也不香。慢慢吃，身体才舒服。",origin:"《黄帝内经·素问》五脏别论",quote:"古籍大意：古人讲饮食要细嚼慢咽，脾胃才安。",look:"今天吃饭数数嚼几下再吞。",rhyme:"吃饭慢，细细嚼，脾胃舒服不长膘。"},{e:"🥗",name:"不挑食",hi:"五颜六色都尝尝",fact:"青菜、肉肉、饭饭都要吃，身体才样样都不缺。只吃一种会缺营养。不挑食的小朋友长得壮壮的。",origin:"《黄帝内经·素问》藏气法时论",quote:"古籍大意：五谷为养、五果为助，食物要搭配着吃。",look:"今天每样菜都尝一口，记下来。",rhyme:"不挑食，样样尝，身体壮壮精神昂。"},{e:"💧",name:"喝水",hi:"小水杯不离手",fact:"身体像小花园，需要水来浇。渴了就喝温水，别等渴坏。多喝水，小便清清的，身体干净。",origin:"《黄帝内经·素问》经脉别论",quote:"古籍大意：古人说饮入于胃，水精四布，水很重要。",look:"带个小水杯，上午下午各喝几口。",rhyme:"小水杯，常润喉，身体花园水常流。"},{e:"🧼",name:"洗手",hi:"泡泡赶走小虫虫",fact:"饭前便后洗手，泡泡把脏脏的小虫虫冲走。手干净，病就从嘴边溜走。小朋友要洗够二十秒哦。",origin:"《黄帝内经·素问》刺法论",quote:"古籍大意：古人讲避其毒气，讲卫生少生病。",look:"和妈妈学七步洗手法，唱完歌再冲。",rhyme:"小手洗，泡泡多，小虫虫被水冲脱。"},{e:"🪥",name:"刷牙",hi:"牙齿白亮亮",fact:"早晚刷牙，小牙刷把饭菜渣刷掉，牙齿亮亮的、不掉虫。晚上刷完别再吃甜的，牙虫就搬家啦。",origin:"《黄帝内经·素问》",quote:"古籍大意：古人重视洁齿，齿健则身安。",look:"今天数数刷了几个面，里外都刷到。",rhyme:"早和晚，刷刷牙，牙齿亮亮虫搬家。"},{e:"🏃",name:"运动",hi:"身体会跳舞",fact:"跑一跑、跳一跳，身体像在跳舞。运动让骨头硬、肉肉结实，心情也开心。每天动一动，病菌不敢来。",origin:"《黄帝内经·素问》异法方宜论",quote:"古籍大意：古人讲导引按跷，活动肢体强身。",look:"放学后跳跳绳，数数跳了多少。",rhyme:"跑跑跳，身体舞，病菌见了绕道走。"},{e:"☀️",name:"晒太阳",hi:"太阳公公抱抱我",fact:"晒晒太阳，身体里会生出帮钙住骨头的小伙伴。天气好去户外，脸和手晒晒暖暖的。不过别晒伤哦。",origin:"《黄帝内经·素问》生气通天论",quote:"古籍大意：阳气者若天与日，晒太阳助养阳气。",look:"挑温和的上午，去户外晒十分钟。",rhyme:"晒太阳，暖洋洋，钙儿住骨身体强。"},{e:"😊",name:"心情好",hi:"心里开出小花花",fact:"开心的时候，身体也轻松。笑一笑，心里像开了小花。生气难过要告诉大人，别憋着，心情好病就少。",origin:"《黄帝内经·素问》上古天真论",quote:"古籍大意：恬淡虚无，真气从之，精神内守不生病。",look:"今天做一件开心的事，记下来。",rhyme:"心情好，笑开花，病儿见了躲在家。"},{e:"🌬️",name:"不生气",hi:"气气变成小云云",fact:"生气时胸口闷闷的，像乌云盖住心。深呼吸、数到十，乌云就散了。不随便生气，身体才太平。",origin:"《黄帝内经·素问》举痛论",quote:"古籍大意：怒则气上，生气会让气乱，要会平心。",look:"生气时试试深呼吸数到十。",rhyme:"不生气，云散开，胸口平平真自在。"},{e:"⏰",name:"规律作息",hi:"我的小钟表",fact:"每天差不多时间睡、差不多时间起，身体就有了小钟表。钟准了，精神好、长得快。周末也别乱翻天哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：起居有常，不妄作劳，身体才安康。",look:"画一张作息表，贴在床头。",rhyme:"作息规，小钟摆，按时睡起精神来。"},{e:"🧥",name:"春捂秋冻",hi:"快慢脱衣有讲究",fact:"春天别急着脱厚衣，早晚还凉；秋天别急着加衣，慢慢适应。这样身体不被忽冷忽热欺负。不过冻狠了要加衣哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：圣人春夏养阳、秋冬养阴，穿衣随季节。",look:"春天看天气，先别收厚外套。",rhyme:"春捂暖，秋冻凉，慢慢添减身不伤。"},{e:"🌾",name:"五谷",hi:"身体的小砖块",fact:"米饭、馒头、玉米是五谷，像给身体盖房子的砖块。它们给最多力气。每顿吃一点，身子才结实。",origin:"《黄帝内经·素问》藏气法时论",quote:"古籍大意：五谷为养，主食是养身的根本。",look:"今天认一认碗里的五谷是哪几种。",rhyme:"五谷香，小砖块，盖好身子力气带。"},{e:"🥬",name:"蔬菜",hi:"绿绿小扫把",fact:"青菜像小扫把，把肠子里脏脏扫一扫。每顿有蔬菜，大便顺顺的。不过农药要洗干净哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：五菜为充，蔬菜充实营养。",look:"今天吃两种不同颜色的蔬菜。",rhyme:"蔬菜绿，小扫把，肠子干净便便下。"},{e:"🍎",name:"水果",hi:"甜甜小维生素C",fact:"水果甜甜的，给身体维生素C小卫士。每天一点水果，免疫强强的。不过水果不能当饭，牙也别坏哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：五果为助，水果助养身体。",look:"今天挑一种水果尝尝。",rhyme:"水果甜，维生素C宝，每天一点身体好。"},{e:"🌍",name:"四季",hi:"四季轮流转",fact:"春种夏长秋收冬藏，四季像四兄弟轮着来。我们春天长个、夏天玩水、秋天收果、冬天藏暖。跟着四季身体好。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：夫四时阴阳者，万物之根本也。",look:"画四格，每格画一个季节。",rhyme:"四季转，四兄弟，跟着它们身安逸。"},{e:"🌱",name:"春天",hi:"种子醒来了",fact:"春天暖暖的，小草从土里钻出，我们也要多出门跑跑、长个子。早睡早起，像小苗喝露水。不过风大要保暖哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：春三月此谓发陈，夜卧早起，广步于庭。",look:"春天去公园，找找发芽的小草。",rhyme:"春天到，苗醒早，多多户外个子高。"},{e:"🌞",name:"夏天",hi:"太阳热情高",fact:"夏天热热的，出汗多，要喝水、少暴晒。中午躲阴凉，早晚再玩。心静自然凉，别贪凉感冒哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：夏三月此谓蕃秀，无厌于日，使气得泄。",look:"夏天带水壶出门，避开正午晒。",rhyme:"夏天热，汗珠掉，喝水避晒暑气消。"},{e:"🍂",name:"秋天",hi:"叶子飘呀飘",fact:"秋天干干的，叶子黄了飘下。多喝温水、润润嗓子，早卧早起。天气凉了，衣服慢慢加。不过别捂出汗哦。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：秋三月此谓容平，早卧早起，与鸡俱兴。",look:"秋天捡一片落叶，看看什么色。",rhyme:"秋天来，叶飘摇，润嗓加衣身不焦。"},{e:"❄️",name:"冬天",hi:"小熊藏起来",fact:"冬天冷冷的，像小熊躲洞。我们早睡晚起、多保暖，把力气藏起来。太阳出来再出门玩，别冻着。",origin:"《黄帝内经·素问》四气调神大论",quote:"古籍大意：冬三月此谓闭藏，早卧晚起，必待日光。",look:"冬天出门戴帽手套，别露脖。",rhyme:"冬天冷，学小熊，藏好暖暖力不空。"},{e:"📅",name:"节气",hi:"大自然的日历",fact:"一年有二十四个节气，像大自然的日历：清明、谷雨、霜降……每个节气天气不一样。看节气穿衣吃饭，身体乖乖的。",origin:"《黄帝内经·素问》",quote:"古籍大意：古人观天象定节气，指导生活农事。",look:"今天查查是什么节气，记下来。",rhyme:"节气到，日历翻，跟着天穿身不寒。"},{e:"🫁",name:"呼吸",hi:"鼻子的小风箱",fact:"我们用鼻子呼吸，像小风箱一鼓一鼓。深呼吸把新鲜空气送进肚子，身体醒醒的。不过雾霾天少出门哦。",origin:"《黄帝内经·素问》离合真邪论",quote:"古籍大意：真气者，所受于天，呼吸养真气。",look:"今天做三次深呼吸，手放肚子感受。",rhyme:"深呼吸，小风箱，新鲜空气肚里装。"},{e:"💧",name:"眼泪",hi:"眼睛的小河流",fact:"难过或眼睛进灰，眼泪哗哗流，像小河流把脏东西冲走。哭完心里轻松，眼睛也干净。不过天天哭要告诉大人哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：悲则气消，哭泣是情志的自然流露。",look:"揉眼不舒服时，让泪水流一流。",rhyme:"眼泪流，小河忙，冲走灰灰眼亮堂。"},{e:"💦",name:"汗",hi:"身体的小凉扇",fact:"运动或热了，汗从毛孔冒出，像小凉扇给身体降温。出汗后擦干别吹风，不然会着凉。多喝水补回来哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：阳气蒸腾津液为汗，汗出排邪。",look:"运动后擦汗，喝温水别受凉。",rhyme:"汗珠冒，小凉扇，擦干莫吹身不欠。"},{e:"🚽",name:"便便",hi:"肠道的小信使",fact:"每天拉臭臭，是肠道的小信使报告身体好。多吃菜、多喝水，便便软软的。好几天不拉要告诉大人哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：古人重视通利，腑气以通为顺。",look:"今天看看便便软不软，记给妈妈。",rhyme:"便便通，小信使，肠道干净身不弛。"},{e:"🚰",name:"尿尿",hi:"身体小清道夫",fact:"尿尿把身体里的废水清走，像小清道夫。尿黄黄是水喝少，清清的是刚喝够。多尿几次没关系，别憋着哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：膀胱者州都之官，津液藏焉。",look:"看尿的颜色，想想水喝够没。",rhyme:"尿清清，小清道，废水排走身轻巧。"},{e:"😴",name:"午觉",hi:"中午充电一小会儿",fact:"中午吃完饭，闭眼歇一会儿，像给身体充充电。下午精神好、不瞌睡。不过别睡太久，晚上才好睡哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：子午之时养阳养阴，午后小憩养神。",look:"今天中午闭眼安静十分钟。",rhyme:"午觉短，充充电，下午精神真不倦。"},{e:"👀",name:"眼睛休息",hi:"眼球转转圈",fact:"看书久了，眼球累累的。看看远处绿绿的树，转转眼球，它歇歇。每二十分钟歇一下，眼睛亮亮的。",origin:"《黄帝内经·素问》",quote:"古籍大意：久视伤血，用眼要劳逸结合。",look:"看书二十分钟，抬头看远处的树。",rhyme:"眼累时，看看远，转转球儿亮闪闪。"},{e:"👂",name:"耳朵",hi:"小喇叭听世界",fact:"耳朵像小喇叭，把声音送进大脑。太大声会震坏它，所以看动画别开好响。耳朵干净，听得更清。",origin:"《黄帝内经·素问》",quote:"古籍大意：肾气通于耳，护耳即养肾。",look:"今天把音量调小一点听故事。",rhyme:"小耳朵，喇叭俏，声音太大它喊叫。"},{e:"👃",name:"鼻子",hi:"空气小门卫",fact:"鼻子是空气小门卫，把灰尘挡在外面、把空气变暖再进门。用鼻呼吸比用嘴好。不过鼻塞要告诉大人哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：肺开窍于鼻，鼻为呼吸之门。",look:"试
