痕。"},{e:"🧤",name:"防寒",hi:"门口小门帘",fact:"防寒是门口挂小门帘，不让冷风进。手脚耳都护好。寒从脚起，所以袜子穿好，门帘垂下。",origin:"《黄帝内经·素问》",quote:"古籍大意：去寒就温，避其寒邪。",look:"今天出门戴好手套围巾。",rhyme:"防寒帘，门前挂，冷风进不来身佳。"},{e:"👀",name:"护眼",hi:"眼球小保镖",fact:"护眼是给眼球请小保镖：少盯屏、多望远、光线足。保镖在岗，眼睛亮亮不近视。二十分钟歇一下。",origin:"《黄帝内经·素问》",quote:"古籍大意：久视伤血，目得血而能视。",look:"看书二十分钟望远处。",rhyme:"护眼压，保镖强，望远少屏眼亮堂。"},{e:"🦷",name:"护齿",hi:"牙齿小保镖",fact:"护齿是给牙齿请保镖：刷牙、少糖、定期检查。保镖赶走牙虫，白牙笑哈哈。糖后要漱口哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：齿为骨之余，洁齿则身安。",look:"吃完糖马上漱口。",rhyme:"护齿镖，赶牙虫，少糖刷牙笑融融。"},{e:"🗣️",name:"护嗓",hi:"喉咙小润喉糖",fact:"护嗓是给喉咙含小润喉糖：温水、少喊、不尖叫。喉咙润润的，说话唱歌都清亮。大叫会哑哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：声由气发，养喉以养气。",look:"今天说话轻柔，不扯着喊。",rhyme:"护嗓糖，润喉咙，轻声细语不嘶哑。"},{e:"🦵",name:"护腰",hi:"腰儿小腰带",fact:"护腰是给腰系小腰带：坐直、不搬重、常活动。腰是身体的中轴，护好它，跑跳都稳。别瘫坐哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：腰者肾之府，转摇不能肾将惫。",look:"坐直写字，常起来扭扭腰。",rhyme:"护腰带，腰不酸，坐直常动身自安。"},{e:"🧦",name:"护脚",hi:"脚丫小棉鞋",fact:"护脚是给脚丫穿小棉鞋：保暖、干爽、不赤脚踩凉地。寒从脚起，脚暖全身暖。睡觉前泡泡脚最好。",origin:"《黄帝内经·素问》",quote:"古籍大意：寒从足下生，暖足以温身。",look:"今天穿好袜子，不踩凉地。",rhyme:"护脚鞋，暖脚丫，寒从脚起它来遮。"},{e:"📺",name:"远屏幕",hi:"眼睛放假啦",fact:"远屏幕是让眼睛放个假：少看手机电视。多看绿树、多跑跳。假放够，眼睛不累、睡得香。",origin:"《黄帝内经·素问》",quote:"古籍大意：久视伤血，远屏以养目。",look:"今天少看屏，去户外玩。",rhyme:"远屏幕，眼放假，多看绿树身不化。"},{e:"🚶",name:"多散步",hi:"脚丫去串门",fact:"多散步是脚丫去串门：吃完饭走走，血流欢快。不剧烈、慢慢走，消化好、心情好。每天一小圈。",origin:"《黄帝内经·素问》",quote:"古籍大意：饭后缓行，脾胃乃和。",look:"晚饭后和家人散步一小圈。",rhyme:"多散步，脚串门，慢慢走走身轻稳。"},{e:"🤲",name:"揉揉腹",hi:"肚子小揉揉",fact:"吃完饭轻轻揉揉小肚子，像给消化打圈圈帮忙，肚子舒服不胀。力气要轻、顺时针哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：摩腹能助运化，令胃气和。",look:"吃完饭顺时针轻揉肚子几下。",rhyme:"揉揉腹，圈圈揉，消化顺畅身不愁。"},{e:"🦶",name:"泡泡脚",hi:"脚丫小温泉",fact:"睡前泡泡脚，像脚丫泡小温泉，浑身暖暖好睡觉。水温别烫、泡完擦干，要大人陪哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：泡脚温通下肢，引火归元安神。",look:"今晚请大人陪泡脚，水温试好。",rhyme:"泡泡脚，小温泉，暖暖睡好身安痊。"}]},
{id:"shanghan",title:"伤寒杂病论",sub:"赶走感冒的小妙招",emoji:"🌡️",author:"汉·张仲景",locked:false,unit:"方",badgeEmoji:"💊",intro:"张仲景爷爷是古代的好医生，他写了一本书教大家：生病时怎么照顾自己、怎么不让自己生病。（记住：药不能乱吃，一定要听医生和爸爸妈妈的！）",items:[{e:"🤧",name:"感冒",hi:"鼻子的小喷嚏",fact:"着凉或病毒来了，鼻子会塞、会打喷嚏。多穿一点、多喝水，身体的小卫士会赶走它。药不能乱吃，要听医生和爸爸妈妈的。",prop:"调理方向：保暖、休息、补充水分。",origin:"《伤寒论》辨太阳病脉证并治",quote:"古籍大意：张仲景讲外感病初起要早早照顾，不让人受寒、保身体正气。",look:"打喷嚏时用手肘挡住嘴，保护小伙伴。",rhyme:"打喷嚏，肘来挡，勤洗手来感冒慌。"},{e:"🌡️",name:"发烧",hi:"身体小警报",fact:"发烧是身体拉响小警报，说明小卫士在和病菌打仗。多喝水、少穿捂、歇着。烧得高或很久要快告诉医生。",prop:"调理方向：物理降温、补水、观察体温。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲发热要辨表里，护津液、不妄汗下。",look:"用体温计请大人帮忙量一量。",rhyme:"发烧了，小警报，喝水歇着快报告。"},{e:"😷",name:"咳嗽",hi:"气管小扫帚",fact:"咳嗽是气管拿小扫帚，把痰和坏东西扫出来。喝点温水润润，别吃太甜。咳很久要看医生，不能乱吃药哦。",prop:"调理方向：润喉、补水、避刺激。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲咳嗽有寒热之分，要辨证照顾。",look:"咳嗽时低头用手肘挡，别对着人。",rhyme:"咳嗽扫，小扫帚，温水润喉快找医。"},{e:"💦",name:"出汗",hi:"身体的小凉汗",fact:"受了寒微微出汗，是身体在赶走凉气。喝碗热粥盖好被，汗一出就松。但大汗会虚，要听医生的。",prop:"调理方向：微汗解表、保暖避风。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲解表宜微汗，不可令如水流漓。",look:"出汗后马上擦干，别站在风口。",rhyme:"微出汗，赶凉气，擦干莫吹身不疲。"},{e:"🥶",name:"怕冷",hi:"身上小寒颤",fact:"怕冷、爱缩脖子，是寒气在门外敲。多穿一件、喝热汤，把寒气挡外头。一直抖要告诉大人看医生。",prop:"调理方向：保暖、温饮、避风。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲恶寒为表证，宜温覆微汗。",look:"加一件衣服，喝口温热的水。",rhyme:"怕冷时，加件衣，热汤暖身寒颤离。"},{e:"🍃",name:"怕风",hi:"风里小凉针",fact:"怕风是风像小凉针扎皮肤，一吹就起鸡皮。避风、戴帽子，别让风钻领口。不对劲要告诉医生哦。",prop:"调理方向：避风、保暖、静养。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲中风表虚，恶风自汗当护表。",look:"出门戴帽，领口扣好。",rhyme:"怕风针，别钻领，戴帽避风身自宁。"},{e:"🤕",name:"头痛",hi:"脑袋小锤锤",fact:"头痛像小锤锤敲脑袋，可能是累、是着凉。睡一觉、喝温水，轻了就好。痛得凶或呕吐要快看医生。",prop:"调理方向：休息、补水、观察。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲头痛属表，随经脉部位辨证。",look:"安静躺会儿，让脑袋歇歇。",rhyme:"头痛锤，敲脑袋，睡好喝水快松开。"},{e:"💪",name:"身痛",hi:"骨头小酸酸",fact:"浑身酸酸像跑了一百里，是寒气让肌肉紧。热水澡、热敷、歇着，松一松。一直痛要看医生哦。",prop:"调理方向：热敷、休息、保暖。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲身疼腰痛属表实，宜发汗解之。",look:"泡个热水脚，浑身放松。",rhyme:"身痛酸，骨头软，热敷歇着身舒展。"},{e:"🗣️",name:"嗓子疼",hi:"喉咙小辣椒",fact:"嗓子像含了小辣椒，吞口水都痛。温盐水漱口、多喝温水。痛得厉害或发烧要告诉医生，不乱吃药。",prop:"调理方向：温漱、润喉、补水。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景讲咽部不适随经相传，当辨表里。",look:"用温水漱口，小口慢喝。",rhyme:"嗓子疼，小辣椒，温漱喝水快找医。"},{e:"🤢",name:"流鼻涕",hi:"鼻子小水龙头",fact:"鼻子哗哗流清涕，像小水龙头关不住。是寒气在闹。热敷鼻根、喝热汤，水少了就好。很久不停看医生。",prop:"调理方向：温敷、避风、补水。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲鼻鸣干呕属表，宜解表。",look:"用温毛巾敷鼻根，轻轻擦。",rhyme:"流鼻涕，水龙头，温敷热汤快收口。"},{e:"🤧",name:"打喷嚏",hi:"鼻子小鞭炮",fact:"打喷嚏是鼻子放小鞭炮，把脏东西喷出去。用手肘挡、转过身，别喷到小伙伴。常打要看医生哦。",prop:"调理方向：遮挡、清洁、观察。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲嚏为邪气外越之象。",look:"打喷嚏转身用手肘挡。",rhyme:"喷嚏炮，肘来挡，转过身去护同窗。"},{e:"🍽️",name:"没胃口",hi:"肚子小关门",fact:"生病时肚子关小门，不想吃。别硬塞，喝点米汤、清淡的。门开了再慢慢吃。一直不吃要告诉医生。",prop:"调理方向：清淡、少食、补液。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景讲胃不和则卧不安，食当节制。",look:"煮点稀粥，小口慢慢喝。",rhyme:"没胃口，门关小，米汤清淡慢慢好。"},{e:"🔥",name:"肚子痛",hi:"肚肚小打结",fact:"肚肚突然打结痛，可能是吃坏或着凉。热敷、揉揉、不上猛药。痛得打滚要马上看医生，不能乱吃止痛。",prop:"调理方向：保暖、观察、及时就医。",origin:"《伤寒论》辨太阴病",quote:"古籍大意：张仲景讲腹满时痛属太阴，当温之。",look:"用手掌轻轻顺时针揉肚子。",rhyme:"肚子痛，小打结，热敷揉揉快找医。"},{e:"🚽",name:"拉肚子",hi:"肠道小滑梯",fact:"拉肚子是肠道开小滑梯，跑厕所。多喝温水防虚，吃清淡。水样或带血要快看医生，不能乱吃止泻药。",prop:"调理方向：补液、清淡、防脱水。",origin:"《伤寒论》辨太阴病",quote:"古籍大意：张仲景讲下利清谷属虚寒，当温里。",look:"喝淡盐水补水分，记次数。",rhyme:"拉肚子，滑梯开，补水清淡快找医。"},{e:"🤮",name:"呕吐",hi:"胃里小翻江",fact:"胃里翻江倒海想吐，可能是吃坏或受凉。侧身防呛、小口喝水。吐不停或带血要马上看医生。",prop:"调理方向：侧卧、小口补液、观察。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景讲呕属胃气上逆，当和胃。",look:"侧身躺，小口抿温水。",rhyme:"呕吐时，侧身躺，小口喝水快找医。"},{e:"😴",name:"口渴",hi:"喉咙小旱田",fact:"口渴是喉咙旱田喊水。小口慢喝温水，别牛饮。渴得异常、尿多变多要告诉医生查查。",prop:"调理方向：少量多次、温水。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景讲口渴为津液伤，当生津。",look:"小口喝水，含一会儿再咽。",rhyme:"口渴田，喊水来，小口慢喝身不怠。"},{e:"😣",name:"口苦",hi:"嘴里小苦瓜",fact:"早起嘴里苦，像含小苦瓜，可能是累或火气。刷牙、喝温水、早睡觉。一直苦要看医生哦。",prop:"调理方向：清洁、休息、清淡。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景讲口苦咽干属少阳，半表半里。",look:"早起刷牙，喝杯温水。",rhyme:"口苦瓜，嘴里含，刷牙早睡快舒坦。"},{e:"😣",name:"心烦",hi:"心里小蚂蚁",fact:"心里像有小蚂蚁爬，坐不住、烦烦的。去安静处、深呼吸、少屏幕。一直烦要看医生，不乱吃药。",prop:"调理方向：静心、休息、少刺激。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景讲心中烦属热扰，当清之。",look:"找个安静角落深呼吸。",rhyme:"心里烦，小蚂蚁，安静深呼吸就息。"},{e:"🌙",name:"睡不着",hi:"眼睛小闹钟",fact:"该睡却眼睛亮，像小闹钟响。不喝奶茶、不看电视、泡脚。很久失眠要告诉大人看医生。",prop:"调理方向：规律、安神、少刺激。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景讲虚烦不得眠，当养阴安神。",look:"睡前泡脚，听轻音乐。",rhyme:"睡不着，小闹钟，泡脚安静眼朦胧。"},{e:"🧊",name:"手脚凉",hi:"末端小冰块",fact:"手脚凉凉像小冰块，可能是冷或循环慢。搓搓手、泡泡脚、加衣。一直紫冷要快看医生。",prop:"调理方向：保暖、活动、观察。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景讲四肢厥冷属阳虚，当温之。",look:"搓手跺脚，泡个热水脚。",rhyme:"手脚凉，小冰块，搓泡加衣快暖来。"},{e:"🤧",name:"鼻塞",hi:"鼻子小塞子",fact:"鼻子被小塞子堵住，呼吸呼哧呼哧。热毛巾敷、轻轻擤。塞很久或头痛要看医生，别硬撑。",prop:"调理方向：温敷、清理、补水。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲鼻鸣塞属表，宜宣通。",look:"热毛巾敷鼻，轻轻一側擤。",rhyme:"鼻塞子，堵呼哧，温敷轻擤快通气。"},{e:"🫧",name:"痰",hi:"气管小泡泡",fact:"气管里痰像小泡泡，咳不出咽不下。多喝温水稀它，拍拍背。痰黄绿带血要告诉医生，不乱化痰。",prop:"调理方向：补水、拍背、观察。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲痰饮随证治之，不可妄攻。",look:"趴着让大人轻拍后背。",rhyme:"气管痰，小泡泡，温水拍背快化掉。"},{e:"🗣️",name:"咽痛",hi:"喉咙小刀割",fact:"喉咙像被小刀割，吞口水痛。温盐水漱、少说话。痛到不能咽要快看医生，不能乱吃消炎药。",prop:"调理方向：温漱、静声、补水。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景讲咽痛有阴阳虚实之分，当辨治。",look:"小声说话，温水慢慢咽。",rhyme:"咽痛刀，割喉咙，温漱少言快找医。"},{e:"😮‍💨",name:"胸闷",hi:"胸口小石头",fact:"胸口像压小石头，闷闷的。坐下深呼吸、松衣领。闷痛出汗要马上看医生，不能耽误。",prop:"调理方向：透气、休息、及时就医。",origin:"《伤寒论》辨胸痹",quote:"古籍大意：张仲景讲胸满属气机不利，当宽胸。",look:"解开衣领，慢慢深呼吸。",rhyme:"胸闷石，压胸口，透气休息快找医。"},{e:"💓",name:"心慌",hi:"心里小兔子",fact:"心里像小兔子乱跳，突突的。坐下歇、深呼吸、少咖啡。常跳或晕要告诉医生，不乱吃药。",prop:"调理方向：休息、安神、观察。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景讲心动悸属气血虚，当复脉。",look:"安静坐下，数数呼吸。",rhyme:"心慌兔，乱蹦跳，坐下深呼吸快告医。"},{e:"🥱",name:"乏力",hi:"身体小棉花",fact:"浑身软软像小棉花，提不起劲。是身体在修复，多睡、清淡吃。一直软要查查，别硬撑上学。",prop:"调理方向：休息、营养、观察。",origin:"《伤寒论》",quote:"古籍大意：张仲景讲阴阳气血不足则身倦。",look:"睡个午觉，补充点粥饭。",rhyme:"乏力棉，软绵绵，多睡清淡快复原。"},{e:"🥶",name:"打冷战",hi:"身体小抖抖",fact:"打冷战是身体抖抖产热，像发警报。盖好被、喝热汤。伴高烧要快看医生，不能硬扛。",prop:"调理方向：保暖、温饮、观察体温。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景讲恶寒战栗为邪正相争。",look:"盖好被子，喝口热汤。",rhyme:"打冷战，身抖抖，盖被热汤快找医。"},{e:"💧",name:"出虚汗",hi:"夜里小汗珠",fact:"睡着出虚汗，像小珠偷偷冒。可能是累或虚。换衣、避风、早睡觉。常出要告诉医生查因。",prop:"调理方向：擦干、避风、休息。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景讲盗汗属虚，当养阴。",look:"出汗后换干衣，别受凉。",rhyme:"出虚汗，夜珠冒，换衣避风快睡好。"},{e:"😵",name:"眼酸",hi:"眼睛小疲惫",fact:"看久屏幕眼酸酸，像小疲惫挂着眼。闭眼歇、望远、揉太阳穴。一直酸要少看屏，告诉大人。",prop:"调理方向：休息、远眺、少屏。",origin:"《伤寒论》",quote:"古籍大意：久视伤血，目劳则酸。",look:"闭眼一分钟，看看远处绿。",rhyme:"眼酸疲，挂眼角，闭眼望远快走低。"},{e:"😵‍💫",name:"头晕",hi:"脑袋小旋转",fact:"头晕像脑袋小旋转，天旋地转。坐下别动、喝温水。伴呕吐要快看医生，不能自己走远。",prop:"调理方向：静坐、补水、观察。",origin:"《伤寒论》",quote:"古籍大意：张仲景讲头眩属虚或饮，当辨治。",look:"马上坐下扶稳，慢慢喝水。",rhyme:"头晕转，天旋地，坐下慢喝快告医。"},{e:"👄",name:"口臭",hi:"嘴里小臭臭",fact:"嘴里臭臭，可能是没刷净或积食。刷牙、刮舌、喝温水。一直臭要看医生，查查牙或胃。",prop:"调理方向：清洁、饮水、观察。",origin:"《伤寒论》",quote:"古籍大意：张仲景讲胃热则口臭，当清胃。",look:"认真刷牙刮舌，喝温水。",rhyme:"口臭臭，嘴里飘，刷牙刮舌快清掉。"},{e:"🚽",name:"便秘",hi:"肠道小堵车",fact:"便便堵车出不来，肚子胀胀。多喝水、吃菜、揉肚。好几天不通或痛要告诉医生，不乱吃泻药。",prop:"调理方向：纤维、补水、活动。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景讲胃家实宜通下，然不可妄攻。",look:"多吃蔬菜，顺时针揉肚。",rhyme:"便秘堵，肠道车，喝水吃菜快通过。"},{e:"🟡",name:"尿黄",hi:"身体小信号",fact:"尿黄黄是身体小信号，说水喝少了。多喝温水，变清就好。一直深黄或痛要查查医生。",prop:"调理方向：补水、观察。",origin:"《伤寒论》",quote:"古籍大意：津伤则尿黄，当生津补液。",look:"今天多喝几杯温水。",rhyme:"尿黄黄，小信号，多喝温水身轻巧。"},{e:"🌶️",name:"长疹子",hi:"皮肤小红点",fact:"皮肤冒小红点、痒痒，可能是过敏或热。不抓、清凉、记吃了啥。多或喘要快看医生，别乱涂药。",prop:"调理方向：清凉、不抓、观察。",origin:"《伤寒论》",quote:"古籍大意：张仲景讲邪气外发为疹，当透解。",look:"不抓痒处，记下来告诉医生。",rhyme:"长疹子，小红点，不抓清凉快找医。"},{e:"☀️",name:"中暑",hi:"太阳小烤炉",fact:"夏天暴晒，中暑像被小烤炉烤，头晕恶心。快挪阴凉、喝水、扇风。严重要马上看医生，别硬撑。",prop:"调理方向：降温、补水、移阴凉。",origin:"《伤寒论》",quote:"古籍大意：暑热伤气，当清暑益气。",look:"热天躲阴凉，喝淡盐水。",rhyme:"中暑烤，太阳炉，挪阴喝水快找医。"},{e:"🥶",name:"冻伤",hi:"寒气小冰手",fact:"天冷冻伤，手脚红紫痒，像小冰手。别烤火烫、慢慢捂暖。破皮或黑要快看医生，不能硬搓。",prop:"调理方向：渐暖、防护、就医。",origin:"《伤寒论》",quote:"古籍大意：寒伤皮肉，当温通血脉。",look:"戴手套，慢慢搓暖别烫。",rhyme:"冻伤手，小冰冷，渐暖防护快找医。"},{e:"😣",name:"呛着",hi:"气管小误入",fact:"吃饭说笑呛着，东西误入气管，咳得凶。弯腰拍背帮咳出。脸紫喘不上要马上急救看医生。",prop:"调理方向：拍背、急救、就医。",origin:"《伤寒论》",quote:"古籍大意：异物入喉，当急出之。",look:"吃饭不说话，呛了弯腰拍背。",rhyme:"呛着了，气管误，弯腰拍背快救护。"},{e:"🐟",name:"卡鱼刺",hi:"喉咙小毛刺",fact:"吃鱼卡刺，喉咙像扎小毛刺。别吞饭团硬噎，张大嘴看，取不出要快去耳鼻喉科。",prop:"调理方向：停止进食、就医取出。",origin:"《伤寒论》",quote:"古籍大意：骨鲠在喉，当缓取勿强咽。",look:"停止吞咽，请大人看或就医。",rhyme:"卡鱼刺，小毛扎，别咽饭团快找医。"},{e:"🔥",name:"烫伤",hi:"皮肤小火苗",fact:"烫伤像皮肤小火苗，红痛起泡。马上冲凉水、别涂牙膏、盖干净布。起泡破皮要快看医生。",prop:"调理方向：冲凉、保护、就医。",origin:"《伤寒论》",quote:"古籍大意：火伤皮肉，当清凉护创。",look:"冲凉水十五分，盖干净纱布。",rhyme:"烫伤苗，小火烧，冲凉护创快找医。"},{e:"🩹",name:"跌伤",hi:"膝盖小破破",fact:"跑跳跌伤，膝盖破破流血。先止血、清干净、贴创可贴。肿得凶或动不了要快看医生，别乱动。",prop:"调理方向：止血、清洁、就医。",origin:"《伤寒论》",quote:"古籍大意：跌扑伤络，当止血逐瘀。",look:"用干净布压住，清创包扎。",rhyme:"跌伤破，膝盖红，止血清创快找医。"},{e:"🐶",name:"咬伤",hi:"皮肤小牙印",fact:"猫狗咬伤有牙印，可能带病菌。马上冲洗、不包紧、快去打疫苗。不能大意，必须看医生。",prop:"调理方向：冲洗、疫苗、就医。",origin:"《伤寒论》",quote:"古籍大意：毒虫兽伤，当急清创解毒。",look:"流水冲伤口，马上去疾控。",rhyme:"咬伤印，小牙痕，冲洗疫苗快就医。"},{e:"🍵",name:"桂枝汤",hi:"暖暖小甜汤",fact:"桂枝汤是古方小甜汤，用桂枝、芍药、姜枣草煮成。它帮受了微风的人微微出汗、身体松。但它是药，必须医生开方才能喝。",prop:"调理方向：解肌发表、调和营卫，须医生指导。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景说桂枝汤治太阳中风，营卫不和者。",look:"和妈妈认认方里的生姜大枣。",rhyme:"桂枝汤，小甜汤，微汗身松医开方。"},{e:"🌿",name:"麻黄汤",hi:"开门小汗方",fact:"麻黄汤用麻黄、桂枝等，像给寒气开大门，让人发汗赶走凉。它是药，小朋友用必须听医生的，不能自己煮。",prop:"调理方向：发汗解表，须医生严格指导。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景说麻黄汤治太阳伤寒，表实无汗者。",look:"看看书里麻黄长什么样。",rhyme:"麻黄汤，开门汗，赶走凉气医来断。"},{e:"❄️",name:"白虎汤",hi:"清热小凉扇",fact:"白虎汤用石膏、知母等，像给身体拿小凉扇，退掉实热的高烧。它是猛药，必须医生开方，小朋友别碰。",prop:"调理方向：清热生津，须医生指导。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景说白虎汤治阳明气分热盛。",look:"知道它退高热，但必须医生用。",rhyme:"白虎汤，小凉扇，退了高热医来办。"},{e:"🔄",name:"小柴胡汤",hi:"半表小和解",fact:"小柴胡汤用柴胡、黄芩等，帮身体在半表半里和解，胸胁闷、口苦时用。它是药，要医生辨清才能喝。",prop:"调理方向：和解少阳，须医生指导。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景说小柴胡汤治少阳病，和解为宜。",look:"认认方里的柴胡长啥样。",rhyme:"小柴胡，和解方，半表半里医来量。"},{e:"🍲",name:"理中汤",hi:"暖肚小炉子",fact:"理中汤用党参、白术等，像肚子里的小炉子，暖暖受凉的肚子。它是药，小朋友拉肚子要医生判断再用。",prop:"调理方向：温中散寒，须医生指导。",origin:"《伤寒论》辨太阴病",quote:"古籍大意：张仲景说理中汤治太阴虚寒，腹满自利。",look:"和妈妈认认方里的干姜。",rhyme:"理中汤，小炉子，暖了肚肚医来使。"},{e:"🔥",name:"四逆汤",hi:"回阳小暖手",fact:"四逆汤用附子、干姜等，像小暖手救回冰凉的手脚。它很猛，必须医生急救用，小朋友绝不能自己碰。",prop:"调理方向：回阳救逆，须医生急救使用。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景说四逆汤治少阴病，四肢厥逆。",look:"知道它救急，但必须医生用。",rhyme:"四逆汤，小暖手，救回凉肢医急救。"},{e:"💧",name:"五苓散",hi:"利水小水泵",fact:"五苓散用茯苓、泽泻等，像身体小水泵，把多余的水排走、解口渴。它是药，要医生辨清再用。",prop:"调理方向：利水渗湿，须医生指导。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景说五苓散治水逆、小便不利。",look:"认认方里的茯苓白白的。",rhyme:"五苓散，小水泵，排走水湿医来定。"},{e:"🌊",name:"真武汤",hi:"镇水小堤坝",fact:"真武汤用附子、茯苓等，像小堤坝镇住身体里乱跑的水。它是药，怕冷水肿要医生判断再用。",prop:"调理方向：温阳利水，须医生指导。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景说真武汤治少阴水气，心悸头眩。",look:"认认方里的白芍白白的。",rhyme:"真武汤，小堤坝，镇住水气医来查。"},{e:"🍲",name:"半夏泻心汤",hi:"和胃小调和",fact:"半夏泻心汤用半夏、黄芩等，帮肚子上面热下面凉的和解。它是药，胃不舒服要医生开方。",prop:"调理方向：和胃降逆，须医生指导。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景说泻心汤治心下痞，寒热错杂。",look:"认认方里的半夏白白的。",rhyme:"泻心汤，小调和，胃里寒热医来摸。"},{e:"🌿",name:"逍遥散",hi:"心情小清风",fact:"逍遥散用柴胡、当归等，像给闷闷的心吹小清风，舒舒展展。它是药，小朋友情绪差要大人带看医生。",prop:"调理方向：疏肝解郁，须医生指导。",origin:"《伤寒论》类方（宋·太平惠民和剂局方）",quote:"古籍大意：古人用逍遥散疏肝健脾，解郁闷。",look:"和妈妈说说今天开不开心。",rhyme:"逍遥散，小清风，闷闷心儿医来通。"},{e:"⚫",name:"六味地黄丸",hi:"肾儿小补丸",fact:"六味地黄丸用熟地、山茱萸等，像给肾儿小补丸。它是成人常用药，小朋友没病不能吃，要医生判断。",prop:"调理方向：滋补肾阴，须医生指导，小儿慎用。",origin:"《伤寒论》类方（钱乙·小儿药证直诀）",quote:"古籍大意：古人创地黄丸滋补肾阴，小儿用量极慎。",look:"知道这是大人药，小孩别乱吃。",rhyme:"六味丸，小补肾，小孩莫乱医来认。"},{e:"🍚",name:"补中益气汤",hi:"提气小云梯",fact:"补中益气汤用黄芪、白术等，像小云梯把往下掉的气提起来。它是药，没劲懒言要医生开方。",prop:"调理方向：补中益气，须医生指导。",origin:"《伤寒论》类方（李东垣·脾胃论）",quote:"古籍大意：古人用补中益气汤升阳举陷。",look:"认认方里的黄芪黄黄的。",rhyme:"补中汤，小云梯，提了气来医来批。"},{e:"😴",name:"归脾汤",hi:"安神小枕头",fact:"归脾汤用党参、龙眼等，像给心慌睡不好的人小枕头，安心脾。它是药，失眠要医生辨清再用。",prop:"调理方向：健脾养心，须医生指导。",origin:"《伤寒论》类方（宋·济生方）",quote:"古籍大意：古人用归脾汤养心血、健脾气。",look:"和妈妈说说睡得好不好。",rhyme:"归脾汤，小枕头，安心睡好医来谋。"},{e:"🧠",name:"天王补心丹",hi:"心神小灯笼",fact:"天王补心丹用生地、酸枣仁等，像给慌慌的心点小灯笼，静下来。它是药，小孩要用必须医生定。",prop:"调理方向：滋阴安神，须医生指导。",origin:"《伤寒论》类方（明·摄生秘剖）",quote:"古籍大意：古人用补心丹养心安神。",look:"知道它安神，但必须医生用。",rhyme:"补心丹，小灯笼，心静下来医来统。"},{e:"🌿",name:"藿香正气散",hi:"暑湿小香囊",fact:"藿香正气散用藿香、紫苏等，像小香囊驱走暑天湿闷、肚子不舒服。它是药，中暑腹泻要医生判断再用。",prop:"调理方向：解表化湿，须医生指导。",origin:"《伤寒论》类方（宋·太平惠民和剂局方）",quote:"古籍大意：古人用藿香正气散散寒化湿。",look:"认认方里的藿香香香的。",rhyme:"正气散，小香囊，暑湿闷肚医来量。"},{e:"🌼",name:"银翘散",hi:"风热小凉茶",fact:"银翘散用金银花、连翘等，像小凉茶清掉嗓子痛、发热的风热。它是药，感冒类型要医生辨清。",prop:"调理方向：辛凉解表，须医生指导。",origin:"《伤寒论》类方（清·温病条辨）",quote:"古籍大意：古人用银翘散治风热表证。",look:"认认方里的金银花。",rhyme:"银翘散，小凉茶，风热清掉医来察。"},{e:"🌿",name:"桑菊饮",hi:"轻清小润肺",fact:"桑菊饮用桑叶、菊花等，轻轻润润嗓子、咳咳的风热。它是药，轻症要医生判断再用。",prop:"调理方向：疏风清热，须医生指导。",origin:"《伤寒论》类方（清·温病条辨）",quote:"古籍大意：古人用桑菊饮治风温咳嗽轻证。",look:"认认方里的桑叶菊花。",rhyme:"桑菊饮，小润肺，轻清咳嗽医来认。"},{e:"🔥",name:"清瘟败毒饮",hi:"大热小凉水",fact:"清瘟败毒饮用石膏、黄连等，像大凉水浇灭高烧大热。它很猛，必须医生急救用，小孩别碰。",prop:"调理方向：清热解毒，须医生急救使用。",origin:"《伤寒论》类方（清·疫疹一得）",quote:"古籍大意：古人用清瘟败毒饮治气营两燔大热。",look:"知道它治大热，但必须医生用。",rhyme:"败毒饮，小凉水，浇灭大热医来为。"},{e:"🌿",name:"逍遥丸",hi:"舒肝小糖丸",fact:"逍遥丸和逍遥散一伙，是小糖丸帮闷闷不乐舒展开。它是药，情绪差要大人带看医生再定。",prop:"调理方向：疏肝健脾，须医生指导。",origin:"《伤寒论》类方（宋·太平惠民和剂局方）",quote:"古籍大意：古人用逍遥丸疏肝解郁。",look:"知道它舒肝，但必须医生用。",rhyme:"逍遥丸，小糖球，闷闷舒开医来谋。"},{e:"🍡",name:"保和丸",hi:"积食小帮手",fact:"保和丸用山楂、神曲等，像小帮手化掉吃多的积食、肚子胀。它是药，吃撑了要医生判断再用。",prop:"调理方向：消食导滞，须医生指导。",origin:"《伤寒论》类方（元·丹溪心法）",quote:"古籍大意：古人用保和丸消食和胃。",look:"吃多时告诉妈妈，别自己吃药。",rhyme:"保和丸，小帮手，化掉积食医来守。"},{e:"🍚",name:"健脾丸",hi:"脾胃小厨师",fact:"健脾丸用党参、山楂等，像小厨师帮懒懒的脾胃动起来。它是药，消化差要医生开方。",prop:"调理方向：健脾开胃，须医生指导。",origin:"《伤寒论》类方（明·证治准绳）",quote:"古籍大意：古人用健脾丸健脾消食。",look:"知道它帮脾胃，但必须医生用。",rhyme:"健脾丸，小厨师，脾胃勤快医来使。"},{e:"💧",name:"生脉饮",hi:"气阴小甘露",fact:"生脉饮用人参、麦冬等，像小甘露补回出汗多的气阴。它是药，虚汗乏力要医生辨清再用。",prop:"调理方向：益气生津，须医生指导。",origin:"《伤寒论》类方（金·医学启源）",quote:"古籍大意：古人用生脉饮益气养阴。",look:"知道它补汗后虚，但必须医生用。",rhyme:"生脉饮，小甘露，补回气阴医来顾。"},{e:"🛡️",name:"玉屏风散",hi:"体表小卫墙",fact:"玉屏风散用黄芪、白术等，像给体表筑小卫墙，少感冒。它是药，易感冒要医生判断再用。",prop:"调理方向：益气固表，须医生指导。",origin:"《伤寒论》类方（元·丹溪心法）",quote:"古籍大意：古人用玉屏风散固表止汗。",look:"认认方里的黄芪白术。",rhyme:"玉屏风，小卫墙，少感冒了医来量。"},{e:"🍚",name:"参苓白术散",hi:"脾胃小营养",fact:"参苓白术散用党参、茯苓等，像给虚虚的脾胃加小营养、止泻。它是药，拉肚子要医生辨清。",prop:"调理方向：健脾渗湿，须医生指导。",origin:"《伤寒论》类方（宋·太平惠民和剂局方）",quote:"古籍大意：古人用参苓白术散健脾止泻。",look:"知道它止泻，但必须医生用。",rhyme:"参苓散，小营养，脾胃实了医来享。"},{e:"❤️",name:"炙甘草汤",hi:"心动小鼓补",fact:"炙甘草汤用甘草、生地等，像给乱跳的心补小鼓点、稳下来。它是药，心慌要医生开方。",prop:"调理方向：滋阴复脉，须医生指导。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景说炙甘草汤治心动悸、脉结代。",look:"知道它稳心跳，但必须医生用。",rhyme:"炙甘草，小鼓补，心动稳了医来处。"},{e:"🍲",name:"小建中汤",hi:"肚肚小暖锅",fact:"小建中汤用饴糖、桂枝等，像肚肚里小暖锅，暖暖隐隐的腹痛。它是药，肚子痛要医生辨清再用。",prop:"调理方向：温中补虚，须医生指导。",origin:"《伤寒论》辨太阴病",quote:"古籍大意：张仲景说小建中汤治虚劳里急。",look:"知道它暖肚子，但必须医生用。",rhyme:"小建中，小暖锅，暖了肚痛医来摹。"},{e:"🌿",name:"葛根汤",hi:"颈背小松筋",fact:"葛根汤用葛根、麻黄等，像给僵硬的颈背松松筋、发发汗。它是药，脖子痛要医生判断再用。",prop:"调理方向：解表舒筋，须医生指导。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景说葛根汤治项背强几几。",look:"知道它松颈背，但必须医生用。",rhyme:"葛根汤，松筋方，颈背舒展医来详。"},{e:"🔄",name:"大柴胡汤",hi:"里实小通下",fact:"大柴胡汤用柴胡、大黄等，像通下肚里实在的积。它挺猛，必须医生开方，小孩别碰。",prop:"调理方向：和解通下，须医生严格指导。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景说大柴胡汤治少阳阳明合病。",look:"知道它通下，但必须医生用。",rhyme:"大柴胡，通下方，里实通了医来掌。"},{e:"🌿",name:"温胆汤",hi:"胆虚小静心",fact:"温胆汤用半夏、竹茹等，像给胆小易惊的人小静心、安稳。它是药，睡不安要医生辨清再用。",prop:"调理方向：理气化痰，须医生指导。",origin:"《伤寒论》类方（宋·三因方）",quote:"古籍大意：古人用温胆汤和胃化痰、安神。",look:"知道它静心，但必须医生用。",rhyme:"温胆汤，小静心，胆虚安稳医来评。"},{e:"🩸",name:"血府逐瘀汤",hi:"血瘀小通渠",fact:"血府逐瘀汤用桃仁、红花等，像通开身体里堵住的小水渠。它是药，要医生辨清瘀血再用。",prop:"调理方向：活血祛瘀，须医生指导。",origin:"《伤寒论》类方（清·医林改错）",quote:"古籍大意：古人用血府逐瘀汤活血行气。",look:"知道它通瘀，但必须医生用。",rhyme:"逐瘀汤，通水渠，血瘀化开医来渠。"},{e:"🌿",name:"桂枝",hi:"小暖小树枝",fact:"桂枝是桂树的小枝，晒干了入药。它暖暖的、能帮身体打开毛孔出汗赶寒。它是药，必须医生配着用。",prop:"性味：性温，味辛甘；归心、肺、膀胱经。能发汗、温通。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景用桂枝配芍药调和营卫。",look:"看看桂枝细细卷卷的样子。",rhyme:"桂枝枝，小暖条，配芍出汗寒儿逃。"},{e:"🌸",name:"芍药",hi:"酸酸小根茎",fact:"芍药根是酸酸的小根茎，和桂枝是搭档，一散一收。它帮肚子不挛、身体松。它是药，要医生开方。",prop:"性味：性微寒，味苦酸；归肝、脾经。能养血、柔肝。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景用芍药配桂枝，一则解表二则敛阴。",look:"看芍药根胖胖的切片。",rhyme:"芍药根，酸又白，配桂身体松下来。"},{e:"🌿",name:"甘草",hi:"甜甜小调和",fact:"甘草根甜甜的，像药里的和事佬，把各种药拉在一起好好干活。它也能润润嗓子。它是药，要医生配。",prop:"性味：性平，味甘；归心、肺、脾、胃经。能调和、润肺。",origin:"《伤寒论》",quote:"古籍大意：张仲景多方用甘草调和诸药。",look:"尝一小片甘草，是不是甜甜。",rhyme:"甘草甜，和事佬，诸药拉手一起好。"},{e:"🔴",name:"大枣",hi:"红红小补气",fact:"大枣红红的、甜甜的，在方里补补气血、护护胃。它像小甜心。它是药食两用，但药方里要医生配。",prop:"性味：性温，味甘；归脾、胃、心经。能补中、养血。",origin:"《伤寒论》",quote:"古籍大意：张仲景用大枣配姜草，助胃气、和营卫。",look:"数数方里常配几颗枣。",rhyme:"大枣红，小补气，配姜护胃甜咪咪。"},{e:"🌿",name:"麻黄",hi:"发汗小尖草",fact:"麻黄是细细的草茎，力量猛，一用就让人大汗。它是药里的大力士，小朋友必须医生严格用，不能自己煮。",prop:"性味：性温，味辛微苦；归肺、膀胱经。能发汗、平喘。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景用麻黄开表发汗、平喘利水。",look:"看麻黄细细的茎节。",rhyme:"麻黄草，发汗猛，大力士来医掌控。"},{e:"🌰",name:"杏仁",hi:"润润小化痰",fact:"杏仁小小的、苦香的，帮气管润润、把痰化掉、气顺。它是药，苦杏仁有毒，必须医生处理才能用。",prop:"性味：性微温，味苦；归肺、大肠经。能降气、化痰。",origin:"《伤寒论》辨太阳病",quote:"古籍大意：张仲景用杏仁配麻黄，宣肺平喘。",look:"记住苦杏仁不能乱吃。",rhyme:"杏仁苦，小化痰，配麻平喘医来煎。"},{e:"🪨",name:"石膏",hi:"凉凉小石头",fact:"石膏是白白的小石头，磨粉入药，清热像小凉扇。它退实热高烧。它是药，分量要医生拿捏，小孩别碰。",prop:"性味：性大寒，味甘辛；归肺、胃经。能清热、生津。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景用石膏清气分大热。",look:"看石膏白白的像石头。",rhyme:"石膏石，凉又白，退了高热医来裁。"},{e:"🪨",name:"知母",hi:"润润小苦根",fact:"知母根是苦润的小根，配石膏清掉热、补回干。它是药，清热生津要医生开方。",prop:"性味：性寒，味苦甘；归肺、胃、肾经。能清热、润燥。",origin:"《伤寒论》类方",quote:"古籍大意：古人用知母配石膏清热生津。",look:"看知母根细细长长的。",rhyme:"知母根，苦又润，配膏清热医来认。"},{e:"🌿",name:"柴胡",hi:"舒舒小绿杆",fact:"柴胡是细细绿绿的茎，能舒舒闷住的气、退半表半里的热。它是药，要医生辨清再用。",prop:"性味：性微寒，味苦；归肝、胆经。能和解、退热。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景用柴胡为少阳病主药。",look:"看柴胡细细的茎叶。",rhyme:"柴胡杆，绿又细，舒气退热医来提。"},{e:"🌿",name:"黄芩",hi:"黄黄小凉根",fact:"黄芩根是黄黄的，凉凉的，清掉肺和胃的小热。它是药，要医生配着用。",prop:"性味：性寒，味苦；归肺、胆、胃经。能清热、燥湿。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景用黄芩清半里之热。",look:"看黄芩断面黄黄的。",rhyme:"黄芩根，黄又凉，清了小热医来量。"},{e:"🌿",name:"半夏",hi:"小小白疙瘩",fact:"半夏是地里的小白疙瘩，能化痰、止呕。它有毒，必须炮制过、医生开方才能用，小朋友绝对不能碰生品。",prop:"性味：性温，味辛；有毒；归脾、胃、肺经。能化痰、降逆。",origin:"《伤寒论》辨少阳病",quote:"古籍大意：张仲景用半夏和胃降逆、化痰。",look:"记住半夏有毒要炮制。",rhyme:"半夏白，小疙瘩，有毒炮制医来拿。"},{e:"🟡",name:"人参",hi:"补气小老根",fact:"人参是胖胖的老根，补气的大力士。它很补，小孩没虚不能吃，必须医生判断。乱补会流鼻血哦。",prop:"性味：性微温，味甘微苦；归脾、肺、心经。能大补元气。",origin:"《伤寒论》",quote:"古籍大意：张仲景用参救虚极欲脱之人。",look:"看人参像不像小娃娃。",rhyme:"人参根，补气虚，小孩莫乱医来虑。"},{e:"🟡",name:"黄芪",hi:"黄黄小补气",fact:"黄芪黄黄的、软软的，补气像给身体打气。它帮没劲的人。它是药，要用医生开方，小孩别自己喝。",prop:"性味：性温，味甘；归肺、脾经。能补气、固表。",origin:"《伤寒论》类方",quote:"古籍大意：古人用黄芪益气固表。",look:"看黄芪断面黄黄的。",rhyme:"黄芪黄，补气棒，打足气来医来放。"},{e:"🟫",name:"白术",hi:"白白小健脾",fact:"白术是白白的根茎，帮懒懒的脾胃动起来、去去湿。它是药，消化差要医生开方。",prop:"性味：性温，味苦甘；归脾、胃经。能健脾、燥湿。",origin:"《伤寒论》类方",quote:"古籍大意：古人用白术健脾燥湿。",look:"看白术白白胖胖的。",rhyme:"白术白，小健脾，动了脾胃湿儿离。"},{e:"⚪",name:"茯苓",hi:"白白小云朵",fact:"茯苓是松根旁的白块，像小云朵，帮身体排排多余的水、安心。它是药，要医生配着用。",prop:"性味：性平，味甘淡；归心、脾、肾经。能利水、安神。",origin:"《伤寒论》类方",quote:"古籍大意：古人用茯苓渗湿健脾、安神。",look:"看茯苓白白块块的。",rhyme:"茯苓白，小云朵，排了水湿心自妥。"},{e:"🔥",name:"附子",hi:"暖暖小烈药",fact:"附子是乌头的子根，性大热，像小烈火暖回冰凉。它有毒，必须炮制、医生小心用，小孩绝不可碰。",prop:"性味：性大热，味辛甘；有毒；归心、肾、脾经。能回阳、散寒。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景用附子回阳救逆。",look:"记住附子有毒要医生用。",rhyme:"附子烈，小火炉，回阳救逆医慎图。"},{e:"🟤",name:"干姜",hi:"暖中干姜片",fact:"干姜是生姜晒干片，暖暖中焦、赶寒。方里常配附子。它是药，要医生配，小孩别自己煮。",prop:"性味：性热，味辛；归脾、胃、肾、心、肺经。能温中、散寒。",origin:"《伤寒论》辨太阴病",quote:"古籍大意：张仲景用干姜温中散寒。",look:"看干姜片皱皱的。",rhyme:"干姜片，暖中焦，配附散寒医来调。"},{e:"🌿",name:"细辛",hi:"小小辛香草",fact:"细辛是小小辛香的草，通鼻窍、止小痛。它有毒，用量极小，必须医生精确开方，小孩不能碰。",prop:"性味：性温，味辛；有小毒；归心、肺、肾经。能散寒、通窍。",origin:"《伤寒论》",quote:"古籍大意：张仲景用细辛散寒通窍。",look:"记住细辛有毒量要小。",rhyme:"细辛草，辛香小，通窍止痛医来调。"},{e:"🌿",name:"防风",hi:"挡风小卫士",fact:"防风像名字一样，帮身体挡挡风邪、止痉。它是药，受风要医生配着用。",prop:"性味：性温，味辛甘；归膀胱、肝、脾经。能祛风、解表。",origin:"《伤寒论》类方",quote:"古籍大意：古人用防风祛风胜湿。",look:"看防风根头像风吹的毛。",rhyme:"防风草，小卫士，挡了风邪身不迟。"},{e:"🟫",name:"当归",hi:"补血小根须",fact:"当归是香香的根须，补血活血，像给血小快递加油。它是药，要医生开方，小孩别自己喝。",prop:"性味：性温，味甘辛；归肝、心、脾经。能补血、活血。",origin:"《伤寒论》类方",quote:"古籍大意：古人用当归补血活血。",look:"看当归须须卷卷的。",rhyme:"当归须，补血好，加了油来医来调。"},{e:"🌿",name:"川芎",hi:"走路小活血",fact:"川芎香香的，帮血在身体里顺畅走路、不堵。它是药，要医生配，小孩别碰。",prop:"性味：性温，味辛；归肝、胆、心包经。能活血、行气。",origin:"《伤寒论》类方",quote:"古籍大意：古人用川芎活血行气止痛。",look:"看川芎疙瘩状的根茎。",rhyme:"川芎香，血路畅，不堵不痛医来量。"},{e:"🟫",name:"生地",hi:"凉凉小汁根",fact:"生地是地黄的鲜根，凉凉的、能清血热、滋阴。它是药，要医生开方。小朋友别自己吃。",prop:"性味：性寒，味甘苦；归心、肝、肾经。能清热、凉血。",origin:"《伤寒论》类方",quote:"古籍大意：古人用生地凉血养阴。",look:"看生地黑黑黏黏的。",rhyme:"生地根，凉又黏，清了血热医来添。"},{e:"🟫",name:"熟地",hi:"黏黏小补血",fact:"熟地是生地蒸熟变黑，黏黏的、专补血阴。它是药，大补，小孩无虚不能吃，要医生定。",prop:"性味：性微温，味甘；归肝、肾经。能补血、滋阴。",origin:"《伤寒论》类方",quote:"古籍大意：古人用熟地补血填精。",look:"看熟地乌黑油亮的。",rhyme:"熟地黑，黏又补，血阴足了医来铺。"},{e:"🟠",name:"陈皮",hi:"橘子小老皮",fact:"陈皮是橘子皮放久了，香香的、帮脾胃理气化痰。它是药食两用，但方里要医生配。",prop:"性味：性温，味辛苦；归脾、肺经。能理气、化痰。",origin:"《伤寒论》类方",quote:"古籍大意：古人用陈皮理气健脾、燥湿化痰。",look:"看陈皮卷卷的橙皮。",rhyme:"陈皮皮，橘子老，理气化痰医来调。"},{e:"🟠",name:"枳实",hi:"小小小青果",fact:"枳实是小小青果，力气猛，能破气消积、通堵。它是药，小孩要医生严格用，别自己碰。",prop:"性味：性微寒，味苦辛；归脾、胃经。能破气、消积。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景用枳实配厚朴通腑消痞。",look:"看枳实小小的圆果。",rhyme:"枳实小，力气猛，破了积滞医来控。"},{e:"🟫",name:"厚朴",hi:"树皮小宽胸",fact:"厚朴是树皮卷卷的，帮肚子宽宽、气顺下来。它是药，要医生配，小孩别自己煮。",prop:"性味：性温，味苦辛；归脾、胃、肺、大肠经。能燥湿、下气。",origin:"《伤寒论》辨阳明病",quote:"古籍大意：张仲景用厚朴配枳实除满。",look:"看厚朴卷卷的树皮。",rhyme:"厚朴皮，卷卷宽，气顺肚舒医来观。"},{e:"🌼",name:"桔梗",hi:"宣宣小喇叭",fact:"桔梗根是宣肺的小喇叭，把痰往上一宣、嗓子松。它是药，要医生开方。",prop:"性味：性平，味苦辛；归肺经。能宣肺、利咽。",origin:"《伤寒论》辨少阴病",quote:"古籍大意：张仲景用桔梗汤治咽痛。",look:"看桔梗根白白的。",rhyme:"桔梗根，小喇叭，宣了肺气嗓不哑。"},{e:"🌼",name:"连翘",hi:"清心小黄果",fact:"连翘是黄黄的小果，凉凉的、清掉热毒小疮。它是药，要医生配，小孩别乱吃。",prop:"性味：性微寒，味苦；归肺、心、小肠经。能清热解毒。",origin:"《伤寒论》类方（清·温病条辨）",quote:"古籍大意：古人用连翘清热解毒、消肿。",look:"看连翘黄黄的小果。",rhyme:"连翘黄，小果凉，清了热毒医来量。"},{e:"🌿",name:"金银花",hi:"金银小清花",fact:"金银花白变黄，凉凉的、清掉风热咽疼。它是药，不能当饮料乱喝，要医生定。",prop:"性味：性寒，味甘；归肺、胃、心经。能清热解毒。",origin:"《伤寒论》类方（清·温病条辨）",quote:"古籍大意：古人用金银花散热解毒。",look:"看金银花开白变黄。",rhyme:"金银花，金银色，清了风热医来择。"}]},
{id:"tianji",title:"天纪",sub:"倪海厦爷爷讲天文地理",emoji:"🌌",author:"倪海厦",locked:false,unit:"讲",badgeEmoji:"🌌",intro:"倪海厦爷爷讲天上的事。我们一起抬头看天：太阳、月亮、星星和四季，都是又大又奇妙的朋友！（我们只讲看得见的、科学的小知识哦）",items:[{e:"☀️",name:"太阳",hi:"天上的大灯泡",fact:"太阳离我们很远很远，却给我们光和热。植物靠阳光长大，我们也离不开它。",origin:"《尚书·尧典》观象授时",quote:"古籍大意：古人很早就观察太阳运行来安排农时。",look:"早晨和傍晚看看太阳的位置，是不是不一样？",rhyme:"太阳公，挂天上，照得世界亮堂堂。"},{e:"🌙",name:"月亮",hi:"夜里的白盘子",fact:"月亮自己不发光，是反射太阳的光。它圆了又缺、缺了又圆，像和我们捉迷藏。",origin:"《诗经·小雅》",quote:"古籍大意：古人观测月亮圆缺记日子、定月份。",look:"连续几天晚上看月亮，画下它的形状。",rhyme:"月亮白，像盘子，圆缺变化真有意思。"},{e:"⭐",name:"星星",hi:"夜空小钻石",fact:"星星是远远的太阳，离得太远才变成小点。晴天夜里它们一闪一闪，像撒在天上的钻石。",origin:"《史记·天官书》",quote:"古籍大意：古人把星星分组起名，用来认方向和记时。",look:"找找夜空里最亮的三颗星。",rhyme:"小星星，亮晶晶，远远挂着像钻石。"},{e:"🪞",name:"北斗七星",hi:"天上的小勺子",fact:"七颗星连起来像一把大勺子，叫北斗七星。勺子柄转一圈，春夏秋冬就轮流来。",origin:"《鹖冠子》",quote:"古籍大意：古人看斗柄指向辨四季：东指春、南指夏。",look:"夜里找找那把‘勺子’在哪里。",rhyme:"北斗七，小勺子，柄转四季知此时。"},{e:"📍",name:"北极星",hi:"夜里的指北针",fact:"北极星几乎不动，总在北方。找到北斗勺口两颗星连线，就能找到它，迷路时帮大忙。",origin:"《论语》为政以德",quote:"古籍大意：古人靠北极星定方向，喻如众星共之。",look:"用北斗勺口连线延长找北极星。",rhyme:"北极星，不挪窝，指北方向的罗盘。"},{e:"🌟",name:"金星",hi:"晨昏小亮星",fact:"金星离我们近又反光强，是天上最亮的星。它有时在清晨、有时在傍晚出现，像启明和长庚。",origin:"《诗经》",quote:"古籍大意：古人称晨见为启明、昏见为长庚，实为一星。",look:"清晨或傍晚找最亮的那颗星。",rhyme:"金星亮，启明长，晨昏出现闪光芒。"},{e:"🔴",name:"火星",hi:"红色小邻居",fact:"火星表面含铁、看起来红红的，是地球的邻居。它比地球小，上面很冷很干。",origin:"《史记·天官书》",quote:"古籍大意：古人观火星（荧惑）行度以察天时。",look:"看火星为啥发红，想想它的土。",rhyme:"火星红，小邻居，冷干荒凉远望你。"},{e:"🟠",name:"木星",hi:"胖胖大行星",fact:"木星是行星里的大胖子，比地球大很多。它转得快，晚上常能看到它亮亮地挂着。",origin:"《史记·天官书》",quote:"古籍大意：古人称木星为岁星，用以纪年。",look:"找找夜空里很亮的那颗大星。",rhyme:"木星胖，大块头，夜里亮亮挂天沟。"},{e:"⚪",name:"水星",hi:"最近小飞星",fact:"水星离太阳最近，跑得最快。它总在太阳旁边，清晨或傍晚才偶尔露面，小小的一颗。",origin:"《史记·天官书》",quote:"古籍大意：古人称水星为辰星，察其出入知寒暑。",look:"知道水星总挨着太阳旁边。",rhyme:"水星近，跑得快，贴着太阳小存在。"},{e:"🪐",name:"土星",hi:"戴圈小帅星",fact:"土星外面套着一圈漂亮的光环，像戴了草帽。它是气体大球，远远看去真神气。",origin:"《史记·天官书》",quote:"古籍大意：古人称土星为镇星，二十八年走一周天。",look:"想象土星光环像草帽。",rhyme:"土星帅，草帽戴，光环一圈真气派。"},{e:"🪐",name:"天王星",hi:"侧躺小冰星",fact:"天王星是冷冷的冰巨星，它还懒懒地侧躺着转。它离我们很远，要用望远镜才看得清。",origin:"《史记·天官书》续考",quote:"古籍大意：后世天文家测得天王星，补五星之外。",look:"知道天王星是侧着转的。",rhyme:"天王星，侧着转，冷冰冰远看不见。"},{e:"🔵",name:"海王星",hi:"最深小蓝星",fact:"海王星是深深蓝蓝的冰巨星，离太阳最远，冷得要命。它是算出来才找到的星。",origin:"《史记·天官书》续考",quote:"古籍大意：古人未见，近世以算法定其位。",look:"知道海王星是最远的蓝星。",rhyme:"海王星，深蓝远，算出来才得一见。"},{e:"🌌",name:"银河",hi:"天上的大牛奶",fact:"夏天夜里的白茫茫一条，是银河。它其实是无数星星挤在一起，远看像河。",origin:"《古诗十九首》",quote:"古籍大意：古人想象银河为天上之河，隔牛女二星。",look:"夏天找找天上白茫茫的一条带。",rhyme:"银河白，像牛奶，万颗星挤成一带。"},{e:"✨",name:"星座",hi:"星星小拼图",fact:"人们把相近的星连成图案，叫星座，像狮子、像仙女。同一片星能讲不同故事。",origin:"《史记·天官书》",quote:"古籍大意：古人分星官、连星成象以记天。",look:"把几颗星连成你喜欢的动物。",rhyme:"星座图，星拼成，故事讲给夜空听。"},{e:"🐻",name:"大熊座",hi:"熊熊大拼图",fact:"大熊座是北方的大星座，里面的七颗星就是北斗勺。它一年绕着北极星转圈。",origin:"《史记·天官书》",quote:"古籍大意：古人以北斗属大熊，随天旋转。",look:"先找北斗，再想它在大熊身上。",rhyme:"大熊座，熊熊大，北斗勺在它脚下。"},{e:"🐻",name:"小熊座",hi:"熊宝宝拼图",fact:"小熊座尾巴尖上就是北极星。它紧紧挨着北方，像熊宝宝守着家。",origin:"《史记·天官书》",quote:"古籍大意：古人以北极居中，小熊环绕。",look:"找北极星，它就小熊尾尖。",rhyme:"小熊座，熊宝宝，尾尖北极守家小。"},{e:"🏹",name:"猎户座",hi:"猎人小三星",fact:"猎户座像个拿弓的猎人，腰间三颗星排成一排最醒目。冬天夜里最好找。",origin:"《史记·天官书》",quote:"古籍大意：古人观参宿（猎户）以定冬时。",look:"冬天找腰间整齐的三颗星。",rhyme:"猎户座，猎人强，腰间三星排成行。"},{e:"🧚",name:"仙女座",hi:"远处小星系",fact:"仙女座是离我们很远的一个星系，用望远镜看像小椭圆。它也在慢慢靠近我们。",origin:"《史记·天官书》续考",quote:"古籍大意：后世天文测得仙女星系，为近邻大星系。",look:"知道仙女座是别处星系。",rhyme:"仙女座，远处家，小椭圆在慢靠咱。"},{e:"💫",name:"流星",hi:"天空小滑梯",fact:"流星是太空小石头闯进大气，摩擦发光划过，像坐滑梯。许个愿，它已烧光啦。",origin:"《春秋》",quote:"古籍大意：古人记流星陨星，以为天象之变。",look:"对着流星快许个小愿望。",rhyme:"流星过，小滑梯，唰一下去许个期。"},{e:"☄️",name:"彗星",hi:"扫把小尾巴",fact:"彗星拖着长长尾巴，像大扫把。它绕太阳转，很多年才来一次。古书里叫它扫星。",origin:"《春秋》",quote:"古籍大意：古人记彗星（扫星）之行以观天变。",look:"看图片里彗星的长尾巴。",rhyme:"彗星来，扫把尾，多年一次空中飞。"},{e:"🪨",name:"陨石",hi:"天外来小石头",fact:"陨石是从天上掉下来的石头，落在地上还热热的。它告诉我们太空的样子。",origin:"《春秋》",quote:"古籍大意：古人记陨石坠地，以为天降之石。",look:"看博物馆里的陨石标本。",rhyme:"陨石石，天外来，落地还热故事在。"},{e:"🌑",name:"日食",hi:"太阳小挡板",fact:"月亮跑到太阳前面，挡住光，白天变暗，叫日食。它只在初一附近发生，要用专用镜片看。",origin:"《尚书·胤征》",quote:"古籍大意：古人记日食之变，以正历法。",look:"用专用眼镜或投影看，别直视。",rhyme:"日食来，月挡光，白天变暗莫直望。"},{e:"🌕",name:"月食",hi:"地球小影子",fact:"地球影子投到月亮上，月亮变红或暗，叫月食。它发生在满月时，用眼睛看很安全。",origin:"《诗经》",quote:"古籍大意：古人观月食以察地影之度。",look:"满月夜看看月亮是不是缺一块。",rhyme:"月食红，地影遮，满月变暗安全瞅。"},{e:"🌒",name:"新月",hi:"月亮小镰刀",fact:"新月是月亮全黑看不见，像藏起来的小镰刀。它出现在农历初一，和太阳同边。",origin:"《说文》",quote:"古籍大意：古人以朔为新月，日月合朔。",look:"农历初一抬头找找有没有月。",rhyme:"新月藏，小镰刀，初一不见莫心焦。"},{e:"🌓",name:"上弦月",hi:"右半小亮脸",fact:"上弦月只亮右半边，像笑着的半张脸。它出现在农历初七、八，半夜就落。",origin:"《说文》",quote:"古籍大意：古人以弦月察月行之半。",look:"初八晚上看月亮亮哪边。",rhyme:"上弦月，半边亮，初八右脸朝咱望。"},{e:"🌕",name:"满月",hi:"圆圆小银盘",fact:"满月又圆又亮，像银盘挂夜空。它出现在农历十五、六，整夜不落。",origin:"《说文》",quote:"古籍大意：古人以望为满月，日月相望。",look:"十五晚上看最圆的月亮。",rhyme:"满月圆，银盘亮，十五挂夜整宿望。"},{e:"🌗",name:"下弦月",hi:"左半小亮脸",fact:"下弦月只亮左半边，出现在农历廿二、三，半夜才升起。和上弦正好相反。",origin:"《说文》",quote:"古籍大意：古人以下弦察月行之又半。",look:"廿三凌晨看月亮亮哪边。",rhyme:"下弦月，左半明，廿三夜起对面迎。"},{e:"📅",name:"农历",hi:"月亮小日历",fact:"农历看月亮圆缺定日子，十五月圆、初一新月。过节（中秋、端午）都按它。",origin:"《尚书·尧典》",quote:"古籍大意：古人观月相制历，以闰月正四时。",look:"翻翻农历，找今天初几。",rhyme:"农历历，看月缺，十五圆来初一歇。"},{e:"📆",name:"公历",hi:"太阳小日历",fact:"公历看地球绕太阳定年，一年365天，月份整齐。我们上学、生日多用它。",origin:"《史记》历书",quote:"古籍大意：古人以太阳行度定岁，后世为公历。",look:"看公历今天是几月几号。",rhyme:"公历历，太阳转，365天整一年。"},{e:"🔁",name:"闰年",hi:"多出的小日子",fact:"地球绕日不是整365天，差一点。每四年加一天（2月29），叫闰年，把差的补上。",origin:"《史记》历书",quote:"古籍大意：古人置闰以齐天度，四时不错。",look:"查查今年是不是闰年。",rhyme:"闰年加，一天补，四年一次二月五。"},{e:"🌞",name:"一天",hi:"地球小转圈",fact:"地球自己转一圈就是一天。朝太阳这面是白天，背过去是黑夜，所以我们看到日出日落。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日出入为一昼一夜。",look:"记记今天日出和日落时间。",rhyme:"地球转，一天成，日出日落昼夜更。"},{e:"🪐",name:"一年",hi:"地球小长跑",fact:"地球绕太阳跑一大圈叫一年，约365天。跑的过程中我们经历春夏秋冬。",origin:"《尚书·尧典》",quote:"古籍大意：古人观日躔以定岁，分四时。",look:"数数一年有几个月。",rhyme:"地球跑，一年长，绕日一圈四季装。"},{e:"🌸",name:"四季",hi:"四色小轮盘",fact:"因为地球歪着身子绕太阳，阳光照到的地方会变，成了春暖夏热秋凉冬冷四季。",origin:"《礼记·月令》",quote:"古籍大意：古人依四时次序安排农事生活。",look:"画四个格子写四季特点。",rhyme:"四季轮，四色盘，歪身绕日冷热换。"},{e:"🌱",name:"春分",hi:"昼夜小天平",fact:"春分这天，白天黑夜一样长，像天平放平。过后白天越来越长，春天过半。",origin:"《礼记·月令》",quote:"古籍大意：古人以春分日夜分，仲春之月。",look:"春分那天记记早晚时长。",rhyme:"春分来，天平平，昼夜一样仲春迎。"},{e:"🍂",name:"秋分",hi:"昼夜小天平",fact:"秋分和春分相反半，白天黑夜又一样长。过后黑夜变长，秋天过半、要添衣。",origin:"《礼记·月令》",quote:"古籍大意：古人以秋分日夜分，仲秋之月。",look:"秋分记记昼夜是否等长。",rhyme:"秋分至，天平称，夜长昼短凉风乘。"},{e:"☀️",name:"夏至",hi:"白天小最长",fact:"夏至这天白天最长、夜里最短，太阳最高。过后白天慢慢变短，盛夏来了。",origin:"《礼记·月令》",quote:"古籍大意：古人以夏至日长至，阳气极。",look:"夏至记记是不是天黑最晚。",rhyme:"夏至到，昼最长，过了这天渐变凉。"},{e:"❄️",name:"冬至",hi:"黑夜小最长",fact:"冬至这天黑夜最长、白天最短。过后白天变长，古人说‘冬至一阳生’。",origin:"《礼记·月令》",quote:"古籍大意：古人以冬至日短至，阴极阳生。",look:"冬至记记是不是天黑最早。",rhyme:"冬至夜，最长黑，过了这天昼往回。"},{e:"🌱",name:"立春",hi:"春天小敲门",fact:"立春是春天第一个节气，天气要回暖，小苗准备醒。它告诉我们：脱厚衣还早，先迎春。",origin:"《礼记·月令》",quote:"古籍大意：古人以立春为岁首，东风解冻。",look:"立春前后去户外找绿芽。",rhyme:"立春到，春天敲，东风解冻苗要笑。"},{e:"🌞",name:"立夏",hi:"夏天小开门",fact:"立夏是夏天开始，天气变热、青蛙叫。它说：多喝水、少暴晒，夏天来了。",origin:"《礼记·月令》",quote:"古籍大意：古人以立夏为孟夏，万物繁茂。",look:"立夏听听蛙鸣、看绿叶。",rhyme:"立夏开，夏天门，蛙鸣叶茂热煞人。"},{e:"🍁",name:"立秋",hi:"秋天小报到",fact:"立秋是秋天开始，虽还热，但早晚凉、叶子将黄。它提醒：贴秋膘、慢添衣。",origin:"《礼记·月令》",quote:"古籍大意：古人以立秋为孟秋，凉风至。",look:"立秋看早晚是不是凉了。",rhyme:"立秋报，秋天到，虽热早晚凉风飘。"},{e:"❄️",name:"立冬",hi:"冬天小关门",fact:"立冬是冬天开始，水要结冰、要保暖。它说：藏好力气、多穿衣，冬天来了。",origin:"《礼记·月令》",quote:"古籍大意：古人以立冬为孟冬，水始冰。",look:"立冬检查棉衣厚不厚。",rhyme:"立冬关，冬天门，水始结冰衣加身。"},{e:"📜",name:"二十四节气",hi:"大自然小闹钟",fact:"一年分二十四节气，像大自然小闹钟：清明、谷雨、小满、大雪……每个提醒该种啥、穿啥。",origin:"《礼记·月令》",quote:"古籍大意：古人依节气安排农时起居。",look:"背几个节气名字给妈妈听。",rhyme:"二十四，小闹钟，跟着天穿身不空。"},{e:"🌧️",name:"春雨",hi:"春天小细线",fact:"春天雨细细的，像天上撒小线，喂醒小草小花。它不凶，润润的，正合万物长。",origin:"《诗经》",quote:"古籍大意：古人以春雨贵如油，润物无声。",look:"春雨天伸手接接小雨点。",rhyme:"春雨细，像丝线，喂醒草花天地鲜。"},{e:"⚡",name:"夏雷",hi:"夏天小鼓手",fact:"夏天热，云里正负电打架，啪啪响是雷、闪是光。雷公敲鼓提醒：快躲雨别站树下。",origin:"《诗经》",quote:"古籍大意：古人观雷以知阳气奋发。",look:"打雷时躲进屋子别出门。",rhyme:"夏雷响，小鼓敲，躲雨别站树下瞧。"},{e:"🍁",name:"秋霜",hi:"秋天小白糖",fact:"秋天清早，水汽在草叶上结白白的霜，像撒了白糖。它说天冷了，要去霜、加衣。",origin:"《诗经》",quote:"古籍大意：古人以霜降为秋深之候。",look:"清晨看草叶上有没有白霜。",rhyme:"秋霜白，像白糖，草叶一层天转凉。"},{e:"❄️",name:"冬雪",hi:"冬天小棉花",fact:"冬雪是天上落的小棉花，盖住麦苗保温。它白白的、软软的，世界变安静。",origin:"《诗经》",quote:"古籍大意：古人以瑞雪兆丰年。",look:"下雪天伸手接一片雪花看。",rhyme:"冬雪落，小棉花，盖住麦苗暖哇哇。"},{e:"🌈",name:"彩虹",hi:"雨后小拱桥",fact:"下雨后太阳出来，光被小水珠分成七色，挂出彩虹拱桥。红橙黄绿蓝靛紫，真漂亮。",origin:"《诗经》",quote:"古籍大意：古人以虹为日旁之气，雨霁乃见。",look:"雨后找找天上有没有彩虹。",rhyme:"彩虹桥，七色排，雨过天晴挂云崖。"},{e:"☁️",name:"云",hi:"天上小棉花团",fact:"云是地面的水变成汽，上天聚成小水珠，白白的像棉花团。积多了就下雨。",origin:"《诗经》",quote:"古籍大意：古人观云以色状辨阴晴。",look:"躺地上看云像什么动物。",rhyme:"云朵白，棉花团，水珠聚多雨就欢。"},{e:"🌬️",name:"风",hi:"空气小跑步",fact:"风是空气在跑步。太阳晒热这处、冷那处，空气就流动成风。它帮花儿传粉、风车转。",origin:"《诗经》",quote:"古籍大意：古人以八方之风察气之动。",look:"伸出手感觉风从哪边来。",rhyme:"空气跑，成了风，吹得风车转嗡嗡。"},{e:"🌩️",name:"雷电",hi:"云里小火花",fact:"云里电荷太多，啪地放出闪电、跟着打雷。光比声快，所以先见闪后闻雷。",origin:"《诗经》",quote:"古籍大意：古人以雷电为阴阳相薄。",look:"数见闪到闻雷隔几秒。",rhyme:"雷电闪，云里花，先见光来后听哗。"},{e:"🌧️",name:"雨",hi:"天上小水龙头",fact:"地面水变汽上天，遇冷成小水珠，胖了掉下成雨。它浇灌田地，也提醒带伞。",origin:"《诗经》",quote:"古籍大意：古人以雨为天之津液，润泽万物。",look:"下雨听雨滴声，看水洼圈圈。",rhyme:"雨珠落，水龙头，浇了田地伞在手。"},{e:"❄️",name:"雪",hi:"六角小冰花",fact:"雪是高空的水汽直接冻成六角小冰花，轻轻飘下。每片都不一样，真神奇。",origin:"《诗经》",quote:"古籍大意：古人以雪为阴凝之华。",look:"接一片雪看是不是六角。",rhyme:"雪六角，小冰花，每片不同天上撒。"},{e:"🌫️",name:"雾",hi:"地面小纱巾",fact:"清晨水汽贴地结成雾，像白纱巾蒙住世界。它让远处看不清，走路要慢、车要开灯。",origin:"《诗经》",quote:"古籍大意：古人以雾为地气上腾。",look:"雾天走路慢点、看不清远处。",rhyme:"雾纱巾，蒙地面，慢走开车灯亮显。"},{e:"💧",name:"露",hi:"草尖小珍珠",fact:"晴夜地面凉，水汽在草叶上凝成露，像小珍珠。天一热就蒸发不见。",origin:"《诗经》",quote:"古籍大意：古人以露为阴液之润。",look:"清晨看草尖有没有露珠。",rhyme:"露珠亮，草尖挂，太阳一晒不见啦。"},{e:"🥶",name:"霜",hi:"秋末小冰衣",fact:"天很冷时，水汽直接在地面结成霜，像给小草穿冰衣。它比露更冷，提醒添衣。",origin:"《诗经》",quote:"古籍大意：古人以霜降为寒之渐。",look:"霜晨摸摸叶上冰冰的白。",rhyme:"霜如衣，叶上白，天寒地冻添衣来。"},{e:"🧊",name:"冰",hi:"小河小玻璃",fact:"天冷到零度下，水结成冰，像小河铺玻璃。它滑，走路要小心，别独自上去。",origin:"《诗经》",quote:"古籍大意：古人以冰为水寒所凝。",look:"看湖面结冰亮亮的。",rhyme:"冰如镜，河面封，走路小心莫逞能。"},{e:"🌌",name:"极光",hi:"北极小彩帘",fact:"在很北很南的地方，太阳粒子撞大气，会舞出绿红彩帘，叫极光。我们这很少见。",origin:"《史记·天官书》续考",quote:"古籍大意：近世知极光为太阳风与大气相激。",look:"看极光图片想象彩帘舞。",rhyme:"极光帘，北边舞，绿红彩带天作幕。"},{e:"🧭",name:"东",hi:"日出小方向",fact:"太阳升起的那边是东。早晨面对太阳，前面是东、后面是西。认东就不迷路。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日出为东，定四方。",look:"早晨面对太阳认东在哪。",rhyme:"太阳升，是东方，面对它来不迷向。"},{e:"🧭",name:"南",hi:"中午小暖方",fact:"中午太阳在南方最高，影子最短。面南背北，是我们这最常指的暖方向。",origin:"《尚书·尧典》",quote:"古籍大意：古人以南为正，定方位。",look:"中午看影子朝哪，反方向是南。",rhyme:"中午晒，南最高，影子短处南边靠。"},{e:"🧭",name:"西",hi:"日落小方向",fact:"太阳落下的那边是西。傍晚面对落日，前面是西。和东正好相反。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日入为西。",look:"傍晚看太阳落哪边是西。",rhyme:"太阳落，是西方，面对它来知去向。"},{e:"🧭",name:"北",hi:"北极小方向",fact:"面对北极星的那边是北。它常冷、背阳。认北，配合东就能找全方向。",origin:"《尚书·尧典》",quote:"古籍大意：古人以北极定北。",look:"用北极星认北在哪边。",rhyme:"北极星，指北方，面对它来心不慌。"},{e:"🧭",name:"东南",hi:"转角小方向",fact:"东和南之间叫东南。风从东南来，常带暖湿，要下雨的样子。",origin:"《尚书·尧典》",quote:"古籍大意：古人分八方以察风。",look:"看东南方向有没有乌云。",rhyme:"东南角，风中藏，暖湿带来雨一场。"},{e:"🧭",name:"西北",hi:"转角小方向",fact:"西和北之间叫西北。风从西北来，常干冷，冬天更明显。",origin:"《尚书·尧典》",quote:"古籍大意：古人以西北风为寒。",look:"冬天感受西北风是不是冷。",rhyme:"西北角，风里寒，干冷吹来冬衣穿。"},{e:"🌅",name:"黎明",hi:"天边小橘灯",fact:"黎明是天快亮、东方泛橘红的时候。小鸟先醒、虫儿收声，新的一天要开始。",origin:"《诗经》",quote:"古籍大意：古人以平旦为昼之始。",look:"早起看东方是不是泛红。",rhyme:"黎明来，橘灯亮，天快亮了鸟先唱。"},{e:"🌇",name:"黄昏",hi:"天边小橙纱",fact:"黄昏是天快黑、西方橙红的时候。路灯亮起、该回家吃饭啦。",origin:"《诗经》",quote:"古籍大意：古人以日入为黄昏，止劳作。",look:"黄昏看西方橙红、路灯亮。",rhyme:"黄昏至，橙纱飘，路灯亮了该回巢。"},{e:"🌞",name:"中午",hi:"太阳小头顶",fact:"中午太阳跑到头顶最高，影子最短、最热。吃过饭歇歇，别正午暴晒。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日中为午。",look:"中午看自己影子是不是最短。",rhyme:"中午到，日头高，影子短短热难熬。"},{e:"🌃",name:"子夜",hi:"深夜小静钟",fact:"子夜是半夜十二点左右，最安静、天最黑。小朋友早该睡熟，养足精神。",origin:"《诗经》",quote:"古籍大意：古人以夜半为子时。",look:"知道子夜是半夜最深时。",rhyme:"子夜深，万籁静，小朋友该睡得定。"},{e:"⏰",name:"时差",hi:"钟儿小错位",fact:"地球转，各地太阳时间不同。东边先亮，西边还黑，就叫时差。出国要调钟。",origin:"《史记》历书",quote:"古籍大意：古人知日中随地而异，后世立时区。",look:"查查北京和伦敦差几小时。",rhyme:"时差在，钟错位，东亮西黑各进退。"},{e:"🌍",name:"地球",hi:"我们的小蓝船",fact:"地球是我们住的小蓝船，有山有海有空气。它转着圈也绕日跑，给我们四季白天。",origin:"《尚书·尧典》",quote:"古籍大意：古人观天地，知人居于地载之上。",look:"拿地球仪转转看海陆。",rhyme:"地球船，蓝汪汪，载着我们绕日忙。"},{e:"🌙",name:"月球",hi:"地球小跟班",fact:"月球是地球的跟班，一直绕着地球转，也跟着地球绕太阳。它照亮夜空、引起潮汐。",origin:"《尚书·尧典》",quote:"古籍大意：古人以月系地，察其晦朔弦望。",look:"看月亮每天位置在变。",rhyme:"月球班，跟地球，绕着我们夜夜走。"},{e:"🔄",name:"自转",hi:"地球小陀螺",fact:"地球像小陀螺自己转，转一圈是一天，所以有日出日落、昼夜交替。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日出入知地之自转。",look:"想地球自转，我们跟着转。",rhyme:"地球转，像陀螺，转出昼夜日穿梭。"},{e:"🪐",name:"公转",hi:"地球小长跑",fact:"地球歪着身子绕太阳长跑，一圈一年，阳光角度变出四季。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日躔知地之公转。",look:"想地球绕日跑出四季。",rhyme:"地球跑，绕日长，歪身跑出四季装。"},{e:"📏",name:"赤道",hi:"地球小腰带",fact:"赤道是地球中间的热腰带，那里太阳直照、终年热。往两极走就变冷。",origin:"《史记·大宛传》",quote:"古籍大意：古人知地有中道，南北分寒暑。",look:"在地球仪找中间的红圈。",rhyme:"赤道带，热乎乎，太阳直照中道铺。"},{e:"🧊",name:"北极",hi:"地球小冰尖",fact:"北极是地球最北的尖，常年冰天雪地。指南针的北就指向它附近。",origin:"《史记·大宛传》",quote:"古籍大意：古人以北极定北端。",look:"在地球仪找最上的尖。",rhyme:"北极尖，冰连连，最北端上白雪掩。"},{e:"🧊",name:"南极",hi:"地球小冰尖",fact:"南极是地球最南的尖，也冰天雪地，住着企鹅。它和北极相对。",origin:"《史记·大宛传》",quote:"古籍大意：古人以南极对北极。",look:"在地球仪找最下的尖。",rhyme:"南极尖，冰连天，企鹅住这最南边。"},{e:"♨️",name:"回归线",hi:"太阳小折返",fact:"南北回归线是太阳直照最远的线。夏至直射北回归线、冬至南回归线，过后折返。",origin:"《尚书·尧典》",quote:"古籍大意：古人以日南至、北至知回归。",look:"看地图找两条回归线。",rhyme:"回归线，太阳返，直射尽头又往还。"},{e:"🧭",name:"经线",hi:"地球小纵线",fact:"经线是从北极到南极的纵线，帮我们定东西位置。本初子午线在零度。",origin:"《史记》历书",quote:"古籍大意：古人以子午线定经度。",look:"在地球仪看竖着的线。",rhyme:"经线纵，连两极，东西位置它来记。"},{e:"➡️",name:"纬线",hi:"地球小横线",fact:"纬线是与赤道平行的横线，帮我们定南北位置。赤道是零度纬线。",origin:"《史记》历书",quote:"古籍大意：古人以赤道分纬度。",look:"在地球仪看横着的圈。",rhyme:"纬线横，平行排，南北位置它来裁。"},{e:"⛰️",name:"高山",hi:"大地小脊梁",fact:"高山是大地隆起的脊梁，越往上越冷、空气越薄。爬山要慢、注意保暖。",origin:"《尚书·禹贡》",quote:"古籍大意：古人导山治水，知山之高。",look:"看远处最高的山在哪。",rhyme:"高山高，大地梁，越上越冷莫逞强。"},{e:"🌊",name:"海洋",hi:"地球小水库",fact:"海洋占地球七成，是超级大水库。它调节气候、养鱼养虾，也帮下雨。",origin:"《尚书·禹贡》",quote:"古籍大意：古人观四海，知水之大。",look:"看地图上海洋有多大。",rhyme:"海洋大，水库广，七成地球它来装。"},{e:"🏞️",name:"平原",hi:"大地小席子",fact:"平原是平平整整的大地席子，适合种庄稼、盖房子。我们多数住在平原。",origin:"《尚书·禹贡》",quote:"古籍大意：古人辨九洲平原以居。",look:"看家乡是不是平平整整。",rhyme:"平原平，像席子，种粮盖房最合适。"},{e:"🏞️",name:"河流",hi:"大地小银带",fact:"河流从山里流到海，像大地银带，给我们喝水、浇田、行船。",origin:"《尚书·禹贡》",quote:"古籍大意：古人导水入海，利灌溉。",look:"找找家附近的小河。",rhyme:"河流带，银闪闪，从山到海润农田。"},{e:"☀️",name:"太阳系",hi:"太阳小家族",fact:"太阳带着八大行星和许多小石头，组成太阳系大家庭。地球是其中一员。",origin:"《史记·天官书》续考",quote:"古籍大意：近世知太阳系以日为中心。",look:"数数太阳系有几颗大行星。",rhyme:"太阳系，太阳家，八大行星绕它耍。"},{e:"🪐",name:"行星",hi:"绕日小滚球",fact:"行星是绕太阳转的大滚球，自己不发光。有水金地火木土天海八颗。",origin:"《史记·天官书》",quote:"古籍大意：古人察五行星之行，近世补其三。",look:"背出八颗行星名字。",rhyme:"行星球，绕日滚，八颗兄弟排成阵。"},{e:"🌙",name:"卫星",hi:"行星小月亮",fact:"卫星是绕行星转的小家伙，比如月球绕地球。有的行星有很多卫星。",origin:"《史记·天官书》续考",quote:"古籍大意：近世知卫星绕行星而行。",look:"想月球是地球的小卫星。",rhyme:"卫星小，绕行星，月亮绕着地球行。"},{e:"🪨",name:"小行星",hi:"太空小石子",fact:"小行星是太空里的小石子，大多在火星木星间排队。它们不惹事，远远绕着太阳。",origin:"《史记·天官书》续考",quote:"古籍大意：近世于火星木区间发现小行星带。",look:"知道小行星带在哪。",rhyme:"小行星，小石子，火星木区间排次。"},{e:"🌊",name:"潮汐",hi:"海水小呼吸",fact:"月亮引力拉着海水，海水每天涨落两次，像大海在呼吸。农历初一十五潮最大。",origin:"《史记·天官书》",quote:"古籍大意：古人观潮信，知月引海水。",look:"海边看海水是不是在涨。",rhyme:"潮汐来，海呼吸，月亮拉着水起立。"},{e:"🕰️",name:"日晷",hi:"太阳小钟表",fact:"日晷是古人用太阳影子看时间的钟表。太阳挪，影子挪，就能读钟点。",origin:"《周礼》",quote:"古籍大意：古人立晷影以正时刻。",look:"中午看影子最短像不像指针。",rhyme:"日晷钟，影做针，太阳挪动报时辰。"},{e:"📐",name:"圭表",hi:"测影小尺子",fact:"圭表是立根杆、量影子长短，知节气和年长。古人靠它定春耕时间。",origin:"《周礼》",quote:"古籍大意：古人以土圭测日影定四时。",look:"想杆子影子冬长夏短。",rhyme:"圭表尺，量影长，冬长夏短知农忙。"},{e:"🔁",name:"闰月",hi:"多出的小月",fact:"农历年比太阳年短，隔几年加一个月叫闰月，把季节对齐。它是古人的聪明办法。",origin:"《尚书·尧典》",quote:"古籍大意：古人以闰月正四时，不差农候。",look:"查今年农历有没有闰月。",rhyme:"闰月加，对季节，古人聪明不差歇。"},{e:"🌌",name:"三垣",hi:"天中三小城",fact:"古人把北极周围星分成三垣，像三座天中小城，各管一块天区。",origin:"《史记·天官书》",quote:"古籍大意：古人分中宫三垣以象天宫。",look:"知道三垣围着北极星。",rhyme:"三垣城，围北极，天中三块各有职。"},{e:"🐉",name:"四象",hi:"四方小神兽",fact:"古人把天空四方星连成四象：青龙、朱雀、白虎、玄武，各守一方。",origin:"《史记·天官书》",quote:"古籍大意：古人以四象分天四方。",look:"说出四象是哪四个神兽。",rhyme:"四象兽，守四方，青龙朱雀白虎玄。"},{e:"🐯",name:"二十八宿",hi:"天边小驿站",fact:"古人把天边星分成二十八宿，像二十八个小驿站，月亮每晚歇一站。",origin:"《史记·天官书》",quote:"古籍大意：古人分二十八宿以度日月。",look:"知道月亮一夜换一宿。",rhyme:"二十八，小驿站，月儿每夜换一站。"},{e:"🏹",name:"参宿",hi:"猎户小亮星",fact:"参宿是猎户座的亮星群，冬天最醒目。古人看它知冬来、劝农闲。",origin:"《史记·天官书》",quote:"古籍大意：古人以参宿定冬时。",look:"冬天找猎户腰间参宿。",rhyme:"参宿亮，猎户星，冬天夜空它最明。"},{e:"❤️",name:"心宿",hi:"夏天小红星",fact:"心宿是天蝎座的心，三颗红星排一排，夏天夜里亮。古人说它管农事。",origin:"《史记·天官书》",quote:"古籍大意：古人以心宿察火（荧惑）之所。",look:"夏天找天蝎那三颗红星。",rhyme:"心宿红，夏天星，三颗一排天蝎心。"},{e:"🪡",name:"角宿",hi:"春天小龙角",fact:"角宿是东方青龙的角，春天傍晚从东方升起，古人说龙抬头了。",origin:"《史记·天官书》",quote:"古籍大意：古人以角宿为苍龙之角，春见。",look:"春天看东方升起的龙角星。",rhyme:"角宿角，龙抬头，春天东方它先游。"},{e:"🏠",name:"室女座",hi:"春天小处女",fact:"室女座是春天南天的星座，像一位处女。它指引春分点附近的天区。",origin:"《史记·天官书》续考",quote:"古籍大意：近世以室女座邻春分点。",look:"春天找南天这片星。",rhyme:"室女座，春南天，一片星群静无言。"},{e:"🎵",name:"天琴座",hi:"夏天小竖琴",fact:"天琴座是夏天的小竖琴，里面的织女星最亮。它和牛郎隔河相望。",origin:"《史记·天官书》",quote:"古籍大意：古人以织女星属天琴。",look:"夏天找亮亮的织女星。",rhyme:"天琴座，小竖琴，织女亮亮天上吟。"},{e:"🦂",name:"天蝎座",hi:"夏天小红心",fact:"天蝎座是夏天低空的大蝎子，心宿红星就在它胸口。它红红的好认。",origin:"《史记·天官书》",quote:"古籍大意：古人以心宿为天蝎之心。",look:"夏天看低空红心的大蝎。",rhyme:"天蝎座，大红心，夏天低空最显明。"},{e:"👑",name:"仙后座",hi:"秋天小皇椅",fact:"仙后座是秋天北天的W形，像一把皇椅。它和北斗轮流露面，帮找北极星。",origin:"《史记·天官书》续考",quote:"古籍大意：近世以仙后座呈W形来辨别北天。",look:"秋天找北天像W形状的一排星。",rhyme:"仙后座，皇椅形，秋夜北天最易识。"}]},
{id:"renji",title:"人纪",sub:"倪海厦爷爷讲身体经络",emoji:"🧭",author:"倪海厦",locked:false,unit:"讲",badgeEmoji:"🧠",intro:"倪海厦爷爷讲我们的身体。我们的身体像一座神奇的小城堡，每个房间都有自己的工作！（不舒服一定要告诉大人哦）",items:[{e:"❤️",name:"心脏",hi:"身体里的小鼓手",fact:"心脏住在胸口左边，咚咚咚不停地跳，把红红的血液送到全身。它一天要跳十万多次！",origin:"《黄帝内经·素问》灵兰秘典论",quote:"古籍大意：心是身体的君主，像国王住在宫殿里，管血脉和精神。",look:"把手放在胸口，闭上眼，感受小鼓手在打拍子。",rhyme:"小心脏，咚咚跳，送血全身真勤劳。"},{e:"🫁",name:"肺",hi:"呼吸小气球",fact:"肺像两个小气球，一鼓一鼓帮我们吸气吐气。吸进氧气，呼出废气，身体才清爽。",origin:"《黄帝内经·素问》五脏生成篇",quote:"古籍大意：肺像宰相，帮心把气布散到全身。",look:"深吸一口气，感受两个小气球鼓起来。",rhyme:"小肺球，一鼓鼓，吸气吐气真舒服。"},{e:"🟥",name:"肝脏",hi:"身体小化工厂",fact:"肝脏是身体里的小化工厂，把营养存起来、把坏东西变没。它默默工作，最勤快。",origin:"《黄帝内经·素问》灵兰秘典论",quote:"古籍大意：肝是将军，管疏泄和藏血。",look:"摸摸右边肋骨下，那里藏着小化工厂。",rhyme:"小肝厂，默默忙，存好营养身安康。"},{e:"🟧",name:"脾脏",hi:"血液小仓库",fact:"脾脏躲在左边，像血液小仓库，还帮身体抓坏细菌。它不声不响保护我们。",origin:"《黄帝内经·素问》经脉别论",quote:"古籍大意：脾主运化，是气血生化的源头。",look:"左边肋骨下摸摸，谢谢小仓库。",rhyme:"小脾库，藏血液，抓了坏菌身不怠。"},{e:"🟫",name:"肾脏",hi:"身体小滤器",fact:"肾脏像两个小滤器，把血液里的废水变成尿排走。它日夜不停，帮身体大扫除。",origin:"《黄帝内经·素问》六节藏象论",quote:"古籍大意：肾是作强的官，藏精、主水。",look:"后腰两边摸摸，那里有两个小滤器。",rhyme:"小肾滤，日夜忙，废水变尿身清爽。"},{e:"🥣",name:"胃",hi:"肚子小搅拌机",fact:"胃像小搅拌机，把嚼碎的食物和胃液混在一起，搅成糊糊送下游。它酸酸的能杀菌。",origin:"《黄帝内经·素问》五脏别论",quote:"古籍大意：胃是水谷之海，受纳腐熟食物。",look:"吃完饭摸摸上腹部，感受小搅拌机。",rhyme:"小胃机，搅糊糊，消化食物身有福。"},{e:"🌀",name:"小肠",hi:"营养小吸收管",fact:"小肠弯弯绕绕，像长长的吸管，把食物里的营养吸进血液。它是最长的加工厂。",origin:"《黄帝内经·素问》灵兰秘典论",quote:"古籍大意：小肠是受盛之官，分清别浊、吸收营养。",look:"想想食物在肚里长长的弯弯管道走。",rhyme:"小肠长，吸营养，弯弯绕绕身强壮。"},{e:"💩",name:"大肠",hi:"残渣小传送管",fact:"大肠接住小肠剩下的残渣，把水吸走，变成便便送出。它让肠道不堵塞。",origin:"《黄帝内经·素问》灵兰秘典论",quote:"古籍大意：大肠是传道之官，把糟粕送出体外。",look:"每天吃菜喝水，帮大肠顺顺地工作。",rhyme:"大肠管，送残渣，便便顺畅身不卡。"},{e:"🧠",name:"大脑",hi:"身体小司令",fact:"大脑住在头骨里，是身体小司令，管想、管记、管动。它天天最忙，要睡好才精神。",origin:"《黄帝内经·素问》灵兰秘典论",quote:"古籍大意：脑为髓之海，主精神思维。",look:"轻轻摸摸后脑勺，谢谢小司令。",rhyme:"小大脑，司令员，想想记记真能干。"},{e:"🤸",name:"小脑",hi:"平衡小助手",fact:"小脑在大脑后下方，帮我们站稳、不摔跤。骑车、跳舞都靠它悄悄帮忙。",origin:"《黄帝内经·素问》",quote:"古籍大意：髓海有余则轻劲多力，主身体协调。",look:"单脚站一站，感受小脑帮平衡。",rhyme:"小脑助，稳当当，骑车跳舞它来帮。"},{e:"🦴",name:"脊髓",hi:"身体小电线",fact:"脊髓是脊梁里的小电线，把大脑的命令送到全身，也把感觉送回大脑。它像信息高速路。",origin:"《黄帝内经·素问》",quote:"古籍大意：经脉者，所以行血气而营阴阳。",look:"挺直背，想想里面这根小电线。",rhyme:"脊髓线，传命令，上下通顺身灵敏。"},{e:"🔌",name:"神经",hi:"身体小电话线",fact:"神经像小电话线，遍布全身，把痒、痛、冷的消息快快告诉大脑。碰一下就知道。",origin:"《黄帝内经·素问》",quote:"古籍大意：经脉流行不止，如环无端通于内外。",look:"轻轻碰手指，感受消息传到大脑。",rhyme:"神经线，电话忙，痒痛冷热快报上。"},{e:"👀",name:"眼睛",hi:"心灵小窗户",fact:"眼睛像两扇小窗户，黑黑的瞳孔让光进来，成像给大脑看世界。它累了要歇歇。",origin:"《黄帝内经·素问》金匮真言论",quote:"古籍大意：肝开窍于目，目得血而能视。",look:"看看远处绿树，让小窗户歇一歇。",rhyme:"小眼睛，窗两扇，看看世界真好看。"},{e:"👂",name:"耳朵",hi:"声音小喇叭",fact:"耳朵像小喇叭，把声音收进里道，传给大脑听。太大声会震坏它，要爱护。",origin:"《黄帝内经·素问》阴阳应象大论",quote:"古籍大意：肾开窍于耳，和则能闻五音。",look:"听一首歌，感受小喇叭在工作。",rhyme:"小耳朵，喇叭俏，轻轻声音它收到。"},{e:"👃",name:"鼻子",hi:"气味小侦探",fact:"鼻子是气味小侦探，能闻花香、饭香，也能闻警报告诉危险。它还是呼吸的大门。",origin:"《黄帝内经·素问》金匮真言论",quote:"古籍大意：肺开窍于鼻，鼻和则能知香臭。",look:"深吸一口气，猜猜闻到了什么味道。",rhyme:"小鼻子，侦探俏，香臭危险它先报。"},{e:"👅",name:"舌头",hi:"味道小评委",fact:"舌头上的小点点能尝酸甜苦辣咸，像小评委。它帮我们爱上好吃的、躲开怪味。",origin:"《黄帝内经·素问》阴阳应象大论",quote:"古籍大意：心开窍于舌，舌能辨五味。",look:"喝口汤，用舌头猜猜咸还是甜。",rhyme:"小舌头，评委忙，五味尝遍身健康。"},{e:"🦷",name:"牙齿",hi:"嘴巴小石头",fact:"牙齿硬硬的像小石头，把食物咬碎磨细，好让胃省力气。每天刷牙它亮亮的。",origin:"《黄帝内经·素问》",quote:"古籍大意：齿为骨之余，洁齿则身安。",look:"对着镜子数数自己有几颗牙。",rhyme:"小牙齿，硬石头，咬碎食物胃不愁。"},{e:"👄",name:"嘴巴",hi:"食物小大门",fact:"嘴巴是食物小大门，牙齿嚼、舌头尝、唾液润，把美食送进肚子。它也会说话笑。",origin:"《黄帝内经·素问》",quote:"古籍大意：口者脾之窍，出纳水谷言语。",look:"对着镜子笑一笑，看看小大门。",rhyme:"小嘴巴，大门开，嚼嚼尝尝真愉快。"},{e:"🗣️",name:"喉咙",hi:"声音小通道",fact:"喉咙是声音小通道，气流经过声带振动，就发出说话和歌声。多喝水它润润的。",origin:"《黄帝内经·素问》",quote:"古籍大意：喉者气之所以上下者也。",look:"喝口水润润，轻轻哼首歌。",rhyme:"小喉咙，声道长，说话唱歌它来帮。"},{e:"🌬️",name:"气管",hi:"空气小管道",fact:"气管是空气小管道，把鼻子吸的气送到肺里。它里面有毛，挡住灰尘。别呛着哦。",origin:"《黄帝内经·素问》",quote:"古籍大意：肺主气，司呼吸而通于天。",look:"吸气时感受空气沿小管道下行。",rhyme:"气管道，送气忙，灰尘挡住身安康。"},{e:"🌿",name:"支气管",hi:"肺里小树枝",fact:"支气管是肺里的小树枝，一分为二再分叉，把气送到每个肺泡。像树杈分呀分。",origin:"《黄帝内经·素问》",quote:"古籍大意：肺朝百脉，输布精气于周身。",look:"想象肺里像小树杈分叉。",rhyme:"支气管，小树杈，分叉把气送万家。"},{e:"🦴",name:"骨骼",hi:"身体小钢筋",fact:"骨骼硬硬的像小钢筋，撑起身体、保护软软的器官。多喝奶晒太阳，它更强。",origin:"《黄帝内经·素问》六节藏象论",quote:"古籍大意：肾主骨，骨为身之支架。",look:"伸伸胳膊，感受骨头撑着身体。",rhyme:"小骨骼，钢筋硬，撑起身体护内廷。"},{e:"💀",name:"头骨",hi:"脑子小头盔",fact:"头骨像硬硬的小头盔，把大脑乖乖护在里面。它拼成圆顶，撞一下也护着司令。",origin:"《黄帝内经·素问》",quote:"古籍大意：脑为髓海，赖骨以固护。",look:"轻轻摸摸头顶，谢谢小头盔。",rhyme:"头骨盔，护大脑，硬硬圆顶真牢靠。"},{e:"🧱",name:"脊柱",hi:"身体中轴柱",fact:"脊柱是身体中轴柱，一节节摞起来，让我们直直站立，还护着里面的脊髓。",origin:"《黄帝内经·素问》",quote:"古籍大意：脊者身之柱，藏髓而通脑。",look:"挺直背，摸摸一节节的脊柱。",rhyme:"脊柱柱，中轴正，直直站立身不倾。"},{e:"🦴",name:"肋骨",hi:"胸口小笼子",fact:"肋骨像小笼子，围成笼子护着心和肺。它软软能扩缩，帮我们呼吸。",origin:"《黄帝内经·素问》",quote:"古籍大意：胸为心肺之郭，赖肋骨以卫护。",look:"深呼吸，感受肋骨笼子张大缩小。",rhyme:"肋骨笼，护心胸，一张一缩气畅通。"},{e:"🦵",name:"股骨",hi:"大腿小顶梁",fact:"股骨是大腿里最长最粗的骨头，像小顶梁撑住身体、帮我们跑跳。它最结实。",origin:"《黄帝内经·素问》",quote:"古籍大意：肾主骨，股为身之柱干。",look:"拍拍大腿，感受里面硬硬的股骨。",rhyme:"股骨粗，顶梁柱，跑跳全靠它撑住。"},{e:"💪",name:"肌肉",hi:"身体小弹簧",fact:"肌肉像小弹簧，一缩一放让我们跑跳拿东西。多运动它结实，不运动会变松。",origin:"《黄帝内经·素问》",quote:"古籍大意：脾主肌肉，运动则气充血肉实。",look:"握拳弯臂，看肌肉鼓起来。",rhyme:"小肌肉，弹簧强，跑跳拿物它在忙。"},{e:"🧴",name:"皮肤",hi:"身体小被子",fact:"皮肤裹住全身，像小被子保暖、挡脏挡菌。它还会出汗散热，要常洗香香的。",origin:"《黄帝内经·素问》",quote:"古籍大意：肺主皮毛，为身之卫外者也。",look:"洗澡时看看皮肤干不干净。",rhyme:"皮肤被，裹全身，挡脏保暖最安心。"},{e:"💇",name:"头发",hi:"头顶小草草",fact:"头发像头顶小草草，保护头皮不受晒。它会掉几根、长新的，都是正常的。",origin:"《黄帝内经·素问》",quote:"古籍大意：肾华在发，发为血之余。",look:"梳头时看掉几根正常的发。",rhyme:"头发草，头上长，常梳洗来顺又亮。"},{e:"💅",name:"指甲",hi:"指尖小铠甲",fact:"指甲像指尖小铠甲，保护软软的指尖。它会长长，要剪短免藏脏。剪完洗手。",origin:"《黄帝内经·素问》",quote:"古籍大意：爪为筋之余，甲坚则肢健。",look:"这周让妈妈帮剪指甲。",rhyme:"小指甲，铠甲俏，剪短洗手细菌少。"},{e:"🩸",name:"血液",hi:"红色小快递",fact:"血液红红的像小快递，在血管里跑，送氧气和营养到全身，还带走废水。",origin:"《黄帝内经·素问》",quote:"古籍大意：心主血，血行脉中濡养全身。",look:"看手背青筋，那是血液小公路。",rhyme:"血液红，小快递，送氧送料全身济。"},{e:"🔴",name:"红细胞",hi:"氧气小面包",fact:"红细胞圆圆平平像小面包，里面装血红蛋白，专门搬氧气送到全身。它没有核真勤快。",origin:"《黄帝内经·素问》",quote:"古籍大意：血主濡运，赤者载气以养身。",look:"想象红红的小面包在血管里跑。",rhyme:"红细胞，小面包，搬氧送全身不抛。"},{e:"⚪",name:"白细胞",hi:"身体小卫士",fact:"白细胞是身体小卫士，看到坏细菌就冲上去包围它。生病时它会变多去打仗。",origin:"《黄帝内经·素问》",quote:"古籍大意：卫气者，所以温分肉而御外邪。",look:"受伤发红时，是卫士在忙。",rhyme:"白细胞，小卫士，围住坏菌身不迟。"},{e:"🟡",name:"血小板",hi:"伤口小补丁",fact:"血小板是伤口小补丁，哪破了它立刻聚过去，帮血变稠结痂。它让伤口快好。",origin:"《黄帝内经·素问》",quote:"古籍大意：血气和则创易敛，血小板司凝。",look:"看伤口结痂，谢谢小补丁。",rhyme:"血小板，小补丁，伤口结疤它来拼。"},{e:"🩺",name:"血管",hi:"身体小河流",fact:"血管是身体里的小河流，粗的叫动脉、细的叫静脉，血在里面日夜奔流不停。",origin:"《黄帝内经·素问》",quote:"古籍大意：脉者血之府，流行不止如环无端。",look:"摸手腕 ，轻言细语身不伤。"},{e:"👀",name:"视觉",hi:"眼睛小相机",fact:"视觉是眼睛小相机，把光变成画面送大脑，我们就看见世界。离书远点，别近视。",origin:"《黄帝内经·素问》",quote:"古籍大意：目受血而能视，远观以养目。",look:"看远处绿树，保护小相机。",rhyme:"视觉机，眼里藏，远观近歇身不盲。"},{e:"⚡",name:"痛觉",hi:"身体小警报",fact:"痛觉是身体小警报，碰烫、扎刺马上喊疼，催我们躲开。它虽难受，却是好保镖。",origin:"《黄帝内经·素问》",quote:"古籍大意：痛者气血不通，所以警身以避害。",look:"碰疼时快躲开，谢谢警报。",rhyme:"痛觉报，小警报，催你躲开身不熬。"},{e:"🦷",name:"换牙",hi:"牙齿小接班",fact:"换牙是乳牙小接班，六七岁乳牙掉了，恒牙来上岗。掉了别怕，新牙会更硬。",origin:"《黄帝内经·素问》",quote:"古籍大意：齿更而更新，幼年之常也。",look:"掉牙时数数，新牙长出来没。",rhyme:"换牙班，新上岗，掉了别怕牙更壮。"},{e:"📏",name:"长高",hi:"骨头小拔节",fact:"长高是骨头小拔节，小时候长得快，尤其睡觉时是高峰。多睡多跳多奶，窜得高。",origin:"《黄帝内经·素问》",quote:"古籍大意：肾主骨而生髓，故能长。",look:"量量身高，看是不是又高了。",rhyme:"长高节，骨拔长，多睡多跳个儿昂。"},{e:"🎤",name:"声带",hi:"喉咙小琴弦",fact:"声带是喉咙里小琴弦，气流一吹就振动发声，说话唱歌都靠它。别喊哑，要轻声。",origin:"《黄帝内经·素问》",quote:"古籍大意：喉有声带，气鼓而能言。",look:"轻声说话，保护小琴弦。",rhyme:"声带弦，喉咙藏，轻声细语身不哑。"},{e:"🫧",name:"肺泡",hi:"肺里小气球",fact:"肺泡是肺里无数小气球，气体交换就在那儿：吸氧、排二氧化碳。它小而忙。",origin:"《黄帝内经·素问》",quote:"古籍大意：肺朝百脉而主气，换气于细微。",look:"深呼吸，想象小气球在换气。",rhyme:"肺泡球，肺里藏，吸氧气来排碳忙。"},{e:"🔵",name:"肾小球",hi:"肾脏小滤网",fact:"肾小球是肾脏里小滤网，把血里的废料滤成尿，好东西留回去。它精细又勤快。",origin:"《黄帝内经·素问》",quote:"古籍大意：肾主水，气化而分别清浊。",look:"知道肾脏里有精细小滤网。",rhyme:"肾小球，小滤网，滤掉废料身清亮。"},{e:"⚡",name:"神经元",hi:"神经小信使",fact:"神经元是神经小信使，长长伸出手，把消息嗖嗖传给下一个。大脑里好多在忙。",origin:"《黄帝内经·素问》",quote:"古籍大意：髓海之中，神机出入以为用。",look:"想想信号在神经里嗖嗖跑。",rhyme:"神经元，信使忙，嗖嗖传信身灵光。"},{e:"💧",name:"脑脊液",hi:"脑子小软垫",fact:"脑脊液是脑子小软垫，托着大脑减震动，还送营养。它像水床护着司令。",origin:"《黄帝内经·素问》",quote:"古籍大意：髓海得液以养，则脑安而不震。",look:"轻轻护头，感谢小软垫。",rhyme:"脑脊液，软垫藏，托着大脑身不晃。"},{e:"💧",name:"关节液",hi:"关节小润滑油",fact:"关节液是关节小润滑油，让骨头转轴顺滑不卡。它少了关节会响会痛，要保暖。",origin:"《黄帝内经·素问》",quote:"古籍大意：关节利在滑泽，液充则屈伸如意。",look:"活动关节时想想小润滑油。",rhyme:"关节液，滑溜溜，转轴顺滑身不皱。"},{e:"👁️",name:"睫毛",hi:"眼睛小扫帚",fact:"睫毛是眼睛小扫帚，挡灰尘和小虫，还遮阳。它轻轻眨，护着窗户不进灰。",origin:"《黄帝内经·素问》",quote:"古籍大意：目之有睫，所以捍外而守护。",look:"眨眨眼，感受小扫帚在护窗。",rhyme:"睫毛扫，护眼窗，挡灰遮阳身不伤。"},{e:"🌈",name:"眉毛",hi:"眼睛小雨棚",fact:"眉毛是眼睛小雨棚，把汗和雨挡开，不流进眼睛。它还能表情，让你会笑会愁。",origin:"《黄帝内经·素问》",quote:"古籍大意：眉者蔽额而护目者也。",look:"抬抬眉，看小雨棚在挡汗。",rhyme:"眉毛棚，挡汗雨，护着眼睛身不眯。"},{e:"💋",name:"嘴唇",hi:"嘴巴小大门",fact:"嘴唇是嘴巴小大门，软软的、管开合，还帮忙发各种音。它干了要喝水，别舔破。",origin:"《黄帝内经·素问》",quote:"古籍大意：口之用，唇为之扃键。",look:"抿抿嘴，感受小大门开合。",rhyme:"嘴唇门，软又灵，开合发音身不闷。"},{e:"✋",name:"手掌",hi:"抓握小吸盘",fact:"手掌是抓握小吸盘，纹路和肉垫让我们拿东西更牢。它天天写字画画最勤快。",origin:"《黄帝内经·素问》",quote:"古籍大意：手之掌握，所以任物也。",look:"握拳感受手掌肉垫牢牢的。",rhyme:"手掌垫，抓握牢，写字画画真灵巧。"},{e:"🦶",name:"脚掌",hi:"走路小软垫",fact:"脚掌是走路小软垫，肉厚厚缓冲，让我们走远不累。它天天着地，要洗要暖。",origin:"《黄帝内经·素问》",quote:"古籍大意：足掌着地处，任重而用劳。",look:"光脚踩地，感受小软垫缓冲。",rhyme:"脚掌垫，软又厚，走远不累身不皱。"},{e:"🧪",name:"内分泌",hi:"身体小信使",fact:"内分泌是身体小信使，腺体分泌小激素进血，管长个、管心情。它悄悄调，让我们刚刚好。",origin:"《黄帝内经·素问》",quote:"古籍大意：脏腑之精，化气以为用，调和周身。",look:"知道身体里有小信使在悄悄调。",rhyme:"内分泌，信使悄，调好长个心情好。"}]},
{id:"shanhai",title:"山海经",sub:"古人笔下的神奇山海",emoji:"🗺️",author:"先秦·佚名",locked:false,unit:"篇",badgeEmoji:"🐉",intro:"《山海经》是古人写的一本奇妙大书，里面记了好多奇怪又可爱的神兽、神山和神话故事。这些都是古人了不起的想象力，就像今天的童话和神话传说。我们读读故事、认一认古人奇妙的世界吧！（记住哦：这些都是神话传说、古人的想象，不是真实存在的动物，也不用来指导现实。）",items:[{e:"🦊",name:"九尾狐",hi:"九条尾巴的小狐狸",fact:"传说九尾狐有九条毛茸茸的大尾巴，住在青丘山上。古人把它想成又聪明又漂亮的神奇狐狸，是想象力里的好朋友。它是神话故事里的角色，现实里没有哦。",origin:"《山海经·南山经》",quote:"古籍大意：书里说青丘山有一种狐狸，长着九条尾巴，声音像婴儿，古人把它当作祥瑞来想象。",look:"画一画你心目中的九尾狐，数数它有几条尾巴。",rhyme:"九尾狐，尾巴多，青丘山上传说活。"},{e:"🐦",name:"凤凰",hi:"会唱歌的五彩神鸟",fact:"凤凰是古人想象出的漂亮神鸟，身上有五种漂亮颜色，唱起歌来好听极了。它只在太平的好时候出现，是吉祥的想象朋友，现实里没有这种鸟。",origin:"《山海经·南山经》",quote:"古籍大意：书里说丹穴山上有一种鸟叫凤凰，身上花纹美丽，吃喝从容，是古人眼里的祥瑞之鸟。",look:"用彩笔画一只你喜欢的凤凰，说说它有几样颜色。",rhyme:"凤凰飞，彩衣飘，吉祥鸟儿传说俏。"},{e:"🐉",name:"应龙",hi:"长着翅膀的大神龙",fact:"应龙是古人想象里会飞的神龙，背上长着一对大翅膀。传说它帮大禹治水，用尾巴画出江河。它是神话里的龙，现实里没有，是古人很棒的想象。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里说应龙是有翅膀的龙，曾帮黄帝和天帝下雨打仗，后来住在南方，是古人的神奇想象。",look:"画一条带翅膀的龙，给它添上云朵和雨水。，你来说说看。",rhyme:"应龙飞，翅膀张，神话里头治水忙。"},{e:"🐉",name:"烛龙",hi:"睁眼就是白天的龙",fact:"烛龙也叫烛阴，是古人想象里超级大的神龙。传说它睁眼世界就变白天，闭眼就变黑夜，吹气变冬天，呼气变夏天。它是神话角色，现实没有。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说钟山有个神叫烛阴，身子像龙，睁眼为昼闭眼为夜，吹气成冬呼气成夏，是古人的想象。",look:"画一画烛龙，一边画太阳一边画月亮表示白天黑夜。",rhyme:"烛龙睁，天就亮，闭上眼睛夜茫茫。"},{e:"👹",name:"饕餮",hi:"贪吃贪吃的大怪兽",fact:"饕餮是古人想象里特别贪吃的大怪兽，传说它吃得太多，最后连自己身子都吃没了，只剩大嘴。它是提醒小朋友别太贪吃的神话角色，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里记了一种贪吃的怪兽，古人用它来比喻贪心的人，提醒不要太贪吃，是想象出来的故事。",look:"画一只张大嘴巴的饕餮，说说它为什么吃太多不好。",rhyme:"饕餮馋，嘴巴大，贪吃贪喝可不好。"},{e:"🐯",name:"穷奇",hi:"长着翅膀的老虎怪",fact:"穷奇是古人想象里像老虎又长翅膀的怪兽，传说它有点调皮，会帮坏人做坏事。它是神话里用来讲道理的角色，现实里没有这种动物。",origin:"《山海经·西山经》",quote:"古籍大意：书里说邽山有一种像牛的野兽叫穷奇，声音像狗，吃人，是古人想象出来的奇怪怪兽。",look:"画一画长翅膀的穷奇，说说它和老虎哪里不一样。",rhyme:"穷奇怪，翅膀长，神话老虎会飞翔。"},{e:"🌀",name:"帝江",hi:"没有脸蛋的快乐神",fact:"帝江也叫混沌，是古人想象里圆滚滚的神，没有眼睛没有脸，却喜欢唱歌跳舞。它像一个快乐的小圆球，是神话里的有趣角色，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说天山有一种神叫帝江，样子像黄口袋，红得像火，长着六只脚四只翅膀，没有脸却会歌舞。",look:"画一个快乐的小圆球，给它画上小手小脚在跳舞。",rhyme:"帝江圆，爱跳舞，没有脸蛋也幸福。"},{e:"🐦",name:"毕方",hi:"只有一只脚的神鸟",fact:"毕方是古人想象里只有一条腿的神鸟，身体是蓝色的，带红色花纹。传说它出现时容易有火，是古人用来想象火的神奇鸟，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说章莪山有一种鸟叫毕方，样子像鹤只有一只脚，是古人想象中带来火信号的神鸟。",look:"画一只单脚站立的毕方鸟，说说它为什么只一只脚。",rhyme:"毕方鸟，一只脚，神话火鸟真奇妙。"},{e:"🐗",name:"当康",hi:"带来好收成的小猪",fact:"当康是古人想象里像小猪一样的神兽，传说它一出现，庄稼就会丰收。它是古人盼望好收成的可爱想象，现实里没有这种会报喜的小猪。",origin:"《山海经·东山经》",quote:"古籍大意：书里说钦山有一种野兽叫当康，样子像小猪有牙，叫起来像喊自己名字，古人想象它预示丰收。",look:"画一只圆圆的小当康，旁边画上金黄的麦穗。",rhyme:"当康叫，丰收到，胖胖小猪真热闹。"},{e:"🦁",name:"狰",hi:"五颜六色的小怪猫",fact:"狰是古人想象里像红马又像老虎的怪兽，头上有角，身上五颜六色。传说它叫起来像敲石头。它是神话里的奇怪朋友，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说章莪山有一种兽叫狰，样子像红马，头上有角，身上花纹斑斓，是古人的想象。",look:"画一画五颜六色的狰，数数它有几种颜色。，你来说说看。",rhyme:"狰儿怪，花衣裳，神话里头放光芒。"},{e:"🐺",name:"狡",hi:"带来好运的小神兽",fact:"狡是古人想象里像狗又像豹的小兽，头上长角，身后有长毛。传说它出现时天下就会太平丰收。它是古人盼望好运的想象，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说玉山有一种兽叫狡，样子像狗有豹纹，角在耳边，古人想象它出现预示吉祥丰收。",look:"画一只带角的小狡，说说它像小狗还是像小豹。",rhyme:"小狡跑，角儿翘，带来好运真奇妙。"},{e:"🦜",name:"鸾鸟",hi:"凤凰的漂亮好朋友",fact:"鸾鸟是古人想象里像凤凰一样的神鸟，羽毛漂亮，叫声好听。传说它是凤凰的亲戚，代表快乐和吉祥。它是神话里的鸟，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说女床山有一种鸟叫鸾鸟，样子像翟鸡，身上有五彩花纹，是古人想象中的祥瑞之鸟。",look:"画一只鸾鸟，比较它和凤凰有什么相同和不同。",rhyme:"鸾鸟唱，声音甜，五彩羽毛真鲜艳。"},{e:"🐋",name:"鲲鹏",hi:"由大鱼变巨鸟的鲲",fact:"鲲鹏是古人想象里超级大的鱼，后来变成超级大的鸟。传说它一飞就飞到很远的天边。它是庄子故事里的神奇想象，现实没有这么大的鱼鸟。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记有大鱼大鸟的传说，后来庄子把它写成鲲鹏，说它变化巨大、志向高远，是古人的想象。",look:"画一条大鱼变成大鸟，给大翅膀涂上蓝色。，你来说说看。",rhyme:"鲲变鹏，飞高高，神话大鱼上云霄。"},{e:"🐐",name:"白泽",hi:"什么都知道的神兽",fact:"白泽是古人想象里雪白的神兽，传说它知道天下所有奇怪的事，还帮人认识妖怪。它是聪明博学的神话朋友，现实没有。",origin:"《山海经·海内北经》",quote:"古籍大意：书里记有神兽白泽，古人传说它通晓万物、能说人话，是想象中智慧又善良的神奇动物。",look:"画一只白白胖胖的白泽，给它画一副聪明的表情。",rhyme:"白泽白，懂很多，神话智者真不错。"},{e:"🐲",name:"貔貅",hi:"只进不出招财小兽",fact:"貔貅是古人想象里像狮子又像龙的瑞兽，传说它只吃东西不拉出来，所以被想成能聚财。它是神话里的吉祥小兽，现实没有。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记有名叫貔貅的猛兽，古人想象它凶猛又招财，是带来好运的祥瑞想象。",look:"画一只圆滚滚的貔貅，说说它为什么被想成招财。",rhyme:"貔貅胖，只管藏，神话瑞兽守钱粮。"},{e:"🦄",name:"麒麟",hi:"头顶长角的温柔兽",fact:"麒麟是古人想象里温柔的神兽，身上像鹿，头上长角，蹄子像马。传说它只在好人出现时才来。它是和平吉祥的神话朋友，现实没有。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记有仁兽麒麟一类神兽，古人想象它性情温和、不踩小草，是太平吉祥的象征。",look:"画一只带角的麒麟，说说它为什么被叫仁兽。",rhyme:"麒麟来，步子轻，温柔神兽传美名。"},{e:"🐻",name:"梼杌",hi:"顽皮又难管的小怪",fact:"梼杌是古人想象里像小老虎的顽皮怪兽，传说它又硬又难管，总是不听劝。它是神话里用来讲别太顽皮的角色，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里记有凶兽梼杌，古人把它想象成又顽劣又难教训的怪兽，用来比喻不听话的人。",look:"画一只撅着嘴的梼杌，说说小朋友为什么要听话。",rhyme:"梼杌皮，不听话，神话提醒别犯傻。"},{e:"🐷",name:"山膏",hi:"开口就爱骂人的兽",fact:"山膏是古人想象里像小猪的怪兽，传说它一开口就爱骂人。它是神话里用来逗笑、提醒讲礼貌的角色，现实没有这种小猪。",origin:"《山海经·中山经》",quote:"古籍大意：书里说苦山有一种兽叫山膏，样子像小猪，叫起来像在骂人，是古人想象中好玩的怪兽。",look:"画一只张嘴的山膏，说说骂人为什么不礼貌。",rhyme:"山膏猪，爱嘟囔，开口骂人不太好。"},{e:"🐱",name:"讙",hi:"会笑又会说话的猫",fact:"讙是古人想象里像猫一样的神兽，传说它会笑，还能像人一样说话。它有三只尾巴，是神话里有趣的小精灵，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说翼望山有一种兽叫讙，样子像狸猫，长着三只尾巴，叫起来像人在百般争辩，是想象。",look:"画一只三尾小猫讙，给它画一个笑脸。，你来说说看。",rhyme:"讙猫笑，尾巴三，神话小猫会言谈。"},{e:"🐒",name:"举父",hi:"最爱举石头的猴子",fact:"举父是古人想象里像猴子的神兽，传说它特别喜欢举着石头玩。它是神话里调皮又有力气的小猴，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说崇吾山有一种兽叫举父，样子像猿猴，胳膊上有花纹，喜欢举石头，是古人的想象。",look:"画一只举着石头的举父，说说它力气大不大。",rhyme:"举父猴，举石头，神话里头力气够。"},{e:"🐵",name:"长右",hi:"长着四只耳朵的水怪",fact:"长右是古人想象里像猴子却长着四只耳朵的怪兽，传说它一出现就会发大水。它是古人想象水灾的奇怪朋友，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里说长右山有一种兽叫长右，样子像猴子，长着四只耳朵，古人想象它出现预示水灾。",look:"画一只四只耳朵的长右，说说它和猴子哪里不同。",rhyme:"长右怪，四耳长，神话水怪名声扬。"},{e:"🦡",name:"猾褢",hi:"冬天爱睡觉的怪熊",fact:"猾褢是古人想象里像熊又没脚的怪兽，传说它冬天躲起来睡觉，春天才出来。它是神话里懒洋洋的小怪，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里说尧光山有一种兽叫猾褢，样子像人面羊身，腋下有眼，冬天蛰伏，是古人的想象。",look:"画一只卷成一团的猾褢，说说它像不像在冬眠。",rhyme:"猾褢懒，冬天眠，神话小熊睡得甜。"},{e:"🦅",name:"蛊雕",hi:"样子凶恶的吃人鸟",fact:"蛊雕是古人想象里像鹰又像雕的怪兽，传说它样子凶，会吃人。它是神话里用来讲勇敢的故事角色，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里说鹿吴山有一种兽叫蛊雕，样子像雕有角，叫声像婴儿，古人想象它很凶猛。",look:"画一只带角的蛊雕，说说童话里怎么打败怪兽。",rhyme:"蛊雕凶，角儿尖，神话鸟怪莫近前。"},{e:"🦉",name:"颙",hi:"招来旱灾的怪鸟呀",fact:"颙是古人想象里像猫头鹰的怪鸟，脑袋是方方的，传说它一出现就会大旱。它是古人想象干旱的神奇鸟，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里说令丘山有一种鸟叫颙，样子像猫头鹰，人脸四眼，古人想象它出现会闹旱灾。",look:"画一只方头四眼的颙，说说天旱时该怎么办。",rhyme:"颙鸟怪，四只眼，神话旱鸟让人烦。"},{e:"🐴",name:"䑏疏",hi:"头生独角的避火马",fact:"䑏疏是古人想象里像马一样的神兽，头上有只角，传说它能帮人避开火灾。它是神话里护身的小马，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说带山有一种兽叫䑏疏，样子像马，一只角，古人想象它能辟火防灾。",look:"画一只带角的䑏疏，说说火来了要注意什么。",rhyme:"䑏疏马，角一根，神话小马避火神。"},{e:"🐕",name:"天狗",hi:"天上抓月亮的天狗",fact:"天狗是古人想象里像大狗一样的神兽，传说它有时会去天上咬太阳和月亮，造成日食月食。它是神话角色，现实没有。",origin:"《山海经·西山经》",quote:"古籍大意：书里说阴山有一种兽叫天狗，样子像猫头鹰的狸，叫声像榴，古人想象它能御凶，是神奇动物。",look:"画一只张大嘴的天狗，说说日食月食是怎么回事。",rhyme:"天狗汪，咬月亮，神话故事真荒唐。"},{e:"🦫",name:"狸力",hi:"长翅爱挖土的猪怪",fact:"狸力是古人想象里像小猪却长着翅膀的怪兽，传说它最爱用爪子挖土。古人想象它出现就要大兴土木。现实没有这种小怪。",origin:"《山海经·南山经》",quote:"古籍大意：书里说柜山有一种兽叫狸力，样子像小猪有鸡爪，喜欢挖土，古人想象它出现预示工程动工。",look:"画一只带翅膀挖土的小狸力，说说土用来做什么。",rhyme:"狸力猪，爱挖坑，神话小怪忙不停。"},{e:"🐉",name:"九婴",hi:"九个头的喷水火怪",fact:"九婴是古人想象里长着九个头的水火怪兽，传说它能喷水也能喷火，很厉害。它是神话里被英雄打败的怪，现实没有。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记有凶兽九婴，古人想象它长着多个头，能吐水吐火，后来被羿射杀，是神奇传说。",look:"画一只九头怪九婴，说说英雄怎么打败它。，你来说说看。",rhyme:"九婴怪，头儿多，喷水喷火神话说。"},{e:"🐍",name:"巴蛇",hi:"能吞下大象的长蛇",fact:"巴蛇是古人想象里超级长的巨蛇，传说它能把一整头大象吞下去，要三年才吐骨头。它是神话里的巨蛇，现实没有这么大。",origin:"《山海经·海内南经》",quote:"古籍大意：书里说巴蛇能吞下大象，三年才吐出骨头，古人用它想象巨大的蛇，是神奇夸张的故事。",look:"画一条长长的大蛇，说说它和真蛇有什么不同。",rhyme:"巴蛇长，吞大象，神话巨蛇真夸张。"},{e:"🐍",name:"相柳",hi:"长着九个头的毒蛇",fact:"相柳是古人想象里长着九个头的毒蛇，传说它到过的地方都会变成臭水。它是神话里被大禹打败的坏怪，现实没有。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说相柳是九头蛇身的水神，所到之处变成沼泽，后来被大禹治理，是古人的想象传说。",look:"画一条九头毒蛇，说说大禹怎么对付它。，你来说说看。",rhyme:"相柳毒，九颗头，神话恶蛇水中游。"},{e:"🐊",name:"猰貐",hi:"样子奇怪的吃人怪",fact:"猰貐是古人想象里样子奇怪的吃人怪兽，传说它本来是神，后来被弄死又活过来变坏了。它是神话角色，现实没有。",origin:"《山海经·海内南经》",quote:"古籍大意：书里记有猰貐，古人想象它形状像牛马或龙首，会吃人，是神话里可怕的怪兽。",look:"画一只奇怪的猰貐，说说童话里好坏是怎么分的。",rhyme:"猰貐怪，样子凶，神话吃人让人恐。"},{e:"🐅",name:"驺吾",hi:"一天能跑千里的马",fact:"驺吾是古人想象里像大老虎一样的神兽，传说它跑得飞快，一天能跑一千里。它是神话里威风又仁慈的兽，现实没有。",origin:"《山海经·海内北经》",quote:"古籍大意：书里说林氏国有一种兽叫驺吾，样子像大虎，尾巴比身子长，一日行千里，是古人的想象。",look:"画一只长尾巴的驺吾，说说它为什么跑得快。",rhyme:"驺吾虎，尾巴长，神话神兽跑得狂。"},{e:"🐎",name:"乘黄",hi:"骑上能长寿的神马",fact:"乘黄是古人想象里像狐狸又像马的神奇兽，背上有角，传说谁骑上它就能活很久。它是神话里的想象朋友，现实没有。",origin:"《山海经·海外西经》",quote:"古籍大意：书里说白民国有一种兽叫乘黄，样子像狐狸背生角，古人想象骑它能长寿，是神奇传说。",look:"画一只带角的乘黄，说说长寿要靠什么。，你来说说看。",rhyme:"乘黄骑，寿命长，神话神马闪金光。"},{e:"🐴",name:"吉量",hi:"带来好运的吉祥马",fact:"吉量是古人想象里浑身雪白、鬃毛红黄的神奇马，传说骑上它能带来好运和长寿。它是神话里的祥瑞马，现实没有。",origin:"《山海经·海外西经》",quote:"古籍大意：书里说有一种马叫吉量，毛白红鬃，古人想象骑它能增寿，是带来吉祥的想象之马。",look:"画一匹白身子红鬃毛的吉量，说说它哪里漂亮。",rhyme:"吉量马，白又亮，神话宝马送吉祥。"},{e:"🐿️",name:"飞鼠",hi:"会在树间滑翔的鼠",fact:"飞鼠是古人想象里像老鼠却能在树间滑翔的小兽，传说它长着翅膀会飞。现实里有会滑翔的鼯鼠，但神话里的飞鼠更神奇。",origin:"《山海经·北山经》",quote:"古籍大意：书里说丹熏山有一种兽像鼠，长着翅膀能飞，叫起来像羊，是古人想象中会飞的小动物。",look:"画一只张开翅膀滑翔的小飞鼠，说说它怎么飞。",rhyme:"飞鼠小，展翅飘，神话滑翔乐逍遥。"},{e:"🐭",name:"耳鼠",hi:"想象能治肚痛的鼠",fact:"耳鼠是古人想象里像老鼠又像兔的小兽，传说它能像飞一样跑，古人还想象它能治肚子胀。但这是传说，生病要看医生哦。",origin:"《山海经·北山经》",quote:"古籍大意：书里说丹熏山有一种兽叫耳鼠，样子像鼠兔，能用尾巴飞，古人想象它可治腹胀，是传说想象。",look:"画一只长尾巴的耳鼠，说说生病为什么要看医生。",rhyme:"耳鼠乖，尾巴长，神话小兔跑得忙。"},{e:"🦅",name:"竦斯",hi:"长得像母鸡的怪鸟",fact:"竦斯是古人想象里像母鸡一样的鸟，传说它叫起来像在喊自己的名字。它是神话里普通又可爱的小鸟，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说灌题山有一种鸟叫竦斯，样子像雌鸡，长着人面的花纹，叫起来像喊自己名字，是想象。",look:"画一只像母鸡的竦斯，给它画一张小人脸。，你来说说看。",rhyme:"竦斯鸡，叫唧唧，神话小鸟真有趣。"},{e:"🦆",name:"酸与",hi:"招来恐慌的怪鸟呀",fact:"酸与是古人想象里像蛇又像鸟的怪兽，长着四只翅膀、六只眼睛、三只脚，传说它出现会让人害怕。它是神话角色，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说景山有一种鸟叫酸与，样子像蛇有四翅六眼三脚，古人想象它出现预示恐慌。",look:"画一只四翅三脚的酸与，数数它有几个眼睛。",rhyme:"酸与鸟，眼睛多，神话怪鸟真啰嗦。"},{e:"🐦",name:"瞿如",hi:"长着白脑袋的人鸟",fact:"瞿如是古人想象里长着人脸白脑袋的怪鸟，传说它叫起来像在喊自己的名字。它是神话里有趣的小鸟，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里说祷过山有一种鸟叫瞿如，长着人面白脑袋三只脚，叫起来像喊自己名字，是古人的想象。",look:"画一只白脑袋人面的瞿如，说说它像不像人。",rhyme:"瞿如鸟，白脑袋，神话人面真可爱。"},{e:"🦉",name:"鴸鸟",hi:"让人被赶走的怪鸟",fact:"鴸鸟是古人想象里像猫头鹰的怪鸟，传说它出现时，有才能的人会被赶走。它是神话里讲道理的角色，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里说柜山有一种鸟叫鴸鸟，样子像鸱鸮，红脚，古人想象它出现预示才士被放逐。",look:"画一只红脚的鴸鸟，说说为什么要有真本领。",rhyme:"鴸鸟飞，红脚爪，神话怪鸟运气糟。"},{e:"🐦",name:"灌灌",hi:"唱起歌来好听的鸟",fact:"灌灌是古人想象里像斑鸠一样的鸟，传说它的肉吃了能让人不怕妖怪，歌声也好听。但这是传说，别真去吃鸟哦。",origin:"《山海经·南山经》",quote:"古籍大意：书里说青丘山有一种鸟叫灌灌，样子像鸠，叫声像人说话，古人想象它可御妖，是传说想象。",look:"画一只唱歌的灌灌，说说真鸟能不能吃。，你来说说看。",rhyme:"灌灌唱，声音娇，神话小鸟乐陶陶。"},{e:"🐟",name:"赤鱬",hi:"长着人脸身的怪鱼",fact:"赤鱬是古人想象里长着人脸鱼身子的怪鱼，传说它的肉吃了能让人不犯困。但这是神话，鱼可不能乱吃哦。",origin:"《山海经·南山经》",quote:"古籍大意：书里说青丘山有水里的赤鱬，样子像鱼有人脸，叫声像鸳鸯，古人想象吃它能治忧愁，是传说。",look:"画一条长人脸的赤鱬，说说鱼是什么样子。，你来说说看。",rhyme:"赤鱬鱼，长人脸，神话怪鱼水中潜。"},{e:"🐟",name:"何罗鱼",hi:"一个头十个身子的鱼",fact:"何罗鱼是古人想象里一个脑袋十个身子的怪鱼，传说它叫起来像狗吠。它是神话里夸张的好玩鱼，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说谯明山的水里有何罗鱼，一个头十个身子，叫声像狗，是古人想象出来的奇怪鱼。",look:"画一条一头十身的何罗鱼，数数它有几个身子。",rhyme:"何罗鱼，身十条，神话怪鱼水上漂。"},{e:"🐠",name:"文鳐鱼",hi:"长着翅膀会飞的海鱼",fact:"文鳐鱼是古人想象里长着翅膀能飞的海鱼，传说它夜里从西海飞到东海。它是神话里浪漫的鱼，现实里没有会飞的鱼哦。",origin:"《山海经·西山经》",quote:"古籍大意：书里说观水有文鳐鱼，长着翅膀，样子像鲤鱼鸟翼，夜里飞，古人想象它见则天下丰收。",look:"画一条长翅膀飞在云间的文鳐鱼，说说它去哪。",rhyme:"文鳐鱼，翅膀张，神话飞鱼逛海洋。"},{e:"🐟",name:"䱻鱼",hi:"脑袋像牛会牛叫的鱼",fact:"䱻鱼是古人想象里长着牛样子、声音像牛叫的怪鱼，传说它出现会闹瘟疫。它是神话角色，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说带水里有䱻鱼，样子像鲤有牛头，叫声像牛，古人想象它出现预示疫病。",look:"画一条长牛头的䱻鱼，说说牛叫是什么样。，你来说说看。",rhyme:"䱻鱼牛，叫哞哞，神话怪鱼水中游。"},{e:"👵",name:"西王母",hi:"住在昆仑山的女神",fact:"西王母是古人想象里住在昆仑山上的女神，传说她管着不死的药。她是神话里慈祥又神秘的长辈，现实没有，是古人的想象。",origin:"《山海经·西山经》",quote:"古籍大意：书里说玉山住着西王母，样子像人，豹尾虎齿，善啸，古人想象她掌管灾厉与刑罚，是神话之神。",look:"画一座昆仑山，山上有位慈祥的西王母。，你来说说看。",rhyme:"西王母，住昆仑，神话女神守仙门。"},{e:"🗡️",name:"刑天",hi:"被砍了头的战神呀",fact:"刑天是古人想象里勇敢的战神，传说他被砍掉头，就把胸口的乳头当眼睛，肚脐当嘴继续战斗。他是神话里不服输的角色，现实没有。",origin:"《山海经·海外西经》",quote:"古籍大意：书里说刑天与天帝争斗被斩首，仍以乳为眼脐为口，持盾斧而舞，是古人想象中顽强的神。",look:"画一个没有头却拿着盾斧的刑天，说说他的勇敢。",rhyme:"刑天勇，无头战，神话硬汉真好看。"},{e:"🏃",name:"夸父",hi:"追赶太阳的大巨人",fact:"夸父是古人想象里高大的巨人，传说他追着太阳跑，想抓住它，最后渴得不行。他是神话里敢追梦想的角色，现实没有。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说夸父追日，渴饮河渭仍不够，最后渴死，他手杖化成桃林，是古人想象中的巨人传说。",look:"画一个奔跑的夸父追着大太阳，说说太阳有多远。",rhyme:"夸父追，太阳跑，神话巨人志气高。"},{e:"🐦",name:"精卫",hi:"天天填海的小鸟呀",fact:"精卫是古人想象里的小鸟，传说是炎帝女儿女娃变的，她淹死在大海里，就天天叼石子想填平海。她是神话里坚持的小英雄，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说发鸠山有鸟叫精卫，是女娃溺于东海所化，常衔木石填海，是古人想象中坚持的化身。",look:"画一只小鸟叼着小石子飞向大海，说说坚持是什么。",rhyme:"精卫鸟，衔石忙，神话填海情意长。"},{e:"👷",name:"大禹",hi:"治水的英雄大禹呀",fact:"大禹是古人想象里治水的英雄，传说他不怕辛苦，挖河道把洪水引走，三过家门都不进。他是神话里的好榜样，现实里大禹是传说人物。",origin:"《山海经·海内经》",quote:"古籍大意：书里说鲧禹父子治水，禹疏通河道平定水土，是古人传颂的治水英雄，属于神话与历史交织的想象。",look:"画大禹拿着工具挖河道，说说水要往哪里流。",rhyme:"大禹忙，治水长，神话英雄美名扬。"},{e:"🌟",name:"女娲",hi:"造人又补天的女神",fact:"女娲是古人想象里温柔的女神，传说她用泥土造了人，又补好了破掉的天。她是神话里又聪明又善良的母亲，现实没有。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里提到女娲之肠化成神，古人传说她抟土造人、炼石补天，是想象中创造与拯救的女神。",look:"画女娲在补天上的破洞，说说天为什么不能破。",rhyme:"女娲巧，补青天，神话造人万万年。"},{e:"🌿",name:"句芒",hi:"掌管春天的木神呀",fact:"句芒是古人想象里管春天和树木的神，传说他长着人脸鸟身，给大地带来绿芽。他是神话里温柔的春神，现实没有。",origin:"《山海经·海外东经》",quote:"古籍大意：书里说东方有神句芒，人脸鸟身，古人想象他掌管春天与草木生长，是春天的象征。",look:"画一棵刚发芽的小树，旁边站着鸟身的句芒。",rhyme:"句芒来，春天到，神话绿芽满地笑。"},{e:"🔥",name:"祝融",hi:"管火的红脸火神呀",fact:"祝融是古人想象里管火的神，传说他坐着两条龙，给人们带来温暖和熟食。他是神话里的火神，现实没有。",origin:"《山海经·海外南经》",quote:"古籍大意：书里说南方有神祝融，兽身人面乘两龙，古人想象他掌管火与光明，是火的象征。",look:"画一个红红的祝融骑着小龙，说说火有什么用。",rhyme:"祝融红，火苗跳，神话火神暖怀抱。"},{e:"🌊",name:"共工",hi:"一生气撞山的神呀",fact:"共工是古人想象里管水的神，传说他一生气就撞断了不周山，让天塌了一角。他是神话里脾气大的角色，现实没有。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里记共工之臣相柳等，古人传说共工怒触不周山致天倾，是想象中水神发怒的故事。",look:"画一座歪掉的山，说说生气时要不要撞东西。",rhyme:"共工怒，撞高山，神话水神惹祸端。"},{e:"⛰️",name:"后土",hi:"掌管大地的大神呀",fact:"后土是古人想象里管大地和土壤的神，传说他让土地长出庄稼，养活大家。他是神话里厚道的大地之神，现实没有。",origin:"《山海经·海内经》",quote:"古籍大意：书里记后土生信等，古人想象后土为大地之神，掌管土壤与农耕，是尊崇土地的象征。",look:"画一片长满庄稼的土地，谢谢大地妈妈。，你来说说看。",rhyme:"后土宽，大地暖，神话厚土养万物。"},{e:"🍂",name:"蓐收",hi:"掌管秋天的金神呀",fact:"蓐收是古人想象里管秋天和金属的西方神，传说他左耳挂着蛇，给人带来丰收的金色。他是神话里的秋神，现实没有。",origin:"《山海经·海外西经》",quote:"古籍大意：书里说西方有神蓐收，人脸虎爪执钺，古人想象他掌管秋天与收割，是金色季节的象征。",look:"画一片金黄的稻田，旁边站着蓐收。，你来说说看。",rhyme:"蓐收到，秋天黄，神话金神收粮忙。"},{e:"🌬️",name:"禺强",hi:"掌管北风的海神呀",fact:"禺强是古人想象里管北方和大海的风神，传说他有时是人面鸟身，有时是鱼身。他是神话里的北神，现实没有。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说北方有神禺强，人面鸟身或鱼身，古人想象他掌管北海与北风，是北方的象征。",look:"画一阵北风吹动海浪，旁边画禺强。，你来说说看。",rhyme:"禺强吹，北风凉，神话海神守北方。"},{e:"👑",name:"帝俊",hi:"管天界的大家长呀",fact:"帝俊是古人想象里天上的大神，传说他有好几个厉害的孩子，像太阳月亮的妈妈爸爸。他是神话里的天神长辈，现实没有。",origin:"《山海经·大荒东经》",quote:"古籍大意：书里说帝俊娶羲和生十日、娶常羲生十二月，古人想象他为天界之祖，是创造日月之神。",look:"画一个戴皇冠的帝俊，周围有太阳和月亮。，你来说说看。",rhyme:"帝俊坐，管天上，神话天神福满堂。"},{e:"☀️",name:"羲和",hi:"太阳的妈妈羲和呀",fact:"羲和是古人想象里太阳的妈妈，传说她每天赶着太阳车，把十个太阳轮流送上天。她是神话里温暖的母亲，现实没有。",origin:"《山海经·大荒南经》",quote:"古籍大意：书里说羲和生十日，是古人心中的日母，想象她驾车驭日，是太阳出自东方的神话。",look:"画一辆太阳车，羲和赶着太阳出来。，你来说说看。",rhyme:"羲和娘，赶太阳，神话日车亮堂堂。"},{e:"🌙",name:"常羲",hi:"月亮的妈妈常羲呀",fact:"常羲是古人想象里月亮的妈妈，传说她生了十二个月亮，轮流挂在夜空。她是神话里安静的母亲，现实没有。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里说常羲生十二月，古人想象她为月母，掌管月亮的圆缺，是夜晚的神话之神。",look:"画一轮圆月亮，旁边站着常羲。，你来说说看。",rhyme:"常羲柔，月儿圆，神话月母守夜晚。"},{e:"🛡️",name:"黄帝",hi:"善于打仗的祖先呀",fact:"黄帝是古人想象里厉害的部落首领，传说他打败了蚩尤，还发明了很多好东西。他是神话里的英雄祖先，现实里是传说人物。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记黄帝与蚩尤大战，应龙助之，古人传说黄帝是中央天帝与人文始祖，是英雄想象。",look:"画黄帝拿着武器站在战车上，说说勇敢是什么。",rhyme:"黄帝强，战蚩尤，神话祖先美名留。"},{e:"⚔️",name:"蚩尤",hi:"铜头铁臂的大战神",fact:"蚩尤是古人想象里勇猛的战神，传说他头上长角，铜头铁臂，和黄帝打仗很厉害。他是神话里的对手角色，现实没有。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记蚩尤作兵伐黄帝，纵大风雨，古人想象他勇猛善战，是神话中黄帝的对手。",look:"画一个头长角的蚩尤，说说比赛有输赢。，你来说说看。",rhyme:"蚩尤猛，角儿尖，神话战神敢向前。"},{e:"🌞",name:"旱魃",hi:"带来干旱的女神呀",fact:"旱魃是古人想象里带来干旱的女神，传说她一出现，天上就不下雨，田地都干裂。她是神话角色，现实里干旱是自然现象。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记黄帝女魃止雨助战，后人想象她所居不雨，是古人解释旱灾的神话形象。",look:"画一片干裂的土地，说说下雨多重要。，你来说说看。",rhyme:"旱魃来，雨不下，神话干旱真可怕。"},{e:"⚡",name:"雷神",hi:"敲肚子打雷的神呀",fact:"雷神是古人想象里管打雷的神，传说他长着龙身人头，一敲肚子就隆隆响。他是神话里热闹的神，现实里雷是天气现象。",origin:"《山海经·海内东经》",quote:"古籍大意：书里说雷泽有雷神，龙身人头，鼓其腹则雷，是古人想象雷声来源的神奇之神。",look:"画一个龙身人头的雷神敲肚子，说说雷声从哪来。",rhyme:"雷神敲，轰隆隆，神话打雷震长空。"},{e:"🌗",name:"烛阴",hi:"管昼夜的光明神呀",fact:"烛阴就是烛龙，是古人想象里超级大的神，睁眼变白天，闭眼变黑夜。他是神话里的光明之神，现实没有。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说钟山之神烛阴，睁眼为昼闭眼为夜，吹气成冬呼气成夏，是古人想象的光明之神。",look:"画烛阴一只眼张开一只眼闭上，表示昼夜。，你来说说看。",rhyme:"烛阴神，管昼夜，神话光明永不灭。"},{e:"🌅",name:"夸父逐日",hi:"勇敢巨人追太阳呀",fact:"夸父逐日是古人想象的神话故事，讲巨人夸父追着太阳跑，想把它抓住，结果渴得厉害。这是古人对勇敢追梦的想象，现实没有。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说夸父与日逐走，渴欲饮水，最终实现愿望化作桃林，是古人想象中追逐光明的故事。",look:"画夸父伸着手追大太阳，说说你最想追什么。",rhyme:"追太阳，志气豪，神话故事真逍遥。"},{e:"🌊",name:"精卫填海",hi:"小鸟坚持填大海呀",fact:"精卫填海是古人想象的神话，讲小鸟精卫天天叼石子想填平大海，因为大海淹死了她。这是讲坚持的想象故事，现实没有。",origin:"《山海经·北山经》",quote:"古籍大意：书里说女娃溺于东海化为精卫，常衔木石以填海，是古人想象中不畏艰难的故事。",look:"画精卫飞在浪花上叼石子，说说坚持有什么用。",rhyme:"填大海，不停休，神话小鸟记心头。"},{e:"💧",name:"大禹治水",hi:"英雄挖河道治水呀",fact:"大禹治水是古人想象的神话，讲大禹不怕累，挖开河道把洪水引回大海，救了大家。这是讲智慧勤劳的想象，现实中大禹是传说。",origin:"《山海经·海内经》",quote:"古籍大意：书里说禹卒布土定九州，疏通洪水，是古人传颂的治水故事，想象中智慧与奉献的英雄。",look:"画大禹指挥水流进河里，说说水要流去哪。，你来说说看。",rhyme:"治水患，挖河道，神话英雄本领高。"},{e:"🛡️",name:"刑天舞干戚",hi:"没了头还舞干戚呀",fact:"刑天舞干戚是古人想象的神话，讲刑天被砍了头，还用乳头当眼、肚脐当嘴，挥着盾和斧跳舞战斗。这是讲不服输的想象。",origin:"《山海经·海外西经》",quote:"古籍大意：书里说刑天与帝争神被斩首，乃以乳为目脐为口，操干戚以舞，是古人想象中顽强的象征。",look:"画刑天舞动盾和斧，说说什么是勇敢不退缩。",rhyme:"舞干戚，斗志昂，神话硬汉永流芳。"},{e:"🌈",name:"女娲补天",hi:"炼石补天上的洞呀",fact:"女娲补天是古人想象的神话，讲天破了个大洞，女娲炼出五彩石把天补好，又斩龟脚撑天。这是讲善良拯救的想象。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里提及女娲，古人传说她炼五色石补天、断鳌足立四极，是想象中拯救世界的女神。",look:"画女娲举着五彩石补天上的洞，说说天为什么重要。",rhyme:"补苍天，五彩石，神话女神显仁慈。"},{e:"⛰️",name:"共工怒触不周山",hi:"水神撞断天柱山呀",fact:"共工怒触不周山是古人想象的神话，讲水神共工一生气，用头撞断了撑天的不周山，天就塌了一边。这是讲脾气要控制的想象。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里记共工之臣相柳，古人传说共工怒触不周山使天柱折，是想象中解释天倾地斜的故事。",look:"画歪倒的不周山和塌了一角的天，说说生气不能乱撞。",rhyme:"撞不周，天柱折，神话水神太暴烈。"},{e:"⚔️",name:"黄帝战蚩尤",hi:"黄帝蚩尤大决战呀",fact:"黄帝战蚩尤是古人想象的神话大战，讲黄帝带着应龙，和铜头铁臂的蚩尤打了一仗，最后赢了。这是讲正义勇敢的想象。",origin:"《山海经·大荒北经》",quote:"古籍大意：书里记黄帝与蚩尤战于冀州，应龙蓄水、黄帝请旱魃，古人想象这场远古大战。",look:"画黄帝和应龙一起对战蚩尤，说说团结的力量。",rhyme:"战蚩尤，靠齐心，神话大战定乾坤。"},{e:"🌊",name:"鲧禹治水",hi:"父子接力治洪水呀",fact:"鲧禹治水是古人想象的神话，讲鲧先偷土堵水没成功，儿子禹改用疏导终于治好。这是讲方法要对的想象，现实里是传说。",origin:"《山海经·海内经》",quote:"古籍大意：书里说鲧窃息壤堙洪水被杀，其子禹继之疏导而定水，是古人想象中父子治水的传说。",look:"画堵水和挖河两种方法，说说哪种更好。，你来说说看。",rhyme:"父子俩，治水忙，神话疏导胜硬挡。"},{e:"☀️",name:"十日并出",hi:"十个太阳一起出呀",fact:"十日并出是古人想象的神话，讲天上一齐冒出十个太阳，把大地烤得冒烟，后来被英雄射下九个。这是讲酷热想象的传说。",origin:"《山海经·大荒南经》",quote:"古籍大意：书里说帝俊妻羲和生十日，古人传说曾十日并出草木焦枯，后羿射落其九，是想象故事。",look:"画天上十个太阳，说说一个太阳就够了。，你来说说看。",rhyme:"十日出，大地焦，神话酷热真难熬。"},{e:"🌞",name:"女丑之尸",hi:"为求雨晒死的巫女",fact:"女丑之尸是古人想象的神话，讲巫女女丑为了求雨被晒死，化成旱灾里的身影。这是古人解释干旱的想象，现实里求雨不科学。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里说女丑之尸，古人想象她因求雨而曝于十日下，是解释旱灾的神话形象，并非真实。",look:"画一个巫女举着手求雨，说说现在怎么应对干旱。",rhyme:"女丑巫，求雨忙，神话旱景太凄凉。"},{e:"👑",name:"夏后启",hi:"从天上取回乐谱呀",fact:"夏后启是古人想象里夏朝的王，传说他三次上天，把天上的乐曲和跳舞带了回来给大家。他是神话里会分享快乐的王，现实是传说人物。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里说夏后启三嫔于天得九辩九歌，古人想象他从天帝处带回乐章，是神奇传说。",look:"画启从天梯上捧着乐谱下来，说说音乐的好处。",rhyme:"夏后启，上天庭，神话乐谱带给人。"},{e:"🧍",name:"大人国",hi:"个子特别高的人呀",fact:"大人国是古人想象里国民都超级高大的国家，传说他们一个比一个魁梧。这是古人对远方异域的想象，现实没有这种国。",origin:"《山海经·海外东经》",quote:"古籍大意：书里说海外有大人之国，人身长大，古人想象远方有身高异常的人，是异域奇谈。",look:"画一个比树还高的大人，说说高个子有什么方便。",rhyme:"大人国，个子高，神话巨人真自豪。"},{e:"🐜",name:"小人国",hi:"全身只有拇指大小",fact:"小人国是古人想象里国民都只有手指大的国家，传说他们住在小小的家里。这是古人对微小世界的想象，现实没有。",origin:"《山海经·海外南经》",quote:"古籍大意：书里说海外有小人国，身形极小，古人想象远方有娇小的人，是好玩的异域传说。",look:"画一群手指大的小人，说说小也有小的可爱。",rhyme:"小人国，小又巧，神话迷你真好玩。"},{e:"🌿",name:"不死民",hi:"永远不老不死的人",fact:"不死民是古人想象里永远不老不死的人，传说他们住在东方，吃了不死树就不老。这是古人对长生的想象，现实没有。",origin:"《山海经·海外南经》",quote:"古籍大意：书里说有不死之民，古人想象他们长寿不死，是表达对生命长久的向往，属于神话。",look:"画一棵不死树，旁边站着笑呵呵的不死民。，你来说说看。",rhyme:"不死民，笑呵呵，神话长生意向多。"},{e:"🦾",name:"一臂国",hi:"生来一只手的人呀",fact:"一臂国是古人想象里国民都只有一只手一只眼的国家，传说他们很团结一起做事。这是古人对奇趣异域的想象，现实没有。",origin:"《山海经·海外西经》",quote:"古籍大意：书里说一臂国的人一臂一目一鼻孔，古人想象远方有奇特身体的人，是异域奇谈。",look:"画一个单手单眼的人，说说团结怎么做事。，你来说说看。",rhyme:"一臂国，一只手，神话齐心样样有。"},{e:"⛰️",name:"昆仑山",hi:"神仙居住的大山呀",fact:"昆仑山是真实存在的山，在西部很高很大。古人把想象的神住在这里，说西王母就在山上。神话故事安在真山上，现实里它是真山。",origin:"《山海经·西山经》",quote:"古籍大意：书里说昆仑是帝之下都，方圆八百里，上有神兽仙人，是古人想象中神仙居住的圣山。",look:"画一座高高的雪山，想象山顶住着神仙。，你来说说看。",rhyme:"昆仑高，神仙家，神话圣山人人夸。"},{e:"🏔️",name:"不周山",hi:"被撞歪的天柱山呀",fact:"不周山是古人想象里撑着天的大柱子山，传说被共工撞歪了，天就塌了一角。它是神话里的山，现实没有这根天柱。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里说不周山有风，古人想象它是撑天之柱，被共工撞折致天倾，是神话中的山。",look:"画一座歪着身子的山，说说天为什么还好好在。",rhyme:"不周山，被撞歪，神话天柱真奇怪。"},{e:"🏝️",name:"蓬莱",hi:"海上漂的神仙岛呀",fact:"蓬莱是古人想象里漂浮在海上的神仙岛，传说岛上有长生不老的药。它是神话里的仙境，现实里没有这座会漂的岛。",origin:"《山海经·海内北经》",quote:"古籍大意：书里记有蓬莱等海中神山，古人在想象中把它们写成仙人住的不老之岛，是神话仙境。",look:"画海上飘着一座小岛，岛上长着仙草。，你来说说看。",rhyme:"蓬莱岛，海上飘，神话仙境真奇妙。"},{e:"🦊",name:"青丘",hi:"九尾狐居住的山呀",fact:"青丘是古人想象里的一座山，传说九尾狐就住在那里，山里还出好人。它是神话里的山，现实里没有这座狐狸山。",origin:"《山海经·南山经》",quote:"古籍大意：书里说青丘之山有九尾狐，古人想象这是祥瑞出没之地，是神话中的灵山。",look:"画一座绿色小山，山洞里住着九尾狐。，你来说说看。",rhyme:"青丘山，绿油油，神话狐仙乐悠悠。"},{e:"🌊",name:"弱水",hi:"羽毛都浮不起的水",fact:"弱水是古人想象里一种奇怪的河，传说连羽毛掉上去都会沉，谁也过不去。它是神话里的河，现实里没有这种水。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里说昆仑有弱水，古人想象它连羽毛都浮不起，是神话中难以渡过的水。",look:"画一条河，河上漂不了任何东西，说说为什么。",rhyme:"弱水河，沉羽毛，神话怪水真难渡。"},{e:"🏜️",name:"流沙",hi:"像河一样流的沙呀",fact:"流沙是古人想象里像河一样流动的沙地，传说人和车一上去就陷下去。它是神话里的险地，现实里沙漠真有流沙但要小心。",origin:"《山海经·大荒西经》",quote:"古籍大意：书里说流沙出昆仑，古人想象沙像水一样会流动淹没，是神话中的险阻之地。",look:"画一片会流动的沙，说说在沙漠要注意什么。",rhyme:"流沙动，像河跑，神话沙海真难熬。"},{e:"🌋",name:"丹穴山",hi:"凤凰出生的灵山呀",fact:"丹穴山是古人想象里的一座山，传说漂亮的凤凰就出生在这里，山里还产好丹砂。它是神话里的山，现实没有这座凤凰山。",origin:"《山海经·南山经》",quote:"古籍大意：书里说丹穴之山有凤凰，古人想象这是祥瑞之鸟出没的灵山，属神话地理。",look:"画一座红色的山，山顶停着凤凰。，你来说说看。",rhyme:"丹穴山，红艳艳，神话凤凰落山巅。"},{e:"⛰️",name:"钟山",hi:"烛龙居住的神山呀",fact:"钟山是古人想象里的一座大山，传说神烛龙就住在这里，睁眼闭眼管着昼夜。它是神话里的山，现实没有这座神山。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说钟山之神烛阴居此，古人想象他掌管昼夜四季，是神话中的神山。",look:"画一座大山，山里睡着管昼夜的烛龙。，你来说说看。",rhyme:"钟山深，烛龙眠，神话昼夜它来管。"},{e:"🌿",name:"招摇山",hi:"书中排第一的山呀",fact:"招摇山是古人写在书里第一座山，传说山上长着一种叫迷谷的树，戴着它的花就不会迷路。它是神话里的山，现实没有。",origin:"《山海经·南山经》",quote:"古籍大意：书里开篇说招摇山有迷谷树，古人想象戴其花不迷路，是神话中奇妙的开篇之山。",look:"画一座山长着发光的小树，说说迷路怎么办。",rhyme:"招摇山，排第一，神话迷谷不迷离。"},{e:"🐒",name:"崇吾山",hi:"神兽举父住的山呀",fact:"崇吾山是古人想象里的一座山，传说喜欢举石头的神兽举父就住在这里。它是神话里的山，现实没有这座山。",origin:"《山海经·西山经》",quote:"古籍大意：书里说崇吾山有举父，古人想象这是猿猴状神兽出没的山，属神话地理。",look:"画一座山，山里举父正举着石头玩。，你来说说看。",rhyme:"崇吾山，举父闹，神话小猴爱举石。"},{e:"🌟",name:"槐江山",hi:"神仙游玩的花园山",fact:"槐江山是古人想象里一座开满花、像神仙花园的山，传说天神常来游玩。它是神话里的山，现实没有这座花园山。",origin:"《山海经·西山经》",quote:"古籍大意：书里说槐江山是黄帝的平圃，古人想象这是神仙嬉戏的花园山，属神话之地。",look:"画一座开满花的小山，想象天神在散步。，你来说说看。",rhyme:"槐江山，花满坡，神话花园神仙乐。"},{e:"🐦",name:"发鸠山",hi:"小鸟精卫的家乡山",fact:"发鸠山是古人想象里的一座山，传说小鸟精卫就在这里出生，山上有很多柘树。它是神话里的山，现实没有这座精卫山。",origin:"《山海经·北山经》",quote:"古籍大意：书里说发鸠山有精卫鸟，是女娃所化，古人想象这是坚持填海的小鸟故乡。",look:"画一座山长着柘树，精卫从山里飞出。，你来说说看。",rhyme:"发鸠山，柘树多，神话精卫出此坡。"},{e:"⛰️",name:"华山",hi:"险峻的西岳华山呀",fact:"华山是真实存在的大山，又高又陡，在陕西。古人把想象的故事安在这里，说它是西方的神山。现实里华山真存在，很险峻。",origin:"《山海经·西山经》",quote:"古籍大意：书里记华山，古人想象它为西方险峻之山，是现实名山被写入神话地理。",look:"画一座陡峭的高山，说说爬山要注意安全。，你来说说看。",rhyme:"华山险，插云霄，神话现实一样高。"},{e:"⛰️",name:"泰山",hi:"东方的圣山泰山呀",fact:"泰山是真实存在的大山，在山东，很高很威风。古人把想象的故事安在这里，说它是东方的神山。现实里泰山真存在。",origin:"《山海经·东山经》",quote:"古籍大意：书里记泰山，古人想象它为东方圣山，现实是真实名山，被赋予神话色彩。",look:"画一座雄伟的大山，说说你听说过泰山吗。，你来说说看。",rhyme:"泰山雄，立东方，神话现实共辉煌。"},{e:"⛰️",name:"太行山",hi:"长长的巨人山脉呀",fact:"太行山是真实存在的大山，又长又大，横跨好几个省。古人把想象的故事安在这里。现实里太行山真存在，很壮观。",origin:"《山海经·北山经》",quote:"古籍大意：书里记太行山，古人想象它为北方绵延的巨山，是真实山脉被写入神话地理。",look:"画一条长长的山脉，说说山连着山像什么。，你来说说看。",rhyme:"太行长，连成排，神话巨岭真气派。"},{e:"🌊",name:"东海",hi:"太阳升起的大海呀",fact:"东海是真实存在的海，在我国的东边，太阳从海里升起。古人把精卫填海等想象故事安在这里。现实里东海真存在。",origin:"《山海经·海外东经》",quote:"古籍大意：书里说东海之外有大壑，古人想象太阳从这里升起，并把精卫等故事安在东海，属神话地理。",look:"画一片大海，太阳正从海里跳出来。，你来说说看。",rhyme:"东海宽，日升起，神话现实都欢喜。"},{e:"🌊",name:"南海",hi:"温暖宽阔的大海呀",fact:"南海是真实存在的海，在我国的南边，水暖鱼多。古人把想象里奇怪的国家和鱼安在这里。现实里南海真存在。",origin:"《山海经·海外南经》",quote:"古籍大意：书里记南海之外有诸国异兽，古人想象南方海外充满奇谈，是真实海域加神话。",look:"画一片暖暖的海，说说海里有什么动物。，你来说说看。",rhyme:"南海暖，鱼成群，神话奇谈海中寻。"},{e:"🌊",name:"北海",hi:"北方寒冷的大海呀",fact:"北海是古人想象里在很北边的大海，传说冰天雪地，有奇怪的鱼和神。现实里北方真有冷海，但神话里的北海更神奇。",origin:"《山海经·海外北经》",quote:"古籍大意：书里说北海有鲲等巨物，古人想象北方严寒之海充满神奇，是神话地理。",look:"画一片结着冰的海，想象里面有巨鱼。，你来说说看。",rhyme:"北海冷，冰满洋，神话巨鱼里面藏。"},{e:"🌑",name:"幽都山",hi:"黑暗的鬼山幽都呀",fact:"幽都山是古人想象里在北方极黑的山，传说那里的人都是黑皮肤，连动物都是黑的。它是神话里的山，现实没有这座黑山。",origin:"《山海经·海内经》",quote:"古籍大意：书里说幽都山在北海之内，其人有黑特征，古人想象这是极北黑暗之地，属神话。",look:"画一座黑黑的山，山里动物都是黑的。，你来说说看。",rhyme:"幽都山，黑茫茫，神话北地好荒凉。"},{e:"🌾",name:"都广之野",hi:"神仙的肥沃田地呀",fact:"都广之野是古人想象里一片肥沃的原野，传说这里是天地的中心，种什么长什么。它是神话里的好地方，现实没有这片野。",origin:"《山海经·海内经》",quote:"古籍大意：书里说都广之野是天地之中，百谷自生，古人想象这是神仙的丰收原野，属神话地理。",look:"画一片长满庄稼的原野，想象是天地中心。，你来说说看。",rhyme:"都广野，五谷香，神话沃土满粮仓。"}]}]
    }
  };
