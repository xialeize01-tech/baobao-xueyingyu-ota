<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>快乐学英语 · 6岁宝宝英语乐园</title>
<style>
  :root{
    --cream:#FFFAF0;
    --yellow:#FFC857;
    --coral:#FF8C7A;
    --blue:#6BB6E0;
    --green:#7BB661;
    --purple:#A78BFA;
    --ink:#2A2A2A;
    --gray:#5C5147;
    --cta:#FF7B25;
    --card-shadow:0 10px 24px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Quicksand",-apple-system,"PingFang SC",sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #FFF3D6 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #FFE3DA 0%, transparent 55%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  .floaty{position:fixed;border-radius:50%;filter:blur(2px);opacity:.35;z-index:0;pointer-events:none;animation:bob 7s ease-in-out infinite;}
  .floaty.f1{width:120px;height:120px;background:var(--yellow);top:12%;left:6%;}
  .floaty.f2{width:90px;height:90px;background:var(--coral);top:70%;left:4%;animation-delay:1.5s;}
  .floaty.f3{width:140px;height:140px;background:var(--blue);top:20%;right:5%;animation-delay:.8s;}
  .floaty.f4{width:80px;height:80px;background:var(--green);bottom:10%;right:9%;animation-delay:2.2s;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-22px);}}

  .app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 20px 120px;}

  /* ---------- HOME ---------- */
  .home-head{text-align:center;margin-bottom:8px;}
  .home-head .kicker{display:inline-block;font-size:14px;font-weight:600;color:var(--cta);
    background:#fff;border:2px solid #FFE0CC;border-radius:999px;padding:6px 16px;margin-bottom:14px;
    box-shadow:var(--card-shadow);}
  .home-head h1{font-size:40px;font-weight:700;line-height:1.15;margin-bottom:10px;}
  .home-head h1 .hl{color:var(--cta);}
  .home-head p{font-size:16px;color:var(--gray);font-weight:500;}

  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;}
  @media(max-width:760px){.theme-grid{grid-template-columns:repeat(2,1fr);}}

  .theme-card{
    background:#fff;border-radius:28px;padding:26px 18px 22px;text-align:center;
    box-shadow:var(--card-shadow);cursor:pointer;position:relative;overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
    border:3px solid transparent;
  }
  .theme-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 18px 36px rgba(0,0,0,.12);}
  .theme-card:active{transform:translateY(-2px) scale(.99);}
  .theme-card .big-emoji{font-size:60px;line-height:1;margin-bottom:14px;display:block;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));}
  .theme-card .tc-name{font-size:22px;font-weight:700;margin-bottom:4px;}
  .theme-card .tc-sub{font-size:13px;font-weight:600;color:var(--gray);}
  .theme-card .go{margin-top:14px;display:inline-block;font-size:13px;font-weight:700;color:#fff;
    background:var(--cta);border-radius:999px;padding:7px 16px;}
  .theme-card .ribbon{position:absolute;top:14px;right:-30px;transform:rotate(38deg);
    font-size:11px;font-weight:700;color:#fff;background:var(--yellow);padding:4px 36px;}

  /* ---------- DETAIL ---------- */
  .detail{display:none;}
  .detail.active{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  .back{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:none;
    background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;
    padding:10px 18px;border-radius:999px;box-shadow:var(--card-shadow);transition:transform .15s;}
  .back:hover{transform:translateX(-4px);}

  .banner{border-radius:32px;padding:30px 28px;margin:20px 0 8px;color:#fff;
    display:flex;align-items:center;gap:22px;box-shadow:var(--card-shadow);position:relative;overflow:hidden;}
  .banner .b-emoji{font-size:72px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));}
  .banner .b-title{font-size:32px;font-weight:700;}
  .banner .b-sub{font-size:16px;font-weight:600;opacity:.95;margin-top:4px;}
  .banner .b-badge{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;
    padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px;}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);}}

  /* 国文学习：作者搜索 + 作者标签 */
  .poem-search{margin-top:22px;background:#fff;border-radius:24px;padding:18px 18px 16px;box-shadow:var(--card-shadow);}
  .ps-input{width:100%;border:2px solid #E7E1F5;border-radius:16px;padding:14px 16px;font-size:16px;
    font-family:inherit;color:#4A4063;outline:none;transition:border-color .15s;}
  .ps-input:focus{border-color:#6C5CE7;}
  .ps-input::placeholder{color:#B7AED0;}
  .author-chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px;}
  .achip{cursor:pointer;user-select:none;border:2px solid #E7E1F5;background:#F6F3FD;color:#6C5CE7;
    border-radius:999px;padding:8px 15px;font-size:14px;font-weight:700;transition:all .14s;}
  .achip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(108,92,231,.22);}
  .achip.active{background:#6C5CE7;color:#fff;border-color:#6C5CE7;}
  .empty{grid-column:1/-1;text-align:center;color:#9A8FB0;font-weight:600;padding:40px 0;}

  .wc{background:#fff;border-radius:24px;padding:22px 12px 18px;text-align:center;
    box-shadow:var(--card-shadow);transition:transform .15s ease;cursor:pointer;}
  .wc:hover{transform:translateY(-6px) rotate(-1deg);}
  .wc:active{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.07);}100%{transform:scale(1);}}
  .wc .circle{width:108px;height:108px;border-radius:28px;margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-size:54px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);}
  .wc .word{font-size:21px;font-weight:700;}
  .wc .mean{font-size:13px;font-weight:600;margin-top:3px;opacity:.85;}
  /* 罗马音 / 拼音提示（韩语·日语发音学习） */
  .wc .rom{font-size:12px;color:#8a8a8a;margin-top:2px;font-style:italic;letter-spacing:.3px;}
  .wc .tap{margin-top:9px;font-size:11px;font-weight:700;color:#C9BFB4;
    display:flex;align-items:center;justify-content:center;gap:3px;}
  /* 日常口语按钮 */
  .wc .sent{margin-top:7px;padding:7px 8px;border-radius:14px;background:#FFF7E8;
    border:1.5px dashed #FFD79A;cursor:pointer;transition:transform .12s ease, background .12s;}
  .wc .sent:hover{background:#FFEFD2;transform:scale(1.02);}
  .wc .sent:active{transform:scale(.97);}
  .wc .sent-btn{display:block;font-size:11px;font-weight:700;color:#E08A1E;
    display:flex;align-items:center;justify-content:center;gap:3px;}
  .wc .sent-txt{display:block;margin-top:3px;font-size:10.5px;font-weight:600;
    color:#9A8C7A;line-height:1.35;}
  .grid-letters{grid-template-columns:repeat(7,1fr);gap:14px;}
  @media(max-width:760px){.grid-letters{grid-template-columns:repeat(4,1fr);}}
  .wc .circle.letter-circle{font-size:38px;font-weight:700;line-height:1;letter-spacing:1px;}

  /* ---------- 天文科学 板块 ---------- */
  .astro-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 2px;}
  .astro-tab{flex:1 1 0;min-width:88px;border:none;border-radius:16px;padding:12px 8px;
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
    background:#F2F0FB;color:#5B6BD6;transition:transform .12s, background .12s;}
  .astro-tab .te{font-size:26px;display:block;margin-bottom:3px;}
  .astro-tab.active{background:#5B6BD6;color:#fff;box-shadow:0 6px 16px rgba(91,107,214,.35);}
  .astro-tab:active{transform:scale(.96);}
  .astro-sec-title{font-size:15px;font-weight:800;color:#5B6BD6;margin:16px 4px 0;}
  .grid-astro{grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:760px){.grid-astro{grid-template-columns:repeat(2,1fr);}}
  .wc .fact{margin-top:8px;font-size:11.5px;font-weight:600;line-height:1.4;
    color:#6f6f6f;background:#F5F3FF;border-radius:12px;padding:7px 9px;text-align:left;}

  .foot{text-align:center;margin-top:50px;font-size:13px;font-weight:600;color:var(--gray);opacity:.8;}

  /* ---------- 版本 / 在线更新 ---------- */
  .verbar{display:flex;align-items:center;justify-content:center;gap:10px;
    margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--gray);opacity:.75;}
  .verbtn{border:1.5px solid rgba(92,81,71,.28);background:transparent;color:var(--gray);
    font-family:inherit;font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;cursor:pointer;}
  .verbtn:active{transform:scale(.95);}
  .verbtn[disabled]{opacity:.5;}
  /* ---------- OTA 更新弹窗（居中模态框） ---------- */
  .ota-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
    display:none;align-items:center;justify-content:center;
    animation:otaFadeIn .25s ease;}
  .ota-backdrop.show{display:flex;}
  .ota-modal{background:#fff;border-radius:24px;padding:28px 24px 22px;
    width:280px;max-width:80vw;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.22),0 8px 20px rgba(0,0,0,.12);}
  .ota-emoji{font-size:44px;line-height:1;margin-bottom:8px;}
  .ota-title{font-size:18px;font-weight:800;color:#2A2A2A;margin-bottom:4px;}
  .ota-body{font-size:14px;color:#666;line-height:1.5;margin-bottom:18px;}
  .oa-btn{display:inline-block;border:none;border-radius:999px;background:var(--cta);color:#fff;
    font-family:inherit;font-size:15px;font-weight:800;padding:11px 32px;cursor:pointer;
    box-shadow:0 4px 14px rgba(255,123,37,.35);transition:transform .15s,box-shadow .15s;}
  .oa-btn:active{transform:scale(.95);box-shadow:0 2px 8px rgba(255,123,37,.3);}
  .ota-dismiss{display:block;margin-top:10px;border:none;background:transparent;color:#aaa;
    font-family:inherit;font-size:13px;cursor:pointer;padding:4px 0;}
  @keyframes otaFadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- 闯关系统 ---------- */
  .challenge{display:none;}
  .challenge.active{display:block;animation:fade .35s ease;}

  .ch-entry{margin-top:30px;display:flex;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(120deg,#FF7B25,#FFB05A);color:#fff;border-radius:26px;
    padding:22px 26px;cursor:pointer;box-shadow:0 14px 30px rgba(255,123,37,.35);
    transition:transform .15s ease, box-shadow .15s;}
  .ch-entry:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(255,123,37,.45);}
  .ch-entry:active{transform:translateY(-1px) scale(.99);}
  .ch-entry .ce-emoji{font-size:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
  .ch-entry .ce-title{font-size:22px;font-weight:700;line-height:1.2;}
  .ch-entry .ce-sub{font-size:13px;font-weight:600;opacity:.95;margin-top:2px;}

  /* 选关页 */
  .hub-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .hub-title{font-size:30px;font-weight:700;}
  .hub-sub{font-size:15px;color:var(--gray);font-weight:600;margin-top:2px;}
  .lvl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:8px;}
  @media(max-width:760px){.lvl-grid{grid-template-columns:repeat(3,1fr);}}
  .lvl-card{background:#fff;border-radius:22px;padding:18px 10px 16px;text-align:center;
    box-shadow:var(--card-shadow);cursor:pointer;position:relative;transition:transform .15s,border-color .15s;
    border:3px solid transparent;}
  .lvl-card:hover{transform:translateY(-5px) scale(1.02);}
  .lvl-card:active{transform:translateY(-1px) scale(.98);}
  .lvl-card.locked{cursor:not-allowed;filter:grayscale(.6);opacity:.7;}
  .lvl-card .ln{font-size:30px;font-weight:700;color:var(--cta);}
  .lvl-card .lname{font-size:11px;font-weight:600;color:var(--gray);margin-top:2px;min-height:26px;
    display:flex;align-items:center;justify-content:center;}
  .lvl-card .lstars{margin-top:6px;font-size:14px;letter-spacing:1px;color:#FFC857;}
  .lvl-card .lock{position:absolute;top:8px;right:10px;font-size:16px;}
  .lvl-card .pairs{margin-top:4px;font-size:10px;font-weight:700;color:#B7AE9F;}

  /* 对战界面 */
  .game-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .game-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;
    box-shadow:var(--card-shadow);}
  .pill.t{color:#E0541E;}
  .pill.m{color:#C23B6B;}
  /* 闯关：英文 + 古诗词 随机组合 答题卡 */
  .q-area{margin-top:14px;}
  .qcard{border-radius:26px;background:#fff;box-shadow:var(--card-shadow);padding:22px 18px 18px;
    border:3px solid #FFE6E0;text-align:center;max-width:520px;margin:0 auto;}
  .q-tag{display:inline-block;border-radius:999px;color:#fff;font-size:13px;font-weight:800;
    padding:4px 14px;margin-bottom:14px;letter-spacing:1px;}
  .q-emoji{font-size:74px;line-height:1;margin:6px 0 10px;}
  .q-title{font-size:15px;font-weight:700;color:var(--gray);margin-bottom:8px;}
  .q-line{font-size:30px;font-weight:800;color:#3a2f2a;letter-spacing:2px;line-height:1.5;margin:4px 0 2px;}
  .q-line .blank{display:inline-block;min-width:40px;border-bottom:3px solid var(--cta);color:var(--cta);padding:0 6px;}
  .q-tip{font-size:14px;color:#9c9c9c;margin:10px 0 16px;}
  .q-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:360px;margin:0 auto;}
  .q-opt{border:3px solid #EFE7DF;background:#fff;border-radius:18px;padding:16px 8px;font-size:22px;
    font-weight:800;color:#3a2f2a;cursor:pointer;transition:transform .12s, border-color .12s, background .12s;
    box-shadow:var(--card-shadow);user-select:none;}
  .q-opt:hover{transform:translateY(-3px);}
  .q-opt:active{transform:scale(.96);}
  .q-opt.correct{border-color:var(--green);background:#EAF7E2;color:#3C8C2E;}
  .q-opt.wrong{border-color:#FF6B6B;background:#FFEDED;color:#C23B6B;animation:shake .4s;}
  .q-speak{margin:16px auto 0;display:block;border:none;background:var(--cta);color:#fff;font-weight:800;
    font-size:15px;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 8px 16px rgba(255,123,37,.3);}
  .q-speak:active{transform:scale(.97);}
  @media(max-width:420px){.q-line{font-size:24px;}.q-opt{font-size:19px;padding:13px 6px;}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  .game-progress{height:10px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    overflow:hidden;margin-top:6px;}
  .game-progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9AD36F);
    width:0;transition:width .3s ease;}

  /* 过关弹窗 */
  .win{position:fixed;inset:0;background:rgba(42,42,42,.7);display:none;align-items:center;
    justify-content:center;z-index:70;padding:20px;animation:fade .25s ease;}
  .win.show{display:flex;}
  .win-box{background:#fff;border-radius:30px;max-width:420px;width:100%;padding:34px 28px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35);}
  .win-box .w-emoji{font-size:72px;animation:pop .5s ease;}
  .win-box h3{font-size:28px;font-weight:700;margin:6px 0 6px;}
  .win-box .w-stars{font-size:40px;letter-spacing:4px;color:#FFC857;margin:6px 0 4px;}
  .win-box p{color:var(--gray);font-weight:600;font-size:15px;}
  .win-box .w-btns{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .w-btn{font-family:inherit;border:none;font-weight:700;font-size:16px;padding:13px 26px;border-radius:999px;
    cursor:pointer;color:#fff;background:var(--cta);box-shadow:0 10px 22px rgba(255,123,37,.32);transition:transform .15s;}
  .w-btn:hover{transform:translateY(-3px);}
  .w-btn.alt{background:#fff;color:var(--ink);box-shadow:var(--card-shadow);}

  /* ---------- 单词/诗词详情（渲染进 #detail 面板，规避部分 WebView 浮层不显示的问题） ---------- */
  .word-detail{max-width:520px;margin:0 auto;text-align:center;}
  .word-detail .wactions{justify-content:center;}
  .word-detail .wactions .wbtn{flex:0 1 auto;min-width:140px;max-width:220px;}
  .word-detail .wshadow{text-align:left;}
  .wemoji{font-size:84px;line-height:1;margin:6px 0 2px;}
  .wword{font-size:30px;font-weight:800;color:var(--cta);}
  .wmean{font-size:18px;font-weight:700;color:var(--ink);margin-top:2px;}
  .wpy{font-size:15px;font-weight:600;color:var(--gray);margin-top:2px;}
  .poem-lines{margin:14px 0 2px;text-align:center;line-height:1.45;}
  .pline{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:2px;}
  .ppinyin{font-size:13px;font-weight:600;color:var(--gray);margin-bottom:8px;}
  .poem-mean{margin-top:10px;background:#F7F4EE;border-radius:14px;padding:12px;font-size:15px;font-weight:600;color:var(--ink);line-height:1.6;text-align:left;}
  .wactions{display:flex;gap:10px;margin-top:16px;}
  .wbtn{flex:1;border:none;font-family:inherit;font-weight:700;font-size:15px;padding:13px 10px;border-radius:16px;
    cursor:pointer;color:#fff;background:var(--cta);transition:transform .12s;}
  .wbtn:hover{transform:translateY(-2px);}
  .wbtn.ghost{background:#FFF3D6;color:#E08A1E;}
  .wbtn.blue{background:var(--blue);}
  .wbtn.green{background:var(--green);}
  .wshadow{margin-top:18px;background:#F7F4EE;border-radius:18px;padding:14px;text-align:left;}
  .wshadow .sh-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .pline.reading{background:#FFF3D6;border-radius:8px;padding:0 6px;}

  /* ---------- 底部 Tab 栏 ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
  .tab{flex:1;border:none;background:none;font-family:inherit;font-weight:800;font-size:13px;color:var(--gray);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:16px;cursor:pointer;transition:background .15s;}
  .tab .ti{font-size:22px;}
  .tab.active{color:var(--cta);background:#FFF3D6;}

  /* ---------- 我的 / 设置页 ---------- */
  .me{display:none;}
  .me.active{display:block;animation:fade .35s ease;}
  .me-profile{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .me-ava{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:52px;cursor:pointer;box-shadow:var(--card-shadow);margin:4px auto 10px;transition:transform .15s;}
  .me-ava:active{transform:scale(.96);}
  .me-name{font-size:26px;font-weight:800;cursor:pointer;}
  .me-edit{font-size:14px;color:var(--cta);font-weight:700;margin-left:6px;}
  .me-sub{font-size:13px;color:var(--gray);font-weight:600;margin-top:4px;}
  .set-title{font-size:16px;font-weight:800;color:var(--ink);margin:4px 2px 10px;}
  .set-row{width:100%;display:flex;align-items:center;gap:12px;background:#FFF7E8;border:none;border-radius:16px;
    padding:14px 16px;margin-bottom:10px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
    cursor:pointer;text-align:left;transition:transform .12s;}
  .set-row:active{transform:scale(.99);}

  .set-row.acct{padding:0;gap:0;overflow:hidden;}
  .set-row.acct:active{transform:none;}
  .acct-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:transparent;
    border:none;padding:14px 16px;font-family:inherit;font-size:16px;font-weight:700;

  .set-del{flex:none;width:46px;align-self:stretch;border:none;background:transparent;

  .ava-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
  .ava-opt{font-size:34px;background:#FFF7E8;border:none;border-radius:14px;padding:10px 0;cursor:pointer;transition:transform .12s;}
  .ava-opt:active{transform:scale(.92);}

  /* ---------- 成长页 ---------- */
  .grow{display:none;}
  .grow.active{display:block;animation:fade .35s ease;}
  .gcard{background:#fff;border-radius:24px;padding:22px;box-shadow:var(--card-shadow);margin-top:18px;}
  .gstat{display:flex;gap:12px;margin:14px 0 6px;}
  .gstat .gs{flex:1;text-align:center;background:#FFF7E8;border-radius:18px;padding:14px 6px;}
  .gstat .gs b{display:block;font-size:26px;font-weight:800;color:var(--cta);}
  .gstat .gs span{font-size:12px;font-weight:700;color:var(--gray);}

  .glv .gn{font-size:18px;font-weight:800;color:var(--cta);}
  .glv .gs{font-size:13px;color:#FFC857;letter-spacing:1px;}
  .gbtns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .gbtn{flex:1;min-width:140px;border:none;font-family:inherit;font-weight:800;font-size:15px;padding:14px;border-radius:16px;cursor:pointer;color:#fff;background:var(--cta);}
  .gbtn.alt{background:var(--blue);}

  /* ===== 全球旅行：世界地图 / 七大洲 / 国家 / 中国省份 ===== */
  .worldmap{width:100%;max-width:920px;margin:10px auto 4px;display:block;background:#EAF4FF;border-radius:22px;}

  .worldmap .cfull{pointer-events:none;text-anchor:middle;font-size:11px;fill:rgba(255,255,255,.9);}
  .cont-list{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;}
  @media(max-width:760px){.cont-list{grid-template-columns:repeat(2,1fr);}}
  .cont-card{border-radius:20px;padding:16px 10px;text-align:center;box-shadow:var(--card-shadow);background:#fff;
    cursor:pointer;border:3px solid transparent;transition:transform .14s ease, box-shadow .14s;}

  .cont-card .ce{font-size:34px;}
  .cont-card .cn{font-weight:800;margin-top:6px;}
  .cont-card .cs{font-size:12px;opacity:.7;}
  .country-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px;}
  @media(max-width:760px){.country-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:420px){.country-grid{grid-template-columns:repeat(2,1fr);}}
  .country-card{border-radius:18px;padding:12px 6px;text-align:center;background:#fff;box-shadow:var(--card-shadow);
    cursor:pointer;border:2px solid transparent;transition:transform .14s ease;}
  .country-card:hover{transform:translateY(-3px);border-color:var(--blue);}

  .country-card .cname{font-weight:800;font-size:14px;margin-top:4px;}
  .country-card .ccap{font-size:11px;color:#888;}
  .cn-title{font-size:16px;font-weight:800;margin:14px 0 2px;display:flex;align-items:center;gap:8px;}
  .cnmap{width:100%;max-width:980px;margin:6px auto;display:block;background:#EAF4FF;border-radius:22px;touch-action:manipulation;}

  .cn-prov.dim{opacity:.4;}
  .cn-label{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2.6px;stroke-linejoin:round;}
  .prov-detail{padding:6px 2px 26px;}
  .pd-hero{border-radius:22px;padding:18px;color:#fff;margin-bottom:14px;}

        {e:"💦",title:"望庐山瀑布",author:"李白",dynasty:"唐",lines:["日照香炉生紫烟，", "遥看瀑布挂前川。", "飞流直下三千尺，", "疑是银河落九天。"],py:["rì zhào xiāng lú shēng zǐ yān，", "yáo kàn pù bù guà qián chuān。", "fēi liú zhí xià sān qiān chǐ，", "yí shì yín hé luò jiǔ tiān。"],s:"阳光照在香炉峰升起紫色烟霞，远远看去瀑布像挂在山前。水流飞泻直下三千尺，让人怀疑是银河从九天落下来。"},
        {e:"🦅",title:"上李邕",author:"李白",dynasty:"唐",lines:["大鹏一日同风起，", "扶摇直上九万里。", "假令风歇时下来，", "犹能簸却沧溟水。", "世人见我恒殊调，", "闻余大言皆冷笑。", "宣父犹能畏后生，", "丈夫未可轻年少。"],py:["dà péng yī rì tóng fēng qǐ，", "fú yáo zhí shàng jiǔ wàn lǐ。", "jiǎ lìng fēng xiē shí xià lái，", "yóu néng bǒ què cāng míng shuǐ。", "shì rén jiàn wǒ héng shū diào，", "wén yú dà yán jiē lěng xiào。", "xuān fù yóu néng wèi hòu shēng，", "zhàng fū wèi kě qīng nián shào。"],s:"大鹏鸟一日乘风飞起，直上九万里高空。即使风停落下，也能掀动大海的波涛。世人看我总不顺眼、笑我大话，但圣人尚且敬畏后生，大丈夫不可轻视少年。"},
        {e:"🏠",title:"南陵别儿童入京",author:"李白",dynasty:"唐",lines:["白酒新熟山中归，", "黄鸡啄黍秋正肥。", "呼童烹鸡酌白酒，", "儿女嬉笑牵人衣。", "高歌取醉欲自慰，", "起舞落日争光辉。", "游说万乘苦不早，", "著鞭跨马涉远道。", "会稽愚妇轻买臣，", "余亦辞家西入秦。", "仰天大笑出门去，", "我辈岂是蓬蒿人。"],py:["bái jiǔ xīn shú shān zhōng guī，", "huáng jī zhuó shǔ qiū zhèng féi。", "hū tóng pēng jī zhuó bái jiǔ，", "ér nǚ xī xiào qiān rén yī。", "gāo gē qǔ zuì yù zì wèi，", "qǐ wǔ luò rì zhēng guāng huī。", "yóu shuì wàn chéng kǔ bù zǎo，", "zhù biān kuà mǎ shè yuǎn dào。", "huì jī yú fù qīng mǎi chén，", "yú yì cí jiā xī rù qín。", "yǎng tiān dà xiào chū mén qù，", "wǒ bèi qǐ shì péng hāo rén。"],s:"白酒新酿、黄鸡正肥，呼唤孩童烹鸡斟酒，儿女笑着牵衣。高歌醉酒自慰平生之志，终于奉诏入京，仰天大笑出门：我岂是久居草野的平凡人！"},
        {e:"🌕",title:"子夜吴歌·秋歌",author:"李白",dynasty:"唐",lines:["长安一片月，", "万户捣衣声。", "秋风吹不尽，", "总是玉关情。", "何日平胡虏，", "良人罢远征。"],py:["cháng ān yī piàn yuè，", "wàn hù dǎo yī shēng。", "qiū fēng chuī bù jìn，", "zǒng shì yù guān qíng。", "hé rì píng hú lǔ，", "liáng rén bà yuǎn zhēng。"],s:"长安城上一轮明月，千家万户传来捣衣声。秋风吹个不停，都是思念远方征人的情。何时才能平定胡虏，让亲人不再远征。"},
        {e:"🎶",title:"与史郎中钦听黄鹤楼上吹笛",author:"李白",dynasty:"唐",lines:["一为迁客去长沙，", "西望长安不见家。", "黄鹤楼中吹玉笛，", "江城五月落梅花。"],py:["yī wèi qiān kè qù cháng shā，", "xī wàng cháng ān bú jiàn jiā。", "huáng hè lóu zhōng chuī yù dí，", "jiāng chéng wǔ yuè luò méi huā。"],s:"一旦成了贬谪远去的人，西望长安已不见家园。黄鹤楼中吹起玉笛，江城五月仿佛飘落梅花。"},
        {e:"🎼",title:"送陆判官往琵琶峡",author:"李白",dynasty:"唐",lines:["水国秋风夜，", "殊非远别时。", "长安如梦里，", "何日是归期。"],py:["shuǐ guó qiū fēng yè，", "shū fēi yuǎn bié shí。", "cháng ān rú mèng lǐ，", "hé rì shì guī qī。"],s:"水乡秋风之夜，本不是远别的时节。长安如在梦里，何日才是归期。"},
        {e:"🍷",title:"将进酒",author:"李白",dynasty:"唐",lines:["君不见黄河之水天上来，", "奔流到海不复回。", "君不见高堂明镜悲白发，", "朝如青丝暮成雪。", "人生得意须尽欢，", "莫使金樽空对月。", "天生我材必有用，", "千金散尽还复来。", "烹羊宰牛且为乐，", "会须一饮三百杯。", "岑夫子，丹丘生，", "将进酒，杯莫停。", "与君歌一曲，", "请君为我倾耳听。", "钟鼓馔玉不足贵，", "但愿长醉不愿醒。", "古来圣贤皆寂寞，", "惟有饮者留其名。", "陈王昔时宴平乐，", "斗酒十千恣欢谑。", "主人何为言少钱，", "径须沽取对君酌。", "五花马，千金裘，", "呼儿将出换美酒，", "与尔同销万古愁。"],py:["jūn bú jiàn huáng hé zhī shuǐ tiān shàng lái，", "bēn liú dào hǎi bù fù huí。", "jūn bú jiàn gāo táng míng jìng bēi bái fà，", "cháo rú qīng sī mù chéng xuě。", "rén shēng dé yì xū jìn huān，", "mò shǐ jīn zūn kōng duì yuè。", "tiān shēng wǒ cái bì yǒu yòng，", "qiān jīn sàn jǐn hái fù lái。", "pēng yáng zǎi niú qiě wèi lè，", "huì xū yī yǐn sān bǎi bēi。", "cén fū zǐ， dān qiū shēng，", "qiāng jìn jiǔ， bēi mò tíng。", "yǔ jūn gē yī qū，", "qǐng jūn wèi wǒ qīng ěr tīng。", "zhōng gǔ zhuàn yù bù zú guì，", "dàn yuàn zhǎng zuì bù yuàn xǐng。", "gǔ lái shèng xián jiē jì mò，", "wéi yǒu yǐn zhě liú qí míng。", "chén wáng xī shí yàn píng lè，", "dòu jiǔ shí qiān zì huān xuè。", "zhǔ rén hé wèi yán shǎo qián，", "jìng xū gū qǔ duì jūn zhuó。", "wǔ huā mǎ， qiān jīn qiú，", "hū ér jiāng chū huàn měi jiǔ，", "yǔ ěr tóng xiāo wàn gǔ chóu。"],s:"你可见黄河之水从天而降、奔流入海不再回还；你可见高堂明镜悲叹白发，朝如青丝暮成雪。人生得意就该尽情欢，莫让金杯空对明月。天生我材必有用，千金散尽还复来。"},
        {e:"🤝",title:"别董大",author:"高适",dynasty:"唐",lines:["千里黄云白日曛，", "北风吹雁雪纷纷。", "莫愁前路无知己，", "天下谁人不识君。"],py:["qiān lǐ huáng yún bái rì xūn，", "běi fēng chuī yàn xuě fēn fēn。", "mò chóu qián lù wú zhī jǐ，", "tiān xià shuí rén bù shí jūn。"],s:"千里黄云遮暗了落日，北风吹雁大雪纷纷。不要担心前路没有知己，天下谁人不识你的大名。"},
        {e:"🫘",title:"相思",author:"王维",dynasty:"唐",lines:["红豆生南国，", "春来发几枝。", "愿君多采撷，", "此物最相思。"],py:["hóng dòu shēng nán guó，", "chūn lái fā jǐ zhī。", "yuàn jūn duō cǎi xié，", "cǐ wù zuì xiāng sī。"],s:"红豆生长在南方，春天又发几枝新。愿你多采撷它，这东西最能寄托相思。"},
        {e:"🪟",title:"杂诗",author:"王维",dynasty:"唐",lines:["君自故乡来，", "应知故乡事。", "来日绮窗前，", "寒梅著花未？"],py:["jūn zì gù xiāng lái，", "yīng zhī gù xiāng shì。", "lái rì qǐ chuāng qián，", "hán méi zhù huā wèi？"],s:"你从故乡来，该知道故乡的事。请问那天倚窗前，寒梅可曾开花未？"},
        {e:"🐦",title:"春晓",author:"孟浩然",dynasty:"唐",lines:["春眠不觉晓，", "处处闻啼鸟。", "夜来风雨声，", "花落知多少。"],py:["chūn mián bù jué xiǎo，", "chù chù wén tí niǎo。", "yè lái fēng yǔ shēng，", "huā luò zhī duō shǎo。"],s:"春夜酣睡不知不觉天已亮，处处听见鸟啼声。想起昨夜的风雨，不知吹落多少花。"},
        {e:"🏡",title:"过故人庄",author:"孟浩然",dynasty:"唐",lines:["故人具鸡黍，", "邀我至田家。", "绿树村边合，", "青山郭外斜。", "开轩面场圃，", "把酒话桑麻。", "待到重阳日，", "还来就菊花。"],py:["gù rén jù jī shǔ，", "yāo wǒ zhì tián jiā。", "lǜ shù cūn biān hé，", "qīng shān guō wài xié。", "kāi xuān miàn chǎng pǔ，", "bǎ jiǔ huà sāng má。", "dài dào chóng yáng rì，", "hái lái jiù jú huā。"],s:"老友备好鸡黍，邀请我到田家。绿树环绕村庄，青山斜倚城外。开窗面对谷场菜园，把酒闲话桑麻。等到重阳佳节，再来赏菊。"},
        {e:"🏯",title:"登鹳雀楼",author:"王之涣",dynasty:"唐",lines:["白日依山尽，", "黄河入海流。", "欲穷千里目，", "更上一层楼。"],py:["bái rì yī shān jǐn，", "huáng hé rù hǎi liú。", "yù qióng qiān lǐ mù，", "gèng shàng yī céng lóu。"],s:"夕阳依傍山峦沉落，黄河奔流入海。想要望尽千里风光，就要再登上一层高楼。"},
        {e:"🏔",title:"出塞",author:"王昌龄",dynasty:"唐",lines:["秦时明月汉时关，", "万里长征人未还。", "但使龙城飞将在，", "不教胡马度阴山。"],py:["qín shí míng yuè hàn shí guān，", "wàn lǐ cháng zhēng rén wèi hái。", "dàn shǐ lóng chéng fēi jiāng zài，", "bù jiào hú mǎ dù yīn shān。"],s:"秦汉时的明月与关塞，万里征人至今未还。若让龙城的飞将军还在，绝不许胡马越过阴山。"},
        {e:"🍇",title:"凉州词",author:"王翰",dynasty:"唐",lines:["葡萄美酒夜光杯，", "欲饮琵琶马上催。", "醉卧沙场君莫笑，", "古来征战几人回。"],py:["pú táo měi jiǔ yè guāng bēi，", "yù yǐn pí pá mǎ shàng cuī。", "zuì wò shā chǎng jūn mò xiào，", "gǔ lái zhēng zhàn jǐ rén huí。"],s:"葡萄美酒盛在夜光杯，正要饮酒琵琶马上催。醉卧沙场请莫见笑，古来征战几人能回。"},
        {e:"⛰",title:"望岳",author:"杜甫",dynasty:"唐",lines:["岱宗夫如何？", "齐鲁青未了。", "造化钟神秀，", "阴阳割昏晓。", "荡胸生层云，", "决眦入归鸟。", "会当凌绝顶，", "一览众山小。"],py:["dài zōng fū rú hé？", "qí lǔ qīng wèi liǎo。", "zào huà zhōng shén xiù，", "yīn yáng gē hūn xiǎo。", "dàng xiōng shēng céng yún，", "jué zì rù guī niǎo。", "huì dāng líng jué dǐng，", "yī lǎn zhòng shān xiǎo。"],s:"泰山是何等雄伟？齐鲁大地青翠不尽。大自然聚拢神奇秀美，山南水北明暗分界。胸怀激荡层云生，睁眼归鸟入林。定要登上最高峰，俯看群山皆渺小。"},
        {e:"🏯",title:"黄鹤楼",author:"崔颢",dynasty:"唐",lines:["昔人已乘黄鹤去，", "此地空余黄鹤楼。", "黄鹤一去不复返，", "白云千载空悠悠。", "晴川历历汉阳树，", "芳草萋萋鹦鹉洲。", "日暮乡关何处是，", "烟波江上使人愁。"],py:["xī rén yǐ chéng huáng hè qù，", "cǐ dì kòng yú huáng hè lóu。", "huáng hè yī qù bù fù fǎn，", "bái yún qiān zài kōng yōu yōu。", "qíng chuān lì lì hàn yáng shù，", "fāng cǎo qī qī yīng wǔ zhōu。", "rì mù xiāng guān hé chù shì，", "yān bō jiāng shàng shǐ rén chóu。"],s:"古人乘鹤已去，此地只留空楼。黄鹤一去不返，白云千载悠悠。晴川汉阳树清晰，鹦鹉洲芳草萋萋。日暮何处是家乡？江上烟波使人愁。"},
        {e:"🐎",title:"过华清宫",author:"杜牧",dynasty:"唐",lines:["长安回望绣成堆，", "山顶千门次第开。", "一骑红尘妃子笑，", "无人知是荔枝来。"],py:["cháng ān huí wàng xiù chéng duī，", "shān dǐng qiān mén cì dì kāi。", "yī qí hóng chén fēi zǐ xiào，", "wú rén zhī shì lì zhī lái。"],s:"回望长安如锦绣堆叠，山顶宫门次第敞开。一骑红尘扬起妃子一笑，无人知是送荔枝来。"},
        {e:"❄️",title:"白雪歌送武判官归京（节选）",author:"岑参",dynasty:"唐",lines:["北风卷地白草折，", "胡天八月即飞雪。", "忽如一夜春风来，", "千树万树梨花开。"],py:["běi fēng juǎn dì bái cǎo zhé，", "hú tiān bā yuè jí fēi xuě。", "hū rú yī yè chūn fēng lái，", "qiān shù wàn shù lí huā kāi。"],s:"北风卷地吹折白草，胡地八月就飞雪。忽然一夜春风吹来，千万棵树开满梨花。（以春花比喻大雪）"},
        {e:"🌧",title:"春夜喜雨",author:"杜甫",dynasty:"唐",lines:["好雨知时节，", "当春乃发生。", "随风潜入夜，", "润物细无声。"],py:["hǎo yǔ zhī shí jié，", "dāng chūn nǎi fā shēng。", "suí fēng qián rù yè，", "rùn wù xì wú shēng。"],s:"好雨似乎知道时节，春天一到就悄悄落下，随着风在夜里滋润万物，听不到一点声响。"},
        {e:"🐦",title:"绝句",author:"杜甫",dynasty:"唐",lines:["两个黄鹂鸣翠柳，", "一行白鹭上青天。", "窗含西岭千秋雪，", "门泊东吴万里船。"],py:["liǎng gè huáng lí míng cuì liǔ，", "yī xíng bái lù shàng qīng tiān。", "chuāng hán xī lǐng qiān qiū xuě，", "mén pō dōng wú wàn lǐ chuán。"],s:"两只黄鹂在翠柳间啼鸣，一行白鹭飞上蓝天。窗外是西岭千年不化的积雪，门前停着远航万里的船只。"},
        {e:"⛰",title:"登高",author:"杜甫",dynasty:"唐",lines:["风急天高猿啸哀，", "渚清沙白鸟飞回。", "无边落木萧萧下，", "不尽长江滚滚来。"],py:["fēng jí tiān gāo yuán xiào āi，", "zhǔ qīng shā bái niǎo fēi huí。", "wú biān luò mù xiāo xiāo xià，", "bù jìn cháng jiāng gǔn gǔn lái。"],s:"秋风劲急、猿声哀鸣，江心小洲清朗、白鸟盘旋。无边落叶萧萧飘下，奔腾的长江滚滚而来。"},
        {e:"🏠",title:"茅屋为秋风所破歌（节选）",author:"杜甫",dynasty:"唐",lines:["安得广厦千万间，", "大庇天下寒士俱欢颜！", "风雨不动安如山。"],py:["ān dé guǎng shà qiān wàn jiān，", "dà bì tiān xià hán shì jù huān yán！", "fēng yǔ bù dòng ān rú shān。"],s:"怎样才能有千万间宽大的屋子，让天下受苦的读书人都能欢笑安身，风吹雨打也安稳如山。"},
        {e:"🌲",title:"山居秋暝",author:"王维",dynasty:"唐",lines:["空山新雨后，", "天气晚来秋。", "明月松间照，", "清泉石上流。"],py:["kōng shān xīn yǔ hòu，", "tiān qì wǎn lái qiū。", "míng yuè sōng jiān zhào，", "qīng quán shí shàng liú。"],s:"空旷的青山刚下过雨，傍晚的天气透着秋凉。明月洒在松林间，清泉在石头上流淌。"},
        {e:"🌳",title:"鹿柴",author:"王维",dynasty:"唐",lines:["空山不见人，", "但闻人语响。", "返景入深林，", "复照青苔上。"],py:["kōng shān bú jiàn rén，", "dàn wén rén yǔ xiǎng。", "fǎn jǐng rù shēn lín，", "fù zhào qīng tái shàng。"],s:"空山里看不见人影，只听见有人说话的回响。夕阳的余晖射入深林，又照在青苔之上。"},
        {e:"🍂",title:"九月九日忆山东兄弟",author:"王维",dynasty:"唐",lines:["独在异乡为异客，", "每逢佳节倍思亲。", "遥知兄弟登高处，", "遍插茱萸少一人。"],py:["dú zài yì xiāng wèi yì kè，", "měi féng jiā jié bèi sī qīn。", "yáo zhī xiōng dì dēng gāo chù，", "biàn chā zhū yú shǎo yī rén。"],s:"独自漂泊在他乡，每到节日就加倍思念亲人。遥想兄弟们登高插茱萸，偏偏少了我一个人。"},
        {e:"🍶",title:"渭城曲",author:"王维",dynasty:"唐",lines:["渭城朝雨浥轻尘，", "客舍青青柳色新。", "劝君更尽一杯酒，", "西出阳关无故人。"],py:["wèi chéng cháo yǔ yì qīng chén，", "kè shě qīng qīng liǔ sè xīn。", "quàn jūn gèng jǐn yī bēi jiǔ，", "xī chū yáng guān wú gù rén。"],s:"渭城清晨的细雨打湿微尘，客舍旁杨柳青翠。再干一杯吧，向西出了阳关就难遇老朋友了。"},
        {e:"🌿",title:"赋得古原草送别",author:"白居易",dynasty:"唐",lines:["离离原上草，", "一岁一枯荣。", "野火烧不尽，", "春风吹又生。"],py:["lí lí yuán shàng cǎo，", "yī suì yī kū róng。", "yě huǒ shāo bù jìn，", "chūn fēng chuī yòu shēng。"],s:"原野上茂盛的青草，每年枯萎又繁荣。野火怎也烧不完，春风一吹又生机勃勃。"},
        {e:"🌸",title:"忆江南",author:"白居易",dynasty:"唐",lines:["江南好，", "风景旧曾谙。", "日出江花红胜火，", "春来江水绿如蓝。"],py:["jiāng nán hǎo，", "fēng jǐng jiù céng ān。", "rì chū jiāng huā hóng shèng huǒ，", "chūn lái jiāng shuǐ lǜ rú lán。"],s:"江南真好，那里的风景我早已熟悉。太阳出来江花红胜火，春天江水绿得像蓝草。"},
        {e:"🌸",title:"大林寺桃花",author:"白居易",dynasty:"唐",lines:["人间四月芳菲尽，", "山寺桃花始盛开。", "长恨春归无觅处，", "不知转入此中来。"],py:["rén jiān sì yuè fāng fēi jǐn，", "shān sì táo huā shǐ shèng kāi。", "zhǎng hèn chūn guī wú mì chù，", "bù zhī zhuǎn rù cǐ zhōng lái。"],s:"四月里平地百花已谢，高山寺庙的桃花才刚开放。常遗憾春天一去难寻，谁知它转到了这里。"},
        {e:"🏔",title:"题西林壁",author:"苏轼",dynasty:"宋",lines:["横看成岭侧成峰，", "远近高低各不同。", "不识庐山真面目，", "只缘身在此山中。"],py:["héng kàn chéng lǐng cè chéng fēng，", "yuǎn jìn gāo dī gè bù tóng。", "bù shí lú shān zhēn miàn mù，", "zhǐ yuán shēn zài cǐ shān zhōng。"],s:"横看是山岭侧看是山峰，从不同角度看各不相同。看不清庐山的真面目，只因为自己就在山中。"},
        {e:"💧",title:"饮湖上初晴后雨",author:"苏轼",dynasty:"宋",lines:["水光潋滟晴方好，", "山色空蒙雨亦奇。", "欲把西湖比西子，", "淡妆浓抹总相宜。"],py:["shuǐ guāng liàn yàn qíng fāng hǎo，", "shān sè kōng méng yǔ yì qí。", "yù bǎ xī hú bǐ xī zi，", "dàn zhuāng nóng mǒ zǒng xiāng yí。"],s:"晴天湖面波光闪动很美，雨天山色迷蒙也很奇妙。若把西湖比作美人西施，淡妆浓抹都合适。"},
        {e:"🌕",title:"水调歌头（节选）",author:"苏轼",dynasty:"宋",lines:["明月几时有？", "把酒问青天。", "不知天上宫阙，", "今夕是何年。", "但愿人长久，", "千里共婵娟。"],py:["míng yuè jǐ shí yǒu？", "bǎ jiǔ wèn qīng tiān。", "bù zhī tiān shàng gōng què，", "jīn xī shì hé nián。", "dàn yuàn rén cháng jiǔ，", "qiān lǐ gòng chán juān。"],s:"明月什么时候才有？举起酒杯问青天。不知天上宫殿今夜是哪一年。只愿亲人长久平安，相隔千里共赏这轮明月。"},
        {e:"🌊",title:"如梦令",author:"李清照",dynasty:"宋",lines:["昨夜雨疏风骤，", "浓睡不消残酒。", "知否，知否？", "应是绿肥红瘦。"],py:["zuó yè yǔ shū fēng zhòu，", "nóng shuì bù xiāo cán jiǔ。", "zhī fǒu， zhī fǒu？", "yīng shì lǜ féi hóng shòu。"],s:"昨夜雨小风急，酣睡也没消尽残酒。试问卷帘人海棠怎样？说是依旧。可知晓？应是叶茂花稀。"},
        {e:"⚔",title:"夏日绝句",author:"李清照",dynasty:"宋",lines:["生当作人杰，", "死亦为鬼雄。", "至今思项羽，", "不肯过江东。"],py:["shēng dàng zuò rén jié，", "sǐ yì wèi guǐ xióng。", "zhì jīn sī xiàng yǔ，", "bù kěn guò jiāng dōng。"],s:"活着要做人中豪杰，死了也要做鬼中英雄。至今还思念项羽，宁死也不肯退回江东。"},
        {e:"🌾",title:"西江月·夜行黄沙道中",author:"辛弃疾",dynasty:"宋",lines:["明月别枝惊鹊，", "清风半夜鸣蝉。", "稻花香里说丰年，", "听取蛙声一片。"],py:["míng yuè bié zhī jīng què，", "qīng fēng bàn yè míng chán。", "dào huā xiāng lǐ shuō fēng nián，", "tīng qǔ wā shēng yī piàn。"],s:"明月惊起枝头喜鹊，半夜清风送来蝉鸣。稻花香里谈论丰收年景，耳边一片蛙声。"},
        {e:"🍃",title:"清平乐·村居",author:"辛弃疾",dynasty:"宋",lines:["茅檐低小，", "溪上青青草。", "最喜小儿亡赖，", "溪头卧剥莲蓬。"],py:["máo yán dī xiǎo，", "xī shàng qīng qīng cǎo。", "zuì xǐ xiǎo ér wáng lài，", "xī tóu wò bō lián péng。"],s:"茅屋又低又小，溪边青草青青。最可爱那顽皮的小儿子，正躺在溪头剥莲蓬。"},
        {e:"🌆",title:"登乐游原",author:"李商隐",dynasty:"唐",lines:["向晚意不适，", "驱车登古原。", "夕阳无限好，", "只是近黄昏。"],py:["xiàng wǎn yì bù shì，", "qū chē dēng gǔ yuán。", "xī yáng wú xiàn hǎo，", "zhǐ shì jìn huáng hūn。"],s:"傍晚时心情不畅，驾车登上乐游原。夕阳无限美好，只可惜已近黄昏。"},
        {e:"🌧",title:"夜雨寄北",author:"李商隐",dynasty:"唐",lines:["君问归期未有期，", "巴山夜雨涨秋池。", "何当共剪西窗烛，", "却话巴山夜雨时。"],py:["jūn wèn guī qī wèi yǒu qī，", "bā shān yè yǔ zhǎng qiū chí。", "hé dāng gòng jiǎn xī chuāng zhú，", "què huà bā shān yè yǔ shí。"],s:"你问归期归期未定，巴山夜雨涨满秋池。何时才能共剪西窗烛光，再聊这巴山夜雨之时。"},
        {e:"🍃",title:"清明",author:"杜牧",dynasty:"唐",lines:["清明时节雨纷纷，", "路上行人欲断魂。", "借问酒家何处有，", "牧童遥指杏花村。"],py:["qīng míng shí jié yǔ fēn fēn，", "lù shàng xíng rén yù duàn hún。", "jiè wèn jiǔ jiā hé chù yǒu，", "mù tóng yáo zhǐ xìng huā cūn。"],s:"清明时节细雨纷纷，路上行人落魄断魂。借问哪里有酒家？牧童远远指向杏花村。"},
        {e:"❄",title:"江雪",author:"柳宗元",dynasty:"唐",lines:["千山鸟飞绝，", "万径人踪灭。", "孤舟蓑笠翁，", "独钓寒江雪。"],py:["qiān shān niǎo fēi jué，", "wàn jìng rén zōng miè。", "gū zhōu suō lì wēng，", "dú diào hán jiāng xuě。"],s:"千山不见飞鸟，万路没有行人。江上孤舟里披蓑戴笠的老翁，独自在雪中垂钓。"},
        {e:"🏛",title:"乌衣巷",author:"刘禹锡",dynasty:"唐",lines:["朱雀桥边野草花，", "乌衣巷口夕阳斜。", "旧时王谢堂前燕，", "飞入寻常百姓家。"],py:["zhū què qiáo biān yě cǎo huā，", "wū yī xiàng kǒu xī yáng xié。", "jiù shí wáng xiè táng qián yàn，", "fēi rù xún cháng bǎi xìng jiā。"],s:"朱雀桥边野草开花，乌衣巷口夕阳西斜。昔日王谢堂前的燕子，如今飞进普通百姓家。"},
        {e:"🌍",title:"送杜少府之任蜀州（节选）",author:"王勃",dynasty:"唐",lines:["海内存知己，", "天涯若比邻。"],py:["hǎi nèi cún zhī jǐ，", "tiān yá ruò bǐ lín。"],s:"只要四海之内有知心朋友，即使远在天边也像近在比邻。"},
        {e:"🌙",title:"相见欢",author:"李煜",dynasty:"南唐",lines:["无言独上西楼，", "月如钩。", "寂寞梧桐深院锁清秋。", "别是一般滋味在心头。"],py:["wú yán dú shàng xī lóu，", "yuè rú gōu。", "jì mò wú tóng shēn yuàn suǒ qīng qiū。", "bié shì yì bān zī wèi zài xīn tóu。"],s:"默默独自登上西楼，月弯如钩。梧桐深院锁住清秋的寂寞。离愁别是一番滋味在心头。"},
        {e:"📜",title:"示儿",author:"陆游",dynasty:"宋",lines:["死去元知万事空，", "但悲不见九州同。", "王师北定中原日，", "家祭无忘告乃翁。"],py:["sǐ qù yuán zhī wàn shì kōng，", "dàn bēi bú jiàn jiǔ zhōu tóng。", "wáng shī běi dìng zhōng yuán rì，", "jiā jì wú wàng gào nǎi wēng。"],s:"本知死后万事皆空，只悲未能见国家统一。待朝廷收复中原那天，家祭别忘了告诉父亲。"},
        {e:"🌿",title:"泊船瓜洲",author:"王安石",dynasty:"宋",lines:["京口瓜洲一水间，", "钟山只隔数重山。", "春风又绿江南岸，", "明月何时照我还。"],py:["jīng kǒu guā zhōu yī shuǐ jiān，", "zhōng shān zhǐ gé shù zhòng shān。", "chūn fēng yòu lǜ jiāng nán àn，", "míng yuè hé shí zhào wǒ hái。"],s:"京口与瓜洲隔水相望，钟山只隔几座山。春风又吹绿江南岸，明月何时照我归还。"},
        {e:"🎆",title:"元日",author:"王安石",dynasty:"宋",lines:["爆竹声中一岁除，", "春风送暖入屠苏。", "千门万户曈曈日，", "总把新桃换旧符。"],py:["bào zhú shēng zhōng yī suì chú，", "chūn fēng sòng nuǎn rù tú sū。", "qiān mén wàn hù tóng tóng rì，", "zǒng bǎ xīn táo huàn jiù fú。"],s:"爆竹声中旧年过去，春风送暖饮屠苏酒。初升太阳照着千家万户，都换上新的桃符。"},
        {e:"🪷",title:"小池",author:"杨万里",dynasty:"宋",lines:["泉眼无声惜细流，", "树阴照水爱晴柔。", "小荷才露尖尖角，", "早有蜻蜓立上头。"],py:["quán yǎn wú shēng xī xì liú，", "shù yīn zhào shuǐ ài qíng róu。", "xiǎo hé cái lù jiān jiān jiǎo，", "zǎo yǒu qīng tíng lì shàng tou。"],s:"泉眼悄悄惜细流，树影映水爱晴柔。小荷刚露尖尖角，早有蜻蜓立在上头。"},
        {e:"🌺",title:"晓出净慈寺送林子方",author:"杨万里",dynasty:"宋",lines:["毕竟西湖六月中，", "风光不与四时同。", "接天莲叶无穷碧，", "映日荷花别样红。"],py:["bì jìng xī hú liù yuè zhōng，", "fēng guāng bù yǔ sì shí tóng。", "jiē tiān lián yè wú qióng bì，", "yìng rì hé huā bié yàng hóng。"],s:"毕竟六月的西湖，风光与别时不同。莲叶接天一片碧绿，映着阳光荷花格外红。"},
        {e:"🚣",title:"江上渔者",author:"范仲淹",dynasty:"宋",lines:["江上往来人，", "但爱鲈鱼美。", "君看一叶舟，", "出没风波里。"],py:["jiāng shàng wǎng lái rén，", "dàn ài lú yú měi。", "jūn kàn yī yè zhōu，", "chū mò fēng bō lǐ。"],s:"江上来来往往的人，只爱鲈鱼鲜美。请看那片小舟，在风浪里出没多危险。"},
        {e:"🌿",title:"咏柳",author:"贺知章",dynasty:"唐",lines:["碧玉妆成一树高，", "万条垂下绿丝绦。", "不知细叶谁裁出，", "二月春风似剪刀。"],py:["bì yù zhuāng chéng yī shù gāo，", "wàn tiáo chuí xià lǜ sī tāo。", "bù zhī xì yè shuí cái chū，", "èr yuè chūn fēng shì jiǎn dāo。"],s:"高高的柳树像碧玉妆成，万条柳枝如绿丝带垂下。不知细叶谁裁出？二月的春风像剪刀。"},
        {e:"🏠",title:"回乡偶书",author:"贺知章",dynasty:"唐",lines:["少小离家老大回，", "乡音无改鬓毛衰。", "儿童相见不相识，", "笑问客从何处来。"],py:["shào xiǎo lí jiā lǎo dà huí，", "xiāng yīn wú gǎi bìn máo shuāi。", "ér tóng xiāng jiàn bù xiāng shí，", "xiào wèn kè cóng hé chù lái。"],s:"年少离家乡老才回，乡音未改鬓发已白。儿童见我不相识，笑着问客从哪儿来。"},
        {e:"🌙",title:"枫桥夜泊",author:"张继",dynasty:"唐",lines:["月落乌啼霜满天，", "江枫渔火对愁眠。", "姑苏城外寒山寺，", "夜半钟声到客船。"],py:["yuè luò wū tí shuāng mǎn tiān，", "jiāng fēng yú huǒ duì chóu mián。", "gū sū chéng wài hán shān sì，", "yè bàn zhōng shēng dào kè chuán。"],s:"月落乌啼霜气满天，江枫渔火伴着愁人难眠。姑苏城外寒山寺，夜半钟声传到客船。"},
        {e:"🧵",title:"游子吟",author:"孟郊",dynasty:"唐",lines:["慈母手中线，", "游子身上衣。", "谁言寸草心，", "报得三春晖。"],py:["cí mǔ shǒu zhōng xiàn，", "yóu zi shēn shàng yī。", "shuí yán cùn cǎo xīn，", "bào dé sān chūn huī。"],s:"慈母手中的针线，缝游子身上的衣裳。谁说小草般的心意，能报答春天阳光般的母爱。"},
        {e:"⛰",title:"寻隐者不遇",author:"贾岛",dynasty:"唐",lines:["松下问童子，", "言师采药去。", "只在此山中，", "云深不知处。"],py:["sōng xià wèn tóng zi，", "yán shī cǎi yào qù。", "zhǐ zài cǐ shān zhōng，", "yún shēn bù zhī chù。"],s:"松下问那童子，说师父采药去了。就在这座山中，云深不知在何处。"},
        {e:"🌾",title:"悯农",author:"李绅",dynasty:"唐",lines:["锄禾日当午，", "汗滴禾下土。", "谁知盘中餐，", "粒粒皆辛苦。"],py:["chú hé rì dāng wǔ，", "hàn dī hé xià tǔ。", "shuí zhī pán zhōng cān，", "lì lì jiē xīn kǔ。"],s:"农民正午在烈日下锄草，汗水滴入土里。谁知道碗里的饭，每一粒都饱含辛苦。"},
        {e:"🎣",title:"小儿垂钓",author:"胡令能",dynasty:"唐",lines:["蓬头稚子学垂纶，", "侧坐莓苔草映身。", "路人借问遥招手，", "怕得鱼惊不应人。"],py:["péng tóu zhì zi xué chuí lún，", "cè zuò méi tái cǎo yìng shēn。", "lù rén jiè wèn yáo zhāo shǒu，", "pà dé yú jīng bù yīng rén。"],s:"一个蓬头小孩学着钓鱼，侧坐莓苔草掩身影。路人问路他远远招手，怕惊跑鱼不敢出声。"},
        {e:"🌿",title:"滁州西涧",author:"韦应物",dynasty:"唐",lines:["独怜幽草涧边生，", "上有黄鹂深树鸣。", "春潮带雨晚来急，", "野渡无人舟自横。"],py:["dú lián yōu cǎo jiàn biān shēng，", "shàng yǒu huáng lí shēn shù míng。", "chūn cháo dài yǔ wǎn lái jí，", "yě dù wú rén zhōu zì héng。"],s:"独爱涧边幽幽青草，上有黄鹂在密林啼鸣。春潮带雨傍晚湍急，野渡无人小船横漂。"},
        {e:"🌙",title:"宿建德江",author:"孟浩然",dynasty:"唐",lines:["移舟泊烟渚，", "日暮客愁新。", "野旷天低树，", "江清月近人。"],py:["yí zhōu pō yān zhǔ，", "rì mù kè chóu xīn。", "yě kuàng tiān dī shù，", "jiāng qīng yuè jìn rén。"],s:"把船停泊在烟雾小洲，日暮又添游子新愁。原野空旷天比树低，江水清清月离人近。"},
        {e:"🏯",title:"春望",author:"杜甫",dynasty:"唐",lines:["国破山河在，", "城春草木深。", "感时花溅泪，", "恨别鸟惊心。", "烽火连三月，", "家书抵万金。", "白头搔更短，", "浑欲不胜簪。"],py:["guó pò shān hé zài，", "chéng chūn cǎo mù shēn。", "gǎn shí huā jiàn lèi，", "hèn bié niǎo jīng xīn。", "fēng huǒ lián sān yuè，", "jiā shū dǐ wàn jīn。", "bái tóu sāo gèng duǎn，", "hún yù bù shèng zān。"],s:"国都残破山河依旧，春天城里草木深深。感伤时局花开也落泪，怅恨离别鸟鸣也惊心。战火连烧三个月，一封家信抵万金。白发越挠越短，简直插不住簪子。"},
        {e:"⛰",title:"望岳",author:"杜甫",dynasty:"唐",lines:["岱宗夫如何？", "齐鲁青未了。", "造化钟神秀，", "阴阳割昏晓。", "荡胸生曾云，", "决眦入归鸟。", "会当凌绝顶，", "一览众山小。"],py:["dài zōng fū rú hé？", "qí lǔ qīng wèi liǎo。", "zào huà zhōng shén xiù，", "yīn yáng gē hūn xiǎo。", "dàng xiōng shēng céng yún，", "jué zì rù guī niǎo。", "huì dāng líng jué dǐng，", "yī lǎn zhòng shān xiǎo。"],s:"泰山到底什么样？齐鲁大地青翠望不到头。大自然聚拢神奇秀美，山南山北分隔昏晓。云气层叠荡漾胸襟，睁大眼睛送走归鸟。定要登上最高峰，把群山尽收眼底。"},
        {e:"🎭",title:"江南逢李龟年",author:"杜甫",dynasty:"唐",lines:["岐王宅里寻常见，", "崔九堂前几度闻。", "正是江南好风景，", "落花时节又逢君。"],py:["qí wáng zhái lǐ xún cháng jiàn，", "cuī jiǔ táng qián jǐ dù wén。", "zhèng shì jiāng nán hǎo fēng jǐng，", "luò huā shí jié yòu féng jūn。"],s:"当年在岐王宅里常见你，崔九堂前多次听你唱歌。如今正是江南风光好，暮春落花时又遇见你。"},
        {e:"🎋",title:"竹里馆",author:"王维",dynasty:"唐",lines:["独坐幽篁里，", "弹琴复长啸。", "深林人不知，", "明月来相照。"],py:["dú zuò yōu huáng lǐ，", "tán qín fù cháng xiào。", "shēn lín rén bù zhī，", "míng yuè lái xiāng zhào。"],s:"独自坐在幽深的竹林里，弹琴又放声长啸。深林中没人知道我，只有明月来相伴照耀。"},
        {e:"🐦",title:"鸟鸣涧",author:"王维",dynasty:"唐",lines:["人闲桂花落，", "夜静春山空。", "月出惊山鸟，", "时鸣春涧中。"],py:["rén xián guì huā luò，", "yè jìng chūn shān kōng。", "yuè chū jīng shān niǎo，", "shí míng chūn jiàn zhōng。"],s:"心境悠闲看桂花飘落，夜色静谧春山空旷。月亮升起惊动了山鸟，不时在春涧中啼鸣。"},
        {e:"🏡",title:"过故人庄",author:"孟浩然",dynasty:"唐",lines:["故人具鸡黍，", "邀我至田家。", "绿树村边合，", "青山郭外斜。", "开轩面场圃，", "把酒话桑麻。", "待到重阳日，", "还来就菊花。"],py:["gù rén jù jī shǔ，", "yāo wǒ zhì tián jiā。", "lǜ shù cūn biān hé，", "qīng shān guō wài xié。", "kāi xuān miàn chǎng pǔ，", "bǎ jiǔ huà sāng má。", "dài dào chóng yáng rì，", "hái lái jiù jú huā。"],s:"老朋友备好饭菜，邀请我到他田庄。绿树环绕村庄，青山斜倚城外。推开窗户面对谷场菜园，举杯闲话农事。等到重阳佳节，还要来赏菊花。"},
        {e:"🌊",title:"望洞庭湖赠张丞相",author:"孟浩然",dynasty:"唐",lines:["八月湖水平，", "涵虚混太清。", "气蒸云梦泽，", "波撼岳阳城。"],py:["bā yuè hú shuǐ píng，", "hán xū hùn tài qīng。", "qì zhēng yún mèng zé，", "bō hàn yuè yáng chéng。"],s:"八月洞庭湖水与岸齐平，水天一色混同太空。水汽蒸腾笼罩云梦泽，波涛摇撼岳阳城。"},
        {e:"⛰",title:"望天门山",author:"李白",dynasty:"唐",lines:["天门中断楚江开，", "碧水东流至此回。", "两岸青山相对出，", "孤帆一片日边来。"],py:["tiān mén zhōng duàn chǔ jiāng kāi，", "bì shuǐ dōng liú zhì cǐ huí。", "liǎng àn qīng shān xiāng duì chū，", "gū fān yī piàn rì biān lái。"],s:"天门山被长江从中劈开，碧绿的江水向东流到这里回旋。两岸青山隔江相对耸立，一片孤帆从日边驶来。"},
        {e:"🍂",title:"秋浦歌",author:"李白",dynasty:"唐",lines:["白发三千丈，", "缘愁似个长。", "不知明镜里，", "何处得秋霜。"],py:["bái fà sān qiān zhàng，", "yuán chóu shì gè zhǎng。", "bù zhī míng jìng lǐ，", "hé chù dé qiū shuāng。"],s:"白发长达三千丈，只因愁绪也这般长。对着明镜不知，哪里来的满头秋霜。"},
        {e:"🏯",title:"夜宿山寺",author:"李白",dynasty:"唐",lines:["危楼高百尺，", "手可摘星辰。", "不敢高声语，", "恐惊天上人。"],py:["wēi lóu gāo bǎi chǐ，", "shǒu kě zhāi xīng chén。", "bù gǎn gāo shēng yǔ，", "kǒng jīng tiān shàng rén。"],s:"山顶寺庙高楼百尺，伸手仿佛能摘星辰。不敢大声说话，怕惊动了天上的人。"},
        {e:"🎵",title:"春夜洛城闻笛",author:"李白",dynasty:"唐",lines:["谁家玉笛暗飞声，", "散入春风满洛城。", "此夜曲中闻折柳，", "何人不起故园情。"],py:["shuí jiā yù dí àn fēi shēng，", "sàn rù chūn fēng mǎn luò chéng。", "cǐ yè qǔ zhōng wén zhé liǔ，", "hé rén bù qǐ gù yuán qíng。"],s:"谁家玉笛悄悄响起，随春风飘满洛阳城。今夜曲中听见《折杨柳》，谁不涌起思乡之情。"},
        {e:"⛰",title:"登飞来峰",author:"王安石",dynasty:"宋",lines:["飞来山上千寻塔，", "闻说鸡鸣见日升。", "不畏浮云遮望眼，", "自缘身在最高层。"],py:["fēi lái shān shàng qiān xún tǎ，", "wén shuō jī míng jiàn rì shēng。", "bù wèi fú yún zhē wàng yǎn，", "zì yuán shēn zài zuì gāo céng。"],s:"飞来峰上耸立千寻高塔，听说鸡鸣时可见日出。不怕浮云遮住远望的眼，只因我站在最高层。"},
        {e:"🌸",title:"梅花",author:"王安石",dynasty:"宋",lines:["墙角数枝梅，", "凌寒独自开。", "遥知不是雪，", "为有暗香来。"],py:["qiáng jiǎo shù zhī méi，", "líng hán dú zì kāi。", "yáo zhī bú shì xuě，", "wèi yǒu àn xiāng lái。"],s:"墙角几枝梅花，冒着严寒独自开放。远远看去知道不是雪，因为有暗香飘来。"},
        {e:"🏡",title:"书湖阴先生壁",author:"王安石",dynasty:"宋",lines:["茅檐长扫净无苔，", "花木成畦手自栽。", "一水护田将绿绕，", "两山排闼送青来。"],py:["máo yán zhǎng sǎo jìng wú tái，", "huā mù chéng qí shǒu zì zāi。", "yī shuǐ hù tián jiāng lǜ rào，", "liǎng shān pái tà sòng qīng lái。"],s:"茅屋檐下常打扫没有青苔，花木成行是主人亲手栽。一条溪水环绕绿田，两座青山推门送来青翠。"},
        {e:"🦆",title:"惠崇春江晚景",author:"苏轼",dynasty:"宋",lines:["竹外桃花三两枝，", "春江水暖鸭先知。", "蒌蒿满地芦芽短，", "正是河豚欲上时。"],py:["zhú wài táo huā sān liǎng zhī，", "chūn jiāng shuǐ nuǎn yā xiān zhī。", "lóu hāo mǎn dì lú yá duǎn，", "zhèng shì hé tún yù shàng shí。"],s:"竹林外桃花开了两三枝，春江水温鸭子最先知晓。蒌蒿遍地芦芽才冒尖，正是河豚将要逆流而上时。"},
        {e:"🌙",title:"春宵",author:"苏轼",dynasty:"宋",lines:["春宵一刻值千金，", "花有清香月有阴。", "歌管楼台声细细，", "秋千院落夜沉沉。"],py:["chūn xiāo yī kè zhí qiān jīn，", "huā yǒu qīng xiāng yuè yǒu yīn。", "gē guǎn lóu tái shēng xì xì，", "qiū qiān yuàn luò yè chén chén。"],s:"春夜一刻值千金，花儿清香月亮朦胧。楼台歌声细细，秋千院落夜色深沉。"},
        {e:"⚓",title:"念奴娇·赤壁怀古（节选）",author:"苏轼",dynasty:"宋",lines:["大江东去，", "浪淘尽，", "千古风流人物。"],py:["dà jiāng dōng qù，", "làng táo jǐn，", "qiān gǔ fēng liú rén wù。"],s:"大江向东奔流，巨浪淘洗尽，千古英雄豪杰。"},
        {e:"🌸",title:"一剪梅",author:"李清照",dynasty:"宋",lines:["红藕香残玉簟秋。", "轻解罗裳，", "独上兰舟。", "云中谁寄锦书来？", "雁字回时，", "月满西楼。"],py:["hóng ǒu xiāng cán yù diàn qiū。", "qīng jiě luó shang，", "dú shàng lán zhōu。", "yún zhōng shuí jì jǐn shū lái？", "yàn zì huí shí，", "yuè mǎn xī lóu。"],s:"红荷凋残竹席生秋凉。轻轻换衣，独自登上小船。云中谁寄来书信？大雁飞回时，月光洒满西楼。"},
        {e:"🍂",title:"声声慢（节选）",author:"李清照",dynasty:"宋",lines:["寻寻觅觅，", "冷冷清清，", "凄凄惨惨戚戚。"],py:["xún xún mì mì，", "lěng lěng qīng qīng，", "qī qī cǎn cǎn qī qī。"],s:"寻寻觅觅心中空虚，冷冷清清无人相伴，凄凄惨惨满心愁戚。"},
        {e:"⚔",title:"破阵子（节选）",author:"辛弃疾",dynasty:"宋",lines:["醉里挑灯看剑，", "梦回吹角连营。"],py:["zuì lǐ tiǎo dēng kàn jiàn，", "mèng huí chuī jiǎo lián yíng。"],s:"醉酒中挑亮灯看宝剑，梦里回到号角连天的军营。"},
        {e:"😔",title:"丑奴儿",author:"辛弃疾",dynasty:"宋",lines:["少年不识愁滋味，", "爱上层楼。", "爱上层楼，", "为赋新词强说愁。"],py:["shào nián bù shí chóu zī wèi，", "ài shàng céng lóu。", "ài shàng céng lóu，", "wèi fù xīn cí qiáng shuō chóu。"],s:"年少不懂忧愁，偏爱登楼。偏爱登楼，为了写词硬说愁。"},
        {e:"🏯",title:"永遇乐·京口北固亭怀古（节选）",author:"辛弃疾",dynasty:"宋",lines:["千古江山，", "英雄无觅孙仲谋处。"],py:["qiān gǔ jiāng shān，", "yīng xióng wú mì sūn zhòng móu chù。"],s:"千古江山依旧，却难寻像孙权那样的英雄踪迹。"},
        {e:"🌺",title:"游园不值",author:"叶绍翁",dynasty:"宋",lines:["应怜屐齿印苍苔，", "小扣柴扉久不开。", "春色满园关不住，", "一枝红杏出墙来。"],py:["yīng lián jī chǐ yìn cāng tái，", "xiǎo kòu chái fēi jiǔ bù kāi。", "chūn sè mǎn yuán guān bú zhù，", "yī zhī hóng xìng chū qiáng lái。"],s:"大概是爱惜青苔怕木屐踩坏，轻敲门扉许久没人开。满园春色关不住，一枝红杏探出墙来。"},
        {e:"🍂",title:"夜书所见",author:"叶绍翁",dynasty:"宋",lines:["萧萧梧叶送寒声，", "江上秋风动客情。", "知有儿童挑促织，", "夜深篱落一灯明。"],py:["xiāo xiāo wú yè sòng hán shēng，", "jiāng shàng qiū fēng dòng kè qíng。", "zhī yǒu ér tóng tiāo cù zhī，", "yè shēn lí luò yī dēng míng。"],s:"梧桐叶萧萧送来寒意，江上秋风牵动旅人思乡情。料想有孩童在捉蟋蟀，夜深篱笆下还亮着一盏灯。"},
        {e:"🌸",title:"春日",author:"朱熹",dynasty:"宋",lines:["胜日寻芳泗水滨，", "无边光景一时新。", "等闲识得东风面，", "万紫千红总是春。"],py:["shèng rì xún fāng sì shuǐ bīn，", "wú biān guāng jǐng yī shí xīn。", "děng xián shí dé dōng fēng miàn，", "wàn zǐ qiān hóng zǒng shì chūn。"],s:"晴好日子到泗水边踏青，无边风光一时焕然一新。随处认得春风面貌，万紫千红都是春。"},
        {e:"💧",title:"观书有感",author:"朱熹",dynasty:"宋",lines:["半亩方塘一鉴开，", "天光云影共徘徊。", "问渠那得清如许？", "为有源头活水来。"],py:["bàn mǔ fāng táng yī jiàn kāi，", "tiān guāng yún yǐng gòng pái huái。", "wèn qú nà dé qīng rú xǔ？", "wèi yǒu yuán tóu huó shuǐ lái。"],s:"半亩方塘像明镜敞开，天光云影在其中徘徊。问它为何这样清澈？因为有活水从源头流来。"},
        {e:"🏯",title:"题临安邸",author:"林升",dynasty:"宋",lines:["山外青山楼外楼，", "西湖歌舞几时休？", "暖风熏得游人醉，", "直把杭州作汴州。"],py:["shān wài qīng shān lóu wài lóu，", "xī hú gē wǔ jǐ shí xiū？", "nuǎn fēng xūn dé yóu rén zuì，", "zhí bǎ háng zhōu zuò biàn zhōu。"],s:"山外有青山楼外有楼，西湖的歌舞几时停休？暖风把游人熏得陶醉，简直把杭州当成了汴州。"},
        {e:"🌊",title:"秋夜将晓出篱门迎凉有感",author:"陆游",dynasty:"宋",lines:["三万里河东入海，", "五千仞岳上摩天。", "遗民泪尽胡尘里，", "南望王师又一年。"],py:["sān wàn lǐ hé dōng rù hǎi，", "wǔ qiān rèn yuè shàng mó tiān。", "yí mín lèi jǐn hú chén lǐ，", "nán wàng wáng shī yòu yī nián。"],s:"三万里黄河东流入海，五千仞华山高耸接天。沦陷区百姓在胡尘中哭干眼泪，南望宋军又空等一年。"},
        {e:"🌧",title:"十一月四日风雨大作",author:"陆游",dynasty:"宋",lines:["僵卧孤村不自哀，", "尚思为国戍轮台。", "夜阑卧听风吹雨，", "铁马冰河入梦来。"],py:["jiāng wò gū cūn bù zì āi，", "shàng sī wèi guó shù lún tái。", "yè lán wò tīng fēng chuī yǔ，", "tiě mǎ bīng hé rù mèng lái。"],s:"僵卧孤村却不自伤悲，还想着为国守卫边疆。夜深躺听风雨声，铁马冰河闯入梦中。"},
        {e:"🏡",title:"游山西村（节选）",author:"陆游",dynasty:"宋",lines:["莫笑农家腊酒浑，", "丰年留客足鸡豚。", "山重水复疑无路，", "柳暗花明又一村。"],py:["mò xiào nóng jiā là jiǔ hún，", "fēng nián liú kè zú jī tún。", "shān chóng shuǐ fù yí wú lù，", "liǔ àn huā míng yòu yī cūn。"],s:"别笑农家的酒浑，丰收年景备足鸡豚待客。山重水绕正疑无路，柳绿花红又现一村。"},
        {e:"🐝",title:"蜂",author:"罗隐",dynasty:"唐",lines:["不论平地与山尖，", "无限风光尽被占。", "采得百花成蜜后，", "为谁辛苦为谁甜？"],py:["bù lùn píng dì yǔ shān jiān，", "wú xiàn fēng guāng jǐn bèi zhàn。", "cǎi dé bǎi huā chéng mì hòu，", "wèi shuí xīn kǔ wèi shuí tián？"],s:"不论平地还是山顶，无限风光都被蜜蜂占遍。采尽百花酿成蜜，到底为谁辛苦为谁甜？"},
        {e:"⚓",title:"赤壁",author:"杜牧",dynasty:"唐",lines:["折戟沉沙铁未销，", "自将磨洗认前朝。", "东风不与周郎便，", "铜雀春深锁二乔。"],py:["zhé jǐ chén shā tiě wèi xiāo，", "zì jiāng mó xǐ rèn qián cháo。", "dōng fēng bù yǔ zhōu láng biàn，", "tóng què chūn shēn suǒ èr qiáo。"],s:"断戟沉在沙里铁还没锈，磨洗后认出是前朝遗物。若东风不给周瑜方便，二乔早被锁进铜雀台。"},
        {e:"🛶",title:"泊秦淮",author:"杜牧",dynasty:"唐",lines:["烟笼寒水月笼沙，", "夜泊秦淮近酒家。", "商女不知亡国恨，", "隔江犹唱后庭花。"],py:["yān lóng hán shuǐ yuè lóng shā，", "yè pō qín huái jìn jiǔ jiā。", "shāng nǚ bù zhī wáng guó hèn，", "gé jiāng yóu chàng hòu tíng huā。"],s:"烟雾笼罩寒水月色铺沙，夜泊秦淮靠近酒家。歌女不懂亡国之恨，隔着江还在唱《后庭花》。"},
        {e:"🌸",title:"江南春",author:"杜牧",dynasty:"唐",lines:["千里莺啼绿映红，", "水村山郭酒旗风。", "南朝四百八十寺，", "多少楼台烟雨中。"],py:["qiān lǐ yīng tí lǜ yìng hóng，", "shuǐ cūn shān guō jiǔ qí fēng。", "nán cháo sì bǎi bā shí sì，", "duō shǎo lóu tái yān yǔ zhōng。"],s:"千里江南黄莺啼鸣绿映红，水乡山城酒旗迎风。南朝四百八十座寺庙，多少楼台笼罩在烟雨中。"},
        {e:"🌌",title:"秋夕",author:"杜牧",dynasty:"唐",lines:["银烛秋光冷画屏，", "轻罗小扇扑流萤。", "天阶夜色凉如水，", "卧看牵牛织女星。"],py:["yín zhú qiū guāng lěng huà píng，", "qīng luó xiǎo shàn pū liú yíng。", "tiān jiē yè sè liáng rú shuǐ，", "wò kàn qiān niú zhī nǚ xīng。"],s:"银烛秋光冷照画屏，轻罗小扇扑打流萤。夜色凉如水，卧看牵牛织女星。"},
        {e:"🌊",title:"望洞庭",author:"刘禹锡",dynasty:"唐",lines:["湖光秋月两相和，", "潭面无风镜未磨。", "遥望洞庭山水翠，", "白银盘里一青螺。"],py:["hú guāng qiū yuè liǎng xiāng hé，", "tán miàn wú fēng jìng wèi mó。", "yáo wàng dòng tíng shān shuǐ cuì，", "bái yín pán lǐ yī qīng luó。"],s:"湖光与秋月交融，潭面无风像未磨的镜。远望洞庭山水青翠，好似白银盘里一只青螺。"},
        {e:"🌊",title:"浪淘沙",author:"刘禹锡",dynasty:"唐",lines:["九曲黄河万里沙，", "浪淘风簸自天涯。", "如今直上银河去，", "同到牵牛织女家。"],py:["jiǔ qū huáng hé wàn lǐ shā，", "làng táo fēng bǒ zì tiān yá。", "rú jīn zhí shàng yín hé qù，", "tóng dào qiān niú zhī nǚ jiā。"],s:"九曲黄河裹挟万里黄沙，浪淘风簸来自天涯。如今要直上银河去，一同到牵牛织女的家。"}
      ]},

      china:[      {id:"heilongjiang",name:"黑龙江",full:"黑龙江",abbr:"黑",capital:"哈尔滨",region:"东北",x:790,y:60,story:"金朝、清朝的发祥地，中东铁路枢纽，哈尔滨被誉为“东方莫斯科”。",origin:"因黑龙江（河流）而得名。",sites:"五大连池、圣索菲亚教堂、镜泊湖。",univ:"哈尔滨工业大学、哈尔滨工程大学。",geo:"北部和东部与俄罗斯接壤，有大小兴安岭林海。",war:"1932年哈尔滨沦陷；东北抗日联军在杨靖宇、赵尚志领导下在此浴血奋战。"},
      {id:"jilin",name:"吉林",full:"吉林",abbr:"吉",capital:"长春",region:"东北",x:790,y:126,story:"清代“吉林乌拉”意为沿江，伪满洲国曾定都新京（长春）。",origin:"满语“吉林乌拉”意为“沿江的城池”。",sites:"长白山天池、伪满皇宫、松花湖。",univ:"吉林大学。",geo:"有长白山、松花江，与朝鲜、俄罗斯接壤。",war:"杨靖宇将军在靖宇县壮烈牺牲，东北抗联在林海雪原坚持抗战。"},
      {id:"liaoning",name:"辽宁",full:"辽宁",abbr:"辽",capital:"沈阳",region:"东北",x:790,y:192,story:"清王朝“龙兴之地”，沈阳故宫所在地，九一八事变爆发地。",origin:"取“辽河流域安宁”之意。",sites:"沈阳故宫、九一八历史博物馆、大连海滨。",univ:"大连理工大学、东北大学。",geo:"南临黄海、渤海，有辽河平原。",war:"1931年九一八事变在沈阳发生，日军由此侵占东北。"},
      {id:"neimenggu",name:"内蒙古",full:"内蒙古",abbr:"内蒙古",capital:"呼和浩特",region:"华北",x:450,y:120,story:"草原丝路要冲，成吉思汗在此崛起，元朝发祥于漠北。",origin:"清代指长城以北蒙古各部，意为“漠南蒙古”。",sites:"成吉思汗陵、响沙湾、元上都遗址。",univ:"内蒙古大学。",geo:"横跨东北、华北、西北，有呼伦贝尔大草原。",war:"大青山抗日游击根据地在此长期坚持斗争。"},
      {id:"beijing",name:"北京",full:"北京",abbr:"京",capital:"北京",region:"华北",x:558,y:120,story:"元、明、清三代都城，五四运动、开国大典在此发生。",origin:"明初改称“北京”，意为“北方的京城”。",sites:"故宫、长城、天坛。",univ:"北京大学、清华大学、中国人民大学。",geo:"位于华北平原北端，背靠燕山。",war:"1937年卢沟桥事变（七七事变）在此爆发，全面抗战由此开始。"},
      {id:"tianjin",name:"天津",full:"天津",abbr:"津",capital:"天津",region:"华北",x:450,y:186,story:"近代通商口岸，平津战役中解放。",origin:"明成祖“天子渡津”而得名“天津”。",sites:"五大道、古文化街、天津之眼。",univ:"南开大学、天津大学。",geo:"海河五大支流汇口，东临渤海。",war:"平津战役中天津解放，北平（北京）和平改编。"},
      {id:"hebei",name:"河北",full:"河北",abbr:"冀",capital:"石家庄",region:"华北",x:558,y:186,story:"燕赵大地，战国时燕国、赵国在此建都，荆轲刺秦的故事发生于此。",origin:"因地处黄河以北而得名“河北”。",sites:"承德避暑山庄、山海关、赵州桥。",univ:"河北工业大学、燕山大学。",geo:"西倚太行山，东临渤海，有华北平原。",war:"1941年侵华日军制造潘家峪惨案，屠杀村民千余人。"},
      {id:"shanxi",name:"山西",full:"山西",abbr:"晋",capital:"太原",region:"华北",x:450,y:252,story:"春秋晋国故地，太原为北方军事重镇，平型关大捷在此打响。",origin:"因位于太行山以西而得名“山西”。",sites:"云冈石窟、平遥古城、应县木塔。",univ:"山西大学、太原理工大学。",geo:"表里山河，黄河绕其西，太行立其东。",war:"1937年平型关战役八路军首胜日军；忻口会战在此激战。"},
      {id:"xinjiang",name:"新疆",full:"新疆",abbr:"新",capital:"乌鲁木齐",region:"西北",x:180,y:150,story:"古丝绸之路枢纽，汉唐西域都护府所在，左宗棠收复新疆。",origin:"清代设省，“新疆”意为“故土新归”。",sites:"天山天池、喀纳斯、交河故城。",univ:"新疆大学。",geo:"三山夹两盆（天山、昆仑、阿尔泰；塔里木、准噶尔盆地）。",war:"抗战时期新疆是国际援华物资通道（西北国际通道）的重要节点。"},
      {id:"gansu",name:"甘肃",full:"甘肃",abbr:"甘",capital:"兰州",region:"西北",x:288,y:150,story:"河西走廊咽喉，丝绸之路重镇，敦煌莫高窟所在。",origin:"取甘州（张掖）、肃州（酒泉）二地首字。",sites:"莫高窟、嘉峪关、麦积山。",univ:"兰州大学。",geo:"地形狭长，祁连山、河西走廊贯穿。",war:"兰州曾是抗战大后方与苏联援华通道的重要节点。"},
      {id:"ningxia",name:"宁夏",full:"宁夏",abbr:"宁",capital:"银川",region:"西北",x:180,y:216,story:"西夏王朝都城兴庆府（银川），“塞上江南”。",origin:"元代设“宁夏府路”，意为“安宁西夏”。",sites:"西夏王陵、沙湖、贺兰山岩画。",univ:"宁夏大学。",geo:"黄河穿境，有河套平原。",war:"抗战时期宁夏军民坚守黄河防线。"},
      {id:"qinghai",name:"青海",full:"青海",abbr:"青",capital:"西宁",region:"西北",x:288,y:216,story:"三江源所在，文成公主进藏经此，吐谷浑故地。",origin:"因青海湖而得名。",sites:"青海湖、塔尔寺、可可西里。",univ:"青海大学。",geo:"地处青藏高原东北部，长江、黄河、澜沧江源头。",war:"抗战时期青海出兵抗战，驼峰航线经其南缘。"},
      {id:"shaanxi",name:"陕西",full:"陕西",abbr:"陕",capital:"西安",region:"西北",x:180,y:282,story:"十三朝古都长安所在，秦始皇统一六国，西安事变在此发生。",origin:"取陕原（今河南陕县以西）之西而得名。",sites:"兵马俑、大雁塔、华清池、延安。",univ:"西安交通大学、西北工业大学。",geo:"有秦岭、渭河平原（关中）。",war:"延安是抗战时期中共中央所在地；西安事变促成国共合作抗日。"},
      {id:"xizang",name:"西藏",full:"西藏",abbr:"藏",capital:"拉萨",region:"西南",x:250,y:400,story:"吐蕃王朝故地，文成公主入藏，布达拉宫所在。",origin:"“西藏”意为“西方的宝藏”（清代称谓）。",sites:"布达拉宫、大昭寺、珠穆朗玛峰。",univ:"西藏大学。",geo:"世界屋脊青藏高原，有喜马拉雅山脉。",war:"抗战时期西藏各界捐款捐物支援前线。"},
      {id:"sichuan",name:"四川",full:"四川",abbr:"川",capital:"成都",region:"西南",x:358,y:400,story:"三国蜀汉都城，都江堰造就天府之国，抗战中重庆为陪都。",origin:"北宋设“川峡四路”而得名“四川”。",sites:"都江堰、九寨沟、峨眉山、三星堆。",univ:"四川大学、电子科技大学。",geo:"有成都平原、长江（川江）、峨眉山。",war:"1937年南京沦陷后川军出川抗战，牺牲巨大；李庄接纳内迁文化机构。"},
      {id:"chongqing",name:"重庆",full:"重庆",abbr:"渝",capital:"重庆",region:"西南",x:250,y:466,story:"抗战时期国民政府“陪都”，红岩精神发源地。",origin:"南宋淳祐“双重喜庆”而得名“重庆”。",sites:"大足石刻、洪崖洞、渣滓洞。",univ:"重庆大学。",geo:"长江与嘉陵江交汇，是一座山城。",war:"作为抗战陪都遭日军“重庆大轰炸”，军民意志不屈。"},
      {id:"yunnan",name:"云南",full:"云南",abbr:"云",capital:"昆明",region:"西南",x:358,y:466,story:"西南联大南迁昆明，滇缅公路、驼峰航线是生命线。",origin:"因“彩云之南”而得名“云南”。",sites:"丽江古城、石林、洱海。",univ:"云南大学。",geo:"有滇池、横断山脉、西双版纳。",war:"滇西抗战（松山、腾冲）中国军队反攻收复失地。"},
      {id:"guizhou",name:"贵州",full:"贵州",abbr:"贵",capital:"贵阳",region:"西南",x:250,y:532,story:"遵义会议在此召开，确立了毛泽东同志的领导地位。",origin:"因贵山而得名“贵州”。",sites:"黄果树瀑布、梵净山、荔波。",univ:"贵州大学。",geo:"地处云贵高原，喀斯特地貌，有乌江。",war:"黔南事变中日寇侵入独山，遭当地军民奋勇抗击。"},
      {id:"shandong",name:"山东",full:"山东",abbr:"鲁",capital:"济南",region:"华东",x:630,y:300,story:"孔孟之乡，齐鲁文化发源地，台儿庄战役大捷。",origin:"因在太行山以东而得名“山东”。",sites:"泰山、孔庙、趵突泉。",univ:"山东大学、中国海洋大学。",geo:"有泰山、黄河入海口、濒临黄海渤海。",war:"1938年台儿庄战役歼敌万余，是抗战重大胜利。"},
      {id:"henan",name:"河南",full:"河南",abbr:"豫",capital:"郑州",region:"华东",x:738,y:300,story:"中原腹地，洛阳、开封古都，少林武术发源地。",origin:"因在黄河以南而得名“河南”。",sites:"龙门石窟、少林寺、殷墟。",univ:"郑州大学。",geo:"有嵩山、黄河、华北平原。",war:"1944年豫湘桂战役中河南大片国土沦陷；中原儿女踊跃抗战。"},
      {id:"anhui",name:"安徽",full:"安徽",abbr:"皖",capital:"合肥",region:"华东",x:846,y:300,story:"徽商故里，黄山白岳，李鸿章、胡适的故乡。",origin:"取安庆、徽州二地首字。",sites:"黄山、九华山、宏村。",univ:"中国科学技术大学、合肥工业大学。",geo:"有黄山、长江、巢湖。",war:"1941年皖南事变，新四军在此遭国民党顽固派围攻。"},
      {id:"jiangsu",name:"江苏",full:"江苏",abbr:"苏",capital:"南京",region:"华东",x:630,y:366,story:"六朝古都南京，民国首都，江南繁华之地。",origin:"取江宁、苏州二地首字。",sites:"中山陵、苏州园林、夫子庙。",univ:"南京大学、东南大学。",geo:"有长江、太湖、江南水乡。",war:"1937年南京大屠杀，日军屠城三十万，勿忘国耻。"},
      {id:"shanghai",name:"上海",full:"上海",abbr:"沪",capital:"上海",region:"华东",x:738,y:366,story:"近代远东第一大都市，中共一大会址、淞沪会战。",origin:"古为海边渔村，宋代设镇。",sites:"外滩、东方明珠、豫园。",univ:"复旦大学、上海交通大学。",geo:"长江入海口，黄浦江穿城而过。",war:"1937年淞沪会战粉碎日军“三个月亡华”的企图。"},
      {id:"zhejiang",name:"浙江",full:"浙江",abbr:"浙",capital:"杭州",region:"华东",x:846,y:366,story:"南宋都城临安（杭州），西湖人文荟萃，鲁迅故乡。",origin:"因钱塘江（浙江）而得名。",sites:"西湖、灵隐寺、乌镇。",univ:"浙江大学。",geo:"有西湖、钱塘江、雁荡山。",war:"1942年浙赣战役中日军实施细菌战残害百姓。"},

  const grid = document.getElementById("themeGrid");
  categories.forEach(cat=>{
    const card = document.createElement("div");

      <span class="ribbon" style="background:${cat.color}">GO!</span>

    grid.appendChild(card);

  // 进入一级目录 → 展示其下的子栏目（英语/韩语/日语、诗词、或闯关）
  function openCategory(catId){
    if(catId==='challenge'){ switchTab('challenge'); return; }
    const cat = categories.find(c=>c.id===catId);
    if(!cat) return;
    const cards = cat.themes.map(k=>{
      const t = themes[k];
      return `
        <div class="theme-card" style="border-color:${t.light}" onclick="openTheme('${k}')">
          <span class="ribbon" style="background:${t.color}">GO!</span>
          <span class="big-emoji">${t.emoji}</span>
          <div class="tc-name">${t.name}</div>
          <div class="tc-sub">${t.sub}</div>
          <span class="go">进入学习 →</span>
        </div>`;
    }).join("");
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${cat.color},${shade(cat.color)});">
        <span class="b-emoji">${cat.emoji}</span>
        <div>
          <div class="b-title">${cat.name}</div>
          <div class="b-sub">${cat.sub}</div>
        </div>
      </div>
      <div class="grid">${cards}</div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  const detail = document.getElementById("detail");

  function openTheme(key){
    const t = themes[key];
    if(t.type==='poems'){ openPoemTheme(t, key); return; }
    if(t.type==='world'){ openWorld(t, key); return; }
    if(t.type==='astro'){ openAstro(t, key); return; }
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">
        <span class="b-emoji">${t.emoji}</span>
        <div>
          <div class="b-title">${t.name}</div>
          <div class="b-sub">${t.sub} · 跟着读一读吧</div>
        </div>
        <span class="b-badge">⭐ ${t.badge}</span>
      </div>
      <div class="grid ${t.type==='letters'?'grid-letters':''}">
        ${renderCards(t, key)}
      </div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    document.getElementById("grow").classList.remove("active");
    detail.style.display="";
    detail.classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderCards(t, key){
    if(t.type==='letters'){
      return t.letters.map(L=>`
        <div class="wc" onclick="speakLetter('${L}')">
          <div class="circle letter-circle" style="background:${t.light};color:${t.color}">${L}${L.toLowerCase()}</div>
          <div class="tap">🔊 点我听</div>
        </div>`).join("");
    }
    // 英语单词含 w.s（日常口语）；韩语/日语无 s，改为显示罗马音 w.py
    return t.words.map((w,i)=>`
      <div class="wc" onclick="openWord('${key}', ${i})">
        <div class="circle" style="background:${t.light}">${w.e}</div>
        <div class="word" style="color:${t.color}">${w.w}</div>
        <div class="mean" style="color:${t.color}">${w.m}</div>
        ${w.py ? `<div class="rom">${w.py}</div>` : ``}
        <div class="tap">🔊 点我听</div>
        ${w.s ? `<div class="sent" onclick="event.stopPropagation();speakSentence('${key}',${i})">
          <span class="sent-btn">💬 日常口语</span>
          <span class="sent-txt">${w.s}</span>
        </div>` : ``}
      </div>`).join("");
  }

  // ============ 天文科学：宇宙 / 星球 / 星座 三主题切换 ============
  function openAstro(t, key){
    function sectionHTML(sec){
      return `
        <div class="astro-sec-title">${sec.emoji} ${sec.name} · ${sec.en}</div>
        <div class="grid grid-astro">
          ${sec.items.map(it=>`
            <div class="wc" onclick="speak('${it.en}')">
              <div class="circle" style="background:${t.light}">${it.e}</div>
              <div class="word" style="color:${t.color}">${it.en}</div>
              <div class="mean" style="color:${t.color}">${it.zh}</div>
              <div class="tap">🔊 点我听</div>
              <div class="fact">💡 ${it.fact}</div>
            </div>`).join("")}
        </div>`;
    }
    function show(idx){
      const sec = t.sections[idx];
      const tabs = t.sections.map((s,i)=>`
        <button class="astro-tab ${i===idx?'active':''}" onclick="renderAstroSection(${i})">
          <span class="te">${s.emoji}</span>${s.name}
        </button>`).join("");
      detail.innerHTML = `
        <button class="back" onclick="goHome()">← 返回首页</button>
        <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">
          <span class="b-emoji">${t.emoji}</span>
          <div>
            <div class="b-title">${t.name}</div>
            <div class="b-sub">${t.sub} · 跟着读一读吧</div>
          </div>
          <span class="b-badge">⭐ ${t.badge}</span>
        </div>
        <div class="astro-tabs">${tabs}</div>
        <div id="astroBody">${sectionHTML(sec)}</div>`;
      document.getElementById("home").style.display="none";
      document.getElementById("challenge").classList.remove("active");
      document.getElementById("grow").classList.remove("active");
      detail.style.display="";
      detail.classList.add("active");
      window.scrollTo({top:0,behavior:"smooth"});
    }
    window.renderAstroSection = function(i){ show(i); };
    show(0);
  }

  function goHome(){

  function openWorld(t,key,selId){
    curWorldTheme=t; curWorldKey=key;
    const contSvg = t.continents.map(c=>{
      const sh = CONT_SHAPES[c.id]||{d:"",lx:0,ly:0,full:c.name};
      const sel = (c.id===selId) ? ' sel' : '';
      return `<g class="cont${sel}" onclick="selectContinent('${c.id}')">
        <path d="${sh.d}" fill="${c.color}"></path>
        <text class="clabel" x="${sh.lx}" y="${sh.ly}">${c.emoji} ${c.name}</text>
      </g>`;
    }).join("");
    let below="";
    if(selId){
      const c = t.continents.find(x=>x.id===selId);
      if(c){
        const grid = c.countries.map(co=>`<div class="country-card" onclick="selectCountry('${c.id}','${co.id}')">

          <div class="ccap">首都 ${co.capital}</div></div>`).join("");

  function selectContinent(id){ openWorld(curWorldTheme, curWorldKey, id); }
  function selectCountry(contId, coId){

  // ============ 国文学习：诗词列表 + 作者搜索 + 上次学习作者默认 ============
  // 安全读写 localStorage：部分环境（file:// 直接打开、某些 WebView、隐私模式）下
  // localStorage 会抛 SecurityError，必须吞掉异常，否则会中断整个渲染导致页面空白。
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  let curPoemTheme=null, curPoemKey=null, curPoemAuthors=[], curPoemLines=[], curPoemTitle='';
  let poemFilterState = {q:'', author:null};
  function openPoemTheme(t, key){
    curPoemTheme=t; curPoemKey=key;
    const authors = [...new Set(t.poems.map(p=>p.author))].filter(Boolean);
    const stored = lsGet('lastPoemAuthor') || '';
    // 不搜索时，默认显示上次学习的作者；无记录则显示全部
    poemFilterState.author = (stored && authors.indexOf(stored)>=0) ? stored : null;
    poemFilterState.q = poemFilterState.author || '';
    curPoemAuthors = authors;
    detail.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="banner" style="background:linear-gradient(120deg,${t.color},${shade(t.color)});">

          <div class="b-sub">${t.sub} · 跟着读一读吧</div>

      </div>
      <div class="poem-search">
        <input id="poemSearch" class="ps-input" placeholder="搜索诗词标题 / 作者…" value="${poemFilterState.q}" oninput="poemSearchInput(this.value)" />
        <div class="author-chips" id="authorChips"></div>
      </div>
      <div class="grid" id="poemGrid"></div>`;
    document.getElementById("home").style.display="none";
    document.getElementById("challenge").classList.remove("active");
    document.getElementById("grow").classList.remove("active");
    detail.style.display="";
    detail.classList.add("active");

  function renderAuthorChips(){
    const box = document.getElementById('authorChips'); if(!box) return;
    const chips = ['__all__'].concat(curPoemAuthors);
    box.innerHTML = chips.map(a=>{
      const label = a==='__all__' ? '全部' : a;
      const active = (a==='__all__')
        ? (!poemFilterState.author && !poemFilterState.q)
        : (poemFilterState.author===a);
      return `<span class="achip${active?' active':''}" onclick="selectPoemAuthor('${a}')">${label}</span>`;
    }).join("");
  }
  function renderPoemGrid(){
    const t=curPoemTheme, key=curPoemKey; if(!t) return;
    const q=(poemFilterState.q||'').toLowerCase();
    const au=poemFilterState.author;
    let list=t.poems.map((p,i)=>({p,i}));
    if(au){ list=list.filter(o=>o.p.author===au); }
    else if(q){ list=list.filter(o=>(o.p.title||'').toLowerCase().includes(q)||(o.p.author||'').toLowerCase().includes(q)); }
    const grid=document.getElementById('poemGrid'); if(!grid) return;
    if(!list.length){
      grid.innerHTML=`<div class="empty">没有找到相关诗词，换个关键词试试～</div>`;
      return;
    }
    grid.innerHTML = list.map(o=>`
      <div class="wc" onclick="openPoem('${key}', ${o.i})">
        <div class="circle" style="background:${t.light}">${o.p.e||'📜'}</div>
        <div class="word" style="color:${t.color}">${o.p.title}</div>
        <div class="mean" style="color:${t.color}">${o.p.author}</div>
        <div class="tap">📖 点我读</div>
      </div>`).join("");
  }
  function poemSearchInput(v){
    poemFilterState.q = v.trim();
    poemFilterState.author = null;   // 自由搜索优先于作者过滤
    renderAuthorChips();
    renderPoemGrid();
  }
  function selectPoemAuthor(a){
    if(a==='__all__'){ poemFilterState.author=null; poemFilterState.q=''; }
    else { poemFilterState.author=a; poemFilterState.q=a; }
    const inp=document.getElementById('poemSearch'); if(inp) inp.value=poemFilterState.q;
    renderAuthorChips();
    renderPoemGrid();
  }

  // ============ 发音引擎（桌面 / 平板 / 手机 通用 · 本地音频优先） ============
  // 根因：平板（多为 iPad）无法播放在线有道音频，且对 <audio> 元素程序化播放
  //       常有静默拦截。解决方案：
  //       ① 所有发音预下载为本地文件 /study/audio/*.mp3(.wav)；
  //       ② 主播放改用 Web Audio API（fetch→decode→播放），绕开 <audio> 限制，iPad 友好；
  //       ③ 失败再降级 <audio> 元素、在线有道、浏览器 TTS。

  // ============ 在线 TTS 源（每种语言双源兜底）============
  // ⚠️ 2026-08-03 实测结论（勿轻易改回）：
  //   ① 有道 dictvoice 的 type=2 已废弃，返回 500 {"msg":"returned null audio"}；
  //   ② 有道 le=zh 仅对词典内已收录词条有效，整句古诗（如「床前明月光」）稳定 500；
  //   ③ 百度 gettts 对中/英/日/韩整句（含标点）均返回真实 mp3，故作为主源；
  //   ④ 有道 le=jap / le=ko 对日韩单词可用，作为第二源。
  const BD_LAN = { 'zh-CN':'zh', 'en-US':'en', 'ja-JP':'jp',  'ko-KR':'kor' };
  const YD_LE  = { 'zh-CN':'zh', 'en-US':'',   'ja-JP':'jap', 'ko-KR':'ko'  };

  // 百度 TTS（主源）：整句可用
  const BDT = (t, lang) =>
    'https://fanyi.baidu.com/gettts?lan=' + (BD_LAN[lang] || 'zh') +
    '&text=' + encodeURIComponent(t) + '&spd=3&source=web';

  // 有道 TTS（第二源）：英文用 type=2，其余用 le=xx
  const YDT = (t, lang) => {
    const le = YD_LE[lang];
    return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(t) +
           (le ? ('&le=' + le) : '&type=2');
  };

  // 统一在线兜底候选列表（playAny 会按序尝试，首个成功即停）
  const onlineTTS = (t, lang) => [BDT(t, lang), YDT(t, lang)];

  // 兼容旧调用点的别名
  const YD  = t => YDT(t, 'en-US');   // 英文（原实现漏拼 text 参数，已修复）
  const YDC = t => BDT(t, 'zh-CN');   // 中文（原 type=2 已失效，改百度主源）

  // --- Web Audio 上下文（在首次手势内创建并恢复，iPad 必需） ---
  let audioCtx = null;
  function getCtx(){
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) audioCtx = new AC();
      }
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){}
    return audioCtx;
  }

  // 1) 首次手势解锁音频
  let audioUnlocked = false;
  const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAD//w==';
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    try{
      const s = new Audio(SILENT_WAV); s.play().catch(()=>{});  // 解锁媒体
      getCtx();                                                  // 在手势内恢复 AudioContext
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
    }catch(e){}
  }
  ['touchstart','touchend','click','pointerdown'].forEach(ev=>
    document.addEventListener(ev, unlockAudio, {passive:true}));

  // 2) 文件名推导（与下载脚本 slug 完全一致）
  function slug(text){
    return String(text).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  }
  // 字母名读音词映射（A→ay 读作 /eɪ/ 等）
  const LETTER_PRON = {A:"ay",B:"bee",C:"see",D:"dee",E:"ee",F:"eff",G:"jee",H:"aitch",
    I:"eye",J:"jay",K:"kay",L:"el",M:"em",N:"en",O:"oh",P:"pee",Q:"cue",R:"ar",
    S:"ess",T:"tee",U:"you",V:"vee",W:"double u",X:"eks",Y:"why",Z:"zee"};

  // 3) 语音合成声音加载（兜底用）
  let US_VOICES = [];
  function pickUSVoice(){
    if(!('speechSynthesis' in window)) return null;
    const all = window.speechSynthesis.getVoices() || [];
    const us = all.filter(x => /en[-_]US/i.test(x.lang));
    if(us.length){
      us.sort((a,b)=>{
        const kw = n => /google us english|samantha|zira|aria|female|united states/i.test(n);
        return (kw(b.name)?1:0) - (kw(a.name)?1:0);
      });
      return us[0];
    }
    return all.find(x=>/^en/i.test(x.lang)) || null;
  }
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    const sync = ()=>{ US_VOICES = window.speechSynthesis.getVoices() || []; };
    sync();
    if(!US_VOICES.length){
      window.speechSynthesis.onvoiceschanged = ()=>{ sync(); };
      setTimeout(sync, 1200);
    }
  }
  loadVoices();

  // 4) 兜底：浏览器美式语音合成
  function ttsFallback(text, rate, pitch){
    if(!('speechSynthesis' in window)) return Promise.reject('no-tts');
    return new Promise(res=>{
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate  = (rate  == null ? 0.9 : rate);
        u.pitch = (pitch == null ? 1.1 : pitch);
        const v = pickUSVoice();
        if(v) u.voice = v;
        let settled = false;
        const done = ()=>{ if(!settled){ settled=true; res(); } };
        u.onend = done; u.onerror = done;
        window.speechSynthesis.speak(u);
        setTimeout(done, 4000);
      }catch(e){ res(); }
    });
  }

  // 5) 主播放：Web Audio API（iPad 友好，绕开 <audio> 元素限制）
  async function playWebAudio(url){
    const ctx = getCtx();
    if(!ctx) throw new Error('no-ctx');
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('http'+resp.status);
    const arr = await resp.arrayBuffer();
    const buf = await ctx.decodeAudioData(arr);
    await new Promise((resolve,reject)=>{
      const srcNode = ctx.createBufferSource();
      srcNode.buffer = buf;
      srcNode.connect(ctx.destination);
      let done = false;
      const end = ()=>{ if(done) return; done = true; resolve(); };
      srcNode.onended = end;
      try{ srcNode.start(0); }catch(e){ reject(e); return; }
      setTimeout(end, (buf.duration*1000) + 2000);   // 兜底
    });
  }

  // 6) 降级：<audio> 元素播放（部分环境 Web Audio 不可用）
  function playEl(url){
    return new Promise((resolve,reject)=>{
      const a = document.getElementById('player');
      let done = false;
      const cl = ()=>{ a.onplaying=null; a.onerror=null; };
      const ok  = ()=>{ if(done) return; done=true; cl(); resolve(true); };
      const err = (e)=>{ if(done) return; done=true; cl(); reject(e); };
      a.onplaying = ok; a.onerror = err;
      try{
        a.pause(); a.src = url; a.load();
        const p = a.play();
        if(p && p.then) p.then(ok).catch(err); else setTimeout(ok, 400);
      }catch(e){ err(e); }
      setTimeout(()=>{ if(!done) err(new Error('timeout')); }, 5000);
    });
  }

  // 7) 依次尝试多个来源，命中即返回
  async function playAny(urls){
    for(const u of urls){
      try{ await playWebAudio(u); return true; }catch(e){}
      try{ await playEl(u); return true; }catch(e){}
    }
    return false;
  }
  function localUrls(text){
    const s = slug(text);
    return ['audio/' + s + '.mp3', 'audio/' + s + '.wav'];
  }

  // 轻量提示（仅在兜底/失败时短暂显示，便于排查）
  let toastTimer;
  function aToast(msg, ok){
    const el = document.getElementById('aToast');
    if(!el) return;
    el.textContent = msg;
    el.style.background = ok ? 'rgba(123,182,97,.95)' : 'rgba(200,70,70,.95)';
    el.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 2400);
  }

  // 全局错误横幅：捕获任何未处理的异常，真机排查用
  function showErr(msg){
    const el = document.getElementById('errBar');
    if(!el) return;
    el.textContent = '⚠️ ' + msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(()=>{ el.style.display='none'; }, 8000);
  }
  window.addEventListener('error', e=>{
    showErr((e.message||'Error') + (e.filename? ' @'+(e.filename.split('/').pop())+':'+e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', e=>{
    const r = e.reason; showErr('Promise: ' + ((r&&r.message)||r||'rejection'));
  });

  // 8) 单词 / 例句：本地音频 → 在线有道 → 浏览器 TTS
  async function speak(text){
    unlockAudio();
    if(await playAny(localUrls(text))) return;
    if(await playAny(onlineTTS(text, 'en-US'))) return;
    await ttsFallback(text, 0.9, 1.1);
    aToast('⚠️ 本地与在线发音失败，已用语音合成', false);
  }

  // 9) 字母：读字母名称（A→/eɪ/）
  async function speakLetter(ch){
    unlockAudio();
    const pron = LETTER_PRON[ch] || ch;
    if(await playAny(localUrls(pron))) return;
    if(await playAny(onlineTTS(pron, 'en-US'))) return;
    await ttsFallback(ch, 0.8, 1.15);
  }

  // --- 中文朗读（古诗用）：zh-CN 语音合成 ---
  function pickZHVoice(){
    if(!('speechSynthesis' in window)) return null;
    const all = window.speechSynthesis.getVoices()||[];
    const zh = all.filter(x=>/zh/i.test(x.lang));
    return zh[0] || null;
  }
  // 中文朗读（古诗/中文）：在线 TTS 兜底 + 浏览器语音合成兜底。
  // 关键修复：Capacitor/Android WebView 的 speechSynthesis 常“无声”（无系统中文语音引擎），
  // 因此先走在线中文 TTS，失败再回退到语音合成，确保古诗词“有声音”。
  async function speakZh(text){
    unlockAudio();
    try{ if(await playAny(onlineTTS(text, 'zh-CN'))) return; }catch(e){}
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; u.rate=0.82; u.pitch=1.05;
      const v=pickZHVoice(); if(v) u.voice=v;
      await new Promise(res=>{
        let done=false; const end=()=>{ if(!done){done=true;res();} };
        u.onend=end; u.onerror=end;
        window.speechSynthesis.speak(u);
        setTimeout(end, 6000);
      });
    }catch(e){}
  }
  async function speakZhLines(arr, onLine){
    unlockAudio();
    for(let i=0;i<arr.length;i++){
      if(onLine) try{ onLine(i); }catch(e){}
      await speakZh(arr[i]);
      await new Promise(r=>setTimeout(r,320));
    }
    if(onLine) try{ onLine(-1); }catch(e){}
  }
  // 诗词朗读：逐句朗读（避免长诗被 TTS 截断、加自然停顿），并高亮当前句
  function hlPoemLine(i){
    const ns = document.querySelectorAll('.pline');
    ns.forEach((el,idx)=>{ if(i<0) el.classList.remove('reading'); else el.classList.toggle('reading', idx===i); });
  }
  function speakZhFull(){ speakZhLines(curPoemLines||[], hlPoemLine); }
  function speakZhLinesIdx(){ speakZhLines(curPoemLines||[], hlPoemLine); }

  // 10) 多语言朗读（韩语 ko-KR / 日语 ja-JP 等），用于语言学习板块
  function pickVoiceByLang(lang){
    if(!('speechSynthesis' in window)) return null;
    const all = window.speechSynthesis.getVoices()||[];
    const code = (lang||'en-US').split('-')[0].toLowerCase();
    const hit = all.filter(x=>x.lang && x.lang.toLowerCase().replace('_','-').indexOf(code)===0);
    return hit[0] || null;
  }
  // 多语种朗读（日语/韩语等）。
  // 关键修复（v1.1.8）：原实现只用 speechSynthesis，而 Android WebView 普遍未装
  // 日/韩语音引擎，导致「日语发音」「韩语发音」两个主题共 41 个词全程无声——
  // 与 v1.1.6 修的古诗词无声是同一根因，当时只补了中文、漏了这里。
  // 现统一为：本地音频 → 百度 TTS → 有道 TTS → speechSynthesis 四级兜底。
  async function speakLang(text, lang){
    unlockAudio();
    const lg = lang || 'en-US';
    try{ if(await playAny(localUrls(text))) return; }catch(e){}
    try{ if(await playAny(onlineTTS(text, lg))) return; }catch(e){}
    if(!('speechSynthesis' in window)){ aToast('此设备暂不支持朗读', false); return; }
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lg;
      u.rate = 0.82; u.pitch = 1.05;
      const v = pickVoiceByLang(lg); if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }catch(e){ aToast('朗读失败，请稍后再试', false); }
  }
  // 单词发音：英语走 speak()，韩语/日语走 speakLang()
  function speakWord(themeKey, idx){
    const t = themes[themeKey]; if(!t) return;
    const w = t.words[idx];
    if(t.lang) speakLang(w.w, t.lang); else speak(w.w);
  }
  function speakSentence(themeKey, idx){
    const t = themes[themeKey]; if(!t) return;
    const w = t.words[idx];
    if(!w.s) return;
    if(t.lang) speakLang(w.s, t.lang); else speak(w.s);
  }

  // simple darken for gradient end
  function shade(hex){
    const c = hex.replace("#","");
    const n = parseInt(c,16);
    let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,r-40);g=Math.max(0,g-40);b=Math.max(0,b-40);
    return `rgb(${r},${g},${b})`;
  }

  // ============ 多用户账号（本机多“登录人”，各自独立进度） ============
  const challengeEl = document.getElementById("challenge");
  const USERS_KEY    = "kids_english_users_v1";
  const CUR_USER_KEY = "kids_english_curuser_v1";
  const AVATARS = ["🐻","🐼","🐯","🐰","🦁","🐸","🐵","🐱","🐶","🦊","🐥","🐢"];
  function getUsers(){ try{ return JSON.parse(lsGet(USERS_KEY)||"[]"); }catch(e){ return []; } }
  function saveUsers(u){ lsSet(USERS_KEY, JSON.stringify(u)); }
  function defaultProgress(){ return {unlocked:1, stars:{}, learned:[], poems:[]}; }
  function getCurrentUser(){
    let users = getUsers();

      let old=null; try{ old = JSON.parse(lsGet("kids_english_progress_v1")||"null"); }catch(e){}
      const u = {id:"u1", name:"宝宝", avatar:"🐻", color:"#FFC857",

  // 闯关/成长进度跟随“当前登录人”隔离存储
  function loadProgress(){
