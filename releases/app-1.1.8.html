  // 10 关：pairs 逐步增多、pool 逐步扩大、第 6 关起加入倒计时（更刺激）
  const LEVELS = [
    {n:1,  pairs:2,  pool:["fruit"],                          timer:0,  label:"水果初体验"},
    {n:2,  pairs:3,  pool:["fruit"],                          timer:0,  label:"水果小能手"},
    {n:3,  pairs:3,  pool:["animal"],                         timer:0,  label:"动物乐园"},
    {n:4,  pairs:4,  pool:["animal"],                         timer:0,  label:"动物大集合"},
    {n:5,  pairs:4,  pool:["fruit","animal"],                 timer:0,  label:"混合开始"},
    {n:6,  pairs:5,  pool:["fruit","animal"],                 timer:90, label:"五连挑战"},
    {n:7,  pairs:6,  pool:["fruit","animal","life"],          timer:90, label:"生活家"},
    {n:8,  pairs:7,  pool:["fruit","animal","life","family"], timer:80, label:"全家福"},
    {n:9,  pairs:8,  pool:["fruit","animal","life","family"], timer:70, label:"全明星"},
    {n:10, pairs:10, pool:["fruit","animal","life","family"], timer:60, label:"终极 Boss"}
  ];
  function poolWords(pools){
    let arr=[];
    pools.forEach(p=> arr = arr.concat(themes[p].words));
    return arr;
  }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function themeOf(w){ return themes[ Object.keys(themes).find(k=> themes[k].words && themes[k].words.indexOf(w)>=0) ]; }

  function openHub(){
    const p = loadProgress();
    document.getElementById("home").style.display="none";
    detail.classList.remove("active"); detail.innerHTML="";
    challengeEl.innerHTML = `
      <button class="back" onclick="goHome()">← 返回首页</button>
      <div class="hub-head">
        <div>
          <div class="hub-title">🎮 闯关挑战</div>

        </div>

        ${LEVELS.map(L=>{
          const locked = L.n > p.unlocked;

  let G = null;   // 当前游戏状态
  // 诗词所有汉字池（去标点），用于古诗词填空的干扰项
  const POEM_CHARS = (function(){
    const set = new Set();
    (themes.poems.poems||[]).forEach(p=> (p.lines||[]).forEach(ln=>{
      for(const ch of ln){ if(/[一-鿿]/.test(ch)) set.add(ch); }
    }));
    return [...set];
  })();
  const CHINESE_RE = /[一-鿿]/;

  // ===== 随机题型：英文（emoji→单词） 或 古诗词填空（缺字选填） =====
  function randomEnglishWord(pools){
    const arr = poolWords(pools);
    return arr[Math.floor(Math.random()*arr.length)];
  }
  function buildEnglishRound(pools){
    const w = randomEnglishWord(pools);
    const others = shuffle(poolWords(pools).filter(x=>x.w!==w.w)).slice(0,3);
    const opts = shuffle([w, ...others]).map(x=>x.w);
    const t = themeOf(w);
    return { type:'en', emoji:w.e, answer:w.w, opts, color:t.color, light:t.light };
  }
  function buildPoemRound(){
    const poems = themes.poems.poems;
    for(let tries=0; tries<40; tries++){
      const p = poems[Math.floor(Math.random()*poems.length)];
      const lines = (p.lines||[]).filter(l=> l.replace(/[^一-鿿]/g,'').length>=2);
      if(!lines.length) continue;
      const line = lines[Math.floor(Math.random()*lines.length)];
      const positions = [];
      for(let i=0;i<line.length;i++){ if(CHINESE_RE.test(line[i])) positions.push(i); }
      if(positions.length<2) continue;
      const pos = positions[Math.floor(Math.random()*positions.length)];
      const answer = line[pos];
      const masked = line.slice(0,pos) + '<span class="blank">⬜</span>' + line.slice(pos+1);
      const dist = shuffle(POEM_CHARS.filter(c=>c!==answer)).slice(0,3);
      const opts = shuffle([answer, ...dist]);
      return { type:'poem', title:p.title, author:p.author, line:line, masked:masked, answer:answer, opts };
    }
    const p = poems[0];
    return { type:'poem', title:p.title, author:p.author, line:p.lines[0], masked:p.lines[0], answer:p.lines[0][0], opts:[p.lines[0][0]] };
  }
  function buildRounds(L){
    const rounds=[];
    for(let i=0;i<L.pairs;i++){
      rounds.push( Math.random()<0.5 ? buildEnglishRound(L.pool) : buildPoemRound() );
    }
    // 题数>=2 时，保证英文与古诗词两种题型都出现（随机组合但仍可见到两类）
    if(rounds.length>=2 && rounds.every(r=>r.type===rounds[0].type)){
      const flip = Math.floor(Math.random()*rounds.length);
      rounds[flip] = (rounds[flip].type==='en') ? buildPoemRound() : buildEnglishRound(L.pool);
    }
    return rounds;
  }

  function openLevel(n){
    const L = LEVELS.find(x=>x.n===n);
    const ov = document.getElementById("winOverlay"); if(ov) ov.classList.remove("show"); // 清掉上一关可能残留的过关弹窗
    const rounds = buildRounds(L);
    G = { n, total:L.pairs, rounds, idx:0, resolved:0, mistakes:0,
          timer:L.timer, timeLeft:L.timer, iv:null, done:false };
    challengeEl.innerHTML = `
      <button class="back" onclick="openHub()">← 返回选关</button>
      <div class="game-bar">

  function renderRound(){
    const r = G.rounds[G.idx];
    if(!r){ win(); return; }
    const area = document.getElementById("qArea");
    if(!area) return;
    let html='';
    if(r.type==='en'){
      html = `

          <div class="q-opts">
            ${r.opts.map(o=>`<button class="q-opt" data-v="${o}" onclick="answerOpt(this)">${o}</button>`).join("")}
          </div>
          <button class="q-speak" onclick="speakZh('${r.line}')">🔊 听朗读</button>
        </div>`;
    }
    area.innerHTML = html;
  }

  function answerOpt(el){
    if(!G || G.done) return;
    const r = G.rounds[G.idx];
    if(r._done) return;
    unlockAudio();
    const v = el.dataset.v;
    const opts = el.parentNode.querySelectorAll('.q-opt');
    if(v === r.answer){
      el.classList.add('correct');
      r._done = true; r._ok = true;
      if(r.type==='en') speak(r.answer); else speakZh(r.line);
      G.resolved++; updateProg();
      setTimeout(()=>nextRound(), 650);
    } else {
      el.classList.add('wrong');
      G.mistakes++;
      const mEl=document.getElementById('gMist'); if(mEl) mEl.textContent=G.mistakes;
      opts.forEach(o=>{ if(o.dataset.v===r.answer) o.classList.add('correct'); });
      r._done = true; r._ok = false;
      G.resolved++; updateProg();
      setTimeout(()=>nextRound(), 950);
    }
  }
  function nextRound(){
    if(G.done) return;
    G.idx++;
    if(G.idx >= G.total){ win(); return; }
    renderRound();
  }
  function updateProg(){
    const p = Math.round(G.resolved / G.total * 100);
    const bar = document.getElementById("gProg"); if(bar) bar.style.width = p + "%";
  }
  function startTimer(){
    G.timeLeft = G.timer;
    G.iv = setInterval(()=>{
      G.timeLeft--;
      const tEl = document.getElementById("gTime");
      if(tEl) tEl.textContent = Math.max(0,G.timeLeft);
      if(G.timeLeft<=0){ clearInterval(G.iv); speak("Time is up"); }
    },1000);
  }
  function starsByMistakes(m){ return m===0?3 : (m<=2?2:1); }

  function win(){
    if(G.done) return;
    G.done = true;
    if(G.iv) clearInterval(G.iv);
    const st = starsByMistakes(G.mistakes);
    const p = loadProgress();
    if(st > (p.stars[G.n]||0)) p.stars[G.n]=st;
    if(G.n < LEVELS.length) p.unlocked = Math.max(p.unlocked, G.n+1);
    saveProgress(p);
    showWin(st, G.n < LEVELS.length);
  }
  function showWin(stars, hasNext){
    let ov = document.getElementById("winOverlay");
    const stars_html = "★".repeat(stars) + "☆".repeat(3-stars);
    const msg = stars===3 ? "太棒了，一次都没错！" : (stars===2 ? "做得好，继续加油！" : "闯过啦，多练习会更棒！");
    const btns = `${hasNext?`<button class="w-btn" onclick="nextLevel()">下一关 →</button>`:``}
                 <button class="w-btn alt" onclick="openHub()">选关</button>
                 <button class="w-btn alt" onclick="goHome()">首页</button>`;
    if(!ov){
      ov = document.createElement("div");
      ov.className="win"; ov.id="winOverlay";
      ov.innerHTML = `<div class="win-box">
        <div class="w-emoji">🎉</div>
        <h3>过关啦！</h3>

        <p id="winMsg">${msg}</p>
        <div class="w-btns">${btns}</div>
      </div>`;

  // ============ 底部 Tab 导航 + 成长页 + 备份/导入 ============
  function setActiveTab(name){
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  }
  function switchTab(name){
    setActiveTab(name);
    const home=document.getElementById('home'), det=document.getElementById('detail'),
          ch=document.getElementById('challenge'), grow=document.getElementById('grow'),
          me=document.getElementById('me');
    // 统一用 .active class 控制 detail/challenge/grow/me 的显隐（它们都靠 .active{display:block} 显示）。
    // 切勿给它们设 inline display:none —— inline 优先级高于 .active 规则，会遗留
    // 一个覆盖 .detail.active 的 inline 隐藏样式，导致之后打开详情页整屏空白、只能杀进程恢复。
    [det,ch,grow,me].forEach(s=>{ if(s){ s.classList.remove('active'); s.style.display=''; } });
    home.style.display='none';
    if(name==='study'){ home.style.display='block'; }
    else if(name==='challenge'){ openHub(); ch.classList.add('active'); }
    else if(name==='grow'){ renderGrow(); grow.classList.add('active'); }
    else if(name==='me'){ renderMe(); me.classList.add('active'); }
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function renderGrow(){
    const p = loadProgress();
    const learned = (p.learned||[]).length;
    const learnedPoems = (p.poems||[]).length;
    const totalStars = Object.values(p.stars||{}).reduce((a,b)=>a+(+b||0),0);
    const maxStars = LEVELS.length*3;
    const growEl = document.getElementById('grow');

      </div>`;
  }

  function buildBackup(){
    const p = loadProgress();
    return JSON.stringify({app:"宝宝学英语", version:1, exportedAt:new Date().toISOString(), progress:p}, null, 2);
  }
  async function exportProgress(){
    const json = buildBackup();
    const blob = new Blob([json], {type:'application/json'});
    const file = new File([blob], '宝宝学英语-进度备份.json', {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'宝宝学英语进度备份'}); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='宝宝学英语-进度备份.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    aToast('已生成备份文件，请保存到网盘或发给家长～', true);
  }
  function onImportFile(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    importProgress(f);
    e.target.value='';
  }
  function importProgress(file){
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const data = JSON.parse(r.result);
        const p = data && data.progress ? data.progress : data;
        if(!p || typeof p!=='object') throw new Error('格式不对');
        const clean = {unlocked: Number(p.unlocked)||1, stars:{}, learned:[]};
        if(p.stars) for(const k in p.stars) clean.stars[k]=Number(p.stars[k])||0;
        if(Array.isArray(p.learned)) clean.learned = p.learned.filter(x=>typeof x==='string');
        if(clean.unlocked<1) clean.unlocked=1;
        saveProgress(clean);
        renderGrow();
        aToast('进度已恢复！🌟', true);
      }catch(err){ aToast('恢复失败：文件格式不正确', false); }
    };
    r.readAsText(file);
  }

  // ============ 我的 / 设置页 ============
  // HTML 转义：账号名是用户自由输入，直接拼进 innerHTML 会被当作标签解析
  // （实测输入 <img src=x onerror=...> 会真的注入 DOM），故渲染前必须转义。
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function renderMe(){
    const u = getCurrentUser();
    const meEl = document.getElementById('me');
    if(!meEl) return;
    const users = getUsers();
    const accountRows = users.map(x=>{
      const isCur = x.id === u.id;
      // 仅剩一个账号时不提供删除，避免把自己删空
      const delBtn = (!isCur && users.length > 1)
        ? `<button class="set-del" onclick="meDeleteUser('${esc(x.id)}')" aria-label="删除账号">✕</button>`
        : '';
      return `
      <div class="set-row acct">
        <button class="acct-main" onclick="meSwitchUser('${esc(x.id)}')">
          <span class="set-ico">${esc(x.avatar)}</span>
          <span class="set-label">${esc(x.name)}${isCur?'（当前）':''}</span>
          <span class="set-val">${isCur?'✅':''}</span>
        </button>${delBtn}
      </div>`;
    }).join('');
    meEl.innerHTML = `
      <button class="back" onclick="switchTab('study')">← 返回学习</button>
      <div class="gcard me-profile">
        <div class="me-ava" onclick="meOpenAvatarPicker()" style="background:${esc(u.color||'#FFC857')}">${esc(u.avatar)}</div>
        <div class="me-name" onclick="meEditName()">${esc(u.name)} <span class="me-edit">✎ 改名</span></div>
        <div class="me-sub">当前登录账号</div>
      </div>
      <div class="gcard">
        <div class="set-title">设置</div>
        <button class="set-row" onclick="meEditName()">
          <span class="set-ico">✏️</span><span class="set-label">登录名称</span><span class="set-val">${esc(u.name)} ›</span>
        </button>
        <button class="set-row" onclick="meOpenAvatarPicker()">
          <span class="set-ico">🖼️</span><span class="set-label">头像</span><span class="set-val">${esc(u.avatar)} ›</span>
        </button>
        <button class="set-row" onclick="otaCheck(true)">
          <span class="set-ico">🔄</span><span class="set-label">检查更新</span><span class="set-val">›</span>
        </button>
        <div class="set-row">
          <span class="set-ico">📦</span><span class="set-label">版本号</span><span class="set-val">v${OTA_VER}</span>
        </div>
      </div>
      <div class="gcard">
        <div class="set-title">切换 / 添加账号</div>
        ${accountRows}
        <button class="set-row add" onclick="meAddUser()">
          <span class="set-ico">➕</span><span class="set-label">添加新账号</span><span class="set-val">›</span>
        </button>
        <p style="margin-top:10px;font-size:12px;color:var(--gray);font-weight:600;line-height:1.5;">不同账号的闯关进度、学会的单词和古诗各自独立保存。</p>
      </div>`;

  function meEditName(){
    const u = getCurrentUser();
    const n = prompt('给这个账号起个名字：', u.name);
    if(n==null) return;
    const name = n.trim().slice(0,12) || u.name;
    const users = getUsers(); const cur = users.find(x=>x.id===u.id);
    if(cur){ cur.name = name; saveUsers(users); }

  function meOpenAvatarPicker(){
    const grid = AVATARS.map(a=>`<button class="ava-opt" onclick="mePickAvatar('${a}')">${a}</button>`).join('');
    const box = document.getElementById('avatarBox');
    if(box) box.innerHTML =
      `<div class="win-box"><div class="w-emoji">🖼️</div><h3>选个头像</h3>` +

      `<button class="w-btn alt" style="margin-top:18px" onclick="meCloseWin('avatarWin')">取消</button></div>`;

    if(win) win.classList.add('show');
  }
  function mePickAvatar(a){
    const u = getCurrentUser(); const users = getUsers(); const cur = users.find(x=>x.id===u.id);
    if(cur){ cur.avatar = a; saveUsers(users); }
    meCloseWin('avatarWin'); renderMe();

  function meCloseWin(id){ const w=document.getElementById(id); if(w) w.classList.remove('show'); }
  function meSwitchUser(id){
    if(lsGet(CUR_USER_KEY)===id) return;
    lsSet(CUR_USER_KEY, id);
    const u = getCurrentUser();
    renderMe(); renderGrow();
    aToast('已切换到「'+u.name+'」'+u.avatar, true);

  function meAddUser(){
    const n = prompt('新账号名字：', '宝宝'+(getUsers().length+1));
    if(n==null) return;
    const name = n.trim().slice(0,12) || ('宝宝'+(getUsers().length+1));
    const id = 'u'+Date.now();
    const ava = AVATARS[getUsers().length % AVATARS.length];
    const users = getUsers();
    users.push({id, name, avatar:ava, color:'#FFC857', progress:defaultProgress()});
    saveUsers(users); lsSet(CUR_USER_KEY, id);
    renderMe(); renderGrow();
    aToast('已创建并切换到「'+name+'」', true);

  // 删除账号：走 App 自有弹窗而非系统 confirm()
  // （Capacitor 的原生对话框按钮是硬编码英文 OK/Cancel，且删除进度不可逆，
  //   对儿童应用需要一次明确的二次确认）
  function meDeleteUser(id){
    const users = getUsers();
    const target = users.find(x=>x.id===id);
    if(!target || users.length <= 1) return;
    const box = document.getElementById('avatarBox');
    if(box) box.innerHTML =
      `<div class="win-box"><div class="w-emoji">🗑️</div><h3>删除这个账号？</h3>` +
      `<p style="margin:10px 0 4px;font-size:15px;font-weight:700;color:var(--ink);">` +
      `${esc(target.avatar)} ${esc(target.name)}</p>` +
      `<p style="margin:0 0 6px;font-size:13px;font-weight:600;color:var(--gray);line-height:1.55;">` +
      `该账号的闯关进度、学会的单词和古诗会一并清除，且无法恢复。</p>` +
      `<button class="w-btn" style="margin-top:16px;background:#E5534B;color:#fff"` +
      ` onclick="meDeleteUserConfirm('${esc(id)}')">确认删除</button>` +
      `<button class="w-btn alt" style="margin-top:10px" onclick="meCloseWin('avatarWin')">再想想</button></div>`;
    const win = document.getElementById('avatarWin');
    if(win) win.classList.add('show');
  }
  function meDeleteUserConfirm(id){
    let users = getUsers();
    if(users.length <= 1) { meCloseWin('avatarWin'); return; }
    const target = users.find(x=>x.id===id);
    users = users.filter(x=>x.id!==id);
    saveUsers(users);
    // 若删掉的正好是当前账号，回退到列表首个账号
    if(lsGet(CUR_USER_KEY)===id) lsSet(CUR_USER_KEY, users[0].id);
    meCloseWin('avatarWin');
    renderMe(); renderGrow();
    aToast('已删除「'+(target?target.name:'账号')+'」', true);
  }
</script>

<script>
/* =========================================================
   OTA 在线更新模块
   原理：只更新这份 app.html（约 220KB），视频/音频等大资源留在 APK 内不动。
        新版 HTML 下载后存进 localStorage，由 index.html 加载器在下次启动时运行。
   发布：改完本文件后执行 ./ota-release.sh <新版本号> 即可推送给所有用户。
   ========================================================= */
'use strict';

/* 当前运行的应用版本号：发布 OTA 更新时必须递增（与 manifest.json 的 version 一致） */
const OTA_VER = '1.1.8';

/* 更新源（依次尝试，任一可用即可；兼顾国内网络） */
const OTA_BASES = [
  'https://raw.githubusercontent.com/xialeize01-tech/baobao-xueyingyu-ota/main/',
  'https://cdn.jsdelivr.net/gh/xialeize01-tech/baobao-xueyingyu-ota@main/',
  'https://ghproxy.net/https://raw.githubusercontent.com/xialeize01-tech/baobao-xueyingyu-ota/main/'
];

const OTA_K = { html:'ota.html', ver:'ota.ver', fail:'ota.fail', last:'ota.last' };
const OTA_MAX_BYTES = 3 * 1024 * 1024;   // localStorage 安全上限
const OTA_INTERVAL  = 6 * 3600 * 1000;   // 自动检查间隔：6 小时
let   otaBusy = false;

function otaLSGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function otaLSSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

/* 版本号比较：返回 1 表示 a > b */
function otaCmp(a,b){
  const x=String(a||'0').split('.'), y=String(b||'0').split('.');
  for(let i=0;i<3;i++){
    const m=parseInt(x[i]||'0',10)||0, n=parseInt(y[i]||'0',10)||0;
    if(m!==n) return m>n?1:-1;
  }
  return 0;
}

function otaHide(){
  const bar=document.getElementById('otaBar');
  if(bar) bar.classList.remove('show');
}

/* 显示更新弹窗；actFn 为空则不显示操作按钮 */
function otaShow(text, actLabel, actFn, autoHideMs){
  const bar=document.getElementById('otaBar');
  const msg=document.getElementById('otaMsg');
  const act=document.getElementById('otaAct');
  const title=document.getElementById('otaTitle');
  const emoji=document.getElementById('otaEmoji');
  const dismiss=document.getElementById('otaX');
  if(!bar||!msg) return;
  msg.textContent = text;
  if(actFn){
    act.style.display='inline-block'; act.textContent=actLabel; act.onclick=actFn;
    dismiss.style.display='block';
  } else {
    act.style.display='none'; act.onclick=null;
    /* 无操作按钮时隐藏「稍后再说」 */
    if(autoHideMs > 0){ dismiss.style.display='none'; }
    else { dismiss.style.display='block'; }
  }
  bar.classList.add('show');
  if(autoHideMs){ setTimeout(()=>{ if(msg.textContent===text) otaHide(); }, autoHideMs); }
}

/* 多源依次尝试拉取文本，任一成功即返回 */
async function otaFetchText(path, timeoutMs){
  let lastErr = null;
  for(const base of OTA_BASES){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 9000);
    try{
      const bust = path.endsWith('.json') ? ('?_=' + Date.now()) : '';
      const res = await fetch(base + path + bust, { signal: ctrl.signal, cache:'no-store' });
      clearTimeout(timer);
      if(res.ok) return await res.text();
      lastErr = new Error('HTTP ' + res.status);
    }catch(e){
      clearTimeout(timer);
      lastErr = e;
    }
  }
  throw lastErr || new Error('全部更新源不可用');
}

/* SHA-256 校验（非安全上下文时自动跳过） */
async function otaSha256Hex(text){
  if(!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* 检查更新主流程；manual=true 表示用户手动点击 */
async function otaCheck(manual){
  if(otaBusy) return;
  otaBusy = true;
  const btn = document.getElementById('verBtn');
  if(btn){ btn.disabled = true; btn.textContent = '检查中…'; }

  try{
    if(manual) otaShow('正在检查更新…', null, null, 0);
    otaLSSet(OTA_K.last, String(Date.now()));

    const raw = await otaFetchText('manifest.json', 8000);
    let mf;
    try{ mf = JSON.parse(raw); }
    catch(e){ throw new Error('更新信息格式错误'); }

    if(!mf || !mf.version || !mf.file) throw new Error('更新信息不完整');

    // 已是最新
    if(otaCmp(mf.version, OTA_VER) <= 0){
      if(manual) otaShow('已经是最新版本 v' + OTA_VER + ' 🎉', null, null, 3000);
      else otaHide();
      return;
    }

    if(manual) otaShow('发现新版本 v' + mf.version + '，正在下载…', null, null, 0);
    else otaShow('发现新版本 v' + mf.version + '，正在后台下载…', null, null, 0);

    const html = await otaFetchText(mf.file, 30000);

    // —— 完整性校验，任何一项不过就放弃本次更新 ——
    if(!html || html.length < 20000) throw new Error('更新包不完整');
    if(html.length > OTA_MAX_BYTES) throw new Error('更新包过大，请下载新安装包');
    if(html.indexOf('id="themeGrid"') === -1) throw new Error('更新包内容异常');
    if(mf.sha256){
      const got = await otaSha256Hex(html);
      if(got && got.toLowerCase() !== String(mf.sha256).toLowerCase()){
        throw new Error('更新包校验失败');
      }
    }

    // 写入缓存并重置看门狗计数
    if(!otaLSSet(OTA_K.html, html)) throw new Error('存储空间不足，无法保存更新');
    otaLSSet(OTA_K.ver, mf.version);
    otaLSSet(OTA_K.fail, '0');

    const note = mf.notes ? ('：' + mf.notes) : '';
    otaShow('有版本更新，欢迎小主更新～', '立即更新', otaApply, 0);

  }catch(err){
    const m = (err && err.message) ? err.message : String(err);
    if(manual) otaShow('检查更新失败：' + m, null, null, 4000);
    // 自动检查失败时静默，不打扰孩子使用
  }finally{
    otaBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = '检查更新'; }
  }
}

/* 应用更新：回到加载器，由它载入新版本 */
function otaApply(){
  try{ location.replace('index.html?u=' + Date.now()); }
  catch(e){ location.reload(); }
}

/* 启动收尾：清零看门狗（证明本版本能正常启动）+ 显示版本号 + 定时自动检查 */
(function otaBoot(){
  try{
    otaLSSet(OTA_K.fail, '0');
    // 预热中文 TTS 语音列表：Android WebView 的语音常异步加载，先触发一次避免首读无中文音色
    if('speechSynthesis' in window){
      try{ window.speechSynthesis.getVoices(); }catch(e){}
      window.speechSynthesis.onvoiceschanged = function(){ try{ window.speechSynthesis.getVoices(); }catch(e){} };
    }
    const vt = document.getElementById('verTxt');
    if(vt){
      // 缓存版本号与当前运行版本一致，说明本次运行的是在线更新下来的版本
      const fromOta = otaLSGet(OTA_K.ver) === OTA_VER;
      vt.textContent = '版本 v' + OTA_VER + (fromOta ? ' · 已在线更新' : '');
    }
  }catch(e){}

  setTimeout(function(){
    try{
      const last = parseInt(otaLSGet(OTA_K.last), 10) || 0;
      if(Date.now() - last > OTA_INTERVAL) otaCheck(false);
    }catch(e){}
  }, 3000);
})();
</script>
